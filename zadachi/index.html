<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Задачи</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1d6b5a">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg: #f4f5f1; --panel: #ffffff; --side: #eceee8; --fg: #1c211f; --muted: #67706b; --line: #dde1da; --hover: #e6e9e2;
  --acc: #1d6b5a; --acc-soft: #dcefe8; --warn: #b5432f; --ok: #2b7351; --star: #d49a12; --flag: #d1453b;
  --p1: #d1453b; --p2: #df8a1c; --p3: #3b78d0;
  --sans: "Onest", "Segoe UI", system-ui, sans-serif; --mono: "JetBrains Mono", Consolas, monospace;
  --shadow: 0 6px 24px rgba(20, 30, 25, .12);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141816; --panel: #1b201d; --side: #171c19; --fg: #e8ece8; --muted: #9aa49e; --line: #2c332f; --hover: #232a26;
  --acc: #5fc4a6; --acc-soft: #1d3a31; --warn: #ff8a72; --ok: #6cc497; --star: #f0be4a; --flag: #ff6b5e; --p1: #ff6b5e; --p2: #f2a640; --p3: #6ea2f0;
  --shadow: 0 6px 24px rgba(0, 0, 0, .45); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141816; --panel: #1b201d; --side: #171c19; --fg: #e8ece8; --muted: #9aa49e; --line: #2c332f; --hover: #232a26;
  --acc: #5fc4a6; --acc-soft: #1d3a31; --warn: #ff8a72; --ok: #6cc497; --star: #f0be4a; --flag: #ff6b5e; --p1: #ff6b5e; --p2: #f2a640; --p3: #6ea2f0;
  --shadow: 0 6px 24px rgba(0, 0, 0, .45); color-scheme: dark }
* { box-sizing: border-box }
[hidden] { display: none !important }
html, body { height: 100% }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--sans); -webkit-text-size-adjust: 100% }
button, input, select, textarea { font: inherit; color: inherit }
a { color: var(--acc) }
.top { position: sticky; top: 0; z-index: 20; display: flex; gap: 10px; align-items: center; padding: 10px 16px; padding-top: calc(10px + env(safe-area-inset-top, 0px)); background: var(--bg); border-bottom: 1px solid var(--line) }
.top .brand { display: flex; gap: 8px; align-items: center; font-weight: 700; font-size: 17px; white-space: nowrap; text-decoration: none; color: var(--fg) }
.top .brand i { width: 26px; height: 26px; border-radius: 7px; background: var(--acc); display: grid; place-items: center; color: #fff; font-style: normal; font-size: 15px }
.top .q { flex: 1; min-width: 0; max-width: 420px; margin-left: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px }
.ibtn { background: none; border: 1px solid transparent; border-radius: 8px; padding: 6px 8px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; color: var(--fg); font-size: 13px; white-space: nowrap }
.ibtn:hover { background: var(--hover) }
.ibtn.bad { color: var(--warn) }
.ibtn svg, .nav svg { width: 19px; height: 19px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round }
#menuBtn { display: none }
.layout { display: grid; grid-template-columns: 270px minmax(0, 1fr); min-height: calc(100% - 56px) }
.side { background: var(--side); border-right: 1px solid var(--line); padding: 6px 8px 40px; position: sticky; top: 56px; height: calc(100vh - 56px); overflow-y: auto }
.nav a { display: flex; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 8px; color: var(--fg); text-decoration: none; font-size: 14.5px; min-height: 34px; position: relative }
.nav a:hover { background: var(--hover) }
.nav a.on { background: var(--acc-soft); color: var(--acc); font-weight: 600 }
.nav a .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.nav a .n { font: 500 12px var(--mono); color: var(--muted) }
.nav a.on .n { color: var(--acc) }
.nav .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; margin: 0 4px }
.nav .hash { width: 18px; text-align: center; font-weight: 700; flex: none }
.nav .chev { width: 18px; height: 18px; flex: none; border: 0; background: none; padding: 0; cursor: pointer; color: var(--muted); font-size: 11px; line-height: 18px; border-radius: 4px }
.nav .chev:hover { background: var(--line) }
.nav .chev.sp { visibility: hidden }
.nav .fv { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 0 2px; font-size: 14px; opacity: 0; width: 18px }
.nav a:hover .fv, .nav .fv.on { opacity: 1 } .nav .fv.on { color: var(--star) }
.nav .fv.dl { font-size: 12px } .nav .fv.dl:hover { filter: none; color: var(--warn) }
.starb.delb { font-size: 17px; opacity: .55 } .starb.delb:hover { opacity: 1 }
.nav input.rn { flex: 1; min-width: 0; border: 1px solid var(--acc); border-radius: 6px; padding: 2px 6px; background: var(--panel); font-size: 14px }
.nav a.dropin { outline: 2px solid var(--acc); outline-offset: -2px }
.nav a.dropb { box-shadow: inset 0 2px 0 var(--acc) } .nav a.dropa { box-shadow: inset 0 -2px 0 var(--acc) }
.side .lab { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 16px 8px 4px; display: flex; align-items: center; min-height: 22px; border-radius: 6px }
.side .lab button { margin-left: auto; background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 18px; line-height: 1; padding: 0 6px; border-radius: 6px }
.side .lab button:hover { background: var(--hover); color: var(--fg) }
.side .lab.dropin { outline: 2px solid var(--acc) }
.side .lab[draggable] { cursor: grab; user-select: none }
.side .lab .gh { width: 0; overflow: hidden; opacity: 0; transition: opacity .15s, width .15s; color: var(--muted); font-size: 12px }
.side .lab:hover .gh { width: 14px; opacity: 1 }
.sblk { border-radius: 8px }
.svcbar { display: flex; flex-wrap: wrap; gap: 2px; justify-content: space-between; padding: 8px 4px 2px; margin-top: 14px; border-top: 1px solid var(--line); cursor: grab }
.svcbar a, .svcbar button { flex: 1 1 26px; max-width: 36px; min-width: 26px; height: 34px; display: grid; place-items: center; border-radius: 8px; color: var(--muted); background: none; border: 0; cursor: pointer; position: relative; padding: 0 }
.svcbar a:hover, .svcbar button:hover { background: var(--hover); color: var(--fg) }
.svcbar a.on { background: var(--acc-soft); color: var(--acc) }
.svcbar svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round }
.svcbar .bd { position: absolute; top: 1px; right: 0; font: 600 9.5px/14px var(--mono); min-width: 14px; padding: 0 3px; border-radius: 7px; background: var(--warn); color: #fff }
@media (min-width: 861px) { body.mini .svcbar { flex-direction: column; align-items: center; border-top: 1px solid var(--line) } body.mini .svcbar a, body.mini .svcbar button { flex: none; width: 36px; max-width: none } }
.sblk.dropb { box-shadow: inset 0 3px 0 var(--acc) } .sblk.dropa { box-shadow: inset 0 -3px 0 var(--acc) }
.sblk.dragging, .nav a.dragging { opacity: .45 }
.side .none { color: var(--muted); font-size: 13px; padding: 2px 10px }
.main { padding: 20px 28px 80px; width: 100%; min-width: 0 }
.main.narrow > * { max-width: 920px }
.main .sub, .main .help p { max-width: 920px }
h1 { font-size: 26px; line-height: 1.2; margin: 0; text-wrap: balance }
h2 { font-size: 15px; margin: 22px 0 6px; display: flex; gap: 8px; align-items: center }
h2 .c { font: 500 12px var(--mono); color: var(--muted) }
.sub { color: var(--muted); margin: 4px 0 0; font-size: 14px }
.crumbs { font-size: 13px; color: var(--muted); margin-bottom: 4px }
.crumbs a { color: var(--muted); text-decoration: none } .crumbs a:hover { color: var(--acc) }
.phead { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center }
.phead .dotb { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--line); cursor: pointer; padding: 0; flex: none }
.phead .hashb { border: 0; background: none; font-size: 24px; font-weight: 700; cursor: pointer; padding: 0 2px; line-height: 1 }
.phead .ttl { cursor: text; border-radius: 6px; padding: 0 4px; margin: 0 -4px; min-width: 0; overflow-wrap: anywhere }
.phead .ttl:hover { background: var(--hover) }
.phead input.rn { font: 700 26px/1.2 var(--sans); border: 1px solid var(--acc); border-radius: 8px; padding: 0 6px; background: var(--panel); min-width: 0; flex: 1 1 260px; max-width: 100% }
.starb { border: 0; background: none; cursor: pointer; font-size: 22px; color: var(--muted); padding: 0 4px; line-height: 1 }
.starb.on { color: var(--star) }
.pop { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin: 10px 0; box-shadow: var(--shadow); display: grid; gap: 10px }
.sw { display: flex; flex-wrap: wrap; gap: 8px }
.sw button { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0 }
.sw button.on { border-color: var(--fg) }
.pop .r { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0 }
.chip { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 13px; color: var(--fg); text-decoration: none; background: var(--panel); cursor: pointer }
.chip.on { border-color: var(--acc); background: var(--acc-soft); color: var(--acc) }
.chip i { width: 8px; height: 8px; border-radius: 50% }
.tbar { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin: 12px 0 0; font-size: 13px; color: var(--muted) }
.tbar label { display: inline-flex; gap: 6px; align-items: center }
.tbar select { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; font-size: 13px }
.add { margin: 14px 0 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px }
.add .r1 { display: flex; gap: 8px }
.add input.t { flex: 1; min-width: 0; border: 0; background: none; padding: 7px 8px; outline: none; font-size: 15px }
.add .hint { font-size: 12px; color: var(--muted); padding: 0 8px 2px }
.add .hint code { font: 11.5px var(--mono); background: var(--hover); padding: 0 4px; border-radius: 4px }
.add .pv { font-size: 12.5px; color: var(--acc); padding: 0 8px 4px }
.btn { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 13px; cursor: pointer; font-size: 14px; font-weight: 500; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; text-decoration: none; color: var(--fg) }
.btn:hover { background: var(--hover) }
.btn.pri { background: var(--acc); border-color: var(--acc); color: #fff }
.btn.warn { color: var(--warn) }
.btn.sm { padding: 3px 9px; font-size: 13px }
.btn:disabled { opacity: .45; cursor: default }
.list { list-style: none; margin: 0; padding: 0 }
.task { display: flex; gap: 8px; align-items: flex-start; padding: 8px 4px; border-bottom: 1px solid var(--line); position: relative }
.task:hover { background: color-mix(in srgb, var(--hover) 60%, transparent) }
.task.dropin { outline: 2px solid var(--acc); outline-offset: -2px; border-radius: 6px }
.task.dropb { box-shadow: inset 0 3px 0 var(--acc) } .task.dropa { box-shadow: inset 0 -3px 0 var(--acc) }
.task.sel { background: var(--acc-soft) } .kcard.sel { outline: 2px solid var(--acc); outline-offset: 1px }
#bulk { position: fixed; z-index: 46; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; gap: 4px; align-items: center; background: var(--fg); color: var(--bg); border-radius: 12px; padding: 6px 8px; box-shadow: var(--shadow); max-width: calc(100vw - 24px) }
#bulk b { padding: 0 8px; font-size: 14px; white-space: nowrap }
#bulk button { border: 0; background: transparent; color: inherit; border-radius: 8px; padding: 6px 9px; cursor: pointer; font-size: 13.5px; white-space: nowrap }
#bulk button:hover { background: rgba(127, 127, 127, .25) }
#pal { position: fixed; inset: 0; z-index: 80; background: rgba(0, 0, 0, .28); display: flex; justify-content: center; align-items: flex-start; padding: 12vh 16px 16px }
#pal .box { width: min(640px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; max-height: 70vh }
#pal input { border: 0; border-bottom: 1px solid var(--line); padding: 14px 16px; font-size: 17px; outline: none; background: var(--panel) }
#pal .res { overflow-y: auto; padding: 6px }
#pal .g { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 8px 10px 3px }
#pal button { display: grid; grid-template-columns: 24px 1fr auto; gap: 10px; align-items: center; width: 100%; text-align: left; border: 0; background: none; border-radius: 8px; padding: 8px 10px; cursor: pointer; font-size: 14.5px; color: var(--fg) }
#pal button.on { background: var(--acc-soft); color: var(--acc) }
#pal button .h { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px }
#pal .foot { font-size: 12px; color: var(--muted); padding: 8px 14px; border-top: 1px solid var(--line) }
.task .fold { width: 18px; height: 22px; flex: none; border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0; font-size: 11px }
.task .fold.sp { visibility: hidden }
.ck { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--muted); background: none; flex: none; margin-top: 2px; cursor: pointer; display: grid; place-items: center; padding: 0 }
.ck.p1 { border-color: var(--p1); background: color-mix(in srgb, var(--p1) 12%, transparent) }
.ck.p2 { border-color: var(--p2); background: color-mix(in srgb, var(--p2) 12%, transparent) }
.ck.p3 { border-color: var(--p3); background: color-mix(in srgb, var(--p3) 12%, transparent) }
.ck:hover::after, .task.done .ck::after { content: ""; width: 9px; height: 5px; border: 2px solid currentColor; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); color: var(--muted) }
.task.done .ck, .ck.dn { background: var(--muted); border-color: var(--muted) } .task.done .ck::after { color: var(--panel) }
.task .bd { flex: 1; min-width: 0; cursor: pointer }
.task .tt { overflow-wrap: anywhere }
.task.done .tt { text-decoration: line-through; color: var(--muted) }
.task .mt { display: flex; flex-wrap: wrap; gap: 3px 10px; font-size: 12.5px; color: var(--muted); margin-top: 2px; align-items: center }
.task .mt .late { color: var(--warn); font-weight: 500 }
.task .mt .when { color: var(--acc) }
.task .mt .fl { color: var(--flag) }
.task .acts { display: flex; gap: 2px; opacity: 0 }
.task:hover .acts, .task .acts:focus-within { opacity: 1 }
.task .acts button { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 15px; padding: 0 5px; border-radius: 5px; line-height: 24px }
.task .acts button:hover { background: var(--hover); color: var(--fg) }
.task .acts button.fl.on { color: var(--flag) }
.tag { font-size: 12px; text-decoration: none; display: inline-flex; gap: 3px; align-items: center }
.pdot { display: inline-flex; gap: 5px; align-items: center }
.pdot i { width: 8px; height: 8px; border-radius: 50% }
.subadd { display: flex; gap: 8px; padding: 6px 4px 8px }
.subadd input { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--acc); border-radius: 7px; padding: 6px 10px }
.ed { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin: 6px 0 10px; box-shadow: var(--shadow); display: grid; gap: 10px }
.ed input[type=text], .ed textarea, .ed select, .ed input[type=date], .ed input[type=time], .inp { background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 7px 10px; min-width: 0; max-width: 100% }
.ed .full { width: 100% }
.ed textarea { resize: vertical; min-height: 64px; width: 100% }
.ed .row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center }
.ed label { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted) }
.ed .row.end { justify-content: flex-end }
.ed .row.end .sp { margin-right: auto }
.ed .lbl { font-size: 13px; color: var(--muted) }
.empty { color: var(--muted); padding: 14px 4px; font-size: 14px }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-top: 16px }
.card h2 { margin-top: 0 }
.card .r { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px }
.card label.f, .pop label.f { display: grid; gap: 4px; font-size: 13px; color: var(--muted); max-width: 560px }
.fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px }
.fgrid .box { display: grid; gap: 6px; align-content: start; font-size: 13.5px }
.fgrid .box b { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 500 }
.fgrid .plist { max-height: 180px; overflow: auto; border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; background: var(--bg) }
.fgrid .plist label { display: flex; gap: 6px; align-items: center }
.okc { color: var(--ok) } .warnc { color: var(--warn) } .muted { color: var(--muted); font-size: 13px }
.confirm { border: 1px solid var(--warn); border-radius: 10px; padding: 12px; margin: 10px 0; display: grid; gap: 8px; background: color-mix(in srgb, var(--warn) 6%, var(--panel)) }
.confirm.info { border-color: var(--acc); background: color-mix(in srgb, var(--acc) 6%, var(--panel)) }
.confirm .r { display: flex; flex-wrap: wrap; gap: 8px }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden }
.seg button { border: 0; background: var(--panel); padding: 6px 12px; cursor: pointer; font-size: 13.5px }
.seg button.on { background: var(--acc); color: #fff }
.help h2 { font-size: 18px; margin-top: 26px }
.help p, .help li, .help td { overflow-wrap: anywhere }
.help table { border-collapse: collapse; width: 100%; font-size: 14px }
.help td, .help th { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top }
.help code, .card code, .confirm code { font: 12.5px var(--mono); background: var(--hover); padding: 1px 5px; border-radius: 4px }
.tscroll { overflow-x: auto }
.codebox { margin-top: 12px }
.codebox .h { display: flex; gap: 10px; align-items: center; justify-content: space-between }
.codebox pre { margin: 6px 0 0; background: var(--side); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font: 12px/1.5 var(--mono); max-height: 320px; overflow: auto; white-space: pre }
ol.steps li { margin: 6px 0 }
#errbar { position: fixed; z-index: 90; left: 12px; right: 12px; top: calc(8px + env(safe-area-inset-top, 0px)); background: var(--warn); color: #fff; border-radius: 10px; padding: 10px 14px; box-shadow: var(--shadow); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 14px }
#errbar code { background: rgba(0,0,0,.2); color: #fff; padding: 2px 6px; border-radius: 5px; font: 12px var(--mono); overflow-wrap: anywhere }
#errbar button { border: 1px solid rgba(255,255,255,.6); background: transparent; color: #fff; border-radius: 7px; padding: 4px 10px; cursor: pointer }
#toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 9px; font-size: 14px; z-index: 50; max-width: calc(100% - 32px); box-shadow: var(--shadow) }
.foot { color: var(--muted); font-size: 12px; margin-top: 40px }
.scrim { display: none }
/* --- спринты --- */
.spbar { display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: center; margin: 12px 0 6px; font-size: 14px }
.spbar b { font: 600 15px var(--mono) }
.spbar input { width: 64px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px }
.prog { height: 8px; background: var(--hover); border-radius: 4px; overflow: hidden; margin: 4px 0 10px }
.prog i { display: block; height: 100%; background: var(--acc) }
.prog.over i { background: var(--warn) }
.lchk { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px 14px; margin-top: 10px }
.lchk label { display: flex; gap: 8px; align-items: center; font-size: 14px } .lchk svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round }
.plab { font-size: 12px; color: var(--muted); margin-top: 6px }
.goal { display: grid; gap: 4px; font-size: 13px; color: var(--muted); margin-top: 12px }
.goal textarea { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 15px; color: var(--fg); resize: vertical; min-height: 44px }
.stchip { font-size: 12px; border-radius: 999px; padding: 2px 10px; background: var(--hover); color: var(--muted); white-space: nowrap }

<script type="text/plain" id="srv-index">// «Задачи» — сервер в Яндекс Облаке (одна облачная функция).
// Обслуживает три входа:
//   • приложение:  /api/...   (через API Gateway) — напоминания, «Входящие», привязка Telegram;
//   • Telegram:    /tg/<секрет> (через API Gateway) — сообщения боту;
//   • таймер:      раз в минуту — рассылка наступивших напоминаний.
// Переменные окружения: YDB_ENDPOINT, YDB_DATABASE, APP_ORIGIN; из Lockbox: BOT_TOKEN, HOOK_SECRET.
// Пользователь определяется по его токену Яндекс Диска (тот же вход, что для синхронизации).

const ENV = process.env;
const TG_API = ENV.TG_API || "https://api.telegram.org";
const DISK_API = ENV.DISK_API || "https://cloud-api.yandex.net/v1/disk/";
const CODE_TTL = 30 * 60 * 1000; // код привязки Telegram действует 30 минут
const MAXLEN = 1000;

/* ---------------- хранилище ---------------- */
let DB = null; // для проверки без облака подставляется хранилище в памяти: module.exports._setDb(...)

function ydbStore(token) {
  const { Driver, TokenAuthService, TypedValues } = require("ydb-sdk");
  let driver = null, drvToken = "";
  async function drv() {
    const t = token();
    if (driver && drvToken === t) return driver;
    if (driver) driver.destroy().catch(() => {});
    driver = new Driver({ endpoint: ENV.YDB_ENDPOINT, database: ENV.YDB_DATABASE, authService: new TokenAuthService(t) });
    drvToken = t;
    if (!(await driver.ready(10000))) throw new Error("YDB: нет соединения с базой");
    return driver;
  }
  // значения из ответа YDB → обычные JS-значения
  // (у protobuf-сообщений значения по умолчанию лежат в прототипе — смотрим только реально заданные поля)
  function val(v) {
    if (!v) return null;
    const has = (k) => Object.prototype.hasOwnProperty.call(v, k) && v[k] !== null && v[k] !== undefined;
    if (has("nullFlagValue")) return null;
    if (has("nestedValue")) return val(v.nestedValue);
    if (has("textValue")) return v.textValue;
    if (has("boolValue")) return v.boolValue;
    for (const k of ["int64Value", "uint64Value", "int32Value", "uint32Value", "doubleValue", "floatValue"]) if (has(k)) return Number(String(v[k]));
    if (has("bytesValue")) return Buffer.from(v.bytesValue).toString("utf8");
    return null;
  }
  function rows(rs) {
    if (!rs) return [];
    const cols = rs.columns.map((c) => c.name);
    return (rs.rows || []).map((r) => { const o = {}; r.items.forEach((it, i) => { o[cols[i]] = val(it); }); return o; });
  }
  async function q(text, params) {
    const d = await drv();
    return d.tableClient.withSession(async (s) => {
      const res = await s.executeQuery(text, params || {});
      return rows(res.resultSets && res.resultSets[0]);
    }, 15000);
  }
  const U = (s) => TypedValues.utf8(String(s)), I = (n) => TypedValues.int64(Number(n)), TS = (ms) => TypedValues.timestamp(new Date(ms)), B = (b) => TypedValues.bool(!!b);
  const tsMs = (us) => Math.round(Number(us) / 1000); // Timestamp приходит в микросекундах
  return {
    async setCode(uid, code) {
      await q(`DECLARE $uid AS Utf8; DECLARE $code AS Utf8; DECLARE $now AS Timestamp;
        UPSERT INTO users (uid, link_code, created) VALUES ($uid, $code, $now);`, { $uid: U(uid), $code: U(code), $now: TS(Date.now()) });
    },
    async getUser(uid) {
      const r = await q(`DECLARE $uid AS Utf8; SELECT uid, tg_chat, link_code, created FROM users WHERE uid = $uid;`, { $uid: U(uid) });
      return r[0] ? { uid: r[0].uid, chat: r[0].tg_chat, code: r[0].link_code, created: r[0].created ? tsMs(r[0].created) : 0 } : null;
    },
    async byCode(code) {
      const r = await q(`DECLARE $code AS Utf8; SELECT uid, created FROM users VIEW by_code WHERE link_code = $code;`, { $code: U(code) });
      return r[0] ? { uid: r[0].uid, created: r[0].created ? tsMs(r[0].created) : 0 } : null;
    },
    async byChat(chat) {
      const r = await q(`DECLARE $c AS Int64; SELECT uid FROM users WHERE tg_chat = $c;`, { $c: I(chat) });
      return r.map((x) => x.uid);
    },
    async link(uid, chat) {
      await q(`DECLARE $uid AS Utf8; DECLARE $c AS Int64;
        UPDATE users SET tg_chat = $c, link_code = NULL WHERE uid = $uid;`, { $uid: U(uid), $c: I(chat) });
    },
    async unlinkChat(chat) {
      await q(`DECLARE $c AS Int64; UPDATE users SET tg_chat = NULL WHERE tg_chat = $c;`, { $c: I(chat) });
    },
    async putReminder(uid, r) {
      await q(`DECLARE $uid AS Utf8; DECLARE $id AS Utf8; DECLARE $at AS Timestamp; DECLARE $text AS Utf8; DECLARE $task AS Utf8; DECLARE $rr AS Utf8;
        UPSERT INTO reminders (uid, id, fire_at, text, task_id, rrule, sent) VALUES ($uid, $id, $at, $text, $task, $rr, false);`,
        { $uid: U(uid), $id: U(r.id), $at: TS(r.at), $text: U(r.text), $task: U(r.task || ""), $rr: U(r.rrule || "") });
    },
    async delReminder(uid, id) {
      await q(`DECLARE $uid AS Utf8; DECLARE $id AS Utf8; DELETE FROM reminders WHERE uid = $uid AND id = $id;`, { $uid: U(uid), $id: U(id) });
    },
    async listReminders(uid) {
      const r = await q(`DECLARE $uid AS Utf8; SELECT id, fire_at, text, rrule FROM reminders WHERE uid = $uid;`, { $uid: U(uid) });
      return r.map((x) => ({ id: x.id, at: tsMs(x.fire_at), text: x.text, rrule: x.rrule || "" }));
    },
    async due(now) {
      const r = await q(`DECLARE $now AS Timestamp;
        SELECT r.uid AS uid, r.id AS id, r.fire_at AS fire_at, r.text AS text, r.rrule AS rrule, u.tg_chat AS chat
        FROM reminders AS r INNER JOIN users AS u ON r.uid = u.uid
        WHERE r.fire_at <= $now AND r.sent = false LIMIT 200;`, { $now: TS(now) });
      return r.map((x) => ({ uid: x.uid, id: x.id, at: tsMs(x.fire_at), text: x.text, rrule: x.rrule || "", chat: x.chat }));
    },
    async moveReminder(uid, id, at) {
      await q(`DECLARE $uid AS Utf8; DECLARE $id AS Utf8; DECLARE $at AS Timestamp;
        UPDATE reminders SET fire_at = $at, sent = false WHERE uid = $uid AND id = $id;`, { $uid: U(uid), $id: U(id), $at: TS(at) });
    },
    async addInbox(uid, id, text) {
      await q(`DECLARE $uid AS Utf8; DECLARE $id AS Utf8; DECLARE $text AS Utf8; DECLARE $now AS Timestamp;
        UPSERT INTO inbox (uid, id, text, created, taken) VALUES ($uid, $id, $text, $now, false);`, { $uid: U(uid), $id: U(id), $text: U(text), $now: TS(Date.now()) });
    },
    async listInbox(uid) {
      const r = await q(`DECLARE $uid AS Utf8; SELECT id, text, created FROM inbox WHERE uid = $uid AND taken = false ORDER BY created LIMIT 200;`, { $uid: U(uid) });
      return r.map((x) => ({ id: x.id, text: x.text, at: tsMs(x.created) }));
    },
    async ackInbox(uid, id) {
      await q(`DECLARE $uid AS Utf8; DECLARE $id AS Utf8; DELETE FROM inbox WHERE uid = $uid AND id = $id;`, { $uid: U(uid), $id: U(id) });
    }
  };
}

/* ---------------- общее ---------------- */
let IAM = ""; // токен сервисного аккаунта из контекста вызова
function db() { if (!DB) DB = ydbStore(() => IAM); return DB; }

function rid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function newCode() { const a = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s = ""; for (let i = 0; i < 6; i++) s += a[Math.floor(Math.random() * a.length)]; return s; }
function origins() { return String(ENV.APP_ORIGIN || "").split(",").map((s) => s.trim()).filter(Boolean); }
function hdr(event, k) { const h = event.headers || {}; const key = Object.keys(h).find((x) => x.toLowerCase() === k.toLowerCase()); return key ? h[key] : ""; }
function bodyOf(event) {
  if (!event.body) return {};
  const t = event.isBase64Encoded ? Buffer.from(event.body, "base64").toString("utf8") : event.body;
  try { return JSON.parse(t); } catch (e) { return {}; }
}
function reply(event, status, obj) {
  const o = hdr(event, "Origin"), ok = origins();
  const h = { "Content-Type": "application/json; charset=utf-8", Vary: "Origin" };
  if (o && ok.indexOf(o) >= 0) {
    h["Access-Control-Allow-Origin"] = o;
    h["Access-Control-Allow-Methods"] = "GET, POST, PUT, DELETE, OPTIONS";
    h["Access-Control-Allow-Headers"] = "Authorization, Content-Type";
    h["Access-Control-Max-Age"] = "600";
  }
  return { statusCode: status, headers: h, body: JSON.stringify(obj) };
}

// следующий срок повторяющегося напоминания: "daily", "weekly", "monthly" или "weekdays|<смещение пояса в минутах, как getTimezoneOffset()>"
function nextAt(at, rrule, now) {
  const p = String(rrule || "").split("|"), kind = p[0], off = +p[1] || 0, DAY = 86400000;
  if (kind === "R") return nextRule(at, p, now);
  if (kind !== "daily" && kind !== "weekdays" && kind !== "weekly" && kind !== "monthly") return 0;
  const step = kind === "weekly" ? 7 * DAY : DAY;
  let t = at;
  for (let i = 0; i < 800; i++) {
    if (kind === "monthly") { const d = new Date(t); d.setUTCMonth(d.getUTCMonth() + 1); t = d.getTime(); } else t += step;
    if (t <= now) continue;
    if (kind === "weekdays") { const wd = new Date(t - off * 60000).getUTCDay(); if (wd === 0 || wd === 6) continue; }
    return t;
  }
  return 0;
}

// гибкий повтор «R|f|n|дни недели|число месяца|смещение пояса»: f = d (дни), w (недели), m (месяцы), y (годы);
// дни недели 0–6 через запятую; число месяца или -1 (последний день). Считаем по местному времени пользователя.
function nextRule(at, p, now) {
  const DAY = 86400000, f = p[1], n = Math.max(1, +p[2] || 1), wd = p[3] ? p[3].split(",").map(Number) : [], md = +p[4] || 0, off = +p[5] || 0;
  const L = (ms) => new Date(ms - off * 60000); // местное время в полях UTC
  const di = (d) => Math.round(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) / DAY);
  const last = (y, m) => new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
  const a = L(at);
  for (let i = 1; i < 2400; i++) {
    const cand = at + i * DAY; if (cand <= now) continue;
    const d = L(cand), dd = di(d) - di(a);
    let ok = false;
    if (f === "d") ok = dd % n === 0;
    else if (f === "w") { const days = wd.length ? wd : [a.getUTCDay()]; if (days.indexOf(d.getUTCDay()) >= 0) { const wa = di(a) - (a.getUTCDay() + 6) % 7, wdd = di(d) - (d.getUTCDay() + 6) % 7; ok = Math.round((wdd - wa) / 7) % n === 0; } }
    else if (f === "m") { const mo = (d.getUTCFullYear() - a.getUTCFullYear()) * 12 + d.getUTCMonth() - a.getUTCMonth(); if (mo % n === 0) { const want = md || a.getUTCDate(), l = last(d.getUTCFullYear(), d.getUTCMonth()); ok = want === -1 || want > l ? d.getUTCDate() === l : d.getUTCDate() === want; } }
    else if (f === "y") { const yr = d.getUTCFullYear() - a.getUTCFullYear(); ok = yr % n === 0 && d.getUTCMonth() === a.getUTCMonth() && d.getUTCDate() === Math.min(a.getUTCDate(), last(d.getUTCFullYear(), d.getUTCMonth())); }
    if (ok) return cand;
  }
  return 0;
}

// кто это: по токену Яндекс Диска (кэш на время жизни функции)
const WHO = new Map();
async function whoAmI(event) {
  const a = hdr(event, "Authorization"), m = /^OAuth\s+(\S+)$/i.exec(a || "");
  if (!m) return null;
  const c = WHO.get(m[1]);
  if (c && c.exp > Date.now()) return c.uid;
  const r = await fetch(DISK_API, { headers: { Authorization: "OAuth " + m[1], Accept: "application/json" } });
  if (!r.ok) return null;
  const j = await r.json().catch(() => ({}));
  const uid = j && j.user && (j.user.uid || j.user.login);
  if (!uid) return null;
  WHO.set(m[1], { uid: String(uid), exp: Date.now() + 10 * 60 * 1000 });
  return String(uid);
}

async function tg(method, payload) {
  if (!ENV.BOT_TOKEN) throw new Error("нет BOT_TOKEN");
  const r = await fetch(TG_API + "/bot" + ENV.BOT_TOKEN + "/" + method, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
  const j = await r.json().catch(() => ({}));
  if (!j.ok) { const e = new Error("Telegram: " + (j.description || r.status)); e.code = j.error_code || r.status; throw e; }
  return j.result;
}
let BOTNAME = "";
async function botName() { if (!BOTNAME) { try { BOTNAME = (await tg("getMe", {})).username || ""; } catch (e) { BOTNAME = ""; } } return BOTNAME; }

/* ---------------- приложение: /api/... ---------------- */
async function api(event) {
  const method = (event.httpMethod || "GET").toUpperCase();
  if (method === "OPTIONS") return reply(event, 204, {});
  const p = String((event.pathParams && event.pathParams.path) || (event.params && event.params.path) || (event.path || "").replace(/^\/?api\/?/, "")).replace(/^\/+|\/+$/g, "");
  if (p === "ping") return reply(event, 200, { ok: true, v: 1 });

  const uid = await whoAmI(event);
  if (!uid) return reply(event, 401, { error: "auth", message: "Нет входа через Яндекс: подключите Яндекс Диск в приложении" });
  const d = db(), b = bodyOf(event);

  if (p === "me" && method === "GET") {
    const u = await d.getUser(uid);
    return reply(event, 200, { ok: true, linked: !!(u && u.chat), bot: await botName() });
  }
  if (p === "link" && method === "POST") {
    const code = newCode();
    await d.setCode(uid, code);
    return reply(event, 200, { ok: true, code, bot: await botName() });
  }
  if (p === "reminders" && method === "GET") return reply(event, 200, { ok: true, items: await d.listReminders(uid) });
  if (p === "reminders" && method === "PUT") {
    // { put: [{id, at, text, rrule, task}], del: [id] }
    const put = Array.isArray(b.put) ? b.put.slice(0, 200) : [], del = Array.isArray(b.del) ? b.del.slice(0, 200) : [];
    for (const r of put) {
      if (!r || !r.id || !(+r.at > 0)) continue;
      await d.putReminder(uid, { id: String(r.id).slice(0, 80), at: +r.at, text: String(r.text || "Напоминание").slice(0, MAXLEN), task: String(r.task || "").slice(0, 80), rrule: String(r.rrule || "").slice(0, 40) });
    }
    for (const id of del) await d.delReminder(uid, String(id).slice(0, 80));
    return reply(event, 200, { ok: true, put: put.length, del: del.length });
  }
  if (p === "inbox" && method === "GET") return reply(event, 200, { ok: true, items: await d.listInbox(uid) });
  if (p === "inbox/ack" && method === "POST") {
    const ids = Array.isArray(b.ids) ? b.ids.slice(0, 200) : [];
    for (const id of ids) await d.ackInbox(uid, String(id));
    return reply(event, 200, { ok: true });
  }
  return reply(event, 404, { error: "not_found" });
}

/* ---------------- Telegram: /tg/<секрет> ---------------- */
async function bot(event) {
  const sec = ENV.HOOK_SECRET || "";
  const pathSec = (event.pathParams && event.pathParams.secret) || (event.params && event.params.secret) || String(event.path || "").split("/").pop();
  if (!sec || pathSec !== sec || hdr(event, "X-Telegram-Bot-Api-Secret-Token") !== sec) return { statusCode: 403, body: "forbidden" };
  const up = bodyOf(event), msg = up.message || up.edited_message;
  if (up.callback_query) return await onButton(up.callback_query);
  if (!msg || !msg.chat) return { statusCode: 200, body: "ok" };
  const chat = msg.chat.id, text = String(msg.text || msg.caption || "").trim(), d = db();
  const say = (t) => tg("sendMessage", { chat_id: chat, text: t }).catch(() => {});

  const st = /^\/start(?:@\w+)?\s*(\S*)/i.exec(text);
  if (st) {
    const code = st[1].toUpperCase();
    if (!code) { await say("Здравствуйте! Это бот приложения «Задачи».\nЧтобы привязать его: в приложении «Задачи» откройте «Настройки» → «Сервер и Telegram» → «Привязать Telegram», и пришлите сюда код вида /start ABC123."); return { statusCode: 200, body: "ok" }; }
    const u = await d.byCode(code);
    if (!u || Date.now() - u.created > CODE_TTL) { await say("Код не подошёл или устарел. Получите новый в приложении: «Настройки» → «Сервер и Telegram» → «Привязать Telegram»."); return { statusCode: 200, body: "ok" }; }
    await d.link(u.uid, chat);
    await say("Готово ✓ Напоминания будут приходить сюда.\nНапишите любое сообщение — оно попадёт во «Входящие» приложения «Задачи».\n/stop — отвязать этот чат.");
    return { statusCode: 200, body: "ok" };
  }
  const uids = await d.byChat(chat);
  if (!uids.length) { await say("Этот чат ещё не привязан. В приложении: «Настройки» → «Сервер и Telegram» → «Привязать Telegram»."); return { statusCode: 200, body: "ok" }; }
  if (/^\/stop\b/i.test(text)) { await d.unlinkChat(chat); await say("Чат отвязан. Напоминания сюда больше не придут."); return { statusCode: 200, body: "ok" }; }
  if (/^\/help\b/i.test(text)) { await say("Пришлите текст — он станет задачей во «Входящих».\n/stop — отвязать чат."); return { statusCode: 200, body: "ok" }; }
  if (!text) { await say("Пока понимаю только текст."); return { statusCode: 200, body: "ok" }; }
  for (const u of uids) await d.addInbox(u, rid(), text.slice(0, MAXLEN));
  await say("Добавил во «Входящие» ✓");
  return { statusCode: 200, body: "ok" };
}

// нажатие кнопки под напоминанием: «готово» уходит в приложение через «Входящие» (запись act-…), «отложить» — новое разовое напоминание
async function onButton(cq) {
  const d = db(), chat = cq.message && cq.message.chat && cq.message.chat.id, data = String(cq.data || ""), act = data.charAt(0), rid = data.slice(2);
  const answer = (t) => tg("answerCallbackQuery", { callback_query_id: cq.id, text: t }).catch(() => {});
  const uids = chat ? await d.byChat(chat) : [];
  if (!uids.length) { await answer("Чат не привязан к приложению"); return { statusCode: 200, body: "ok" }; }
  const parts = rid.split(":"), kind = parts[0], target = (parts[1] || "").replace(/~s/g, "");
  const text = String((cq.message && cq.message.text) || "").replace(/^⏰\s*/, "").split("\n")[0].replace(/^через [^—]{1,12} — /, "").slice(0, 900);
  let note = "";
  if (act === "d") {
    for (const u of uids) await d.addInbox(u, "act-" + rid2(), JSON.stringify({ act: kind === "h" ? "habit" : "done", id: target }));
    note = kind === "h" ? "✓ Отмечено" : "✓ Готово";
    await answer(note + " — приложение обновится при открытии");
  } else if (!/^[abc]$/.test(act)) {
    await answer(""); return { statusCode: 200, body: "ok" };
  } else {
    const now = Date.now(), at = act === "a" ? now + 15 * 60000 : act === "b" ? now + 60 * 60000 : now + 24 * 3600000;
    for (const u of uids) await d.putReminder(u, { id: (rid.replace(/~s$/, "") + "~s").slice(0, 80), at: at, text: text || "Напоминание", task: kind === "t" ? target : "", rrule: "" });
    note = act === "a" ? "⏰ Напомню через 15 минут" : act === "b" ? "⏰ Напомню через час" : "⏰ Напомню завтра";
    await answer(note);
  }
  // убираем кнопки и дописываем, что сделано
  if (cq.message) await tg("editMessageText", { chat_id: chat, message_id: cq.message.message_id, text: (cq.message.text || "") + "\n" + note }).catch(() => {});
  return { statusCode: 200, body: "ok" };
}
function rid2() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

/* ---------------- таймер: рассылка напоминаний ---------------- */
// кнопки под напоминанием; callback_data ≤ 64 байт: «действие|id напоминания»
function buttonsFor(id) {
  const rid = String(id).slice(0, 56);
  if (/^h:/.test(rid)) return { inline_keyboard: [[{ text: "✓ Отметить", callback_data: "d|" + rid }, { text: "+1 ч", callback_data: "b|" + rid }]] };
  if (!/^t:/.test(rid)) return undefined;
  return { inline_keyboard: [[{ text: "✓ Готово", callback_data: "d|" + rid }, { text: "+15 мин", callback_data: "a|" + rid }, { text: "+1 ч", callback_data: "b|" + rid }, { text: "Завтра", callback_data: "c|" + rid }]] };
}

async function tick() {
  const d = db(), now = Date.now(), list = await d.due(now);
  let sent = 0;
  for (const r of list) {
    if (r.chat) {
      try { await tg("sendMessage", { chat_id: r.chat, text: "⏰ " + r.text, reply_markup: buttonsFor(r.id) }); sent++; }
      catch (e) { if (e.code === 403) await d.unlinkChat(r.chat).catch(() => {}); } // бот заблокирован — отвязываем
    }
    const n = nextAt(r.at, r.rrule, now);
    if (n) await d.moveReminder(r.uid, r.id, n); else await d.delReminder(r.uid, r.id);
  }
  return { statusCode: 200, body: JSON.stringify({ due: list.length, sent }) };
}

/* ---------------- вход ---------------- */
module.exports.handler = async function (event, context) {
  IAM = (context && context.token && context.token.access_token) || IAM;
  try {
    if (event && Array.isArray(event.messages) && !event.httpMethod) return await tick();
    const path = String((event && (event.path || event.url)) || "");
    if (/^\/?tg\//.test(path)) return await bot(event);
    return await api(event || {});
  } catch (e) {
    console.error(e && (e.stack || e.message || e));
    if (event && event.httpMethod) return reply(event, 500, { error: "server", message: String((e && e.message) || e) });
    return { statusCode: 500, body: "error" };
  }
};
module.exports._setDb = function (x) { DB = x; };
module.exports._nextAt = nextAt;

<script>
(function () {

  function uid() { return Date.now().toString(36).slice(-6) + Math.random().toString(36).slice(2, 6); }
  var LS = {

  };

    else toast("Выделите и скопируйте вручную");
  }

  /* ---------- состояние ---------- */

  var S = (function () { try { return JSON.parse(LS.get("zd-state") || "null"); } catch (e) { return null; } })() || {};
  S.v = 2; S.tasks = S.tasks || []; S.projects = S.projects || []; S.tags = S.tags || []; S.filters = S.filters || []; S.sprints = S.sprints || []; S.comments = S.comments || []; S.habits = S.habits || []; S.hlog = S.hlog || []; S.acts = S.acts || []; S.tpls = S.tpls || []; S.flags = S.flags || []; S.at = S.at || 0; S.opt = S.opt || { autoRem: true };
  var VIEWS = (function () { try { return JSON.parse(LS.get("zd-views") || "{}") || {}; } catch (e) { return {}; } })();
  function save(quiet) { S.at = Date.now(); LS.set("zd-state", JSON.stringify(S)); if (!quiet) { SYNC.later(); SRV.later(); } }
  function live(a) { return a.filter(function (x) { return !x.del; }); }

  }

  function task(id) { return id ? live(S.tasks).filter(function (t) { return t.id === id; })[0] || null : null; }
  // удалённые записи хранятся «надгробием» 60 дней, чтобы удаление дошло до других устройств
  function prune() {

    ["tasks", "projects", "tags", "filters"].forEach(function (k) { S[k].forEach(function (x) { if (x.del && !x.purged && (x.delAt || x.upd || 0) < tl) { x.purged = 1; x.t = ""; x.note = ""; x.body = ""; if (k !== "tasks") x.n = ""; } }); });

    var lim = Date.now() - 60 * 864e5; ["tasks", "projects", "tags", "filters", "sprints", "comments", "habits", "hlog", "tpls", "flags"].forEach(function (k) { S[k] = S[k].filter(function (x) { return !x.del || x.upd > lim; }); }); }

  /* --- проекты: дерево любой глубины --- */

      "<li><b>Подзадачи</b> — кнопка ＋ у задачи (появляется при наведении) или «＋ Подзадача» в карточке задачи. У подзадач могут быть свои подзадачи — глубина любая; ▾ слева сворачивает ветку. Ещё способ: перетащите задачу на другую задачу — она станет её подзадачей; или в карточке выберите «Входит в задачу». Отметка «готово» у задачи закрывает и её незавершённые подзадачи.</li>" +
      "<li>Задачу можно перетащить на проект, тег, «Входящие», «Сегодня» или «С флажком» в левой панели.</li></ul>";
    h += '<h2 id="h-card">Карточка задачи и описание</h2><p>Нажмите на задачу — справа откроется карточка (на телефоне — на весь экран). Всё сохраняется сразу, кнопки «Сохранить» нет. Вверху: ⤢ — развернуть задачу на весь экран (⤡ — обратно в панель), флажок ⚑, удаление 🗑 и закрытие ✕ (или Esc). Ширину панели можно менять, потянув мышью за её левый край; двойной клик по краю — ширина по умолчанию. Размер и режим запоминаются. Название меняется прямо в заголовке; ниже — срок, повтор, проект, приоритет, теги, родительская задача и напоминание; внизу — подзадачи (Enter добавляет новую, клик открывает её карточку).</p>' +
      '<p><b>Описание</b> — полноценный редактор. Нажмите <code>/</code> и выберите блок (можно сразу печатать название для поиска, ↑ ↓ и Enter):</p><div class="tscroll"><table><tr><th>Блок</th><th>Клавиши</th><th>Быстро</th></tr>' +
      [["Текст", "Ctrl+Shift+0", ""], ["To-do список (галочки — клик по квадратику)", "Ctrl+Shift+4", "[] пробел"], ["Заголовок 1 / 2 / 3", "Ctrl+Shift+1 / 2 / 3", "# / ## / ### пробел"], ["Маркированный список", "Ctrl+Shift+5", "- пробел"], ["Нумерованный список", "Ctrl+Shift+6", "1. пробел"], ["Спойлер (сворачивается кликом по ▸)", "Ctrl+Shift+7", ""], ["Цитата", "Ctrl+Shift+8", "> пробел"], ["Код", "Ctrl+Shift+9", "``` пробел"], ["Выноска 💡, таблица, разделитель", "через /", "--- пробел — разделитель"]].map(function (r) { return "<tr><td>" + esc(r[0]) + "</td><td><code>" + esc(r[1]) + "</code></td><td>" + (r[2] ? "<code>" + esc(r[2]) + "</code>" : "") + "</td></tr>"; }).join("") + "</table></div>" +
      "<p>Выделите текст — появится панель: жирный, курсив, подчёркнутый, зачёркнутый, код, маркер, ссылка (Ctrl+K), «убрать оформление». Tab в списке — вложить пункт, Shift+Tab — вернуть; Tab в таблице — следующая ячейка (в последней — новая строка). Ссылка открывается по Ctrl+клику. Если в описании есть to-do список, в строке задачи видно, сколько пунктов отмечено (☑ 2/5).</p>";
    h += '<h2 id="h-menu">Меню задачи и горячие клавиши</h2><p>Правый клик по задаче (на телефоне — долгое нажатие) открывает меню: дата и время ›, Помодоро, приоритет ›, теги ›, чек-лист, завершить ›, флажок, избранное, изменить проект ›, спринт ›, подзадача, родительская задача, вырезать / копировать / вставить / дублировать, ссылка на задачу, удалить; внизу — когда задача создана и изменена. Клавиши работают для задачи под курсором или открытой в карточке:</p><div class="tscroll"><table><tr><th>Клавиши</th><th>Действие</th></tr>' +
      [["Enter", "открыть задачу"], ["Delete / Backspace", "удалить в корзину"], ["Ctrl+C / Ctrl+X", "копировать / вырезать (вместе с подзадачами)"], ["Ctrl+V", "вставить: на задачу под курсором — подзадачей, иначе — в открытый список"], ["Ctrl+D", "дублировать"], ["Ctrl+G", "новый тег"], ["Ctrl+I", "чек-лист в описании"], ["Ctrl+Shift+L", "в избранное"], ["Ctrl+Shift+M", "изменить проект"], ["Alt+Shift+N", "новая подзадача"]].map(function (r) { return "<tr><td><code>" + r[0] + "</code></td><td>" + r[1] + "</td></tr>"; }).join("") + "</table></div>" +
      "<p><b>Помодоро</b> — 25 минут работы над задачей, затем 5 минут перерыва; таймер виден в левом нижнем углу (пауза ⏸, стоп ■, клик по названию открывает задачу), по окончании — звук и уведомление, в задаче копится счётчик 🍅. <b>Избранные задачи</b> (★) собираются наверху левой панели. <b>Ссылка на задачу</b> открывает приложение сразу на ней.</p>";
    h += '<h2 id="h-ai">Голосовой ввод и ИИ-помощник</h2><ul><li><b>🎤 Голос</b> — кнопка рядом с полем новой задачи (и в комментариях). Скажите, например: «завтра в десять позвонить в банк», проверьте текст и нажмите Enter. Работает в Chrome, Edge и Яндекс Браузере; при первом нажатии браузер спросит доступ к микрофону. Речь распознаёт сервис браузера.</li>' +
      "<li><b>✨ ИИ-помощник</b> — в карточке задачи кнопка ✨: «Разбить на подзадачи» (с оценками времени), «Чек-лист в описание», «Оценить время». В «Сегодня» — «✨ Спланировать день»: ИИ расставит задачи без времени по часам с учётом занятого времени, вы видите план и нажимаете «Применить». В спринте — «✨ Подобрать задачи в спринт» с учётом вместимости недели и цели.</li>" +
      "<li><b>Подключение:</b> «Настройки» → «ИИ-помощник». ChatGPT — ключ на platform.openai.com (API keys, нужен пополненный баланс); OpenRouter — openrouter.ai → Keys (там же модели Claude и Gemini); DeepSeek — platform.deepseek.com. YandexGPT — через облачную функцию, как в «Электронном универе». Настройки общие с «Электронным универом» в этом браузере.</li></ul>";
    h += '<h2 id="h-matrix">Матрица, привычки, статистика</h2><ul><li><b>Матрица Эйзенхауэра</b> делит открытые задачи на четыре квадранта: важное (приоритет 1–2 или флажок) и срочное (просрочено или срок в ближайшие дни — сколько именно, выбирается над матрицей). Перетащите карточку в другой квадрант: «важно» ставит приоритет 2, «не важно» снимает приоритет и флажок, «срочно» ставит срок на сегодня, «не срочно» переносит на неделю вперёд.</li>' +
      "<li><b>Привычки</b> — «＋ Привычка»: название, сколько раз в день, дни недели, значок, цвет, время напоминания в Telegram. Клик по кружку отмечает день (если раз в день несколько — каждый клик +1). Видны серия 🔥, лучшая серия 🏆, процент за 30 дней и карта за 12 недель. Привычки на сегодня показаны и в «Сегодня». Клик по названию — изменить, в архив или удалить.</li>" +

    h += '<h2 id="h-cal">Календарь</h2><p>«Календарь» в левой панели: виды <b>День</b>, <b>Неделя</b>, <b>Месяц</b>, стрелки ‹ › и «Сегодня». Задачи со временем стоят на шкале часов, задачи на весь день и дедлайны (⏰) — в строке «весь день». Перетащите задачу на другой день или час (шаг — 15 минут); потяните нижний край — изменится длительность. Справа — задачи <b>без срока</b>: перетащите любую в календарь, чтобы запланировать. Двойной клик по пустому месту — новая задача на это время. Повторы показаны пунктиром. Клик по дню (числу) открывает его отдельно. Красная линия — текущее время.</p>';
    h += '<h2 id="h-gantt">Таймлайн</h2><p>«Таймлайн» в левой панели — задачи со сроками на шкале дней, сгруппированные по проектам. Полоса идёт от даты начала до дедлайна; задача только с дедлайном показана штриховкой, просроченная — красной обводкой.</p><ul><li><b>Перетащите полосу</b> — начало и дедлайн сдвинутся вместе.</li><li><b>Потяните за левый край</b> — изменится начало, <b>за правый</b> — дедлайн.</li><li>Клик по полосе или названию открывает карточку. Кнопки ‹ Сегодня › листают шкалу, «Дни / Недели» меняют масштаб.</li></ul>';
    h += '<h2 id="h-arch">Архив и шаблоны</h2><ul><li><b>В архив</b> — меню проекта (цветная точка у названия) или правый клик по проекту в панели. Проект и его задачи пропадают из списков, календаря и напоминаний, но не удаляются. Архив — значок 🗄 в нижней строке панели; оттуда проект можно вернуть.</li><li><b>Шаблон</b> — «Сохранить как шаблон» в меню проекта (вместе с подпроектами и задачами) или в меню задачи (вместе с подзадачами). Сроки запоминаются относительно самой ранней даты: при создании из шаблона она становится сегодняшним днём.</li><li>Создать из шаблона: «+» у «Проектов», значок «Шаблоны» в нижней строке панели или Ctrl+K → «Создать из шаблона».</li></ul>';
    h += '<h2 id="h-pal">Команды, выделение, порядок</h2><ul><li><b>Ctrl+K</b> (на Mac — ⌘K) — палитра: начните печатать и перейдите к списку, проекту, тегу, фильтру или задаче, выполните команду (тема, узкая панель, список/доска, синхронизация) или сразу создайте задачу из написанного текста — быстрый ввод там тоже работает.</li>' +
      "<li><b>Несколько задач сразу:</b> Ctrl+клик (⌘+клик) отмечает задачи, Shift+клик — диапазон, Ctrl+A — все в списке. Внизу появится панель: готово, срок, проект, приоритет, тег, спринт, флажок, удалить. Esc — снять выделение.</li>" +
      "<li><b>Свой порядок задач:</b> перетащите задачу к верхнему или нижнему краю другой задачи — она встанет перед ней или после (на середину — станет подзадачей). Сортировка списка переключится на «вручную»; её можно выбрать и в «Сортировке».</li></ul>";
    h += '<h2 id="h-board">Список или доска</h2><p>Над каждым списком (Входящие, Сегодня, Планы, С флажком, Все задачи, проекты, теги, фильтры) — переключатель <b>☰ Список / ▦ Доска</b>. На доске колонки строятся по выбранной группировке: без группировки или «по статусу» — «Нужно сделать / В работе / Готово (за 7 дней)»; «по проекту», «по приоритету», «по сроку», «по дням», «по тегу», «по флажку», «по спринту» — соответствующие колонки. Перетащите карточку в другую колонку — и у задачи поменяется статус, проект, приоритет, срок, флажок или спринт (в колонку тега — тег добавится). Клик по карточке открывает задачу. Вид запоминается для каждого списка.</p>';
    h += '<h2 id="h-sprint">Недельные спринты</h2><ul><li><b>Спринт</b> — это неделя с понедельника по воскресенье. «Спринт» в левой панели открывает текущий; стрелки ‹ › — соседние недели; «Все спринты» — история со скоростью (сколько часов или задач вы закрываете в среднем за неделю).</li>' +
      "<li><b>Планирование:</b> впишите цель спринта, внизу страницы — бэклог (задачи без спринта): «→ в спринт» у задачи, или перетащите задачу на «Спринт» в левой панели, или выберите спринт в карточке задачи. Там же — <b>оценка в часах</b>; «Вместимость недели» показывает загрузку и предупреждает о перегрузе.</li>" +
      "<li><b>Доска</b> «Нужно сделать / В работе / Готово» — перетаскивайте карточки между колонками (или меняйте «Статус» в карточке задачи). Вид «Список» — то же списком. <b>График сгорания</b> показывает, сколько осталось, и сравнивает с идеальным темпом.</li>" +
      "<li><b>Завершить спринт…</b> — итоги (что получилось, что улучшить) и куда деть незакрытые задачи: в следующий спринт или в бэклог. Если неделя прошла, а спринт не закрыт, в новом спринте появится предложение перенести хвосты.</li><li>В фильтрах есть условие «Спринт», а в группировке — «по статусу» и «по спринту».</li></ul>";
    h += '<h2 id="h-chat">Комментарии</h2><p>Внизу карточки задачи — лента комментариев, как в чате: Enter отправляет, Shift+Enter — новая строка, ссылки кликабельны. При наведении на сообщение — ✎ изменить и × удалить. Число комментариев видно в строке задачи (💬). Комментарии синхронизируются между устройствами отдельно от задачи, поэтому сообщения с телефона и компьютера не теряются.</p>';
    h += '<h2 id="h-trash">Удаление и корзина</h2><ul><li><b>Проект, тег или фильтр</b> удаляется кнопкой 🗑 рядом со звёздочкой в заголовке его страницы или значком 🗑 у пункта в левой панели (появляется при наведении). Задачи проекта при этом не пропадают — они перейдут во «Входящие», а при восстановлении проекта вернутся в него.</li><li>Задачу удалить можно кнопкой × у задачи (при наведении), 🗑 в карточке задачи, через меню правой кнопкой мыши (на телефоне — долгое нажатие) у задачи, проекта, тега или фильтра, в меню цветной точки проекта — или перетащив задачу на «Корзину» в левой панели.</li><li>Всё удалённое попадает в <b>Корзину</b> (внизу левой панели) и хранится там <b>30 дней</b>: «Восстановить» возвращает задачу вместе с подзадачами и комментариями, проект — вместе с его задачами и подпроектами, тег — на те задачи, где он был. «Удалить навсегда» и «Очистить корзину» стирают без возврата. Сразу после удаления внизу появляется «Вернуть».</li></ul>';
    h += '<h2 id="h-icons">Иконки проектов и родительские задачи</h2><p>У каждого проекта рядом с цветной точкой есть иконка: она подбирается по названию («Дом» — 🏠, «Работа» — 💼, «Учёба» — 🎓, «Финансы» — 💰…), а свою можно выбрать, нажав на точку или иконку у названия проекта. В карточке подзадачи вверху — «↑ Родительская задача»: клик открывает родителя (и всю цепочку выше); в списках ссылка «↳ …» у подзадачи тоже ведёт к родителю.</p>';
    h += '<h2 id="h-mini">Левая панель</h2><p>Блоки панели — «Избранное», «Списки», «Проекты», «Фильтры», «Теги», «Служебное» (корзина, настройки, справка) — можно переставлять мышью: потяните блок за заголовок (при наведении появится ⠿) выше или ниже другого блока. Пункты в «Списках» (Входящие, Сегодня, Спринт…) тоже перетаскиваются. Исходный порядок — «Настройки» → «Левая панель» → «Вернуть исходный порядок». </p><p>Кнопка «« вверху левой панели сворачивает её до полосы с иконками (проекты — цветные точки, теги — #); подписи — при наведении. »» — развернуть обратно. Режим запоминается на этом устройстве.</p>';
    h += '<h2 id="h-fav">Теги, флажки, избранное</h2><ul><li><b>Теги</b>: пишите #тег при вводе или отмечайте в карточке задачи. У тега свой цвет и своя страница; «+» у заголовка «Теги» создаёт тег.</li><li><b>Флажки</b> — свой набор с названиями и цветами (по умолчанию красный, жёлтый, зелёный, синий; меняются в «Настройки» → «Флажки»). У задачи — один флажок: кнопка ⚑ у задачи, строка «Флажок» в карточке, правый клик → «Флажок» или при вводе «!!» (первый флажок) и «!!жёлтый» (по названию). Список «С флажком» показывает все такие задачи, а вверху — отбор по каждому флажку.</li><li><b>Избранное</b> — звёздочка ☆ у проекта, тега или фильтра (в заголовке или в левой панели при наведении). Избранное собирается наверху левой панели.</li></ul>';
    h += '<h2 id="h-views">Группировка, сортировка, фильтры</h2><ul><li>Над каждым списком — <b>Группировка</b> (без, по сроку, по дням, по проекту, по приоритету, по тегу, по флажку) и <b>Сортировка</b> (по сроку, приоритету, названию, сначала новые). Выбор запоминается для каждого списка отдельно. В проекте с подпроектами можно показать и их задачи.</li>' +
