<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2147C8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Рост">
<title>Мастерская роста</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Unbounded:wght@600&display=swap">
<style>
/* Макет: левая колонка навигации по неделям, справа урок; урок — «тетрадь» с рабочей зоной. */
:root {
  --bg: #F3F5F8;
  --surface: #FFFFFF;
  --surface-2: #EAEEF3;
  --ink: #131A22;
  --muted: #566170;
  --line: #D3DAE3;
  --accent: #2147C8;
  --accent-soft: #E3EAFB;
  --accent-ink: #FFFFFF;
  --mark: #C8323C;
  --mark-soft: #FBE7E8;
  --ok: #17794D;
  --ok-soft: #DDF3E8;
  --font-ui: "Golos Text", "Segoe UI", system-ui, sans-serif;
  --font-display: "Unbounded", "Golos Text", "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E131A; --surface: #161D26; --surface-2: #1E2833; --ink: #E7ECF2; --muted: #9AA6B4;
    --line: #2B3745; --accent: #86A0FF; --accent-soft: #1C2A52; --accent-ink: #0E131A;
    --mark: #FF7E86; --mark-soft: #3A1F23; --ok: #5FD2A0; --ok-soft: #12332A; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E131A; --surface: #161D26; --surface-2: #1E2833; --ink: #E7ECF2; --muted: #9AA6B4;
  --line: #2B3745; --accent: #86A0FF; --accent-soft: #1C2A52; --accent-ink: #0E131A;
  --mark: #FF7E86; --mark-soft: #3A1F23; --ok: #5FD2A0; --ok-soft: #12332A; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.6 var(--font-ui); }
a { color: var(--accent); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 12px;
  padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .brand { font: 600 15px/1 var(--font-display); letter-spacing: .01em; margin-right: auto; cursor: pointer; background: none; border: 0; padding: 6px 0; text-align: left; }
.top .prog { font: 500 13px var(--font-mono); color: var(--muted); white-space: nowrap; }
.top .prog b { color: var(--ink); }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; font-size: 14px; }
.icon-btn:hover { background: var(--surface-2); }
#menu-btn { display: none; }

.layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 0; max-width: 1180px; margin: 0 auto; }
nav#nav { border-right: 1px solid var(--line); padding: 16px 12px 40px 16px; position: sticky; top: 53px; align-self: start;
  max-height: calc(100vh - 53px); overflow-y: auto; }
.nav-week { margin-bottom: 4px; }
.nav-week > button { width: 100%; text-align: left; background: none; border: 0; padding: 8px 8px; border-radius: 8px;
  display: grid; grid-template-columns: 28px 1fr auto; gap: 6px; align-items: baseline; }
.nav-week > button:hover { background: var(--surface-2); }
.nav-week .wn { font: 600 12px var(--font-mono); color: var(--muted); }
.nav-week .wt { font-weight: 600; font-size: 14.5px; line-height: 1.3; }
.nav-week .wc { font: 500 12px var(--font-mono); color: var(--muted); }
.nav-week.cur > button { background: var(--accent-soft); }
.nav-week ul { list-style: none; margin: 2px 0 8px 36px; padding: 0; }
.nav-week li a { display: flex; gap: 8px; padding: 4px 8px; border-radius: 6px; text-decoration: none; color: var(--ink); font-size: 14px; line-height: 1.35; }
.nav-week li a:hover { background: var(--surface-2); }
.nav-week li a.active { background: var(--accent); color: var(--accent-ink); }
.nav-week li a .dot { flex: none; width: 10px; height: 10px; margin-top: 6px; border-radius: 50%; border: 1.5px solid var(--muted); }
.nav-week li a.done .dot { background: var(--ok); border-color: var(--ok); }

main#main { padding: 28px 24px 80px; min-width: 0; max-width: 820px; }
.crumb { font: 500 13px var(--font-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 0 0 8px; }
h1 { font: 600 clamp(24px, 4.2vw, 34px)/1.2 var(--font-display); margin: 0 0 12px; text-wrap: balance; letter-spacing: -.01em; }
h2 { font: 600 19px/1.3 var(--font-ui); margin: 32px 0 10px; text-wrap: balance; }
h3 { font: 600 16px/1.3 var(--font-ui); margin: 0 0 6px; }
p { margin: 0 0 12px; max-width: 68ch; }
.lead { font-size: 18px; color: var(--muted); max-width: 62ch; }

.why { border-left: 3px solid var(--accent); padding: 4px 0 4px 14px; margin: 18px 0 8px; font-size: 17px; max-width: 64ch; }
.pts { padding-left: 1.2em; margin: 0 0 8px; max-width: 70ch; }
.pts li { margin-bottom: 8px; }
.pts strong, p strong { font-weight: 600; background: linear-gradient(transparent 62%, var(--accent-soft) 62%); }

figure.fig { margin: 22px 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 8px 8px; overflow-x: auto; }
figure.fig svg { display: block; width: 100%; min-width: 560px; height: auto; }
figure.fig figcaption { font-size: 14px; color: var(--muted); padding: 6px 10px 4px; }
svg .fb { fill: var(--surface-2); stroke: var(--line); stroke-width: 1.2; }
svg .fa { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.4; }
svg .fm { fill: var(--mark-soft); stroke: var(--mark); stroke-width: 1.4; }
svg .ft { fill: var(--ink); font: 600 13px var(--font-ui); }
svg .fs { fill: var(--muted); font: 400 12px var(--font-ui); }
svg .fx { fill: var(--muted); font: 500 11.5px var(--font-mono); }
svg .fl { stroke: var(--muted); stroke-width: 1.5; fill: none; }
svg .fk { stroke: var(--accent); stroke-width: 2.4; fill: none; stroke-linejoin: round; stroke-linecap: round; }
svg .fd { fill: var(--accent); }
svg .fg { stroke: var(--line); stroke-width: 1; stroke-dasharray: 4 4; }
svg .fband { fill: var(--surface-2); opacity: .55; }

.example, .errors { border-radius: 10px; padding: 12px 14px; margin: 12px 0; max-width: 70ch; }
.example { background: var(--surface); border: 1px solid var(--line); }
.errors { background: var(--mark-soft); border: 1px solid var(--mark); }
.example h3, .errors h3 { font: 600 13px var(--font-mono); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; color: var(--muted); }
.errors h3 { color: var(--mark); }
.errors ul { margin: 0; padding-left: 1.1em; }
.errors p, .example p { margin-bottom: 0; }

details.qa { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); margin: 8px 0; max-width: 70ch; }
details.qa summary { padding: 10px 14px; cursor: pointer; font-weight: 500; }
details.qa div { padding: 0 14px 12px; color: var(--muted); }

.task { background: var(--surface); border: 1.5px solid var(--accent); border-radius: 14px; padding: 18px 18px 20px; margin: 32px 0 20px; }
.task .tag { font: 600 12px var(--font-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--accent); margin: 0 0 6px; }
.task .out { font-size: 14px; color: var(--muted); margin: 0 0 10px; }
textarea.ans { width: 100%; min-height: 190px; resize: vertical; font: 400 16px/1.55 var(--font-ui); color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.ans-meta { display: flex; justify-content: space-between; gap: 12px; font: 500 12px var(--font-mono); color: var(--muted); margin-top: 6px; }

.rubric { margin: 18px 0 0; }
.crit { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; padding: 10px 0; border-top: 1px solid var(--line); }
.crit .c-name { font-weight: 600; }
.crit .c-hint { font-size: 14px; color: var(--muted); grid-column: 1; }
.crit .pick { grid-column: 2; grid-row: 1 / span 2; display: flex; gap: 6px; align-items: center; }
.pick label { display: inline-flex; }
.pick input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.pick span { display: inline-block; min-width: 40px; text-align: center; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px;
  font: 600 13px var(--font-mono); background: var(--bg); cursor: pointer; }
.pick input:checked + span { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.pick input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.score { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-top: 2px solid var(--ink); padding-top: 12px; margin-top: 4px; }
.score .num { font: 600 22px var(--font-mono); }
.score .verdict { font-weight: 600; }
.score .verdict.pass { color: var(--ok); }
.score .verdict.fail { color: var(--mark); }

.actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0 0; }
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); padding: 10px 16px; border-radius: 10px; font-weight: 600; }
.btn.ghost { background: var(--surface); color: var(--accent); }
.btn:hover { filter: brightness(1.08); }
.btn.done { background: var(--ok); border-color: var(--ok); color: #fff; }
.sendbox { margin-top: 12px; }
.sendbox textarea { width: 100%; min-height: 200px; font: 400 13.5px/1.5 var(--font-mono); background: var(--bg); color: var(--ink);
  border: 1px dashed var(--accent); border-radius: 10px; padding: 12px; }
.sendbox .hint { font-size: 14px; color: var(--muted); margin: 6px 0; max-width: 64ch; }

details.sample { margin: 14px 0 0; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
details.sample summary { padding: 10px 14px; cursor: pointer; font-weight: 600; }
details.sample p { padding: 0 14px 12px; margin: 0; color: var(--muted); }

.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 36px; padding-top: 18px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.pager a { text-decoration: none; border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; background: var(--surface); color: var(--ink); max-width: 100%; }
.pager a:hover { border-color: var(--accent); }
.pager small { display: block; font: 500 12px var(--font-mono); color: var(--muted); text-transform: uppercase; }

.weeks { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; margin: 14px 0 28px; padding: 0; list-style: none; }
.weeks a { display: block; text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; height: 100%; }
.weeks a:hover { border-color: var(--accent); }
.weeks .wn { font: 600 12px var(--font-mono); color: var(--accent); text-transform: uppercase; letter-spacing: .06em; }
.weeks .wt { display: block; font-weight: 600; margin: 4px 0; line-height: 1.3; }
.weeks .wg { font-size: 14px; color: var(--muted); display: block; }
.weeks .wp { margin-top: 10px; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.weeks .wp i { display: block; height: 100%; background: var(--ok); }
.steps { counter-reset: s; list-style: none; padding: 0; margin: 12px 0 20px; display: grid; gap: 10px; max-width: 70ch; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: baseline; }
.steps li::before { content: counter(s); font: 600 14px var(--font-mono); width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft);
  color: var(--accent); display: inline-grid; place-items: center; }
.scale { width: 100%; max-width: 560px; border-collapse: collapse; margin: 10px 0 16px; font-size: 15px; }
.scale th, .scale td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.scale th { font: 600 12px var(--font-mono); text-transform: uppercase; color: var(--muted); }
.src { columns: 2 260px; column-gap: 28px; padding-left: 1.1em; max-width: 760px; font-size: 14.5px; color: var(--muted); }
.lessons-list { list-style: none; padding: 0; margin: 12px 0; display: grid; gap: 8px; }
.lessons-list a { display: grid; grid-template-columns: 38px 1fr auto; gap: 10px; align-items: baseline; text-decoration: none; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.lessons-list a:hover { border-color: var(--accent); }
.lessons-list .ln { font: 600 13px var(--font-mono); color: var(--muted); }
.lessons-list .ls { font: 600 13px var(--font-mono); color: var(--muted); white-space: nowrap; }
.lessons-list .ls.ok { color: var(--ok); }

@media (max-width: 900px) {
  #menu-btn { display: inline-block; }
  .layout { grid-template-columns: minmax(0, 1fr); }
  nav#nav { display: none; position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--line); background: var(--surface); }
  nav#nav.open { display: block; }
  main#main { padding: 22px 16px 70px; }
  .crit { grid-template-columns: minmax(0, 1fr); }
  .crit .pick { grid-column: 1; grid-row: auto; }
}
@media (prefers-reduced-motion: no-preference) {
  main#main > * { animation: rise .25s ease-out both; }
  @keyframes rise { from { transform: translateY(4px); } to { transform: none; } }
}

/* Мастерская роста: источники урока и библиотека */
.from { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 12px 14px; margin: 12px 0; max-width: 70ch; }
.from h3 { font: 600 13px var(--font-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--accent); margin-bottom: 6px; }
.from ul { margin: 0; padding-left: 1.1em; font-size: 15px; }
.from li { margin-bottom: 6px; }
.from a, .book a { text-decoration: none; }
.from a:hover, .book a:hover { text-decoration: underline; }
.badge { display: inline-block; font: 600 11px var(--font-mono); text-transform: uppercase; letter-spacing: .05em; padding: 1px 6px; border-radius: 6px;
  background: var(--surface-2); color: var(--muted); vertical-align: 1px; }
.badge.au, .from .badge { background: var(--accent-soft); color: var(--accent); }
.nav-lib { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
.nav-lib a { display: grid; grid-template-columns: 28px 1fr auto; gap: 6px; align-items: baseline; padding: 8px; border-radius: 8px; text-decoration: none; color: var(--ink); }
.nav-lib a:hover { background: var(--surface-2); }
.lib-tools { position: sticky; top: 53px; z-index: 5; background: var(--bg); padding: 10px 0 8px; display: grid; gap: 10px; }
.lib-tools input { width: 100%; font: 400 16px var(--font-ui); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 14px; }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.lib { display: grid; gap: 10px; margin-top: 6px; }
.book { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; scroll-margin-top: 150px; }
.book.hl { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.book h3 { font-size: 16.5px; margin: 6px 0 2px; }
.book p { font-size: 15px; margin-bottom: 6px; max-width: none; }
.book .ba { color: var(--muted); font-size: 14px; }
.book .bc { font: 500 12px var(--font-mono); color: var(--muted); }
.book .bs { font-size: 13px; color: var(--mark); }
.book .bu { font-size: 13.5px; color: var(--muted); margin: 0; }
@media (max-width: 900px) { .lib-tools { top: 53px; } }
.book .bl { margin: 2px 0 6px; font-size: 14.5px; font-weight: 600; }
/* Подробный разбор урока */
section.deep { margin: 14px 0 18px; max-width: 70ch; }
section.deep h3 { font-size: 17px; margin-bottom: 6px; }
section.deep p { margin-bottom: 8px; }
.check { background: var(--ok-soft); border: 1px solid var(--ok); border-radius: 10px; padding: 12px 14px; margin: 16px 0; max-width: 70ch; }
.check h3 { font: 600 13px var(--font-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--ok); margin-bottom: 6px; }
.check ul { margin: 0; padding-left: 0; list-style: none; }
.check li { padding-left: 24px; position: relative; margin-bottom: 5px; }
.check li::before { content: "☐"; position: absolute; left: 0; color: var(--ok); }
/* План чтения */
.pbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 6px 0 18px; font: 500 13px var(--font-mono); color: var(--muted); }
.pbar .wp { flex: 1 1 240px; height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.pbar .wp i { display: block; height: 100%; background: var(--ok); }
.pw { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; scroll-margin-top: 70px; }
.pw.full { border-color: var(--ok); }
.pwh { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-bottom: 4px; }
.pwh h3 { margin: 0; font-size: 16px; }
.pwh a { font-size: 14px; text-decoration: none; }
.pwh .pm { margin-left: auto; }
.pw h4 { font: 600 12px var(--font-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 10px 0 4px; }
.pl { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.pi { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 8px; align-items: start; font-size: 15px; }
.pi a { text-decoration: none; }
.pi small { color: var(--muted); }
.pi.ok a { color: var(--muted); text-decoration: line-through; }
.pc { display: inline-flex; padding-top: 2px; cursor: pointer; }
.pc input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.pc span { width: 20px; height: 20px; border: 1.5px solid var(--muted); border-radius: 5px; display: inline-block; background: var(--bg); }
.pc input:checked + span { background: var(--ok); border-color: var(--ok); }
.pc input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.pm { font: 500 12px var(--font-mono); color: var(--muted); }
details.px { margin-top: 8px; }
details.px summary { cursor: pointer; font-size: 14px; color: var(--accent); }
details.px .pl { margin-top: 6px; }

</style>
</head><body>
<header class="top">
  <button type="button" id="menu-btn" class="icon-btn" aria-label="Меню курса">Меню</button>
  <button type="button" id="brand" class="brand">Мастерская роста</button>
  <span class="prog" id="prog" aria-label="Пройдено уроков"></span>
  <button type="button" id="theme" class="icon-btn" aria-label="Сменить тему">Тема</button>
</header>
<div class="layout">
  <nav id="nav" aria-label="Недели и уроки"></nav>
  <main id="main"></main>

window.LIB=[{"id": "bs_100", "c": "S", "f": "к", "a": "Роман Баулин, Лео Шевченко", "t": "100 целей человека в жизни", "k": "Список из 100 целей по сферам на год; брать 10–20 для начала, дробить на простые шаги и вести в отдельном блокноте.", "s": "", "u": ""}, {"id": "merenkov", "c": "S", "f": "к", "a": "Павел Меренков", "t": "Благодарность из будущего", "k": "Благодарность как ежедневная практика внимания к хорошему; «благодарить из будущего» — проживать цель как уже случившуюся, чтобы удерживать мотивацию и замечать возможности.", "s": "", "u": "https://www.litres.ru/73774013/"}, {"id": "truskova", "c": "S", "f": "к", "a": "Леночка Трускова", "t": "Вдохновение. Как разрешить себе творить", "k": "Творить мешает не отсутствие таланта, а запрет себе: выбирать себя, быть добрым к себе, замечать хорошее, знакомиться с внутренним критиком и действовать маленькими шагами.", "s": "", "u": "https://www.litres.ru/9598838/"}, {"id": "lyonnet", "c": "S", "f": "к", "a": "Анни Лайоннет", "t": "Великолепный лайф-коучинг (=«Думай, делай, достигай!»)", "k": "Десять шагов самокоучинга: ответственность за жизнь, колесо баланса сфер, ценности, смена убеждений, цели, план и поддержка. Коуч задаёт вопросы — вы сами себе коуч.", "s": "", "u": "https://www.litres.ru/8498956/"}, {"id": "duhigg", "c": "S", "f": "к", "a": "Чарльз Дахигг", "t": "Власть привычки", "k": "Петля привычки «сигнал → действие → награда» и тяга к награде; меняют не петлю целиком, а действие при старом сигнале и старой награде. Ключевые привычки тянут за собой остальные; вера и группа удерживают перемены.", "s": "", "u": "https://www.litres.ru/23308080/"}, {"id": "pressfield", "c": "S", "f": "к", "a": "Стивен Прессфилд", "t": "Война за креатив", "k": "Сопротивление — внутренняя сила, мешающая важной работе; побеждает профессионал, который приходит работать каждый день, независимо от вдохновения.", "s": "", "u": ""}, {"id": "gladwell", "c": "S", "f": "к", "a": "Малкольм Гладуэлл", "t": "Гении и аутсайдеры", "k": "Успех — не только талант: время рождения, культура, накопленное преимущество и около 10 000 часов практики. Возможности распределены неравно, поэтому их надо создавать и замечать.", "s": "", "u": "https://www.litres.ru/4519228/"}, {"id": "godeff", "c": "S", "f": "к", "a": "сборник саммари", "t": "Год личной эффективности. Когнитивный интеллект", "k": "Конспекты 12 книг: Аллен (GTD), Кови, Элрод («Магия утра»), Пинк (мотивация 3.0), Минто (принцип пирамиды), Карнеги, Сиберг (цифровая диета), Кауфман (первые 20 часов навыка), Эйкерс (бережливость), Сазерленд (Scrum), Максвелл (лидерство).", "s": "", "u": "https://www.litres.ru/46839943/"}, {"id": "pint_act", "c": "S", "f": "к", "a": "Ицхак Пинтосевич", "t": "Действуй! 10 заповедей успеха", "k": "Система «ответственность — правда себе — цели — действие — контроль»: не жди мотивации, делай; окружение, отношения и характер определяют результат больше, чем знания.", "s": "", "u": "https://www.litres.ru/2868695/"}, {"id": "novak_week", "c": "S", "f": "к", "a": "Алекс Новак", "t": "Еженедельник идеалиста", "k": "54 коротких шага-упражнения к цели: работа со временем, коммуникацией, ресурсами; цель достигается регулярными малыми действиями, которые никто не сделает за вас.", "s": "", "u": "https://www.litres.ru/12110342/"}, {"id": "ferris_tools", "c": "S", "f": "к", "a": "Тим Феррис", "t": "Инструменты гигантов", "k": "Привычки и рецепты сотен успешных людей: утренние ритуалы, медитация, дневник, вопросы-фильтры, тело и сон; берите только то, что подходит, и тестируйте.", "s": "", "u": "https://www.litres.ru/40615522/"}, {"id": "schwartz", "c": "S", "f": "к", "a": "Дэвид Шварц", "t": "Искусство мыслить масштабно", "k": "Верьте в успех, лечите «болезнь отговорок» (здоровье, ум, возраст, удача), действуйте против страха, думайте о себе как о значимом человеке, окружайте себя большими мыслителями.", "s": "", "u": "https://www.litres.ru/18371237/"}, {"id": "carnegie_speak", "c": "S", "f": "к", "a": "Дейл Карнеги", "t": "Как выработать уверенность в себе и влиять на людей, выступая публично", "k": "Уверенность приходит из подготовки и опыта: говорите о том, что заслужили правом знания, готовьте, но не заучивайте; начало и конец речи, примеры, энтузиазм.", "s": "", "u": "https://www.litres.ru/21132856/"}, {"id": "novak_book", "c": "S", "f": "к", "a": "Алекс Новак", "t": "Книга, которой нет", "k": "Выйти из «беличьего колеса»: жизнь как игра с правилами, ревизия мечты, система навыков (время, деньги, общение) и план маленьких шагов без ожидания идеального момента.", "s": "", "u": "https://www.litres.ru/9524941/"}, {"id": "kleon1", "c": "S", "f": "к", "a": "Остин Клеон", "t": "Кради как художник", "k": "Ничто не рождается из пустоты: копируйте учителей, смешивайте влияния, пока не получится своё. Работайте руками, держите побочные проекты, будьте скучным в быту ради смелости в работе.", "s": "", "u": "https://www.litres.ru/22957368/"}, {"id": "seelig", "c": "S", "f": "к", "a": "Тина Силиг", "t": "Креатив по правилам", "k": "Цикл изобретения: воображение → творчество → инновации → предпринимательство; увлечённость, предвидение, мотивация, эксперименты, фокус и упорство.", "s": "", "u": "https://www.litres.ru/40778324/"}, {"id": "soup2", "c": "S", "f": "к", "a": "Эми Ньюмарк (сост.)", "t": "Куриный бульон для души. Сила «Да»", "k": "Сказать «да» новому опыту: истории о смелости попробовать. Новизна расширяет зону комфорта и даёт материал для роста.", "s": "", "u": "https://www.litres.ru/43597319/"}, {"id": "soup1", "c": "S", "f": "к", "a": "Эми Ньюмарк (сост.)", "t": "Куриный бульон для души: 101 история о сильных людях", "k": "Истории преодоления: устойчивость строится из смысла, поддержки и маленьких решений. Материал для упражнений на надежду и переосмысление трудностей.", "s": "", "u": "https://www.litres.ru/23796778/"}, {"id": "fleish", "c": "S", "f": "к", "a": "Сабрина Фляйш", "t": "Легче лёгкого. Измени жизнь за 1 месяц", "k": "Месячная программа перемен: ценности и «столпы жизни», упражнение «Комод» (разложить жизнь по ящикам), три причины бездействия и смена жизненных установок через маленькие ежедневные действия.", "s": "", "u": "https://www.litres.ru/69275509/"}, {"id": "roberts", "c": "S", "f": "к", "a": "С. Робертс", "t": "Магия успешного утра", "k": "Утро задаёт день: хронотип, сон, ритуалы пробуждения (вода, движение, свет, план), постепенный сдвиг подъёма.", "s": "", "u": "https://www.litres.ru/42908572/"}, {"id": "luna", "c": "S", "f": "к", "a": "Эль Луна", "t": "Между надо и хочу", "k": "Перекрёсток выбора: «надо» — чужие ожидания, «хочу» — призвание; распознать источник «надо» и сделать шаг к «хочу».", "s": "", "u": "https://www.litres.ru/18736099/"}, {"id": "hardy", "c": "S", "f": "к", "a": "Даррен Харди", "t": "Накопительный эффект", "k": "Малые разумные решения + постоянство + время = радикальная разница. Отслеживайте поведение, меняйте ввод (окружение, информацию), держите импульс.", "s": "", "u": "https://www.litres.ru/51800047/"}, {"id": "rezanova", "c": "S", "f": "к", "a": "Елена Резанова", "t": "Никогда-нибудь", "k": "Как выйти из тупика: разобрать «надо» и «хочу», найти источники энергии, проверить мечты мини-экспериментами и делать маленькие шаги вместо ожидания «когда-нибудь».", "s": "", "u": "https://www.litres.ru/28738978/"}, {"id": "bs_aff", "c": "S", "f": "к", "a": "Роман Баулин, Лео Шевченко", "t": "Позитивные аффирмации, 40 примеров", "k": "Правила аффирмаций: коротко (3–6 слов), про себя, в настоящем времени, без «не», с эмоцией. Читаем критически: работает как напоминание о намерении, а не как магия.", "s": "", "u": ""}, {"id": "kleon2", "c": "S", "f": "к", "a": "Остин Клеон", "t": "Покажи свою работу", "k": "Делитесь процессом, а не только результатом: маленький шаг в день, рассказ истории работы, учите тому, что знаете. Становитесь заметным через щедрость, а не через саморекламу.", "s": "", "u": "https://www.litres.ru/23306973/"}, {"id": "kotler_fire", "c": "S", "f": "к", "a": "Стивен Котлер, Джейми Уил", "t": "Похищая огонь", "k": "Изменённые состояния — поток — дают всплеск продуктивности и творчества; четыре «рычага»: психология, нейробиология, медиа-технологии, физиология. Предупреждение о ловушках погони за пиками.", "s": "", "u": "https://www.litres.ru/39417517/"}, {"id": "tharp", "c": "S", "f": "к", "a": "Твайла Тарп", "t": "Привычка к творчеству", "k": "Творчество — привычка и ритуал начала дня; коробка проекта для идей, «раскопки» памяти, навыки и ограничения как топливо.", "s": "", "u": "https://www.litres.ru/21991482/"}, {"id": "prompts", "c": "S", "f": "к", "a": "сборник", "t": "Промты для жизни и карьеры", "k": "Готовые запросы к нейросети: план, обучение, письма, здоровье, финансы. Принцип: роль + контекст + задача + формат ответа.", "s": "", "u": ""}, {"id": "kleon3", "c": "S", "f": "к", "a": "Остин Клеон", "t": "Просто продолжай", "k": "Творчество — ежедневная практика «дня сурка»: расписание и список дел, оазис без отвлечений, процесс важнее итога; когда сомневаетесь — наведите порядок и погуляйте.", "s": "", "u": "https://www.litres.ru/48451480/"}, {"id": "cameron", "c": "S", "f": "к", "a": "Джулия Кэмерон", "t": "Путь художника", "k": "12-недельный курс восстановления творчества: «утренние страницы» (три страницы потока сознания ежедневно) и «свидания с художником» (еженедельное время наедине с собой для вдохновения).", "s": "", "u": "https://www.litres.ru/6714077/"}, {"id": "robbins", "c": "S", "f": "к", "a": "Энтони Роббинс", "t": "Разбуди в себе исполина", "k": "Решения — источник силы; поведение управляется связками «боль/удовольствие»; меняйте убеждения, вопросы, словарь и физиологию состояния; ставьте стандарты и ценности.", "s": "", "u": "https://www.litres.ru/21128748/"}, {"id": "memory_spec", "c": "S", "f": "к", "a": "Д. С. Букин", "t": "Развитие памяти по методикам спецслужб", "k": "Память держится на внимании (7±2 объекта), ассоциациях и повторении; упражнения агента-наблюдателя, расфокусированное наблюдение, запоминание лиц, чисел и маршрутов.", "s": "", "u": "https://www.litres.ru/8491157/"}, {"id": "moguchy", "c": "S", "f": "к", "a": "Антон Могучий", "t": "Самая полная книга-тренажёр для развития мозга", "k": "Набор ежедневных упражнений на внимание, память, логику и воображение; мозг тренируется как мышца — регулярно, с постепенным усложнением.", "s": "", "u": "https://www.litres.ru/9202921/"}, {"id": "dispenza", "c": "S", "f": "к", "a": "Джо Диспенза", "t": "Сверхъестественный разум", "k": "Медитации и визуализация как способ сменить привычные эмоции и состояние; полезное ядро — практика внимания и осознанная смена эмоциональной привычки. Научные утверждения автора о «квантовом поле» не подтверждены — читаем как метафору.", "s": "", "u": "https://www.litres.ru/26892311/"}, {"id": "covey", "c": "S", "f": "к", "a": "Стивен Кови", "t": "Семь навыков высокоэффективных людей", "k": "Личная победа (проактивность, начинать с конца, сначала главное) → общественная победа (выиграл/выиграл, сначала понять, синергия) → «затачивание пилы». Матрица важное/срочное, круг влияния и круг забот, эмоциональный банковский счёт.", "s": "", "u": "https://www.litres.ru/4239285/"}, {"id": "mcgonigal", "c": "S", "f": "к", "a": "Келли Макгонигал", "t": "Сила воли", "k": "Сила воли — три силы: «я буду», «я не буду», «я хочу»; она истощается и тренируется; ловушки морального самооправдания, «какого чёрта», обещаний будущему себе. Пауза и план.", "s": "", "u": "https://www.litres.ru/6298220/"}, {"id": "borg", "c": "S", "f": "к", "a": "Джеймс Борг", "t": "Сила мысли", "k": "Мысли определяют чувства: замечайте искажения (катастрофизация, чёрно-белое мышление, чтение мыслей), останавливайте негативную жвачку, переформулируйте и тренируйте внимание.", "s": "", "u": "https://www.litres.ru/11080177/"}, {"id": "lubench", "c": "S", "f": "к", "a": "Церен Церенов, Анна Лубенченко", "t": "Системное саморазвитие (т. 2)", "k": "Системное мышление для деятеля: видеть систему, надсистему и подсистемы, роли и интересы, жизненный цикл; саморазвитие как инженерный проект, а не набор привычек.", "s": "", "u": "https://www.litres.ru/66616738/"}, {"id": "state_eff", "c": "S", "f": "к", "a": "Сергей Филиппов", "t": "Состояние эффективности. Необычные методы самосовершенствования", "k": "Решения рушатся, потому что их принимают разные «я» — логический и эмоциональный импульс. Учитесь договариваться с собой и узнавать, кто сейчас принимает решение.", "s": "", "u": "https://www.litres.ru/8716096/"}, {"id": "pint_goals", "c": "S", "f": "к", "a": "Ицхак Пинтосевич", "t": "Ставь цели! Найти свою цель и достичь её за 1 год", "k": "Книга-тренинг: найти истинную цель через ценности, расписать её по системе «+», разбить на этапы, ежедневные действия и еженедельный контроль с поддержкой.", "s": "", "u": "https://www.litres.ru/6129947/"}, {"id": "haidt", "c": "S", "f": "к", "a": "Джонатан Хайдт", "t": "Стакан всегда наполовину полон! (Гипотеза счастья)", "k": "Разум — наездник на слоне; счастье = биология + условия + деятельность; адаптация к удовольствию, взаимность, любовь, работа как призвание и «между» — счастье приходит из связей.", "s": "", "u": "https://www.litres.ru/51694978/"}, {"id": "milliardov", "c": "S", "f": "к", "a": "Андрей Миллиардов", "t": "Стратегия жизни", "k": "Самоанализ → истинные цели → стратегия → план → регулярный пересмотр. Стратегия жизни — это не один план, а система решений, сверяемых с ценностями.", "s": "", "u": "https://www.litres.ru/71649406/"}, {"id": "sheve", "c": "S", "f": "к", "a": "Улаф Шеве", "t": "Суперстудент", "k": "Техники учёбы: активное чтение, конспект-карты, интервальное повторение, мнемотехники, подготовка к экзаменам и управление временем учёбы.", "s": "", "u": "https://www.litres.ru/43624158/"}, {"id": "muzh", "c": "S", "f": "к", "a": "Татьяна Мужицкая", "t": "Теория невероятности", "k": "Мечтать конкретно и смело, переводить мечты в цели по сферам жизни, планировать на год, работать с убеждениями и окружением; «невероятное» достигается системой.", "s": "", "u": "https://www.litres.ru/27304463/"}, {"id": "abramson", "c": "S", "f": "к", "a": "Дэвид Эйбрамсон", "t": "Теория получаса", "k": "30 минут в день на главное изменение дают больше, чем редкие рывки: терпение, регулярность и малые шаги складываются в результат.", "s": "", "u": "https://www.litres.ru/9010834/"}, {"id": "moskvina", "c": "S", "f": "к", "a": "Марина Москвина", "t": "Учись видеть. Уроки творческих взлетов", "k": "Творчество начинается с внимания к детали и живого взгляда: смотреть, удивляться, записывать, не бояться простоты и личной интонации.", "s": "", "u": "https://www.litres.ru/6184218/"}, {"id": "keller", "c": "S", "f": "к", "a": "Гэри Келлер, Джей Папазан", "t": "Хочу… совершить прорыв! (Единственная вещь)", "k": "Фокусирующий вопрос: «Какое ОДНО дело я могу сделать, чтобы всё остальное стало проще или ненужным?» Эффект домино, блок времени под главное, шесть лжеправил (многозадачность, баланс, сила воли всегда под рукой и др.).", "s": "", "u": "https://www.litres.ru/10215295/"}, {"id": "bs_energy", "c": "S", "f": "к", "a": "Роман Баулин, Лео Шевченко", "t": "Цели и энергия", "k": "Из точки А в точку Б: берём сферу «Деньги» и две самые слабые сферы жизни, ставим цели и ищем, где взять энергию на их достижение.", "s": "", "u": ""}, {"id": "a27619670", "c": "S", "f": "а", "a": "Михаил Литвак", "t": "10 методик развития мышления и памяти", "k": "Законы логики и психологии, которые помогают справляться с проблемами; память и мышление как тренируемые функции.", "s": "", "u": "https://www.litres.ru/27619670/"}, {"id": "a39285079", "c": "S", "f": "а", "a": "Михаил Литвак", "t": "7 шагов к успеху", "k": "Парадоксальные советы психотерапевта о пути к работе, которая приносит доход и радость: установки, сценарий жизни, последовательные шаги карьеры.", "s": "", "u": "https://www.litres.ru/39285079/"}, {"id": "a27442864", "c": "S", "f": "а", "a": "подкаст Никиты Маклахова", "t": "Аджан Хуберт: Как присутствовать здесь и сейчас?", "k": "Буддийский учитель традиции тхеравада о при чи недель на всё", "k": "Жизнь длится около 4000 недель; успеть всё невозможно по определению. Выбирайте, от чего отказаться, принимайте ограниченность, ограничьте число начатых дел, найдите радость в «сейчас».", "s": "", "u": "https://www.litres.ru/68872809/"}, {"id": "extreme_tm", "c": "T", "f": "к", "a": "Николай Мрочковский, Алексей Толкачёв", "t": "Экстремальный тайм-менеджмент (ознакомительный фрагмент)", "k": "Колесо жизни как отправная точка: оцените сферы и увидите, где перекос; работа не должна съедать остальные сферы.", "s": "", "u": "https://www.litres.ru/68808090/"}, {"id": "a58004531", "c": "T", "f": "а", "a": "Брайан Моран, Майкл Леннингтон", "t": "12 недель в году", "k": "Год — слишком абстрактный горизонт; живите 12-недельными циклами с недельным планом, учётом выполнения тактик и целью 85%.", "s": "", "u": "https://www.litres.ru/58004531/"}, {"id": "a23328659", "c": "T", "f": "а", "a": "Чарльз Дахигг", "t": "Восемь правил эффективности: умнее, быстрее, лучше", "k": "Мотивация через чувство контроля, командная психологическая безопасность, ментальные модели, растягивающие + SMART-цели, принятие решений, работа с данными.", "s": "", "u": "https://www.litres.ru/23328659/"}, {"id": "a19323482", "c": "T", "f": "а", "a": "Бенджамин Франклин", "t": "Время — деньги! (Автобиография; Совет молодому торговцу)", "k": "Автобиография и советы Франклина: план дня, 13 добродетелей, бережливость и трудолюбие; «время — деньги».", "s": "", "u": "https://www.litres.ru/19323482/"}, {"id": "a57473616", "c": "T", "f": "а", "a": "Джошуа Беккер", "t": "Дом минималиста", "k": "Комната за комнатой: владеть меньшим, чтобы освободить время и внимание для важного; практические шаги расхламления.", "s": "", "u": "https://www.litres.ru/57473616/"}, {"id": "a38840284", "c": "T", "f": "а", "a": "Джон Эйкафф", "t": "Закончи то, что начал", "k": "Перфекционизм — враг финиша; «день после идеального»; сократить цель вдвое, выбрать, что можно провалить, сделать процесс приятным.", "s": : "a25917124", "c": "F", "f": "а", "a": "Т. Харв Экер", "t": "Думай как миллионер", "k": "«Финансовый термостат»: доход определяется внутренними установками о деньгах; 17 различий мышления богатых и бедных; система «кувшинов» для распределения денег.", "s": "", "u": "https://www.litres.ru/25917124/"}, {"id": "a40512958", "c": "F", "f": "а", "a": "Наполеон Хилл", "t": "Механизмы работы мозга, которые делают нас богатыми", "k": "Внутренняя сила, вера и сосредоточенность на цели как двигатели достижения; читаем как мотивационный текст начала XX века.", "s": "", "u": "https://www.litres.ru/40512958/"}, {"id": "a56993023", "c": "F", "f": "а", "a": "Уоллес Уоттлз", "t": "Наука о том, как разбогатеть", "k": "Классика «позитивного мышления» 1910 года: ясное видение, вера, благодарность и деятельность «эффективными поступками». Духовную теорию читаем как мотивационную рамку.", "s": "", "u": "https://www.litres.ru/56993023/"}, {"id": "a34449606", "c": "F", "f": "а", "a": "Анастасия Тарасова", "t": "Сам себе финансист", "k": "Учёт доходов и расходов, оптимизация трат, финансовая подушка, накопления на цели и пенсию при любом доходе.", "s": "", "u": "https://www.litres.ru/34449606/"}, {"id": "a44595322", "c": "F", "f": "а", "a": "Наталия Грибуля, Назар Щетинин (подкаст «Калькулятор»)", "t": "Финансовая уборка", "k": "Как перестать жить от зарплаты до зарплаты: осознанное отношение к деньгам, учёт, первые накопления; данные НАФИ о тратах россиян.", "s": "", "u": "https://www.litres.ru/44595322/"}];
window.COURSE=[{"n": 1, "title": "Ответственность и мышление", "goal": "Перейти из позиции «со мной случается» в позицию «я выбираю»: увидеть круг влияния, свои отговорки и честную точку А.", "lessons": [{"t": "Круг влияния: из пассажира в водителя", "min": 40, "why": "Пока причина ваших результатов «снаружи», менять нечего и некому. Ответственность — не вина, а способность выбирать ответ.", "pts": ["**Проактивность** (Кови, навык 1): между стимулом и реакцией есть пространство выбора. Реактивный человек говорит «меня вынудили», проактивный — «я выбираю».", "**Круг забот** — всё, что вас волнует (курс валют, начальник, погода). **Круг влияния** — то, что вы реально можете сделать. Энергия, вложенная в круг влияния, расширяет его; жалобы на круг забот — сужают.", "Пинтосевич начинает «10 заповедей» с той же точки: **возьми ответственность** и **говори себе правду** — без этого цели и планы превращаются в самообман.", "Курпатов называет главную иллюзию «мне должны»: ожидание справедливости от мира парализует действие. Синсеро в «Не ной» доводит это до правила: жалоба — это отказ от собственной силы.", "Язык выдаёт позицию: «должен», «нет выбора», «если бы не…» — реактивный словарь. Замена на «я решаю», «я предпочитаю», «я могу» меняет фокус внимания."], "fig": {"k": "cols", "cols": [{"h": "Круг забот: не влияю", "items": ["экономика и цены", "характер начальника", "прошлые решения", "чужое мнение обо мне"]}, {"h": "Круг влияния: влияю", "items": ["мой бюджет и навыки", "как я веду разговор с начальником", "выводы из прошлого и следующий шаг", "моё поведение и работа"]}], "cap": "Одна и та же тема почти всегда имеет часть в круге влияния. Ищите её."}, "src": ["covey|навык 1 «Будьте проактивны», круг влияния и круг забот", "pint_act|заповедь 1: ответственность и правда себе", "k_myths|миф о справедливости «мне должны»", "a40260159|жалоба как отказ от силы", "a50803326|ежедневная работа над собой вместо оправданий", "lyonnet|шаг 1: ответственность за жизнь", "asaulyuk|ответственность за свою жизнь как основа отношений"], "ex": "«Меня не повышают, потому что начальник меня не замечает» (забота) → «Что из моих действий делает мою работу заметной? Я прошу обратную связь раз в месяц и показываю результаты цифрами» (влияние).", "err": ["Путать ответственность с самообвинением: «во всём виноват я» так же парализует, как «во всём виноваты они».", "Объявлять проактивность, но продолжать тратить вечера на обсуждение того, что изменить нельзя."], "qa": [["Что такое пространство между стимулом и реакцией?", "Момент выбора: событие не определяет ответ автоматически, ответ выбираете вы."], ["Как понять, что тема в круге забот?", "Вы не можете сделать по ней ни одного действия на этой неделе — только переживать или обсуждать."]], "task": "Выпишите три ситуации, на которые вы чаще всего жалуетесь. Для каждой разделите: что в круге забот, что в круге влияния. Сформулируйте одно действие из круга влияния на ближайшие 7 дней и перепишите одну свою жалобу на язык выбора.", "out": "Таблица: ситуация / забота / влияние / действие на неделю + одна переписанная фраза.", "rub": [["Ситуации реальные", "взяты из вашей жизни, а не абстрактные"], ["Разделение корректно", "в «влиянии» только то, что вы можете сделать сами"], ["Действия конкретны", "понятно, что, когда и как вы сделаете"], ["Язык переписан", "реактивная фраза заменена на фразу выбора без самообвинения"]], "sample": "Ситуация: «Нет времени на спорт». Забота: график работы, пробки. Влияние: что я делаю с 21:00 до 23:00. Действие: вторник и четверг в 21:00 — 30 минут тренировки дома. Фраза: «Я выбираю сериал вместо зарядки» вместо «у меня нет времени».", "deep": [{"h": "Стимул, пауза, ответ", "p": ["Кови опирается на мысль Виктора Франкла: между тем, что с нами происходит, и нашей реакцией есть пространство, и в нём находится свобода выбора. Реактивный человек живёт так, будто пространства нет: погода, настроение начальника, курс рубля сразу превращаются в его состояние и поступки. Проактивный замечает паузу и использует четыре способности, которые есть у каждого: **самосознание** (вижу, что со мной происходит), **воображение** (могу представить другой вариант), **совесть** (знаю, что для меня правильно) и **независимую волю** (могу действовать иначе).", "Проактивность — не активность и не оптимизм. Можно суетиться и при этом быть реактивным: бегать по кругу из-за чужих срочностей. Проактивность — это ответственность в буквальном смысле слова: response-ability, способность выбирать ответ."]}, {"h": "Как устроены два круга", "p": ["У каждого есть широкий **круг забот**: здоровье детей, долги, экономика, отношения на работе. Внутри него — меньший **круг влияния**: то, что мы реально можем изменить. Кови подчёркивает: проактивные люди тратят энергию внутри круга влияния, и он расширяется, потому что растут доверие, навыки и ресурсы. Реактивные тратят энергию на внешний круг — обвиняют, жалуются, ждут, — и их влияние сжимается.", "Полезно различать три вида проблем: с **прямым контролем** (решаются нашими привычками), с **косвенным контролем** (решаются влиянием на других людей) и **без контроля** (их нужно принять и перестать тратить на них силы). Для каждого вида свой инструмент: дисциплина, коммуникация или принятие."]}, {"h": "Язык как диагностика", "p": ["Пинтосевич и Кови сходятся в практичном наблюдении: позиция выдаёт себя в словах. «Я ничего не могу поделать», «Он меня бесит», «Я должен», «Если бы только…» — реактивный словарь, перекладывающий ответственность на обстоятельства. «Давай рассмотрим варианты», «Я могу выбрать другой подход», «Я предпочитаю», «Я сделаю» — проактивный словарь.", "Курпатов добавляет к этому социальный миф «мне должны»: ожидание справедливости от мира делает человека пассивным — он ждёт, когда мир исправится. Синсеро в «НЕ НОЙ» доводит идею до практики: каждая жалоба — это сообщение себе, что от вас ничего не зависит."], "li": ["«У меня нет времени» → «Я выбираю тратить время на другое».", "«Меня вынудили» → «Я согласился, потому что…».", "«Он испортил мне настроение» → «Я позволил его словам испортить мне вечер»."]}, {"h": "Ответственность без самобичевания", "p": ["Распространённая ошибка — превратить проактивность в вину: «раз всё зависит от меня, значит, во всём виноват я». Это та же реактивность, вывернутая наизнанку: человек тратит силы на прошлое, которое не изменить. Ответственность смотрит вперёд: «что я делаю теперь?». Лайоннет называет это первым шагом лайф-коучинга: перестать искать виноватых — и снаружи, и внутри."]}], "steps": ["Выпишите все темы, о которых вы переживали за последнюю неделю.", "Пометьте каждую: К (прямой контроль), В (косвенное влияние), Н (нет контроля).", "Для К — одно действие на неделю; для В — один разговор или просьба; для Н — фраза принятия.", "Неделю отслеживайте свой язык: запишите 5 реактивных фраз и их проактивную замену.", "В конце недели оцените: какую долю энергии вы потратили на круг влияния и что изменилось."], "check": ["Я различаю, что могу сделать сам, где могу повлиять на других и что придётся принять.", "У каждой «моей» проблемы есть действие на ближайшие 7 дней.", "Я поймал(а) себя на реактивной фразе хотя бы раз и заменил(а) её.", "Ответственность не превратилась в самообвинение.", "Я перестал(а) тратить время на обсуждение того, что изменить нельзя."], "qa2": [["Чем проблемы косвенного контроля отличаются от проблем без контроля?", "Проблемы косвенного контроля решаются через влияние на людей (разговор, пример, просьба); проблемы без контроля нужно принять."], ["Почему круг влияния расширяется, если в нём работать?", "Растут доверие окружающих, навыки и ресурсы — появляется больше того, на что вы можете влиять."]]}, {"t": "Убеждения и болезнь отговорок", "min": 40, "why": "Поведение следует за убеждениями. Пока не увидено убеждение под отговоркой, новые планы будут разбиваться о ту же стену.", "pts": ["Шварц описывает **«болезнь отговорок»** — четыре самые частые: здоровье, ум («я недостаточно умён»), возраст («поздно/рано») и удача. Лечение — заметить отговорку, проверить фактами и действовать.", "Роббинс: убеждения — это ощущение уверенности в том, что что-то означает; они формируются из опыта и повторения. Сильные **глобальные убеждения** («я не способен») управляют десятками решений.", "Ян Бекер («Ты можешь всё, что захочешь») и Литвак («7 шагов к успеху») сходятся в практике: установки усвоены с детства и в окружении — их можно выявить и заменить на рабочие.", "Отговорка — верхушка айсберга. Под ней лежит убеждение («если не идеально — не начинай») и защищаемая потребность (не опозориться, не разочароваться).", "Проверка убеждения: «Какие факты за? Какие против? Кто из людей с теми же условиями сделал это? Что я выиграю, если перестану в это верить?»"], "fig": {"k": "ice", "top": "Отговорка: «нет времени», «я не такой»", "bottom": "Убеждение: «ошибаться стыдно», «у меня никогда не получалось» → Потребность: безопасность, не разочароваться, сохранить лицо", "cap": "Работать нужно с подводной частью: отговорка исчезнет вместе с убеждением."}, "src": ["schwartz|«болезнь отговорок» и вера в успех", "robbins|убеждения и глобальные убеждения", "a36343903|выявление и замена установок", "a39285079|«7 шагов к успеху» Литвака: установки и сценарий", "maltz|образ Я как фильтр возможностей"], "ex": "Отговорка: «Я слишком стар(а) для программирования». Факты против: курсы проходят люди 45+, первые 100 часов дают базу. Убеждение: «Если я буду хуже молодых — это позор». Новое убеждение: «Я сравниваю себя с собой месяц назад».", "err": ["Спорить с отговоркой, а не искать убеждение под ней.", "Заменять убеждение красивой фразой без проверки фактами — оно вернётся при первой неудаче."], "qa": [["Назовите четыре вида отговорок по Шварцу.", "Здоровье, ум, возраст, удача."], ["Чем убеждение отличается от факта?", "Факт можно проверить; убеждение — интерпретация опыта, которая ощущается как истина."]], "task": "Найдите две свои частые отговорки. Для каждой опишите айсберг: отговорка → убеждение → защищаемая потребность. Проверьте убеждение тремя вопросами и сформулируйте рабочую альтернативу.", "out": "Два «айсберга» по три уровня + проверка фактами + новое убеждение для каждого.", "rub": [["Отговорки свои и частые", "звучат у вас не реже раза в неделю"], ["Убеждение сформулировано", "это утверждение о себе или мире, а не повтор отговорки"], ["Проверка фактами", "есть факты за и против, пример другого человека"], ["Новое убеждение рабочее", "реалистично и подсказывает действие"]], "sample": "Отговорка: «Я не умею продавать». Убеждение: «Продавать — значит навязывать». Потребность: быть хорошим в глазах людей. Факты: я советую друзьям книги, и они благодарят. Новое убеждение: «Продажа — помощь человеку принять решение».", "deep": [{"h": "Как рождается убеждение", "p": ["Роббинс сравнивает убеждение со столешницей, которой нужны ножки — **опорные переживания**: собственный опыт, услышанное от авторитетов, воображаемые сцены. Одной неудачи на экзамене, слов учителя «у тебя нет способностей» и пары повторений в голове достаточно, чтобы появилось убеждение «я тупой в математике». Оно ощущается как факт, хотя это лишь интерпретация нескольких эпизодов.", "Самые влиятельные — **глобальные убеждения** о себе и мире («я неудачник», «люди нечестны», «деньги портят»). Они действуют как фильтры: мозг замечает подтверждения и отбрасывает опровержения. Поэтому убеждение крепнет само собой, если его не проверять."]}, {"h": "Четыре отговорки по Шварцу", "p": ["Шварц называет «болезнью отговорок» привычку объяснять неудачи тем, что нельзя изменить. Отговорки бывают о **здоровье** («с моей спиной…»), **уме** («не хватает способностей»), **возрасте** («поздно / ещё рано») и **удаче** («мне не везёт»). Лекарства у него простые: не говорить о своём здоровье, ценить умение думать выше количества знаний, считать оставшиеся годы, а не прожитые, и помнить, что за чужой «удачей» почти всегда стоят подготовка и действие."]}, {"h": "Айсберг: отговорка, убеждение, потребность", "p": ["Отговорка — верхушка. Под ней убеждение («если я ошибусь, все увидят, что я не справляюсь»), а ещё глубже — потребность, которую убеждение защищает: безопасность, принадлежность, уважение. Пока не названа потребность, борьба с отговоркой похожа на спор с часовым у двери: он стоит не просто так.", "Ян Бекер и Литвак предлагают похожий путь: найти установку, понять, откуда она (часто — из семейного «сценария»), и сознательно заменить её на рабочую, подкрепив новым опытом."]}, {"h": "Как менять убеждение", "p": ["Роббинс предлагает «расшатывать ножки»: задавать вопросы, которые подрывают опорные переживания, и связывать старое убеждение с болью, а новое — с удовольствием. Борг добавляет когнитивный приём: проверить мысль фактами и найти более точную формулировку. Новое убеждение закрепляется только действием — маленьким опытом, который его подтверждает."], "li": ["Какие факты на самом деле подтверждают это убеждение?", "Кто из людей в похожих условиях сделал то, что я считаю невозможным?", "Чего мне стоило это убеждение за последние 5 лет?", "Какое маленькое действие на этой неделе даст опыт в пользу нового убеждения?"]}], "steps": ["Запишите 10 фраз «я не могу / я не такой / у меня не получится» из своей речи за неделю.", "Выберите две самые частые и найдите под каждой убеждение и потребность.", "Задайте убеждению четыре проверочных вопроса и запишите ответы.", "Сформулируйте новое убеждение — реалистичное и подсказывающее действие.", "Спланируйте одно действие, которое даст опыт в пользу нового убеждения, и выполните его."], "check": ["Я отличаю отговорку от убеждения и убеждение от факта.", "Я знаю, какую потребность защищает моё ограничивающее убеждение.", "Новое убеждение звучит правдоподобно для меня самого.", "Под новое убеждение запланирован подтверждающий опыт.", "Я не спорю с собой силой, а проверяю мысли фактами."], "qa2": [["Что такое опорные переживания по Роббинсу?", "Опыт, услышанное и воображаемое, на которые опирается убеждение, как столешница на ножки."], ["Почему одних аффирмаций мало для смены убеждения?", "Убеждению нужны новые опорные переживания: закрепляет его только опыт действия."]]}, {"t": "Мастерство вместо поиска призвания", "min": 35, "why": "Ожидание «своего дела» часто превращается в бег по кругу. Интерес и смысл чаще приходят вслед за мастерством.", "pts": ["Кэл Ньюпорт («Хватит мечтать, займись делом!»): совет «следуй за страстью» плох. Страсть рождается из **карьерного капитала** — редких и ценных навыков, которые потом можно обменять на свободу и интересные задачи.", "Гладуэлл: за выдающимися результатами стоят тысячи часов практики и **накопленное преимущество** — ранний небольшой отрыв даёт больше возможностей тренироваться, отрыв растёт.", "Мышление ремесленника: «Что я могу дать?» вместо «Что мне дадут?». Мастер ищет обратную связь и сложные задачи на краю своих возможностей.", "В подкасте Маклахова Андрей Левченко говорит о пути к мастерству в своём деле, Владимир Крамник — о том, как шахматист растёт «из пешки в ферзи», Радислав Гандапас — о самодисциплине: «призвать себя в армию»."], "fig": {"k": "curve", "pts": [[0, 1], [15, 2], [30, 2.6], [45, 4.5], [60, 5], [75, 7], [100, 9]], "marks": [[30, "плато: здесь бросают"], [75, "навык становится капиталом"]], "xl": "время практики", "yl": "мастерство", "cap": "Рост идёт ступенями с плато. Плато — признак, что нужно менять упражнение, а не цель."}, "src": ["a57356885|карьерный капитал вместо поиска страсти", "gladwell|10 000 часов и накопленное преимущество", "a27442600|выпуск: как стать мастером своего дела", "a27442872|выпуск: как выйти из пешки в ферзи", "a27442888|выпуск: как «призвать себя в армию»"], "ex": "Бухгалтер, мечтающий «найти себя», три месяца осваивает автоматизацию отчётов в 1С. Через полгода он единственный в компании, кто это умеет, получает проект и гибкий график — интерес пришёл вместе с редким навыком.", "err": ["Менять направление на каждом плато.", "Путать занятость с практикой: часы рутины без обратной связи навык не растят."], "qa": [["Что такое карьерный капитал?", "Редкие и ценные навыки, которые можно обменять на интересную работу, свободу и доход."], ["Почему плато не повод бросать?", "Это нормальная фаза роста: нужно усложнить упражнение или получить обратную связь."]], "task": "Определите один навык, который в вашей сфере редок и ценен. Опишите: текущий уровень (1–10), как вы получите обратную связь, какой будет первая «тяжёлая» задача и сколько часов в неделю готовы вкладывать 3 месяца.", "out": "План развития навыка на 12 недель: навык, уровень, источник обратной связи, задачи, часы.", "rub": [["Навык ценен", "объяснено, почему он редкий и за что за него платят"], ["Есть обратная связь", "назван человек, метрика или способ проверки"], ["Задачи на краю возможностей", "не рутина, а усложнение"], ["Реалистичный объём", "часы в неделю совместимы с вашей жизнью"]], "sample": "Навык: переговоры о цене с поставщиками. Уровень 4. Обратная связь: записываю 2 звонка в неделю и разбираю с руководителем. Первая задача: снизить цену у ключевого поставщика на 3%. 3 часа в неделю.", "deep": [{"h": "Почему совет «следуй за страстью» плох", "p": ["Ньюпорт изучал людей, любящих свою работу, и обнаружил, что у большинства страсть пришла позже — вместе с мастерством, автономией и признанием. Совет «найди своё призвание» заставляет постоянно сомневаться («а вдруг это не моё?») и перескакивать с места на место, не накапливая ничего ценного.", "Его альтернатива — **мышление ремесленника**: сосредоточиться на ценности, которую вы производите, а не на том, что работа даёт вам. Накопленные редкие и ценные навыки — **карьерный капитал** — затем обмениваются на то, что делает работу любимой: контроль над своим временем, интересные задачи, смысл."]}, {"h": "Накопленное преимущество и 10 000 часов", "p": ["Гладуэлл показывает «эффект Матфея»: небольшое преимущество на старте (дата рождения в хоккее, доступ к компьютеру в юности) даёт больше возможностей практиковаться, и разрыв растёт. Его знаменитое правило 10 000 часов — не точная норма, а мысль о порядке величины: мастерство требует тысяч часов целенаправленной практики.", "Важно: часы должны быть **целенаправленными** — с задачами на краю возможностей и обратной связью. Двадцать лет одинаковой работы — это один год опыта, повторённый двадцать раз."]}, {"h": "Плато и как его проходить", "p": ["Рост навыка идёт ступенями: быстрый прогресс новичка, затем плато, когда кажется, что ничего не меняется. Здесь чаще всего бросают или меняют направление. Плато — сигнал сменить упражнение: усложнить задачу, найти наставника, разобрать ошибки. Гости подкаста Маклахова — шахматист Крамник, бизнес-тренер Левченко, Гандапас — по-разному говорят об одном: мастер отличается от профессионала тем, что продолжает учиться, когда уже всё получается."]}], "steps": ["Выпишите 5 навыков своей сферы, за которые платят больше всего.", "Отметьте, какой из них редок и при этом вам по силам освоить за год.", "Найдите источник обратной связи: наставник, метрика, клиент, запись своей работы.", "Определите первую задачу «на краю возможностей» и срок.", "Заложите регулярные часы практики в календарь на 12 недель.", "Раз в месяц фиксируйте прогресс и меняйте упражнение, если наступило плато."], "check": ["Выбранный навык редок и ценен — это подтверждено, а не угадано.", "У меня есть способ получать обратную связь хотя бы раз в неделю.", "Часы практики стоят в календаре.", "Я знаю, что сделаю, когда упрусь в плато.", "Я оцениваю прогресс по результату, а не по затраченному времени."], "qa2": [["Что такое мышление ремесленника?", "Фокус на ценности, которую вы создаёте, а не на том, что работа даёт вам."], ["Почему стаж не равен мастерству?", "Без задач на краю возможностей и обратной связи годы повторяют один и тот же уровень."]]}, {"t": "Точка А: колесо жизни", "min": 40, "why": "Нельзя построить маршрут, не зная, где вы сейчас. Честная точка А — основа всех следующих уроков курса.", "pts": ["**Колесо жизни** (Мрочковский и Толкачёв, Лайоннет): 8 сфер — здоровье, отношения, семья, работа, финансы, развитие, отдых, окружение. Оценка каждой от 1 до 10 показывает перекосы: «колесо» с провалами не катится.", "Баулин и Шевченко советуют брать в работу сферу «Деньги» и **две самые слабые сферы** — там самый большой прирост от малых усилий.", "Фляйш предлагает упражнение **«Комод»**: разложить жизнь по ящикам, найти, что лежит не на месте, что лишнее и чего не хватает.", "Дарья Кутузова (подкаст Маклахова) — о том, как разбираться в себе письменно: бумага и ручка заставляют мысли стать конкретными.", "Важна не цифра, а критерий: что для вас значит «10» в сфере? Без критерия оценка — настроение дня."], "fig": {"k": "hub", "c": "Я сейчас", "a": ["Здоровье", "Отношения", "Семья", "Работа", "Финансы", "Развитие", "Отдых", "Окружение"], "cap": "Оцените каждую сферу 1–10 и запишите, что значит «10» именно для вас."}, "src": ["extreme_tm|колесо жизни как отправная точка", "lyonnet|колесо баланса в лайф-коучинге", "bs_energy|сфера «Деньги» + две самые слабые", "fleish|упражнение «Комод»", "a27442440|выпуск: разобраться в себе с помощью бумаги и ручки", "a27442432|выпуск: как изменить свою жизнь"], "ex": "Работа 8, финансы 6, здоровье 3 («10» — сплю 7,5 часа и бегаю 3 раза в неделю), отношения 5. Выбор: финансы + здоровье + отношения.", "err": ["Оценивать без критерия «10».", "Пытаться поднять все сферы одновременно."], "qa": [["Почему берут две самые слабые сферы?", "В них наибольший прирост качества жизни от небольших усилий, и они тянут вниз остальные."], ["Зачем записывать «10» для каждой сферы?", "Чтобы оценка опиралась на критерий, а не на настроение."]], "task": "Нарисуйте своё колесо: 8 сфер, оценка, критерий «10» для каждой одной фразой. Выберите три сферы на ближайшие 3 месяца (деньги + две самые слабые или обоснуйте другой выбор) и назовите для каждой одно изменение.", "out": "Список 8 сфер с оценками и критериями, три выбранные сферы с одним изменением каждая.", "rub": [["Все сферы оценены", "8 оценок без пропусков"], ["Есть критерии «10»", "конкретные, проверяемые"], ["Выбор обоснован", "почему именно эти три сферы"], ["Изменения конкретны", "можно проверить через 3 месяца"]], "sample": "Здоровье 3 («10» — 7,5 ч сна, 3 тренировки, без сахара). Изменение: отбой в 23:00. Финансы 5 («10» — подушка на 6 месяцев). Изменение: откладывать 10% в день зарплаты.", "deep": [{"h": "Колесо жизни: как оценивать честно", "p": ["Колесо из 8 сфер — классический инструмент коучинга (Лайоннет, Мрочковский и Толкачёв). Ценность не в цифрах, а в критериях: для одного «10» в финансах — подушка на год, для другого — собственная квартира. Без критерия оценка отражает настроение дня. Поэтому сначала пишется «что значит 10 для меня», и только потом ставится балл.", "Важно смотреть на форму колеса, а не только на среднее. Сфера с оценкой 2–3 тянет вниз остальные: хронический недосып снижает и работу, и отношения."]}, {"h": "Какие сферы брать в работу", "p": ["Баулин и Шевченко советуют брать сферу «Деньги» плюс две самые слабые. Логика простая: деньги дают ресурс для остальных сфер, а слабые сферы дают самый большой прирост от малых усилий. Фляйш в упражнении «Комод» предлагает посмотреть, что лежит не в своём ящике: работа в выходных, тревога о деньгах в отношениях."]}, {"h": "Письменная фиксация", "p": ["Нарративный терапевт Дарья Кутузова (подкаст Маклахова) занимается письменными практиками: записанная мысль становится конкретной, с ней можно спорить. Поэтому точка А фиксируется письменно, с датой — через 3 месяца вы сравните. Лариса Парфентьева, автор «100 способов изменить жизнь», в том же подкасте говорит о решимости на перемены: она начинается с честного взгляда на то, где вы сейчас."]}], "steps": ["Нарисуйте колесо из 8 сфер (или используйте свои).", "Для каждой сферы одной фразой запишите, что значит «10».", "Поставьте оценку 1–10 по этому критерию.", "Выберите три сферы: деньги и две самые слабые (или обоснуйте иной выбор).", "Для каждой — одно изменение на 3 месяца и первый шаг на этой неделе.", "Поставьте в календарь дату повторной оценки через 12 недель."], "check": ["У каждой сферы есть критерий «10».", "Оценки поставлены по критерию, а не по настроению.", "Выбрано не больше трёх сфер.", "У каждой выбранной сферы есть первый шаг.", "Дата повторной оценки стоит в календаре."], "qa2": [["Почему важна форма колеса, а не средний балл?", "Провал в одной сфере тянет вниз остальные; среднее его скрывает."], ["Зачем фиксировать точку А письменно с датой?", "Чтобы через 3 месяца сравнить и увидеть реальные изменения, а не впечатления."]]}]}, {"n": 2, "title": "Ценности, предназначение, цели", "goal": "Отделить свои желания от чужих «надо», найти направление и превратить мечты в цели с планом.", "lessons": [{"t": "Надо или хочу: ценности", "min": 40, "why": "Цель, выросшая из чужого «надо», требует постоянного насилия над собой. Цель из ценности даёт энергию сама.", "pts": ["Эль Луна: на **перекрёстке «надо» и «хочу»** мы чаще выбираем «надо» — чужие ожидания, страх, привычку. «Хочу» — то, что делает нас живыми. Первый шаг — увидеть, откуда пришло каждое «надо».", "Резанова («Никогда-нибудь»): тупик возникает, когда «хочу» откладывается на «когда-нибудь». Выход — малые эксперименты, которые проверяют мечту без риска всё потерять.", "**Ценности** — то, что важно само по себе: свобода, семья, мастерство, безопасность. Владимир Герасичев (подкаст Маклахова) — о том, как понять, что тебе важно: смотреть, на что вы тратите время и деньги и где испытываете злость, когда это нарушают.", "Курпатов («Настоящая жизнь») предлагает заменить абстрактные «цели» **задачами и смыслами**: смысл отвечает «зачем», задача — «что делаю сегодня».", "Конфликт ценностей (свобода vs безопасность) не решается выбором одной; решается правилом: «откладываю подушку на год → затем ухожу во фриланс»."], "fig": {"k": "fork", "q": "Это дело я делаю, потому что…", "a": "НАДО: так принято, иначе осудят, страшно потерять, родители хотели", "b": "ХОЧУ: важно мне, даёт энергию, готов делать без внешнего контроля", "cap": "Не все «надо» плохи. Но каждое «надо» стоит проверить: чьё оно и что будет, если его отпустить."}, "src": ["luna|перекрёсток «надо» и «хочу»", "rezanova|выход из тупика через малые эксперименты", "a27442792|выпуск: как понять, что тебе важно", "k_reallife|цели → задачи и смыслы"], "ex": "«Надо получить MBA» — пришло от отца. Проверка: «Что я хочу на самом деле?» — управлять своим проектом. Эксперимент: запустить небольшой онлайн-курс за 6 недель, а решение об MBA принять после.", "err": ["Объявить все «надо» чужими и бросить обязательства.", "Называть ценностями общие слова («счастье», «успех»), которые не помогают выбирать."], "qa": [["Как узнать свою ценность по поведению?", "По тому, на что вы тратите время и деньги, и что вызывает злость, когда это нарушают."], ["Что делать с конфликтом двух ценностей?", "Найти правило или последовательность, при которых обе соблюдены."]], "task": "Составьте список из 10 своих «надо». Для каждого отметьте источник (я / родители / общество / страх). Выберите 5 ключевых ценностей и ранжируйте их. Запишите одно «хочу», которое откладываете, и мини-эксперимент на 2 недели.", "out": "10 «надо» с источниками, 5 ценностей по рангу, «хочу» + эксперимент.", "rub": [["Список «надо» честный", "есть неудобные пункты, а не только очевидные"], ["Источники отмечены", "для каждого пункта"], ["Ценности различают выбор", "по ним можно принять решение в спорной ситуации"], ["Эксперимент проверяемый", "срок, действие, критерий «получилось»"]], "sample": "Ценности: 1) свобода, 2) здоровье, 3) семья, 4) мастерство, 5) доход. «Хочу»: фотографировать. Эксперимент: 2 недели по 20 снимков в день и одна публикация в неделю.", "deep": [{"h": "Откуда берётся «надо»", "p": ["Эль Луна описывает «надо» как голос чужих ожиданий: родителей, общества, страха. Он звучит разумно («стабильная работа», «как у всех») и часто защищает от риска. «Хочу» — то, что делает нас живыми и вызывает энергию, даже если трудно. Перекрёсток между ними возникает у каждого много раз в жизни.", "Чтобы разобраться, Луна предлагает спросить у каждого «надо»: откуда оно пришло? чего я боюсь, если откажусь? что я получу, если продолжу? Часть «надо» после проверки остаётся — они действительно важны. Часть оказывается чужим сценарием."]}, {"h": "Ценности по поведению", "p": ["Ценности, записанные в анкете, часто красивые и бесполезные. Владимир Герасичев (подкаст Маклахова) — о практичном подходе: смотреть, на что вы тратите время и деньги, что вызывает злость при нарушении, чем вы гордитесь. Злость — хороший индикатор: она возникает, когда задета ценность.", "Курпатов в «Настоящей жизни» предлагает сместить внимание с абстрактных «целей» на **смыслы** (зачем) и **задачи** (что делаю сегодня). Ценность без задачи остаётся декларацией."]}, {"h": "Эксперименты вместо прыжка", "p": ["Резанова показывает, как выйти из тупика «когда-нибудь»: не бросать всё ради мечты, а проверить её маленькими экспериментами. Хочется стать фотографом — две недели снимать каждый день и опубликовать работы; хочется своё дело — сделать одну продажу. Эксперимент даёт информацию: «хочу» подтверждается или оказывается фантазией."]}], "steps": ["Выпишите 10 своих «надо».", "Для каждого отметьте источник и страх, который стоит за ним.", "Посмотрите на расходы времени и денег за месяц — какие ценности они выдают?", "Вспомните 3 случая, когда вы злились: какая ценность была задета?", "Составьте список из 5 ценностей и ранжируйте их.", "Выберите одно отложенное «хочу» и придумайте эксперимент на 2 недели."], "check": ["Ценности выведены из поведения, а не из анкеты.", "У каждого «надо» найден источник.", "Ценности помогают выбрать в спорной ситуации.", "Эксперимент с «хочу» ограничен по времени и безопасен.", "Я понимаю, какие «надо» оставляю осознанно."], "qa2": [["Почему злость — хороший индикатор ценности?", "Она возникает, когда нарушено то, что для нас важно."], ["Что даёт эксперимент по сравнению с решительным прыжком?", "Информацию о том, действительно ли это «хочу», без риска потерять всё."]]}, {"t": "Предназначение и икигай", "min": 35, "why": "«Найти предназначение» звучит как разовое открытие. На деле это пересечение того, что вы любите, умеете, что нужно людям и за что платят, — и оно уточняется практикой.", "pts": ["**Икигай** (Гарсия и Миральес): японское «то, ради чего стоит просыпаться». Классическая схема пересечения четырёх кругов: люблю — умею — нужно миру — за это платят.", "Книга про икигай показывает долгожителей Окинавы: у них есть дело, сообщество, движение, умеренность и **отсутствие «пенсии»** как остановки.", "Гости подкаста Маклахова смотрят на предназначение как на процесс: игропрактик Валентина Габышева ищет уникальность через игру и пробы, Олеся Новикова формулирует — «себя невозможно найти, зато можно создать», Павел Кочкин (проект «Предназначение») — о том, как найти призвание и реализоваться.", "Владимир Тарасов («Технология жизни») — о жизни как искусстве управления собой: человек сам выстраивает себя через выбор поступков, а не ждёт подходящей судьбы.", "Практика: ищите пересечение двух-трёх кругов уже сейчас; четвёртый круг можно достроить развитием навыка или поиском рынка."], "fig": {"k": "quad", "c": "Икигай: ради чего вставать утром", "a": ["Что я люблю", "В чём я хорош", "За что платят", "Что нужно миру"], "cap": "Пересечение всех четырёх — идеал. Начните с пересечения двух и достраивайте остальные."}, "src": ["a65105612|четыре круга и уроки Окинавы", "a27442880|выпуск: как пробудить в себе силу и найти призвание", "a27442848|выпуск: как понять своё предназначение", "a27442552|выпуск: как создать себя заново", "a9067767|«Технология жизни»: управлять собой через выбор поступков"], "ex": "Люблю: объяснять. Хорош: Excel и финансы. Платят: финансовый анализ. Нужно миру: финансовая грамотность. Пересечение: вести курс по личному бюджету для сотрудников компании.", "err": ["Ждать полного совпадения четырёх кругов перед первым шагом.", "Записать в «люблю» то, что нравится потреблять, а не делать."], "qa": [["Какие четыре круга у икигай?", "Люблю, умею, нужно миру, за это платят."], ["Что общего у долгожителей Окинавы?", "Дело и смысл, сообщество, ежедневное движение, умеренность, нет резкого «выхода на пенсию»."]], "task": "Заполните четыре круга: по 5–7 пунктов в каждом. Найдите все пересечения хотя бы двух кругов и выберите одно, которое можно проверить за месяц.", "out": "Четыре списка, перечень пересечений, выбранная гипотеза и шаг проверки.", "rub": [["Списки конкретны", "действия и навыки, а не абстракции"], ["Пересечения найдены", "минимум три"], ["Гипотеза проверяема", "можно проверить за месяц"], ["Есть первый шаг", "что и когда сделаете"]], "sample": "Пересечение «люблю + умею»: готовить выпечку. «Платят + нужно»: здоровые перекусы в офис. Гипотеза: продавать коробки перекусов коллегам. Шаг: в пятницу принести 10 коробок и собрать отзывы.", "deep": [{"h": "Четыре круга икигай", "p": ["Гарсия и Миральес популяризировали схему пересечения четырёх кругов: что вы **любите**, в чём вы **хороши**, что **нужно миру** и за что **платят**. Пересечение двух кругов даёт страсть, миссию, профессию или призвание; всех четырёх — икигай. Сами японцы понимают икигай шире и проще: то, ради чего стоит вставать утром, — это может быть и сад, и внуки.", "Важная мысль книги — долгожители Окинавы не «уходят на пенсию»: у них остаётся дело, сообщество (моаи — группы взаимной поддержки), ежедневное движение и умеренность в еде (принцип хара хачи бу — есть до 80 % сытости)."]}, {"h": "Предназначение как процесс", "p": ["Гости подкаста Маклахова говорят о предназначении не как о находке, а как о процессе. Олеся Новикова формулирует: «себя невозможно найти, зато можно создать». Валентина Габышева предлагает искать уникальность через игру и пробы. Павел Кочкин, основатель проекта «Предназначение», — о реализации через действие.", "Владимир Тарасов в «Технологии жизни» смотрит с другой стороны: человек создаёт себя выбором поступков; «быть, а не казаться» — значит действовать по своим принципам, а не ждать подходящей судьбы."]}, {"h": "Как работать с пересечениями", "p": ["Полное пересечение четырёх кругов редко видно сразу. Начинайте с двух-трёх: любимое и умение — это хобби, которое можно превратить в услугу; умение и оплата — профессия, в которой можно найти смысл. Недостающий круг достраивается: навыку можно научиться, рынок — найти, интерес — развить в процессе (связь с идеей Ньюпорта из урока 1.3)."]}], "steps": ["Заполните 4 списка по 5–7 пунктов: люблю, умею, нужно миру, платят.", "Найдите все пересечения хотя бы двух кругов.", "Для каждого пересечения запишите, какого круга не хватает и как его достроить.", "Выберите одно пересечение и сформулируйте проверку на месяц.", "Найдите «моаи» — 2–3 человека, с кем можно делиться прогрессом."], "check": ["Пункты в списках — действия и навыки, а не абстракции.", "Найдено минимум три пересечения.", "Для выбранного пересечения есть проверка на месяц.", "Я понимаю, какой круг достраивать.", "Есть люди для поддержки."], "qa2": [["Что такое хара хачи бу?", "Окинавский принцип есть до ощущения 80 % сытости."], ["Почему не стоит ждать полного пересечения четырёх кругов?", "Оно редко видно сразу; недостающие круги достраиваются навыком, рынком или интересом в процессе."]]}, {"t": "От мечты к цели", "min": 45, "why": "Мечта даёт направление, цель — маршрут. Большинство мечт не сбываются не из-за их размера, а потому что так и остаются мечтами.", "pts": ["Мужицкая («Теория невероятности»): сначала **разрешите себе мечтать** смело и много, по всем сферам, — затем переводите мечты в цели и план года.", "Пинтосевич («Ставь цели!»): цель должна быть **конкретной, измеримой, со сроком**, записанной и разбитой на этапы; ежедневные действия и еженедельный контроль.", "Списки **100 целей** (Баулин и Шевченко, Карма в «Продуктивности миллионеров»): выписать много, затем отобрать 10–20 на год. Количество снимает страх «неправильной» цели.", "Аллан Пиз («Ответ»): записанная цель настраивает внимание — система активации мозга начинает замечать возможности. Отсюда правило: писать от руки и регулярно перечитывать.", "Сборник Smart Reading «Цель!» сводит 12 книг к общему алгоритму: ясное «зачем», формулировка SMART, план, первые шаги и сопротивление, к которому надо быть готовым. Алексей Верютин (подкаст) — о закреплении цели через регулярное представление результата."], "fig": {"k": "flow", "a": ["Мечта|смело, по всем сферам", "Цель|конкретно, измеримо, срок", "Этапы|вехи по месяцам", "Шаг|действие на этой неделе"], "cap": "Каждая ступень отвечает на вопрос «как?» к предыдущей."}, "src": ["muzh|мечтать смело, планировать по сферам", "pint_goals|цель конкретна, записана, разбита на этапы", "bs_100|список 100 целей, отобрать 10–20", "karma|100 вдохновляющих целей и чертёж будущего", "a33474455|записанная цель и система активации мозга", "a63021568|12 книг о целях: общий алгоритм", "a27442720|выпуск: закрепить цель через регулярное представление результата", "tracy_tm|ясные письменные цели как основа ТМ"], "ex": "Мечта: «жить у моря». Цель: «к 1 июня 2027 года работать удалённо 3 месяца в году из Сочи». Этапы: договориться об удалёнке (декабрь), накопить 300 тыс. ₽ (май). Шаг: на этой неделе подготовить аргументы для руководителя.", "err": ["Цель без срока или числа («стать здоровее»).", "Писать 100 целей и ни одну не довести до шага на этой неделе."], "qa": [["Что делает цель целью?", "Конкретность, измеримость, срок и запись; плюс понятный первый шаг."], ["Зачем писать много целей?", "Чтобы снять страх ошибки и найти действительно важные при отборе."]], "task": "Выпишите 30 мечт по разным сферам (за 15 минут, не оценивая). Выберите 3 главных на год и превратите каждую в цель: формулировка, срок, критерий, 3–4 этапа, шаг на этой неделе.", "out": "Список 30 мечт + 3 цели в формате «цель / срок / критерий / этапы / шаг».", "rub": [["Мечты разнообразны", "затронуты разные сферы колеса"], ["Цели измеримы", "есть число или проверяемый результат и дата"], ["Этапы логичны", "ведут от шага к цели"], ["Шаг выполним за неделю", "конкретное действие"]], "sample": "Цель: «Пробежать полумарафон 18 мая 2027». Критерий: финиш до 2:30. Этапы: 5 км без остановки (ноябрь), 10 км (январь), 15 км (март). Шаг: купить кроссовки и пробежать 2 км во вторник.", "deep": [{"h": "Разрешить себе мечтать", "p": ["Мужицкая начинает «Теорию невероятности» с «человека желающего»: многие взрослые разучились хотеть, потому что заранее отбраковывают желания как нереальные. Она предлагает сначала мечтать свободно и много — по всем сферам, — и только потом отбирать. Списки «100 целей» (Баулин и Шевченко, Карма) работают так же: количество снимает страх «неправильной» цели и вытаскивает настоящие желания, которые обычно появляются после первых 30–40 пунктов."]}, {"h": "Как устроена цель", "p": ["Пинтосевич в книге-тренинге «Ставь цели!» требует от цели конкретности, измеримости и срока, записи и разбиения на этапы — по сути, это критерии SMART, которые сборник Smart Reading «Цель!» сводит из нескольких книг. Трейси добавляет: цель записывают от руки и перечитывают ежедневно — так она остаётся в фокусе.", "Аллан Пиз в «Ответе» объясняет эффект записанной цели работой **ретикулярной активирующей системы** — отдела мозга, который фильтрует внимание: когда цель важна и определена, вы начинаете замечать связанные с ней возможности (как после покупки машины вдруг видишь такие же на улицах)."]}, {"h": "От цели к шагу", "p": ["Цель без ближайшего шага остаётся мечтой с датой. Правило: у каждой цели должно быть действие на этой неделе, выполнимое за час. Алексей Верютин (подкаст) — о регулярном представлении результата; Пинтосевич — о еженедельном контроле. Оба подхода работают на одно: цель ежедневно возвращается во внимание."]}], "steps": ["Выпишите 30–100 мечт за один присест, не оценивая.", "Отметьте 10, от которых больше всего энергии.", "Выберите 3 на год, по разным сферам.", "Переформулируйте каждую по SMART: результат, число, срок.", "Разбейте на 3–4 этапа с датам
