ия: повторные покупки, отток, NPS, жизненная ценность клиента (LTV).", "Обратная связь: спросите ушедших клиентов, почему ушли, — это самый ценный маркетинговый материал."], "fig": {"k": "lines", "rows": [{"name": "Без заботы", "pts": [[0, "покупка"], [40, "тишина"], [80, "ушёл"]]}, {"name": "По Коулману", "pts": [[0, "покупка"], [10, "приветствие"], [30, "звонок"], [60, "сюрприз"], [100, "лоялен"]]}], "cap": "Первые 100 дней решают, останется ли клиент."}, "src": ["a39831250|первые 100 дней и восемь этапов пути клиента", "zhukov75|мелочи, повышающие конверсию и повторные покупки"], "ex": "Школа английского: в день оплаты — видео от преподавателя, на 7-й день — звонок «как первые занятия?», на 30-й — сертификат «первый месяц», на 90-й — бесплатный разговорный клуб. Отток за квартал снизился с 35 до 18%.", "err": ["Вкладывать всё в привлечение и ничего в первые недели после покупки.", "Не спрашивать ушедших клиентов о причинах."], "qa": [["Сколько новых клиентов уходит в первые 100 дней по Коулману?", "От 20 до 70%."], ["Назовите две метрики удержания.", "Повторные покупки и отток (а также NPS, LTV)."]], "task": "Распишите путь клиента в своём бизнесе (или любимой компании) после покупки на 100 дней. Добавьте 5 точек заботы. Позвоните или напишите трём бывшим или текущим клиентам и спросите, что можно улучшить.", "out": "Карта 100 дней с 5 точками заботы + ответы трёх клиентов + одно изменение.", "rub": [["Путь расписан", "по дням"], ["Точки заботы конкретны", "что, когда, кто"], ["Обратная связь собрана", "3 клиента"], ["Изменение внедрено", "по ответам"]], "sample": "Точки: день 0 — благодарность и инструкция, день 3 — проверочный звонок, день 21 — полезная подборка, день 60 — скидка другу, день 100 — личное письмо. Клиенты: «не хватало напоминаний о записи» → ввели SMS.", "deep": [{"h": "Первые 100 дней", "p": ["Коулман («Никогда не теряйте клиента») приводит данные: в разных отраслях 20–70 % новых клиентов уходят в первые 100 дней. Причина — после продажи компания перестаёт уделять внимание. Он описывает путь клиента из восьми этапов (от оценки до продвижения) и предлагает в первые 100 дней удивлять и заботиться: приветствие, подарок, видео «что дальше», проверочный звонок, знаки внимания на важных этапах."]}, {"h": "Мелочи конверсии", "p": ["Жуков («75 хаков для роста конверсии интернет-магазина») собрал мелочи, которые решают: отзывы и гарантии на видном месте, понятная карточка товара, удобная корзина без лишних полей, быстрая связь, напоминания о брошенной корзине, допродажи, понятная доставка."]}, {"h": "Метрики удержания", "p": ["Повторные покупки, отток, NPS (готовность рекомендовать), LTV (доход с клиента за всё время). Самый ценный источник улучшений — разговор с ушедшими клиентами: почему ушли?"]}], "steps": ["Нарисуйте путь клиента после покупки на 100 дней.", "Отметьте моменты, где клиент может разочароваться.", "Добавьте 5 точек заботы.", "Позвоните или напишите трём бывшим или текущим клиентам.", "Внедрите одно изменение по их ответам.", "Начните считать повторные покупки и отток."], "check": ["Путь расписан по дням.", "Точки заботы конкретны.", "Обратная связь собрана.", "Изменение внедрено.", "Метрики удержания считаются."], "qa2": [["Что такое LTV?", "Доход, который клиент приносит за всё время сотрудничества."], ["Почему клиенты уходят в первые 100 дней по Коулману?", "После покупки компания перестаёт уделять им внимание."]]}]}, {"n": 20, "title": "Маркетинг", "goal": "Понять основы маркетинга, выстроить контент и соцсети, научиться писать продающие тексты и привлекать клиентов через сайт, поиск и рассылки.", "lessons": [{"t": "Основы маркетинга и инструменты без бюджета", "min": 45, "why": "Маркетинг — это не реклама, а создание ценности для выбранного клиента. Многое можно сделать без денег.", "pts": ["Филип Котлер («Маркетинг от А до Я»): маркетинг — искусство и наука **выбора целевых рынков**, привлечения и удержания клиентов через **ценность**. 80 базовых концепций — от бренда и позиционирования до сегментации и лояльности.", "Игорь Манн («Маркетинг без бюджета»): 50 инструментов — «Топ-5» клиентов (работать с лучшими), отзывы, партнёрства, визитки, сайт, рассылка, мероприятия; у каждого — цель, сложность, стоимость, сроки и ответственный.", "Классическая основа: **сегмент → позиционирование → предложение (4P: продукт, цена, место, продвижение)**.", "Манн: начните с **анализа «Топ-5»** — кто ваши лучшие клиенты и что их объединяет; ищите похожих.", "Маркетинг измеряется: стоимость лида, конверсия, стоимость клиента, доля повторных продаж."], "fig": {"k": "flow", "a": ["Сегмент|кто клиент", "Позиционирование|почему мы", "Предложение|4P", "Каналы|где клиент", "Метрики|что работает"], "cap": "Каркас маркетинга от Котлера до практики Манна."}, "src": ["a33395855|80 концепций маркетинга", "mann|50 инструментов без бюджета"], "ex": "Топ-5 клиентов мастерской ремонта: все — семьи с двумя детьми в новостройках района. Инструменты без бюджета: партнёрство с управляющей компанией, чат ЖК, отзывы с фото, визитка с QR на холодильник.", "err": ["Говорить «наша аудитория — все».", "Запускать много каналов сразу без метрик."], "qa": [["Что такое маркетинг по Котлеру?", "Выбор целевых рынков, привлечение и удержание клиентов через создание ценности."], ["Зачем анализ «Топ-5» по Манну?", "Понять, что объединяет лучших клиентов, и искать похожих."]], "task": "Проведите анализ «Топ-5» клиентов (или опишите идеальных клиентов для своей идеи). Выберите 5 инструментов из «Маркетинга без бюджета», распишите для каждого цель, сложность, сроки и ответственного. Запустите два.", "out": "Портрет Топ-5, таблица 5 инструментов, отчёт о двух запущенных.", "rub": [["Портрет конкретный", "общие черты"], ["Инструменты подходят сегменту", "обосновано"], ["Таблица полная", "цель, сложность, сроки, ответственный"], ["Два запущены", "результат"]], "sample": "Топ-5: владельцы кофеен 28–40 лет, 1–3 точки. Инструменты: партнёрство с поставщиком зерна, кейс в отраслевом канале, бесплатный аудит себестоимости, отзывы, выступление на встрече рестораторов.", "deep": [{"h": "Маркетинг по Котлеру", "p": ["Котлер («Маркетинг от А до Я») определяет маркетинг как искусство и науку выбора целевых рынков, привлечения, удержания и развития клиентов через создание ценности. Базовая логика: **сегментация** (разделить рынок) → **выбор целевого сегмента** → **позиционирование** (почему мы) → **комплекс маркетинга 4P** — продукт, цена, место (каналы), продвижение. Котлер подчёркивает: удерживать клиентов дешевле, чем привлекать новых."]}, {"h": "Маркетинг без бюджета", "p": ["Манн («Маркетинг без бюджета») описывает 50 инструментов, для каждого — цель, сложность, стоимость, кто делает, сроки. Начинается с **«Топ-5»**: проанализировать пять лучших клиентов, найти общее и искать похожих. Дальше — отзывы, партнёрства, визитки и раздаточные материалы, сайт, рассылка, выступления, мероприятия, работа с базой."]}, {"h": "Измерять", "p": ["Маркетинг без метрик — расходы без управления. Минимум: стоимость лида, конверсия в продажу, стоимость клиента, доля повторных продаж. Запускайте каналы по одному и сравнивайте."]}], "steps": ["Проанализируйте 5 лучших клиентов: что общего?", "Опишите целевой сегмент.", "Сформулируйте позиционирование.", "Пройдите 4P для своего продукта.", "Выберите 5 инструментов из Манна и распишите их.", "Запустите 2 и измерьте результат."], "check": ["Сегмент конкретен.", "4P продуманы.", "Инструменты подходят сегменту.", "Есть метрики.", "Каналы запускаются по одному."], "qa2": [["Что такое 4P?", "Продукт, цена, место (каналы), продвижение."], ["Почему удерживать клиентов выгоднее по Котлеру?", "Привлечение нового клиента обходится дороже, чем удержание существующего."]]}, {"t": "Контент и соцсети", "min": 45, "why": "Люди покупают у тех, кого знают и кому доверяют. Контент создаёт знакомство и доверие в масштабе.", "pts": ["Денис Каплунов («Контент, маркетинг и рок-н-ролл»): контент — не реклама; он растит посещаемость, лояльность и статус эксперта; **не заставляйте читателя скучать**.", "Гари Вайнерчук («Информационный удар»): **джеб, джеб, джеб, правый хук** — сначала несколько раз дайте ценность, потом попросите о покупке. Контент должен быть **родным для платформы**.", "Дмитрий Румянцев («Продвижение во ВКонтакте» — быстро и системно): позиционирование сообщества, контент-план, виды контента, отзывы, **сбор болей и вопросов** аудитории, кейсы, реклама и статистика.", "Елена Моисеенкова («Контент-маркетинг в соцсетях»): конкурсы и накрутки собирают не ту аудиторию; нужен контент, который клиенты ищут сами. Лилия Нилова («Поп-арт маркетинг») — визуал, позиционирование и контент-стратегия для блога малого бизнеса.", "Контент-микс: **польза** (обучение), **доверие** (кейсы, закулисье, отзывы), **вовлечение** (вопросы, истории), **продажа** — примерно 4 : 3 : 2 : 1."], "fig": {"k": "lines", "rows": [{"name": "Вайнерчук", "pts": [[10, "джеб"], [30, "джеб"], [50, "джеб"], [80, "хук"]]}, {"name": "Контент-микс", "segs": [[0, 40, "польза"], [40, 70, "доверие"], [70, 90, "вовлечение"], [90, 100, "продажа"]]}], "cap": "Сначала ценность, потом просьба."}, "src": ["kaplunov|контент не реклама, 11 возможностей контента", "vaynerchuk|джеб-джеб-джеб-хук и родной формат", "rum1|подготовка сообщества и контент-план", "rum2|сбор болей, кейсы, правила", "smm_content|контент вместо конкурсов и накруток", "a35232270|визуал и контент-стратегия блога"], "ex": "Мастерская мебели, неделя: пн — как выбрать фурнитуру (польза), ср — до/после кухни клиента (доверие), пт — опрос «какой цвет фасада?» (вовлечение), вс — запись на бесплатный замер (продажа).", "err": ["Только продающие посты.", "Копировать один пост на все площадки без адаптации."], "qa": [["Что значит «джеб, джеб, джеб, правый хук»?", "Несколько раз дать ценность, затем попросить о покупке."], ["Почему конкурсы за репост вредят?", "Собирают любителей халявы, а не клиентов."]], "task": "Соберите 20 вопросов и болей вашей аудитории (из переписки, отзывов, форумов). Составьте контент-план на 2 недели по миксу 4:3:2:1 и опубликуйте 4 материала. Отметьте охваты и реакции.", "out": "20 болей, контент-план, 4 публикации и метрики.", "rub": [["Боли реальные", "из источников"], ["Микс соблюдён", "примерно 4:3:2:1"], ["Формат родной для платформы", "адаптирован"], ["Метрики собраны", "охваты, реакции"]], "sample": "Боли: «как не переплатить за кухню», «сколько длится монтаж»… План: 4 полезных, 3 кейса, 2 опроса, 1 акция. Публикации: охваты 800, 1200, 650, 900; 3 заявки на замер.", "deep": [{"h": "Контент — не реклама", "p": ["Каплунов («Контент, маркетинг и рок-н-ролл») показывает, что контент работает на посещаемость, лояльность, статус эксперта и привлечение клиентов, если он полезен и интересен. Его требование — не заставлять читателя скучать: история, конкретика, живой язык."]}, {"h": "Джеб, джеб, джеб, хук", "p": ["Вайнерчук («Информационный удар») сравнивает маркетинг с боксом: **джебы** — полезный, развлекающий контент, который ничего не требует; **правый хук** — призыв купить. Сначала несколько джебов, потом хук. Контент должен быть **родным для платформы**: то, что работает в одной соцсети, не работает в другой."]}, {"h": "Практика соцсетей", "p": ["Румянцев («Продвижение во ВКонтакте») — практичные шаги: позиционирование сообщества, оформление, контент-план, виды контента, сбор отзывов, **сбор болей и вопросов** аудитории как источник тем, кейсы, реклама и статистика. Моисеенкова («Контент-маркетинг в соцсетях») предупреждает: конкурсы за репост собирают любителей халявы, а не клиентов. Нилова («Поп-арт маркетинг») — о визуале, позиционировании и продажах через блог малого бизнеса."]}], "steps": ["Соберите 20 вопросов и болей аудитории.", "Распределите темы по миксу: польза 4, доверие 3, вовлечение 2, продажа 1.", "Составьте контент-план на 2 недели.", "Адаптируйте формат под площадку.", "Опубликуйте 4 материала.", "Посмотрите статистику и оставьте то, что сработало."], "check": ["Темы из реальных вопросов.", "Микс соблюдён.", "Формат родной для площадки.", "Нет конкурсов ради репостов.", "Решения по статистике."], "qa2": [["Почему контент должен быть «родным для платформы»?", "Каждая площадка имеет свои форматы и ожидания аудитории; чужой формат не работает."], ["Откуда брать темы для контента по Румянцеву?", "Из болей и вопросов аудитории."]]}, {"t": "Продающие тексты", "min": 45, "why": "Текст — продавец, который работает круглосуточно. Его структура важнее «красивых слов».", "pts": ["Дмитрий Кот («Продающие тексты. Модель для сборки»): текст собирается из **блоков** — заголовок, оффер, выгоды, доказательства, снятие возражений, призыв; формулы и шаблоны для каждого.", "Даниил Шардаков («Заголовки на все случаи жизни»): сотни **формул заголовков** («Как [результат] без [боли] за [срок]») и «магические слова»; заголовок решает, будет ли текст прочитан.", "Пётр Панда («Копирайтинг. Сила убеждения»): эмоциональное и логическое убеждение, **четыре уровня убеждения**, энкоды, прайминг, убедительно-позитивный стиль.", "1PS («SEO-копирайтинг. RELOAD»): анализ ЦА и УТП перед текстом, триггеры, подача цены, гарантии и кейсы.", "Роуман и Рафаэльсон («Как писать так, чтобы вам доверяли»): главное — **в начале**, коротко и ясно, без канцелярита; правила деловых писем, предложений и презентаций."], "fig": {"k": "flow", "v": true, "a": ["Заголовок|результат + срок/без боли", "Оффер|что получит клиент", "Выгоды|3–5 с фактами", "Доказательства|кейсы, отзывы, цифры", "Возражения|гарантия, цена", "Призыв|один понятный шаг"], "cap": "Модель сборки продающего текста."}, "src": ["a33395806|блочная модель продающего текста", "shardakov|формулы заголовков", "panda|уровни убеждения, энкоды, прайминг", "seocopy|ЦА, УТП, подача цены и гарантии", "writing|ясность и главное в начале"], "ex": "Заголовок: «Закроем бухгалтерию кофейни за 3 дня — без штрафов и ночных переписок». Оффер: месяц учёта под ключ. Выгоды: себестоимость каждого напитка, отчёты к 5-му числу. Доказательства: 27 кофеен, отзыв. Возражение: «А если ошибётесь?» — штрафы оплачиваем мы. Призыв: «Оставьте номер — позвоним за 15 минут».", "err": ["Писать о себе («мы лидеры рынка»), а не о выгоде клиента.", "Несколько призывов сразу."], "qa": [["Из каких блоков собирается продающий текст?", "Заголовок, оффер, выгоды, доказательства, возражения, призыв."], ["Где должно быть главное по Роуману и Рафаэльсону?", "В начале текста."]], "task": "Напишите продающий текст на 1500–2500 знаков для своего продукта (или любого реального) по модели сборки. Сделайте 10 вариантов заголовка по формулам Шардакова и выберите лучший. Попросите двух людей из ЦА прочитать и сказать, что непонятно.", "out": "Текст, 10 заголовков, отзывы двух читателей и правки.", "rub": [["Все блоки", "6 блоков"], ["Выгоды с фактами", "не общие слова"], ["Заголовки по формулам", "10 вариантов"], ["Проверка на ЦА", "правки по отзывам"]], "sample": "Заголовки: «Как настроить 1С для ИП за 2 дня без курсов», «7 ошибок в учёте, за которые штрафует налоговая», «Учёт для розницы: 1 день настройки — год спокойствия»… Отзыв: «непонятно, что входит в цену» → добавил список.", "deep": [{"h": "Модель сборки", "p": ["Дмитрий Кот («Продающие тексты. Модель для сборки») показывает, что продающий текст собирается из блоков: заголовок, оффер, выгоды, доказательства, снятие возражений, призыв к действию. Для каждого блока есть формулы; блоки можно переставлять под задачу и площадку."]}, {"h": "Заголовки и убеждение", "p": ["Шардаков («Заголовки на все случаи жизни») собрал сотни формул заголовков с примерами: «Как [результат] без [боли]», «N ошибок в…», «Что делать, если…» — и «магические слова». Пётр Панда («Копирайтинг. Сила убеждения») разбирает эмоциональное и логическое убеждение, четыре уровня убеждения, энкоды (убеждающие фразы), прайминг и убедительно-позитивный стиль. 1PS («SEO-копирайтинг. RELOAD») учит перед текстом проанализировать ЦА и УТП, правильно подать цену, гарантии и кейсы."]}, {"h": "Ясность", "p": ["Роуман и Рафаэльсон («Как писать так, чтобы вам доверяли») требуют: главное — в начале, короткие предложения, конкретные слова, без канцелярита и «воды»; писать так, как говорят умные люди. Эти правила одинаково работают для писем, предложений и презентаций."]}], "steps": ["Опишите ЦА и УТП.", "Напишите 10 заголовков по формулам и выберите лучший.", "Соберите текст по блокам.", "Добавьте доказательства: цифры, кейсы, отзывы.", "Уберите канцелярит и «воду».", "Покажите текст двум людям из ЦА и исправьте непонятное."], "check": ["Все блоки на месте.", "Выгоды с фактами.", "Один ясный призыв.", "Главное в начале.", "Проверено на ЦА."], "qa2": [["Что такое оффер?", "Конкретное предложение: что получит клиент и на каких условиях."], ["Почему главное — в начале?", "Читатель решает, читать ли дальше, по первым строкам."]]}, {"t": "Сайт, поиск, рассылки", "min": 50, "why": "Сайт, поисковая выдача и рассылка — каналы, которые вы контролируете сами и которые работают годами.", "pts": ["Петроченков и Новиков («Идеальный Landing Page»): **персонажи** клиентов, идеальное предложение, стоимость лида, структура посадочной страницы и тестирование вариантов.", "SEO (Петросян «Seo Boom», Новицкий, Севостьянов, 1PS «Семантическое ядро»): **семантическое ядро** — запросы, по которым ищут клиенты (частотность, конкурентность, чистка, группировка) → **структура сайта** → оптимизация страниц (title, description, текст) → ранжирование: внутренние, поведенческие и коммерческие факторы.", "Тимофей Шиколенков («Ваш интернет-магазин от А до Я»): концепция, ниша и УТП, ассортимент, платформа, каталог, карточка товара, корзина, логистика и поставщики.", "Виталий Александров («Стратегия email-маркетинга»): рассылка — стратегия: цели, сегменты, **цепочки писем** (приветственная, обучающая, реактивация), метрики (открытия, клики, отписки).", "Связка каналов: поиск и соцсети приводят → лендинг превращает в лид → рассылка прогревает и возвращает."], "fig": {"k": "funnel", "a": ["Поиск и соцсети|трафик", "Лендинг|заявка", "Рассылка|прогрев", "Покупка", "Повторная покупка"], "cap": "Собственные каналы, работающие вместе."}, "src": ["landing|персонажи, предложение, структура лендинга", "seoboom|семантическое ядро и структура сайта", "novitsky|индексация и факторы ранжирования", "sevostyanov|оптимизация страниц и анализ бизнеса заказчика", "semcore|стратегия и ошибки семантического ядра", "shikolenkov|интернет-магазин от концепции до логистики", "alexandrov|стратегия и цепочки email-рассылки"], "ex": "Мастерская: ядро — «ремонт велосипеда [район]», «замена цепи цена», «сезонное ТО велосипеда». Лендинг: оффер «ТО за 1 день с выездом», 3 пакета, отзывы. Рассылка: письмо через месяц «пора проверить тормоза» — 12% повторных записей.", "err": ["Делать сайт «обо всём» без ядра запросов.", "Рассылать только акции без пользы."], "qa": [["Что такое семантическое ядро?", "Набор запросов, по которым целевые клиенты ищут ваш продукт, сгруппированных по страницам."], ["Какие цепочки писем нужны в первую очередь?", "Приветственная, обучающая (прогревающая) и реактивационная."]], "task": "Соберите мини-ядро на 30 запросов для своего продукта (через подсказки поиска и Вордстат), сгруппируйте по 3–5 страницам. Набросайте структуру лендинга (блоки) и приветственную цепочку из 3 писем.", "out": "Ядро с группировкой, структура лендинга, темы и тексты 3 писем.", "rub": [["Ядро релевантно", "запросы клиентов, а не ваши слова"], ["Группировка логична", "1 страница = 1 намерение"], ["Лендинг по структуре", "оффер, выгоды, доказательства, призыв"], ["Цепочка писем", "цель каждого письма"]], "sample": "Группы: «настройка 1С ИП», «1С розница», «обучение кассира 1С». Лендинг: оффер → 3 пакета → кейсы → FAQ → форма. Письма: 1) чек-лист настройки, 2) 5 ошибок в учёте, 3) приглашение на бесплатную диагностику.", "deep": [{"h": "Посадочная страница", "p": ["Петроченков и Новиков («Идеальный Landing Page») начинают с **персонажей** — портретов клиентов, затем формулируют идеальное предложение, считают стоимость лида и строят посадочную страницу: оффер, выгоды, доказательства, ответы на возражения, форма. Обязательно тестирование вариантов."]}, {"h": "SEO: от запросов к сайту", "p": ["Петросян («Seo Boom»), Новицкий, Севостьянов и материалы 1PS сходятся в порядке работы: собрать **семантическое ядро** — запросы, по которым ищут клиенты (частотность, конкурентность, чистка, группировка), — затем выстроить **структуру сайта** (одна страница — одна группа запросов), оптимизировать страницы (title, description, заголовки, текст), учесть факторы ранжирования: внутренние, **поведенческие** (как пользователи ведут себя на сайте) и **коммерческие** (цены, контакты, доставка, отзывы)."]}, {"h": "Магазин и рассылка", "p": ["Шиколенков («Ваш интернет-магазин от А до Я») проводит от концепции и ниши через ассортимент, платформу, каталог и карточку товара к логистике и работе с поставщиками. Александров («Стратегия email-маркетинга») показывает рассылку как стратегию: цели, сегменты, цепочки писем (приветственная, обучающая, реактивация), метрики (открытия, клики, отписки)."]}], "steps": ["Соберите 30 запросов через подсказки поиска и Вордстат.", "Сгруппируйте их по намерениям — каждая группа станет страницей.", "Набросайте структуру лендинга по блокам.", "Напишите title и description для главной страницы.", "Составьте приветственную цепочку из 3 писем.", "Определите метрики: заявки, стоимость лида, открытия писем."], "check": ["Запросы — слова клиентов.", "1 страница = 1 намерение.", "Лендинг по структуре.", "Цепочка писем с целями.", "Метрики определены."], "qa2": [["Что такое поведенческие факторы?", "Как пользователи ведут себя на сайте: время, глубина просмотра, возвраты в поиск."], ["Зачем приветственная цепочка писем?", "Познакомить нового подписчика с вами и прогреть до покупки."]]}]}, {"n": 21, "title": "Управление и лидерство", "goal": "Понять, что отличает великие компании и лидеров, освоить простые управленческие инструменты и способы масштабирования.", "lessons": [{"t": "От хорошего к великому", "min": 45, "why": "«Хорошо» — главный враг «великого»: оно не даёт повода меняться. Исследование Коллинза показывает, что делали компании, совершившие рывок.", "pts": ["Джим Коллинз («От хорошего к великому»): **лидер пятого уровня** — сочетание личной скромности и профессиональной воли; успех приписывает команде, неудачи — себе.", "**«Сначала кто — потом что»**: посадить в автобус нужных людей (и высадить ненужных), а потом решать, куда ехать.", "**Смотреть в лицо суровым фактам**, сохраняя веру в победу (парадокс Стокдейла); климат, где сотрудники могут открыто высказывать мнение.", "**Концепция ежа** — пересечение трёх кругов: в чём мы можем быть лучшими в мире, что движет нашей экономикой (один ключевой показатель), чем мы горим. Это перекликается с «иглой» из недели 18.", "**Культура дисциплины** и **маховик**: рывок — не одно решение, а накопленные усилия в одном направлении, которые разгоняют колесо."], "fig": {"k": "tri", "c": "Ёж", "a": ["Лучшие в мире|в чём именно", "Двигатель экономики|один показатель", "Страсть|чем горим"], "cap": "Концепция ежа: пересечение трёх кругов."}, "src": ["a3954805|лидер 5-го уровня, «сначала кто», ёж, маховик", "igla|игла как ёж малого бизнеса"], "ex": "Небольшая типография. Лучшие в мире: печать меню для кафе за 24 часа. Экономика: прибыль на одного постоянного клиента. Страсть: дизайн и бумага. Решение: отказаться от визиток и баннеров, сосредоточиться на HoReCa.", "err": ["Выбирать направление раньше команды.", "Считать рывок результатом одного смелого решения."], "qa": [["Что такое лидер пятого уровня?", "Сочетание личной скромности и профессиональной воли."], ["Из чего состоит концепция ежа?", "Лучшие в мире, двигатель экономики, страсть."]], "task": "Примените концепцию ежа к своей работе, бизнесу или карьере: заполните три круга, найдите пересечение и один ключевой показатель. Опишите, от чего придётся отказаться, и первый «оборот маховика».", "out": "Три круга, пересечение, показатель, список отказов, первый шаг.", "rub": [["Круги честные", "особенно «лучшие в мире»"], ["Показатель один", "двигатель экономики"], ["Отказы названы", "конкретно"], ["Шаг маховика", "регулярное действие"]], "sample": "Карьера аналитика. Лучший: модели оттока клиентов для телекома. Показатель: удержанная выручка на модель. Страсть: поведение людей. Отказ: дашборды «для всех». Маховик: каждую неделю одна гипотеза оттока.", "deep": [{"h": "Как устроено исследование", "p": ["Коллинз («От хорошего к великому») с командой отобрал компании, которые после долгого периода средних результатов совершили рывок и 15 лет обгоняли рынок, и сравнил их с похожими компаниями, рывка не совершившими. Выводы оказались неожиданными: не харизматичные лидеры, не технологии и не слияния, а набор дисциплин."]}, {"h": "Дисциплинированные люди и мысль", "p": ["**Лидер пятого уровня**: сочетание личной скромности и профессиональной воли; он смотрит в окно, раздавая заслуги, и в зеркало, принимая ответственность. **Сначала кто — потом что**: сначала посадить в автобус нужных людей и высадить ненужных, потом решать, куда ехать. **Суровые факты**: смотреть правде в глаза, сохраняя веру в победу (парадокс Стокдейла); климат, где правду можно говорить. **Концепция ежа**: пересечение трёх кругов — в чём мы можем быть лучшими в мире, что движет нашей экономикой (один показатель «прибыль на X»), чем мы горим."]}, {"h": "Дисциплина действий и маховик", "p": ["**Культура дисциплины**: свобода внутри жёстких рамок концепции ежа; отказ от всего, что в неё не вписывается («список того, что перестать делать»). **Технологии-ускорители**: технология усиливает импульс, но не создаёт его. **Маховик**: рывок — не одно решение, а накопленные усилия в одном направлении; противоположность — «петля обречённости» с постоянной сменой курса."]}], "steps": ["Заполните три круга ежа для своей работы или бизнеса.", "Найдите пересечение и один экономический показатель.", "Составьте список «перестать делать».", "Оцените «кого» в своём автобусе: кого усилить, кого пересадить.", "Определите повторяемое действие маховика на квартал.", "Раз в месяц проверяйте, не уходите ли в петлю смены курса."], "check": ["Круг «лучшие в мире» честный.", "Показатель один.", "Есть список «перестать делать».", "Маховик — регулярное действие.", "Курс не меняется каждый месяц."], "qa2": [["Что такое парадокс Стокдейла?", "Смотреть в лицо самым суровым фактам и одновременно сохранять веру в конечную победу."], ["Что такое «петля обречённости»?", "Постоянная смена стратегий и курса без накопления импульса."]]}, {"t": "Лидер: ритуалы и механика", "min": 45, "why": "Лидерство — не должность, а способ действовать, за которым идут люди. Его можно тренировать.", "pts": ["Робин Шарма («Большая книга лидера», «Как побеждать»): **8 ритуалов** — связь затрат и цели, человеческие отношения, награда и признание, следовать за переменами, сосредоточиться на главном, саморазвитие и самоконтроль, наблюдательность, согласовать лидерство с будущим.", "Андрей Жалевич («Мудрость лидера»): истинное лидерство — **служение и развитие людей**; мифы о лидерстве (что это врождённое, что это позиция); эколидерство.", "Джон Максвелл (конспект в «Годе личной эффективности»): уровни лидерства — от **позиции** («подчиняются, потому что должны») к **разрешению** (отношения), **результатам**, **развитию людей** и **вершине** (уважение за то, кто вы есть).", "Торбосов («Механика лидерства»): **уверенность** (в вас должны поверить — сначала поверьте сами), **воображение** (видеть будущее), **становление** (постоянно учиться и вдохновлять других).", "Общий знаменатель: лидер даёт **направление, пример и рост** людям."], "fig": {"k": "stairs", "a": ["Позиция", "Разрешение|отношения", "Результаты", "Развитие людей", "Вершина|уважение"], "cap": "Пять уровней лидерства по Максвеллу."}, "src": ["sharma_lead|8 ритуалов лидера", "zhalevich|лидерство как служение и развитие людей", "godeff|Максвелл: уровни лидерства", "torbosov|механика лидерства: уверенность, воображение, становление"], "ex": "Новый руководитель отдела: на уровне «позиции» сотрудники выполняют минимум. Шаги к «разрешению»: индивидуальные встречи раз в 2 недели, признание вклада на планёрке, защита команды от лишних задач. Через 3 месяца — инициатива снизу.", "err": ["Опираться только на должность.", "Хвалить всех одинаково и неконкретно."], "qa": [["Какие уровни лидерства выделяет Максвелл?", "Позиция, разрешение, результаты, развитие людей, вершина."], ["Что общее у разных авторов о лидерстве?", "Направление, пример и развитие людей."]], "task": "Оцените свой уровень лидерства (в работе, семье или сообществе) по Максвеллу с примерами. Выберите 2 ритуала Шармы и внедрите на 3 недели. Проведите две встречи один-на-один с людьми, которых вы ведёте.", "out": "Самооценка уровня с примерами, два ритуала и отчёт, итоги двух встреч.", "rub": [["Самооценка обоснована", "примеры поведения"], ["Ритуалы конкретны", "что, когда"], ["Встречи проведены", "о чём, что узнали"], ["Есть изменения", "в отношениях или результатах"]], "sample": "Уровень: «разрешение» — люди доверяют, но результаты нестабильны. Ритуалы: признание (каждую пятницу конкретная благодарность) и фокус (одна цель отдела на месяц). Встречи: узнал, что двое хотят учиться SQL — запустил внутренний кружок.", "deep": [{"h": "Восемь ритуалов Шармы", "p": ["Шарма («Большая книга лидера», включая «Как побеждать») в форме притчи описывает восемь ритуалов: связать затраты усилий с ясной целью; строить человеческие отношения; регулярно награждать и признавать; следовать за переменами; сосредоточиться на главном; развиваться и владеть собой; быть наблюдательным и думать нестандартно; согласовывать лидерство с будущим. Лидерство у Шармы — прежде всего служение людям."]}, {"h": "Уровни лидерства", "p": ["Максвелл (конспект в «Годе личной эффективности») описывает пять уровней: **позиция** (за вами идут, потому что должны), **разрешение** (потому что хотят — отношения), **результаты** (за то, что вы сделали для организации), **развитие людей** (за то, что вы сделали для них), **вершина** (за то, кто вы есть). Каждый уровень строится на предыдущем."]}, {"h": "Служение и механика", "p": ["Жалевич («Мудрость лидера») разбирает мифы о лидерстве (что это врождённое, что это должность) и определяет истинное лидерство как служение и развитие людей; говорит об «эколидерстве» — ответственности перед будущим. Торбосов («Механика лидерства») сводит лидерство к трём вещам: **уверенность** (в вас должны поверить — сначала поверьте сами), **воображение** (видеть будущее), **становление** (постоянно учиться и вдохновлять других)."]}], "steps": ["Оцените свой уровень лидерства по Максвеллу с примерами.", "Выберите 2 ритуала Шармы на 3 недели.", "Проведите встречи один на один с людьми, которых ведёте.", "На каждой спросите: что мешает, чему хочешь научиться?", "Каждую пятницу конкретно признайте вклад одного человека.", "Через 3 недели оцените изменения."], "check": ["Самооценка уровня обоснована.", "Ритуалы конкретны.", "Встречи один на один проведены.", "Признание конкретное.", "Есть изменения в отношениях или результатах."], "qa2": [["Почему позиция — нижний уровень лидерства по Максвеллу?", "За вами идут только потому, что должны; влияние ограничено полномочиями."], ["Что Торбосов понимает под «становлением»?", "Постоянное обучение и вдохновение других."]]}, {"t": "Простое управление", "min": 40, "why": "Сложные теории управления плохо работают в спешке. Нужны простые действия, которые выполняются каждый день.", "pts": ["Фёдор Нестеров («Fast-менеджмент»): жизнь ускоряется; концепция — **упрощать сложные теории управления до простых управленческих действий**, понятных «поколению Fast».", "Базовый управленческий цикл: **цель → задача с критерием → ресурсы → контроль → обратная связь**.", "Постановка задачи: результат (как выглядит «готово»), срок, критерии качества, ресурсы, точки контроля (связь с делегированием, неделя 7).", "Обратная связь: **факт → влияние → что изменить** (без оценки личности); хвалить публично, критиковать наедине.", "Ежедневные/еженедельные ритуалы: короткие планёрки, доска задач, ретроспектива (Scrum из недели 7)."], "fig": {"k": "flow", "a": ["Цель", "Задача|результат, срок, критерии", "Ресурсы", "Контроль|точки", "Обратная связь|факт → влияние → изменение"], "cap": "Простой управленческий цикл."}, "src": ["a6038053|простые управленческие действия вместо сложных теорий"], "ex": "Обратная связь: «Отчёт пришёл в 18:30 вместо 12:00 (факт). Я не успел подготовиться к встрече с директором (влияние). Давай договоримся: если не успеваешь — пиши до 10:00, разделим работу (изменение)».", "err": ["Ставить задачи без критерия «готово».", "Давать обратную связь о личности («ты безответственный»)."], "qa": [["Из чего состоит хорошая постановка задачи?", "Результат, срок, критерии, ресурсы, точки контроля."], ["Как дать обратную связь по Fast-формуле?", "Факт, влияние, что изменить."]], "task": "Поставьте одну задачу кому-то (на работе, дома) по полной формуле. Дайте одну обратную связь по схеме «факт — влияние — изменение». Опишите реакцию и результат.", "out": "Текст постановки, текст обратной связи, итоги.", "rub": [["Задача по формуле", "все элементы"], ["Обратная связь без оценок личности", "факт и влияние"], ["Изменение конкретное", "договорённость"], ["Итог описан", "что получилось"]], "sample": "Задача сыну: «До воскресенья 20:00 разобрать полку с играми: оставить то, во что играешь, остальное — в коробку для дарения. Готово — когда полка закрывается. Если нужна помощь — суббота 11:00».", "deep": [{"h": "Fast-менеджмент", "p": ["Нестеров («Fast-менеджмент») исходит из того, что жизнь ускоряется, а сложные теории управления плохо работают в спешке. Его подход — упрощать управление до понятных действий, которые руководитель делает каждый день: ставит задачи, контролирует, даёт обратную связь, развивает людей."]}, {"h": "Постановка задачи", "p": ["Хорошая задача содержит: **результат** (как выглядит «готово»), **срок**, **критерии качества**, **ресурсы и полномочия**, **точки контроля** и правило, что делать при проблеме. Перед постановкой полезно спросить исполнителя, как он понял задачу, — это экономит переделки."]}, {"h": "Обратная связь и ритм", "p": ["Обратная связь по схеме **факт → влияние → что изменить** обсуждает поступок, а не личность. Хвалить публично, критиковать наедине. Управленческий ритм: короткие ежедневные или еженедельные планёрки, доска задач, ретроспектива (связь со Scrum из урока 7.4)."]}], "steps": ["Выберите задачу, которую поручите на этой неделе.", "Сформулируйте её по формуле: результат, срок, критерии, ресурсы, контроль.", "Попросите исполнителя пересказать, как он понял задачу.", "Назначьте точки контроля в календаре.", "Дайте одну обратную связь по схеме «факт — влияние — изменение».", "Введите еженедельную короткую встречу по задачам."], "check": ["Задача по формуле.", "Исполнитель пересказал понимание.", "Точки контроля в календаре.", "Обратная связь без оценок личности.", "Есть регулярный ритм встреч."], "qa2": [["Зачем просить исполнителя пересказать задачу?", "Чтобы проверить понимание и избежать переделок."], ["Почему критиковать лучше наедине?", "Чтобы человек сохранил лицо и воспринимал критику как помощь, а не унижение."]]}, {"t": "Масштабирование и финансирование", "min": 40, "why": "Рост бизнеса — отдельная задача: то, что работает в одной точке, должно стать воспроизводимым.", "pts": ["Ватутин и Тришин («Клонирование бизнеса»): способы масштаба — **свои филиалы**, **удалённые продажи**, **франчайзинг**. Что подойдёт — зависит от модели, капитала и управляемости.", "Основа тиражирования — **документирование бизнес-процессов**: подбор места и кадров, обучение новых точек, стандарты, продвижение.", "Франчайзинг требует «упакованной» модели: доказанной экономики, стандартов, обучения, поддержки и контроля качества.", "Алексей Горяев (лекция РЭШ «Новые способы инвестиций и финансирования для бизнеса»): **альтернативные финансы** — P2P-кредитование и краудфандинг, которые делают деньги доступнее, обходя посредников.", "Правило: масштабируйте то, что **уже прибыльно и описано**; иначе вы тиражируете проблемы."], "fig": {"k": "fork", "q": "Точка прибыльна и описана?", "a": "Нет: сначала стандарты, цифры, обучение → иначе тиражируете проблемы", "b": "Да: филиалы, удалённые продажи или франшиза → выбор по капиталу и контролю", "cap": "Масштаб — только после воспроизводимости."}, "src": ["clone|филиалы, удалённые продажи, франчайзинг, документирование", "a29605423|P2P-кредитование и краудфандинг"], "ex": "Кофейня с прибылью 18%. Шаг 1: регламенты (рецепты, открытие/закрытие, найм бариста) — 40 страниц. Шаг 2: вторая точка своими силами. Шаг 3: через год — 3 франчайзи с обучением в первой точке.", "err": ["Продавать франшизу неупакованного бизнеса.", "Масштабировать убыточную модель «в надежде на объём»."], "qa": [["Назовите три способа масштабирования.", "Филиалы, удалённые продажи, франчайзинг."], ["Что нужно сделать до масштабирования?", "Добиться прибыльности и описать процессы."]], "task": "Возьмите процесс своей работы или бизнеса и опишите его как регламент на 1–2 страницы так, чтобы новичок мог выполнить его без вас. Оцените, какой способ масштабирования подошёл бы и почему.", "out": "Регламент + анализ способа масштабирования.", "rub": [["Регламент воспроизводим", "шаги, стандарты, критерии"], ["Новичок проверил", "или есть план проверки"], ["Способ выбран обоснованно", "капитал, контроль"], ["Учтены риски", "что может сломаться"]], "sample": "Регламент «Приём заказа на торт»: 9 шагов, скрипт, чек-лист вопросов, шаблон предоплаты. Масштаб: удалённые продажи через сайт и доставку, франшиза рано — нет стабильной прибыли.", "deep": [{"h": "Способы масштабирования", "p": ["Ватутин и Тришин («Клонирование бизнеса») описывают варианты роста: **собственные филиалы** (больше контроля, нужны деньги и управленцы), **удалённые продажи** (рост без новых точек), **франчайзинг** (рост за счёт капитала партнёров, нужна упакованная модель). Выбор зависит от модели бизнеса, капитала и того, насколько вы готовы делиться контролем."]}, {"h": "Тиражирование начинается с регламентов", "p": ["Основа масштаба — **документирование бизнес-процессов**: как выбирать место, нанимать и обучать людей, открывать точку, продвигать, считать результаты. Франчайзинг требует доказанной экономики, стандартов, обучения, поддержки и контроля качества. Масштабировать стоит то, что уже прибыльно и описано, — иначе тиражируются проблемы."]}, {"h": "Альтернативное финансирование", "p": ["Горяев (лекция РЭШ) рассказывает о **P2P-кредитовании** и **краудфандинге** — способах получить деньги напрямую от людей, без банков и посредников. Это делает финансирование доступнее для малого бизнеса, но требует понятного продукта и прозрачной отчётности."]}], "steps": ["Выберите процесс своей работы или бизнеса.", "Опишите его как регламент: шаги, стандарты, критерии, исключения.", "Дайте регламент новичку и посмотрите, где он ошибается.", "Исправьте регламент.", "Оцените способы масштабирования для своей модели.", "Запишите риски выбранного способа."], "check": ["Регламент воспроизводим без вас.", "Проверен на новичке.", "Способ масштабирования обоснован.", "Риски названы.", "Масштабируется прибыльная модель."], "qa2": [["Почему регламент проверяют на новичке?", "Только так видно, что понятно без автора, а что нет."], ["Чем франчайзинг отличается от собственных филиалов?", "Рост идёт за счёт капитала партнёров, но меньше контроля и выше требования к упаковке модели."]]}]}, {"n": 22, "title": "Деньги: мышление и бюджет", "goal": "Разобраться со своими установками о деньгах, навести порядок в бюджете, поставить финансовые цели и спланировать рост дохода. Материал учебный, по книгам библиотеки.", "lessons": [{"t": "Денежное мышление", "min": 40, "why": "Доход часто упирается не в навыки, а в установки о деньгах, усвоенные в детстве.", "pts": ["Т. Харв Экер («Думай как миллионер»): **«финансовый термостат»** — внутренние установки о деньгах держат доход на привычном уровне; 17 различий мышления богатых и бедных; система **«кувшинов»** для распределения дохода.", "Джен Синсеро («НЕ НОЙ»): перестать жаловаться, проработать отношение к деньгам, ставить задачи роста дохода.", "Джон Смит («Привычки миллионеров»): **быть богатым ≠ казаться богатым**; активы против пассивов, жить ниже возможностей, несколько источников дохода.", "Наполеон Хилл («Механизмы работы мозга, которые делают нас богатыми»): вера и сосредоточенность на цели как двигатели достижения — мотивационный текст начала XX века, читаем через фильтр недели 14.", "Курпатов и Абдуллаева («10 дельных вопросов. Деньги большого города»): страхи, жадность, долг и вопрос «сколько нужно для счастья» — **вопрос смысла, а не суммы**. Выпуск подкаста с Алексеем Тараповским — о том, как решить «денежный вопрос»."], "fig": {"k": "ice", "top": "Поведение: трачу всё, не прошу повышения", "bottom": "Установки: «деньги — грязь», «богатые — нечестные», «скромность — добродетель» → Источник: семья, первые заработки", "cap": "Финансовый термостат: поведение держится на подводных установках."}, "src": ["a25917124|финансовый термостат и кувшины", "a40260159|перестать жаловаться и проработать отношение к деньгам", "smith|быть, а не казаться богатым; активы и пассивы", "a40512958|вера и сосредоточенность на цели", "k_money|деньги, страхи и смысл", "a27442968|выпуск: как решить денежный вопрос"], "ex": "Установка: «Просить деньги стыдно». Источник: мама говорила «главное — не жадничать». Новая установка: «Справедливая цена — уважение к своему труду». Действие: поднять ставку на 15% для новых клиентов.", "err": ["Путать богатство с потреблением.", "Ждать, что «правильные мысли» без действий изменят доход."], "qa": [["Что такое финансовый термостат?", "Внутренние установки, удерживающие доход на привычном уровне."], ["Чем активы отличаются от пассивов?", "Активы приносят деньги, пассивы забирают."]], "task": "Выпишите 10 фраз о деньгах, которые слышали в детстве. Отметьте, какие влияют на вас сейчас. Для трёх напишите новую установку и одно действие на этой неделе.", "out": "10 фраз, 3 установки с действиями, отчёт о действии.", "rub": [["Фразы реальные", "из вашего опыта"], ["Влияние показано", "пример поведения"], ["Новые установки правдоподобны", "можно поверить"], ["Действие выполнено", "результат"]], "sample": "Фразы: «не в деньгах счастье», «мы люди простые»… Новая установка: «деньги — ресурс для свободы». Действие: открыл отдельный счёт для накоплений и перевёл 5 000 ₽.", "deep": [{"h": "Финансовый термостат", "p": ["Экер («Думай как миллионер») вводит понятие **финансового термостата**: как термостат держит температуру, внутренние установки держат доход на привычном уровне — люди, внезапно разбогатевшие, часто возвращаются к прежнему состоянию. Установки формируются тем, что мы слышали о деньгах в детстве, что видели и что пережили.", "Он описывает 17 различий мышления богатых и бедных (например: «богатые верят, что создают свою жизнь; бедные — что жизнь случается с ними»; «богатые сосредоточены на возможностях, бедные — на препятствиях») и систему распределения дохода по «кувшинам»: финансовая свобода, крупные покупки, обучение, развлечения, благотворительность, повседневные расходы."]}, {"h": "Быть, а не казаться богатым", "p": ["Смит («Привычки миллионеров») подчёркивает разницу между богатством и демонстрацией богатства: жить ниже своих возможностей, покупать активы (приносящие деньги), а не пассивы (забирающие), развивать несколько источников дохода, учиться у наставников. Синсеро («НЕ НОЙ») добавляет работу с отношением к деньгам: перестать жаловаться и разрешить себе зарабатывать больше."]}, {"h": "Смысл суммы", "p": ["Хилл («Механизмы работы мозга, которые делают нас богатыми») — мотивационный текст начала XX века о вере и сосредоточенности на цели; читаем через фильтр недели 14. Курпатов и Абдуллаева («10 дельных вопросов. Деньги большого города») разбирают страхи, жадность и долг: «сколько нужно для счастья» — вопрос смысла, а не суммы. Алексей Тараповский (подкаст Маклахова) — о том, как решить «денежный вопрос»."]}], "steps": ["Выпишите 10 фраз о деньгах, которые слышали в детстве.", "Отметьте, какие влияют на ваше поведение сейчас.", "Для трёх напишите новую установку.", "Свяжите каждую с действием на неделе.", "Разделите следующий доход хотя бы на 3 «кувшина».", "Составьте список своих активов и пассивов."], "check": ["Установки найдены в своём опыте.", "Видно их влияние на поведение.", "Новые установки правдоподобны.", "Действие выполнено.", "Доход распределён осознанно."], "qa2": [["Почему разбогатевшие внезапно часто теряют деньги по Экеру?", "Финансовый термостат возвращает доход к привычному уровню, пока не изменены установки."], ["Что такое «кувшины» Экера?", "Распределение дохода по целям: свобода, покупки, обучение, развлечения, благотворительность, расходы."]]}, {"t": "Учёт и бюджет", "min": 45, "why": "Нельзя управлять тем, что не видишь. Учёт трат — финансовый хронометраж.", "pts": ["Наталья Колбасина («Трачу и приобретаю»): семейный бюджет начинается с **учёта**; затем — категории, лимиты, обязательные и переменные траты, планирование крупных покупок.", "Анастасия Тарасова («Сам себе финансист»): учёт доходов и расходов при **любом уровне дохода**, оптимизация трат без жёсткой экономии.", "Подкаст «Калькулятор» («Финансовая уборка», Грибуля и Щетинин): большинство россиян тратит столько же, сколько зарабатывает; первый шаг — **осознанность**: куда уходят деньги.", "Т-Банк, «Колесо расходов»: бороться с импульсивными покупками — списки, пауза, анализ трат; что делать, если откладывать не получается; способы вести бюджет.", "Принцип **«сначала заплати себе»**: откладывайте процент в день дохода, а не остатки в конце месяца."], "fig": {"k": "cols", "cols": [{"h": "Обязательные", "items": ["жильё, ЖКХ", "кредиты", "транспорт, связь"]}, {"h": "Переменные", "items": ["еда", "одежда", "развлечения"]}, {"h": "Себе в первую очередь", "items": ["подушка", "цели", "инвестиции"]}], "cap": "Три корзины бюджета; третья заполняется первой."}, "src": ["kolbasina|учёт, категории, крупные покупки", "a34449606|финансы при любом доходе", "a44595322|осознанность: куда уходят деньги", "inv_series|выпуск «Колесо расходов»: импульсивные покупки и способы вести бюджет"], "ex": "Месяц учёта: доход 95 тыс. Еда вне дома — 18 тыс. (19%), подписки — 3,2 тыс. Решения: обеды из дома 3 дня в неделю (−6 тыс.), отменены 4 подписки (−1,9 тыс.). Автоперевод 10% в день зарплаты.", "err": ["Вести учёт, не анализируя категории.", "Откладывать «что останется»."], "qa": [["Что значит «сначала заплати себе»?", "Откладывать процент дохода сразу в день поступления."], ["С чего начинается управление бюджетом?", "С учёта, чтобы увидеть, куда уходят деньги."]], "task": "Месяц (минимум 2 недели для отчёта) ведите учёт всех трат. Разложите по корзинам, найдите 3 категории для оптимизации, настройте автоперевод на накопления.", "out": "Сводка по категориям в % (без точных сумм, если не хотите их показывать), 3 решения, процент автоперевода.", "rub": [["Учёт полный", "все траты"], ["Категории проанализированы", "доли"], ["Решения конкретны", "экономия"], ["Автоперевод настроен", "процент и дата"]], "sample": "Доли: жильё 32%, еда 24%, транспорт 9%, развлечения 11%, подписки 3%… Решения: такси → метро 2 дня, лимит на маркетплейсы, отказ от 3 подписок. Автоперевод: 10% 5-го числа.", "deep": [{"h": "Учёт как фундамент", "p": ["Колбасина («Трачу и приобретаю») строит семейный бюджет с учёта: без данных нельзя понять, куда уходят деньги. Затем — категории, лимиты, обязательные и переменные расходы, планирование крупных покупок. Она пишет о жизни в BANI-мире (хрупком, тревожном, нелинейном, непостижимом) — где подушка и гибкость важнее точных прогнозов."]}, {"h": "При любом доходе", "p": ["Тарасова («Сам себе финансист») показывает, что финансовая грамотность — не для богатых: учёт, оптимизация без жёсткой экономии, подушка и накопления возможны при любом доходе. Подкаст «Калькулятор» («Финансовая уборка», Грибуля и Щетинин) приводит данные НАФИ: многие тратят всё, что зарабатывают; первый шаг — осознанно посмотреть, куда уходят деньги."]}, {"h": "Колесо расходов", "p": ["Выпуск Т-Банка «Колесо расходов» даёт приёмы против импульсивных покупок (списки, пауза перед покупкой, удаление сохранённых карт), способы вести бюджет (приложения, таблица, конверты) и советы, что делать, если откладывать не получается: начать с малого процента и автоматического перевода. Принцип **«сначала заплати себе»** — откладывать в день дохода."]}], "steps": ["Месяц записывайте все траты (банк + наличные).", "Разложите по категориям и посчитайте доли.", "Найдите 3 категории для оптимизации.", "Установите лимиты на переменные траты.", "Настройте автоперевод 5–10 % в день дохода.", "В конце месяца сравните план и факт."], "check": ["Учёт полный.", "Есть доли категорий.", "Лимиты установлены.", "Автоперевод настроен.", "Есть сравнение план/факт."], "qa2": [["Почему откладывать надо в день дохода?", "Остатки в конце месяца обычно не появляются — деньги тратятся."], ["Какие приёмы против импульсивных покупок предлагает Т-Банк?", "Списки, пауза перед покупкой, отказ от сохранённых карт."]]}, {"t": "Финансовые цели и подушка безопасности", "min": 40, "why": "Мечта без суммы и срока остаётся мечтой. Финансовая цель превращает её в ежемесячное действие.", "pts": ["Колбасина: **финансовые цели** классифицируются по срокам (краткие, средние, долгие) и важности; алгоритм — цель, сумма, срок, ежемесячный взнос, инструмент.", "Т-Банк, «Сколько стоит твоя мечта»: 6 шагов к финансовой цели — сформулировать, оценить стоимость, учесть инфляцию, выбрать срок, рассчитать взнос, выбрать инструмент.", "**Подушка безопасности** — 3–6 месяцев обязательных расходов на надёжном и доступном счёте; она защищает от кредитов при форс-мажоре.", "Тарасова: накопления на цели и на пенсию — при любом доходе; не рассчитывать только на государственную пенсию.", "Порядок: подушка → закрыть дорогие долги → цели → долгосрочные инвестиции."], "fig": {"k": "stairs", "a": ["Учёт", "Подушка 3–6 мес.", "Дорогие долги закрыты", "Цели по срокам", "Долгосрочные инвестиции"], "cap": "Лестница финансовой устойчивости."}, "src": ["kolbasina|классификация и алгоритм финансовых целей", "inv_series|выпуск «Сколько стоит твоя мечта»: 6 шагов", "a34449606|подушка и накопления на пенсию"], "ex": "Цель: отпуск 150 тыс. через 10 месяцев. С учётом роста цен ~160 тыс. Взнос 16 тыс. в месяц. Инструмент: накопительный счёт. Подушка: 4 месяца обязательных расходов уже есть.", "err": ["Инвестировать в рискованные инструменты без подушки.", "Ставить цель без суммы и срока."], "qa": [["Какой размер подушки безопасности считается разумным?", "3–6 месяцев обязательных расходов."], ["В каком порядке строить финансы?", "Подушка, дорогие долги, цели, долгосрочные инвестиции."]], "task": "Посчитайте размер своей подушки (обязательные расходы × 3–6) и план её накопления. Сформулируйте 3 финансовые цели (краткую, среднюю, долгую) по алгоритму: сумма, срок, взнос, инструмент.", "out": "Расчёт подушки и план, три цели в таблице.", "rub": [["Подушка рассчитана", "от обязательных расходов"], ["Цели по алгоритму", "все поля"], ["Учтён рост цен", "для средних и долгих"], ["Есть порядок", "что первым"]], "sample": "Обязательные расходы 60 тыс. → подушка 240 тыс. (4 мес.). Есть 90 тыс., добор 15 тыс./мес. — 10 мес. Цели: курсы (6 мес.), машина (3 года), пенсия (25 лет).", "deep": [{"h": "Как ставить финансовые цели", "p": ["Колбасина классифицирует финансовые цели по срокам (краткосрочные до года, среднесрочные 1–5 лет, долгосрочные дольше) и важности. Алгоритм: сформулировать цель → оценить стоимость → учесть рост цен → определить срок → рассчитать ежемесячный взнос → выбрать инструмент, подходящий сроку и риску."]}, {"h": "Сколько стоит мечта", "p": ["Выпуск Т-Банка «Сколько стоит твоя мечта» переводит мечты в финансовый план за 6 шагов и объясняет инфляцию: почему растут цены и как от неё защищаться. Ключевая мысль: деньги — инструмент для мечты, а без плана мечта остаётся абстракцией."]}, {"h": "Подушка и порядок действий", "p": ["**Подушка безопасности** — 3–6 месяцев обязательных расходов на надёжном и доступном счёте; она защищает от кредитов при потере дохода или болезни. Тарасова и серия Т-Банка сходятся в порядке: подушка → погашение дорогих долгов (кредитки) → цели → долгосрочные инвестиции. Инвестировать без подушки — значит быть вынужденным продавать в худший момент."]}], "steps": ["Посчитайте обязательные расходы в месяц.", "Умножьте на 3–6 — это размер подушки.", "Составьте план её накопления.", "Сформулируйте 3 финансовые цели разного срока.", "Для каждой: сумма с учётом роста цен, срок, взнос, инструмент.", "Закройте или запланируйте погашение дорогих долгов."], "check": ["Подушка рассчитана от обязательных расходов.", "Цели по алгоритму.", "Учтена инфляция.", "Порядок действий соблюдён.", "Дорогие долги в плане погашения."], "qa2": [["Почему подушку держат на доступном счёте?", "Чтобы быстро получить деньги без потерь в экстренной ситуации."], ["Почему не стоит инвестировать без подушки?", "При форс-мажоре придётся продавать активы, возможно, в худший момент."]]}, {"t": "Рост дохода", "min": 45, "why": "Экономия ограничена, доход — нет. План роста дохода превращает желание «зарабатывать больше» в цифры и действия.", "pts": ["Центр финансовой культуры («План роста доходов, дерево задач»): таймшит → **KPI (за что вам платят)** → **блок-схема** пути к результату → оцифровка (выработка, сложность действий в «активностях», конверсии) → план на месяц.", "**Дерево задач** детализируется до двух уровней; задачи оцениваются по шкале «легко / быстро / дёшево / высокий эффект», первыми — набравшие 4 и 3 балла; оценка прироста — хотя бы примерная («лучше любое число, чем его отсутствие»).", "Смит: несколько **источников дохода** — основной, побочный проект, пассивный доход от активов.", "Курпатов («Деньги большого города»): рост дохода требует иногда преодолеть **страх перед начальником** и собственную «скромность» — попросить о повышении или поднять цены.", "Каналы роста: повышение ставки, смена работы, новый навык (карьерный капитал, неделя 1), подработка, свой проект."], "fig": {"k": "flow", "a": ["Таймшит|куда уходит время", "KPI|за что платят", "Блок-схема|путь к результату", "Оцифровка|активности и конверсии", "План месяца|сколько действий"], "cap": "Алгоритм плана роста доходов ЦФК."}, "src": ["cfc|план роста доходов и дерево задач", "smith|несколько источников дохода", "k_money|страх начальника и разговор о деньгах"], "ex": "Риелтор: KPI — сделки. Блок-схема: звонок → показ → переговоры → сделка. Конверсии: 20 звонков → 4 показа → 1 сделка. Цель +30%: 26 звонков в неделю. Дерево: обновить скрипт (4 балла), запустить рассылку старым клиентам (3 балла).", "err": ["Хотеть «больше денег» без расчёта, сколько и откуда.", "Не оценивать задачи и браться сначала за самые трудные."], "qa": [["С чего начинается план роста доходов по ЦФК?", "С таймшита и определения KPI — за что вам платят."], ["Какие задачи внедрять первыми?", "Набравшие 4 и 3 балла по шкале «легко, быстро, дёшево, высокий эффект»."]], "task": "Составьте план роста дохода на 3 месяца по алгоритму ЦФК: KPI, блок-схема, конверсии, цель роста в %, дерево задач (2 уровня) с оценкой по шкале. Выполните две задачи с наивысшим баллом.", "out": "План по шагам, дерево задач с баллами, отчёт о двух задачах.", "rub": [["KPI определён", "за что платят"], ["Оцифровка есть", "конверсии и активности"], ["Дерево оценено", "баллы по шкале"], ["Задачи выполнены", "две, с результатом"]], "sample": "KPI: оплаченные часы консультаций. Цель +25%. Дерево: поднять цену новым клиентам (4), пакет из 5 консультаций (3), курс (1). Выполнено: новая цена + пакет — продано 2 пакета.", "deep": [{"h": "План роста доходов", "p": ["Центр финансовой культуры («План роста доходов, дерево задач») предлагает алгоритм: месяц таймшита → определить **KPI** — конечный результат, за который платят → нарисовать **блок-схему** пути к результату с началом и концом каждого блока → **оцифровать**: выработка в месяц, сложность действий в «активностях», конверсии, структура расходов → план на месяц в цифрах."]}, {"h": "Дерево задач и оценка", "p": ["Дерево задач детализируется до двух уровней — задачи и подзадачи, без сроков и исполнителей на этом этапе. Затем каждая идея оценивается по шкале: легко/сложно, быстро/долго, дёшево/дорого, высокий/низкий эффект, — и первыми внедряются набравшие 4 и 3 балла. Оценка прироста от задачи делается хотя бы «на глаз»: «лучше любое примерное число, чем его отсутствие»."]}, {"h": "Каналы роста", "p": ["Смит советует развивать несколько источников дохода: основной, побочный проект, пассивный доход от активов. Курпатов («Деньги большого города») напоминает о психологических барьерах: страх перед начальником и привычка к «скромности» мешают попросить повышения или поднять цены. Связь с уроком 1.3: редкий навык — самый надёжный путь к росту дохода."]}], "steps": ["Определите свой KPI — за что вам платят.", "Нарисуйте блок-схему пути к результату.", "Посчитайте конверсии и активности.", "Поставьте цель роста дохода в процентах на 3 месяца.", "Составьте дерево задач на 2 уровня и оцените по шкале.", "Выполните две задачи с наивысшим баллом и измерьте эффект."], "check": ["KPI определён.", "Есть оцифровка процесса.", "Дерево оценено по шкале.", "Две задачи выполнены.", "Эффект измерен."], "qa2": [["Что такое KPI в плане ЦФК?", "Конечный результат работы, за который платят деньги."], ["Почему лучше примерная оценка, чем никакой?", "Без числа нельзя сравнить задачи и выбрать приоритет."]]}]}, {"n": 23, "title": "Инвестиции: основы", "goal": "Понять сложный процент, виды инструментов, принципы Грэма и Баффета и логику учебного портфеля. Это учебный материал по книгам, а не индивидуальная инвестиционная рекомендация.", "lessons": [{"t": "Сложный процент и инструменты", "min": 45, "why": "Время — главный союзник инвестора. Понимание сложного процента меняет отношение к небольшим регулярным суммам.", "pts": ["Т-Банк, серия «Инвестиции — это просто!»: **сложный процент** — доход начисляется на доход; эффект растёт со временем. «Как вложить 100 рублей» — регулярные небольшие взносы и **стратегия DCA** (покупка на одинаковую сумму через равные промежутки) сглаживают колебания.", "Деньги, лежащие на карте, **дешевеют из-за инфляции**; «На чём заработать»: 5 способов — от вкладов до бизнеса.", "«С чего начать. Акции или облигации»: **облигации** — долг (купон, ниже риск), **акции** — доля в компании (рост и дивиденды, выше риск); фонды дают диверсификацию.", "Елена Коваленко («17 вариантов инвестиций»): сравнение инструментов — акции, облигации, недвижимость, страховые программы, форекс и др. — по доходности, плюсам и минусам, **без розовых и без чёрных очков**.", "Правило: **доходность всегда связана с риском**; обещание высокой доходности без риска — признак мошенничества."], "fig": {"k": "curve", "pts": [[0, 1], [20, 1.5], [40, 2.3], [60, 3.5], [80, 5.5], [100, 9]], "marks": [[40, "кажется, что медленно"], [100, "проценты на проценты"]], "xl": "годы", "yl": "капитал", "cap": "Сложный процент: основной рост приходится на последние годы — поэтому важно начать рано."}, "src": ["inv_series|сложный процент, DCA, инфляция, акции и облигации", "kovalenko|17 инструментов: доходность, плюсы, минусы"], "ex": "Учебный расчёт: 5 000 ₽ в месяц при условной доходности 10% годовых за 20 лет дают около 3,8 млн ₽ при вложенных 1,2 млн ₽. Цифры условные — реальная доходность не гарантирована.", "err": ["Ждать «большой суммы», чтобы начать.", "Верить в высокую доходность без риска."], "qa": [["Что такое сложный процент?", "Начисление дохода на ранее полученный доход."], ["Чем облигация отличается от акции?", "Облигация — долг с купоном, акция — доля в компании с большим риском и потенциалом."]], "task": "Учебное упражнение: в калькуляторе сложного процента сравните три сценария (сумма, срок, условная доходность). Составьте таблицу 6 инструментов из книги Коваленко и серии Т-Банка: доходность, риск, ликвидность, плюсы, минусы.", "out": "Три сценария с выводом + таблица 6 инструментов.", "rub": [["Сценарии различаются", "срок или сумма"], ["Вывод про время", "сформулирован"], ["Таблица полная", "все столбцы"], ["Риск указан честно", "для каждого"]], "sample": "Сценарии: 3 000 ₽ × 30 лет, 10 000 ₽ × 10 лет, 6 000 ₽ × 20 лет. Вывод: срок важнее суммы. Таблица: вклад, ОФЗ, корпоративные облигации, фонд на индекс, акции, недвижимость.", "deep": [{"h": "Сложный процент и регулярность", "p": ["Серия Т-Банка «Инвестиции — это просто!» объясняет сложный процент: доход начисляется на ранее полученный доход, и рост ускоряется со временем. Поэтому срок важнее суммы, а начинать полезно рано и с малого. **Стратегия DCA** (усреднение стоимости) — вкладывать одинаковую сумму через равные промежутки: при падении цены покупается больше, при росте меньше, что сглаживает колебания."]}, {"h": "Инструменты и риск", "p": ["Выпуски серии объясняют, что деньги на карте **дешевеют из-за инфляции**, описывают 5 способов заработать — от вкладов до бизнеса — и разницу между **облигациями** (вы даёте в долг; купон, ниже риск) и **акциями** (доля в компании; потенциал роста и дивиденды, выше риск), а также фондами, дающими диверсификацию."]}, {"h": "Без розовых очков", "p": ["Коваленко («17 вариантов инвестиций») сравнивает инструменты — акции, облигации, недвижимость, страховые программы, форекс и другие — по доходности, плюсам и минусам. Она честно пишет, что сама дважды теряла крупные суммы. Общий вывод: доходность всегда связана с риском, а обещание высокой доходности без риска — признак мошенничества. Это учебный материал, а не индивидуальная рекомендация."]}], "steps": ["В калькуляторе сложного процента посчитайте 3 учебных сценария.", "Сравните влияние срока и суммы.", "Составьте таблицу 6 инструментов: доходность, риск, ликвидность, плюсы, минусы.", "Отметьте инструменты, которые понимаете, и те, что нет.", "Запишите вопросы, которые нужно изучить.", "Не принимайте решений, пока не пройдёте уроки 23.2–23.4."], "check": ["Сценарии различаются сроком и суммой.", "Вывод про время сформулирован.", "Риск указан для каждого инструмента.", "Отмечено, что непонятно.", "Решения отложены до конца недели."], "qa2": [["Что такое стратегия DCA?", "Регулярные вложения одинаковой суммы, которые сглаживают колебания цены покупки."], ["Почему деньги на карте дешевеют?", "Из-за инфляции их покупательная способность снижается."]]}, {"t": "Разумный инвестор: принципы Грэма", "min": 45, "why": "Книга, которую Баффет называет лучшей об инвестициях, учит не выбирать акции, а не терять голову.", "pts": ["Бенджамин Грэм («Разумный инвестор»): **инвестиция** — операция, которая после анализа обещает сохранность капитала и адекватный доход; всё остальное — **спекуляция**.", "**Мистер Рынок** — партнёр, который каждый день предлагает цену, то в эйфории, то в панике. Не обязаны соглашаться — можно пользоваться его настроением.", "**Запас прочности**: покупать, когда цена заметно ниже оценённой стоимости, чтобы ошибка оценки не стала катастрофой.", "**Пассивный (защитный) инвестор**: диверсификация, облигации и акции крупных компаний в пропорции, регулярные взносы, минимум действий. **Активный** — больше анализа и времени.", "Комментарии Джейсона Цвейга: главный враг инвестора — **он сам**: эмоции, погоня за модой, частые сделки."], "fig": {"k": "curve", "pts": [[0, 5], [12, 8], [25, 6], [38, 2.5], [52, 4.5], [66, 7.5], [80, 3.5], [100, 6]], "marks": [[12, "эйфория: продавать не страшно"], [38, "паника: шанс купить"]], "xl": "время", "yl": "настроение Мистера Рынка", "cap": "Мистер Рынок меняет настроение; разумный инвестор не заражается им."}, "src": ["graham|инвестиции против спекуляций, Мистер Рынок, запас прочности, защитный инвестор"], "ex": "Рынок упал на 25% за месяц, в новостях паника. Защитный инвестор по Грэму: не продаёт, продолжает регулярные взносы по плану и проверяет, не нарушена ли заданная пропорция облигаций и акций.", "err": ["Покупать на эйфории и продавать в панике.", "Считать частую торговлю инвестированием."], "qa": [["Чем инвестиция отличается от спекуляции по Грэму?", "Инвестиция после анализа обещает сохранность капитала и адекватный доход; остальное — спекуляция."], ["Что такое запас прочности?", "Разница между ценой покупки и оценённой стоимостью, защищающая от ошибок."]], "task": "Учебное упражнение: напишите свою «инвестиционную политику» защитного инвестора по Грэму (1 страница): цель, горизонт, пропорция классов активов, регулярность взносов, правила на случай падения на 20–30%, чего вы никогда не делаете.", "out": "Инвестиционная политика на 1 страницу.", "rub": [["Цель и горизонт", "указаны"], ["Пропорция активов", "обоснована горизонтом и риском"], ["Правила на падение", "конкретные"], ["Запреты", "список «никогда»"]], "sample": "Цель: капитал к 60 годам. Горизонт 25 лет. Пропорция: 60% фонды акций, 40% облигации, ребалансировка раз в год. Взнос: 10% дохода 5-го числа. Падение: не продаю, продолжаю взносы. Никогда: кредитное плечо, «сигналы» из чатов.", "deep": [{"h": "Инвестиции и спекуляции", "p": ["Грэм («Разумный инвестор») даёт определение: **инвестиционная операция** — та, что после тщательного анализа обещает сохранность основного капитала и адекватный доход; всё остальное — **спекуляция**. Покупка «потому что растёт» — спекуляция, даже если выглядит как инвестиция."]}, {"h": "Мистер Рынок и запас прочности", "p": ["**Мистер Рынок** — воображаемый партнёр, который каждый день предлагает купить или продать долю по цене, зависящей от его настроения: то эйфория, то паника. Вы не обязаны соглашаться: его настроение — возможность, а не руководство. **Запас прочности** — покупать, когда цена заметно ниже оценённой стоимости, чтобы ошибка оценки или неудача не превратились в катастрофу."]}, {"h": "Защитный инвестор", "p": ["Грэм различает **защитного** (пассивного) и **активного** инвестора. Защитному он советует: распределение между облигациями и акциями (от 25/75 до 75/25 в зависимости от ситуации), диверсификацию по крупным надёжным компаниям, регулярные взносы, минимум действий. Комментарии Джейсона Цвейга в современном издании подчёркивают: главный враг инвестора — он сам; эмоции, погоня за модой и частые сделки разрушают результат."]}], "steps": ["Сформулируйте инвестиционную цель и горизонт (учебно).", "Определите пропорцию облигаций и акций по Грэму.", "Запишите правило регулярных взносов.", "Запишите правила на случай падения рынка на 20–30 %.", "Составьте список «никогда не делаю».", "Сохраните документ «инвестиционная политика» и перечитывайте при эмоциях."], "check": ["Цель и горизонт указаны.", "Пропорция обоснована.", "Есть правила на падение.", "Есть список запретов.", "Политика записана."], "qa2": [["Какую пропорцию облигаций и акций советует Грэм защитному инвестору?", "В пределах от 25/75 до 75/25."], ["Кто главный враг инвестора по Цвейгу?", "Он сам: эмоции, погоня за модой и частые сделки."]]}, {"t": "Как думает Баффет", "min": 40, "why": "Самый известный инвестор мира пользуется простыми принципами. Их ценность — в дисциплине, а не в секретах.", "pts": ["Роберт Хагстром («Уоррен Баффет. Как 5 долларов превратить в 50 миллиардов»): покупать **бизнес, а не тикер** — смотреть на компанию, как владелец.", "Принципы Баффета: **понятный бизнес**, стабильная история, благоприятные долгосрочные перспективы; **честный и рациональный менеджмент**; финансовые показатели (рентабельность капитала, «доходы владельца»); **цена ниже внутренней стоимости**.", "**Концентрация** на нескольких хорошо понятых компаниях и **терпение**: «наш любимый срок владения — навсегда».", "Баффет — ученик Грэма: запас прочности и Мистер Рынок — основа его подхода.", "Для непрофессионала Баффет сам советует **недорогой индексный фонд** — это честный вывод для большинства частных инвесторов."], "fig": {"k": "flow", "a": ["Бизнес понятен?", "Менеджмент честен?", "Экономика сильна?|рентабельность", "Цена ниже стоимости?|запас прочности", "Держать долго"], "cap": "Фильтр Баффета по Хагстрому."}, "src": ["hagstrom|принципы Баффета: бизнес, менеджмент, финансы, цена"], "ex": "Учебный разбор: сеть аптек, которой вы пользуетесь. Бизнес понятен (да), отчётность публична, рентабельность стабильна 5 лет, менеджмент выкупает акции… Вывод: компанию понимаю, но оценить стоимость не умею — значит, для меня это не инвестиция, а повод учиться.", "err": ["Покупать «потому что растёт».", "Концентрироваться на компаниях, которых не понимаешь."], "qa": [["Что значит «покупать бизнес, а не тикер»?", "Оценивать компанию как владелец — её экономику и менеджмент, а не движение котировок."], ["Что Баффет советует большинству частных инвесторов?", "Недорогие индексные фонды."]], "task": "Учебный разбор: возьмите публичную компанию, продуктами которой вы пользуетесь, и пройдите фильтр Баффета по открытым данным (отчётность, новости). Честно отметьте, где вам не хватает знаний.", "out": "Разбор по пяти вопросам фильтра + список пробелов в знаниях.", "rub": [["Все вопросы пройдены", "5"], ["Данные из источников", "указаны"], ["Честность о пробелах", "есть"], ["Вывод учебный", "без рекомендации покупать"]], "sample": "Компания: крупный ритейлер. Понятен: да. Менеджмент: дивидендная политика публична. Рентабельность: нужно научиться читать отчёт. Цена: не умею оценивать. Вывод: учиться читать МСФО, пока — индексный фонд.", "deep": [{"h": "Принципы Баффета", "p": ["Хагстром («Уоррен Баффет. Как 5 долларов превратить в 50 миллиардов») раскладывает подход Баффета на группы принципов. **Бизнес**: прост и понятен, имеет стабильную историю, благоприятные долгосрочные перспективы. **Менеджмент**: рационален, честен с акционерами, не следует слепо за толпой. **Финансы**: важна рентабельность капитала, а не прибыль на акцию; «доходы владельца»; высокая маржа. **Рынок**: определить внутреннюю стоимость и покупать со значительной скидкой к ней."]}, {"h": "Концентрация и терпение", "p": ["Баффет держит концентрированный портфель из хорошо понятых компаний и известен фразой о том, что его любимый срок владения — «навсегда». Он ученик Грэма: Мистер Рынок и запас прочности — основа его подхода, дополненная вниманием к качеству бизнеса."]}, {"h": "Честный вывод для частного инвестора", "p": ["Сам Баффет неоднократно советовал большинству непрофессиональных инвесторов недорогой индексный фонд. Выбор отдельных компаний требует знаний и времени; без них разумнее широкая диверсификация. Это учебный материал, а не индивидуальная рекомендация."]}], "steps": ["Выберите публичную компанию, продукты которой знаете (учебно).", "Ответьте: понятен ли бизнес? стабильна ли история?", "Найдите в отчётности рентабельность капитала за 5 лет.", "Оцените честность менеджмента по открытым данным.", "Попробуйте оценить стоимость или отметьте, что не умеете.", "Запишите пробелы в знаниях — это план обучения."], "check": ["Данные из источников.", "Все группы принципов пройдены.", "Пробелы названы честно.", "Нет рекомендации «купить».", "Есть план обучения."], "qa2": [["Почему Баффет смотрит на рентабельность капитала, а не на прибыль на акцию?", "Она лучше показывает, насколько эффективно бизнес использует деньги акционеров."], ["Что Баффет советует большинству частных инвесторов?", "Недорогой индексный фонд."]]}, {"t": "Учебный портфель и защита от мошенников", "min": 45, "why": "Финансовые решения требуют не только знаний, но и защиты от собственных эмоций и чужих схем.", "pts": ["Т-Банк, «Что купить и сколько»: цели инвестирования, **риск-профиль** (консервативный, умеренный, агрессивный) и его влияние на долю акций и облигаций; **ИИС** и налоговые вычеты.", "«Это надёжно? Как работает финансовая система»: биржа, брокер, депозитарий, где хранятся ценные бумаги; **как распознать финансовую пирамиду** — гарантированная высокая доходность, оплата за привлечение людей, отсутствие лицензии ЦБ, давление «только сегодня».", "«Я не финансовый профи, мне можно?», «Сколько времени нужно, чтобы разобраться», «Как действовать дальше»: базовых знаний хватает для начала, важны стратегия и дисциплина.", "«Медиатека начинающего инвестора»: фильмы о рынках и бизнесе («Поменяться местами», «Нефть» и другие) — способ почувствовать психологию рынка.", "Коваленко: автор дважды теряла крупные суммы — **ошибки неизбежны**, поэтому не вкладывайте то, что не готовы потерять, и диверсифицируйте."], "fig": {"k": "cols", "cols": [{"h": "Признаки пирамиды", "items": ["гарантия высокой доходности", "бонус за привлечение", "нет лицензии ЦБ", "«только сегодня»"]}, {"h": "Защита", "items": ["проверить в реестре ЦБ", "пауза 48 часов", "диверсификация", "только «лишние» деньги"]}], "cap": "Распознать схему и защитить себя."}, "src": ["inv_series|риск-профиль, портфель, ИИС, как работает система, пирамиды", "inv_media|фильмы о рынках и психологии инвестора", "kovalenko|ошибки и диверсификация"], "ex": "Знакомый зовёт в «клуб» с доходом 5% в месяц и бонусом за друзей. Проверка: в реестре ЦБ компании нет, доход «гарантирован», бонус за привлечение — три признака пирамиды. Отказ.", "err": ["Определять риск-профиль по желаемой доходности, а не по реакции на падение.", "Вкладывать деньги из подушки безопасности."], "qa": [["Назовите три признака финансовой пирамиды.", "Гарантированная высокая доходность, вознаграждение за привлечение, отсутствие лицензии ЦБ (и давление срочностью)."], ["Как определить риск-профиль?", "По цели, горизонту и тому, как вы перенесёте падение портфеля на 20–30%."]], "task": "Учебное упражнение: определите свой риск-профиль (ответьте: горизонт, цель, реакция на падение на 20% и 40%). Составьте учебную модель портфеля по пропорциям серии Т-Банка для этого профиля (классы активов, без конкретных бумаг). Напишите памятку «как я проверяю любое предложение заработать» (5 пунктов). Посмотрите один фильм из медиатеки и запишите 3 вывода.", "out": "Риск-профиль с ответами, модель портфеля по классам, памятка, 3 вывода по фильму.", "rub": [["Профиль обоснован", "ответы на вопросы"], ["Модель по классам активов", "без конкретных бумаг"], ["Памятка практичная", "5 проверок"], ["Выводы по фильму", "связаны с поведением инвестора"]], "sample": "Профиль: умеренный (горизонт 15 лет, при −20% не продам, при −40% будет очень тревожно). Модель: 50% облигации, 40% фонды акций, 10% золото. Памятка: реестр ЦБ, пауза 48 ч, спросить «откуда доход», не переводить на карту частному лицу, обсудить с близким.", "deep": [{"h": "Риск-профиль и портфель", "p": ["Выпуск Т-Банка «Что купить и сколько» объясняет цели инвестирования, как правильно поставить инвестиционную цель и определить **риск-профиль** — консервативный, умеренный или агрессивный. Он определяется не желанием высокой доходности, а горизонтом, целью и тем, как вы перенесёте временное падение портфеля. Бонусы выпуска — об ИИС и налоговых вычетах и готовые модели портфелей по профилям."]}, {"h": "Надёжность системы и пирамиды", "p": ["«Это надёжно? Как работает финансовая система» объясняет участников: биржа, брокер, депозитарий (где хранятся ценные бумаги), — и что будет, если брокер обанкротится. Признаки **финансовой пирамиды**: гарантированная высокая доходность, вознаграждение за привлечение новых участников, отсутствие лицензии Банка России, давление «только сегодня», непонятный источник дохода. Проверка — реестр участников финансового рынка на сайте ЦБ."]}, {"h": "Психология и обучение", "p": ["Выпуски «Я не финансовый профи, мне можно?», «Сколько времени нужно, чтобы разобраться», «Как действовать дальше» снимают барьер: для начала достаточно базовых знаний, важнее стратегия и дисциплина. «Медиатека начинающего инвестора» — фильмы о рынках, которые помогают почувствовать психологию толпы. Коваленко напоминает: ошибки неизбежны, поэтому вкладывать только «лишние» деньги и диверсифицировать. Всё это учебный материал, решения принимаете вы сами."]}], "steps": ["Ответьте на вопросы риск-профиля: горизонт, цель, реакция на падение на 20 % и 40 %.", "Определите профиль.", "Составьте учебную модель портфеля по классам активов (без конкретных бумаг).", "Напишите памятку из 5 проверок любого предложения «заработать».", "Посмотрите фильм из медиатеки и запишите 3 вывода о поведении инвесторов.", "Решите, нужен ли вам ИИС, и изучите условия."], "check": ["Профиль определён по реакции на падение.", "Модель по классам активов.", "Памятка с проверкой в реестре ЦБ.", "Выводы по фильму про поведение.", "Нет вложения денег из подушки."], "qa2": [["Где проверить, есть ли у компании лицензия?", "В реестре участников финансового рынка на сайте Банка России."], ["Что такое депозитарий?", "Организация, которая хранит ценные бумаги и учитывает права на них."]]}]}, {"n": 24, "title": "Итог: личная система", "goal": "Собрать результаты курса в личную систему жизни: ИИ-ассистент в помощь, жизнь как проект, операционная система недели и итоговый план на год.", "lessons": [{"t": "ИИ как личный ассистент", "min": 40, "why": "Нейросети ускоряют обучение, планирование и тексты. Но думать и отвечать за результат по-прежнему вам.", "pts": ["«Промты для жизни и карьеры»: готовые запросы для плана, обучения, писем, здоровья, финансов. Принцип хорошего запроса: **роль + контекст + задача + формат ответа**.", "Вячеслав Мустакимов («GPT менеджерам. 720 промптов»): работа с ИИ — цикл **план → структура → черновик → проверка**; ИИ — ассистент, а **ответственность за факты на человеке**.", "Связь с неделей 10 (Курпатов): сначала **своя версия**, потом ИИ — так вы учитесь, а не делегируете мышление.", "Проверяйте цифры, ссылки и факты; не вставляйте в чужие сервисы персональные данные и коммерческую тайну.", "Полезные роли ИИ в курсе: собеседник для разбора задания, генератор вариантов, критик текста, тренер для ролевой игры (возражения, трудный разговор)."], "fig": {"k": "flow", "a": ["Роль|«ты — опытный…»", "Контекст|кто я, что есть", "Задача|что нужно", "Формат|список, таблица, 200 слов", "Проверка|факты и своя версия"], "cap": "Анатомия хорошего запроса к ИИ."}, "src": ["prompts|готовые запросы: роль, контекст, задача, формат", "gpt720|цикл работы с GPT и ответственность за факты"], "ex": "Запрос: «Ты — тренер по продажам B2B. Я продаю настройку 1С для ИП, клиент говорит „дорого, фрилансер дешевле“. Сыграй клиента, задавай по одному возражению, после 5 реплик дай разбор моих ответов по шагам: присоединение, уточнение, аргумент, закрытие».", "err": ["Просить «напиши что-нибудь про…» без контекста и формата.", "Публиковать ответ ИИ без проверки фактов."], "qa": [["Из каких частей состоит хороший запрос?", "Роль, контекст, задача, формат."], ["Почему важно сначала сформулировать свою версию?", "Чтобы учиться и сохранять собственное мышление, а не только потреблять ответ."]], "task": "Составьте библиотеку из 7 своих запросов к ИИ для задач курса: план недели, разбор задания по рубрике, ролевая игра (продажа или трудный разговор), учебный план навыка, проверка текста, бюджет, разбор решения. Протестируйте три и улучшите по результатам.", "out": "7 запросов + отчёт о трёх тестах и правках.", "rub": [["Запросы по структуре", "роль, контекст, задача, формат"], ["Покрывают разные задачи", "7 разных"], ["Тесты проведены", "три"], ["Улучшения", "что изменили и почему"]], "sample": "Запрос «разбор задания»: «Ты — наставник курса. Вот задание, рубрика из 4 критериев и мой ответ. Оцени 0–2 по каждому, приведи цитату из ответа как основание, дай 2 правки и следующий шаг». Тест: оценки строгие, добавил «учти, что я новичок».", "deep": [{"h": "Анатомия запроса", "p": ["«Промты для жизни и карьеры» показывают готовые запросы для плана, обучения, писем, здоровья, финансов. Общая структура хорошего запроса: **роль** («ты — опытный…»), **контекст** (кто я, что есть), **задача** (что нужно), **формат** (список, таблица, объём), иногда — **критерии** и **примеры**. Чем больше контекста, тем полезнее ответ."]}, {"h": "Цикл работы с ИИ", "p": ["Мустакимов («GPT менеджерам. 720 промптов») описывает цикл: **план → структура → черновик → проверка**. ИИ ускоряет черновую работу, но ответственность за факты, цифры
