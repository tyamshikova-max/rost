 честности", "есть"], ["План честный", "опирается на реальные факты"]], "sample": "Наблюдение: маркетплейс «23 человека смотрят товар» — соц. доказательство + дефицит, манипулятивно. План: для курса собрать 5 реальных отзывов и ограничить группу 12 местами (реально — больше не проверю).", "deep": [{"h": "Автоматические реакции", "p": ["Чалдини («Психология влияния») начинает с «щёлк-зажжённых» реакций: в сложном мире мы используем короткие правила, и кто-то может запускать их в своих интересах. Он три года работал «под прикрытием» в продажах, рекламе, вербовке, чтобы изучить приёмы изнутри."]}, {"h": "Принципы влияния", "p": ["**Взаимный обмен**: мы чувствуем обязанность ответить на подарок; приём «отказ — затем отступление»: после отказа от большой просьбы соглашаются на меньшую. **Обязательство и последовательность**: маленькое публичное или письменное «да» ведёт к большому («нога в двери»). **Социальное доказательство**: смотрим, как поступают другие, особенно похожие на нас и в неопределённости. **Благорасположение**: охотнее соглашаемся с теми, кто нравится — похожими, хвалящими, знакомыми. **Авторитет**: подчиняемся символам власти — титулам, форме. **Дефицит**: ценим то, что ограничено или может быть потеряно. В новых изданиях добавлено **единство** — чувство общей идентичности («мы»)."]}, {"h": "Защита и честное применение", "p": ["Защита по Чалдини: заметить, что сработал принцип, и спросить себя — согласился бы я без этого фактора? Например, принимать подарок, но не чувствовать обязанности отвечать на уловку; замечать «внутренний спазм», когда тебя ведут к последовательности. Честное применение — опираться на реальные отзывы, настоящую экспертизу и реальный дефицит."]}], "steps": ["Три дня фиксируйте приёмы влияния вокруг: реклама, магазины, переписка.", "Для каждого случая назовите принцип.", "Оцените честность применения.", "Придумайте для себя правило защиты от 2 принципов, на которые чаще поддаётесь.", "Для своей задачи спланируйте честное применение 2–3 принципов.", "Через неделю проверьте, сколько импульсивных решений удалось избежать."], "check": ["Принципы определены верно.", "Есть правила защиты.", "Честное влияние опирается на правду.", "Я замечаю «внутренний спазм».", "Импульсивных покупок стало меньше."], "qa2": [["Что такое приём «отказ — затем отступление»?", "Сначала большая просьба, после отказа — меньшая; на неё соглашаются чаще."], ["Когда социальное доказательство действует сильнее?", "В неопределённости и когда другие похожи на нас."]]}, {"t": "Трудные разговоры и границы", "min": 45, "why": "Избегание трудных разговоров копит обиды; агрессия разрушает отношения. Нужен третий путь.", "pts": ["Кови (навык 4 и 5): ищите **«выиграл/выиграл»** и **сначала стремитесь понять, потом — быть понятым**; эмоциональный банковский счёт пополняется выполненными обещаниями и вниманием.", "Игорь Рызов («Психотрюки»): приёмы против хамства и давления — **«громкое молчание»**, **я-высказывание** («я злюсь, когда…»), **вопрос об истинных целях** («что вы хотите этим добиться?»), **возврат в роль** («давайте вернёмся к задаче»).", "Курпатов и Алёхин («Индивидуальные отношения»): эмпатия — понимание индивидуальности другого, а не согласие с ним; это профессиональная монография для углубления.", "Структура трудного разговора: факт → моё чувство → моя потребность → просьба (конкретная, выполнимая).", "Граница = **«нет» + забота о отношениях**: «Я не могу взять эту задачу до пятницы; могу помочь в понедельник»."], "fig": {"k": "flow", "a": ["Факт|без оценок", "Чувство|я-высказывание", "Потребность|что важно", "Просьба|конкретная"], "cap": "Четыре шага трудного разговора."}, "src": ["covey|навыки 4–5: выиграл/выиграл, сначала понять", "ryzov|приёмы против хамства и давления", "k_empathy|эмпатия как понимание индивидуальности"], "ex": "Факт: «Третью неделю отчёт отдела приходит в пятницу вечером». Чувство: «Я напрягаюсь, потому что работаю в выходные». Потребность: «Мне важно отдыхать». Просьба: «Можете присылать до 15:00 пятницы?»", "err": ["Начинать с обвинения («ты всегда…»).", "Говорить «да», а потом злиться."], "qa": [["Из каких шагов состоит трудный разговор?", "Факт, чувство, потребность, просьба."], ["Что такое «вопрос об истинных целях» у Рызова?", "Спросить собеседника, чего он хочет добиться своим поведением, — это выводит из эмоциональной атаки."]], "task": "Выберите отложенный трудный разговор. Подготовьте его по четырём шагам и два ответа на возможное давление (из «Психотрюков»). Проведите разговор и опишите результат.", "out": "Подготовка + итоги разговора.", "rub": [["Факт без оценок", "проверяемый"], ["Я-высказывание", "о своём чувстве"], ["Просьба конкретна", "что, когда"], ["Разговор проведён", "результат и выводы"]], "sample": "Разговор с соседом о шуме после 23:00. Факт: «В пятницу и субботу музыка до часа ночи». Чувство: устаю. Просьба: «Тише после 23:00». Давление: «А вы что, не молодые?» — громкое молчание, затем возврат к просьбе. Договорились.", "deep": [{"h": "Выиграл/выиграл и сначала понять", "p": ["Кови (навык 4) предлагает искать решение «выиграл/выиграл» или не договариваться вовсе; основа — **эмоциональный банковский счёт**: доверие пополняется выполненными обещаниями, вниманием, извинениями и тратится нарушениями. Навык 5 — «сначала стремитесь понять, потом — быть понятым»: эмпатическое слушание, когда вы пересказываете не только слова, но и чувства собеседника."]}, {"h": "Психотрюки Рызова", "p": ["Рызов собрал приёмы для трудных ситуаций. **«Да, я такой»** — согласиться с нападкой и обесценить её. **«Громкое молчание»** — выдержать паузу после грубости. **Я-высказывание** — говорить о своём чувстве и потребности, а не обвинять. **Вопрос об истинных целях** — «Чего вы хотите этим добиться?» — выводит из эмоциональной атаки. **Возврат в роль** — «Давайте вернёмся к задаче». **Цепляться за слова** — уточнять расплывчатые обвинения."]}, {"h": "Эмпатия без согласия", "p": ["Курпатов и Алёхин («Индивидуальные отношения») описывают эмпатию как понимание индивидуальности другого человека, а не согласие с ним. Это профессиональная монография для углубления, но вывод практичен: понять позицию собеседника — не значит её принять, а значит говорить с человеком, а не с собственной проекцией."]}], "steps": ["Выберите отложенный трудный разговор.", "Подготовьте по схеме: факт без оценок → моё чувство → моя потребность → конкретная просьба.", "Подготовьте вопрос, чтобы понять позицию собеседника.", "Подберите 2 ответа на возможное давление.", "Проведите разговор: сначала выслушать и пересказать, потом говорить.", "Запишите итог и договорённости."], "check": ["Факт без оценок.", "Говорю о своём чувстве, не обвиняю.", "Просьба конкретная.", "Сначала понял(а) собеседника.", "Договорённость записана."], "qa2": [["Что такое эмпатическое слушание у Кови?", "Пересказ не только слов, но и чувств собеседника, чтобы понять его изнутри."], ["Как работает вопрос об истинных целях?", "Он переводит собеседника из эмоции в размышление о цели и снижает атаку."]]}, {"t": "Язык тела и признаки лжи", "min": 40, "why": "Слова — малая часть сообщения. Но язык тела легко прочитать неверно — нужны и наблюдательность, и осторожность.", "pts": ["Курпатов («7 этажей взаимопонимания»): невербальные сигналы — **дистанция** (личное пространство), **открытые и закрытые позы**, рукопожатие, касания лица, взгляд, мышечное напряжение.", "Правило интерпретации: смотреть на **группу сигналов** и **изменения** от обычного поведения человека, а не на один жест.", "Пол Экман («Психология лжи»): ложь выдают **утечки** — в словах (оговорки), голосе, жестах и мимике; **микровыражения** длятся доли секунды.", "Экман предупреждает об **ошибке Отелло**: волнение честного человека, которого подозревают, легко принять за признак лжи. Нет одного «жеста лжеца».", "Практическая ценность: замечать несоответствие слов и тела — повод **задать вопрос**, а не вынести приговор."], "fig": {"k": "cols", "cols": [{"h": "Наблюдаем", "items": ["группа сигналов", "изменение от нормы", "контекст"]}, {"h": "Не делаем", "items": ["вывод по одному жесту", "путать волнение с ложью", "обвинять без фактов"]}], "cap": "Осторожное чтение невербального поведения."}, "src": ["k_7floors|дистанция, позы, жесты, взгляд", "ekman|утечки, микровыражения, ошибка Отелло"], "ex": "На переговорах клиент говорит «всё устраивает», но откидывается назад, скрещивает руки и смотрит в телефон — изменение по сравнению с началом встречи. Вопрос: «Мне кажется, что-то в условиях вызывает сомнение. Что именно?» — всплыло возражение по срокам.", "err": ["Считать скрещённые руки доказательством закрытости (человеку может быть холодно).", "Обвинять во лжи на основании волнения."], "qa": [["Что такое ошибка Отелло?", "Принять волнение честного человека, которого подозревают, за признак лжи."], ["Почему важно смотреть на изменения?", "У каждого своя норма поведения; значим сдвиг от неё, а не жест сам по себе."]], "task": "Три разговора наблюдайте за невербальными сигналами собеседника: норма в начале, изменения, несоответствие словам. В одном случае задайте уточняющий вопрос при несоответствии и опишите, что выяснилось.", "out": "Три наблюдения + разбор одного уточняющего вопроса.", "rub": [["Норма зафиксирована", "до изменений"], ["Изменения описаны", "группа сигналов"], ["Без поспешных выводов", "есть альтернативные объяснения"], ["Вопрос задан", "результат"]], "sample": "Разговор с подчинённым о сроках: норма — свободная поза; при вопросе о дедлайне — взгляд вниз, касание шеи, пауза. Вопрос: «Что может помешать уложиться?» — оказалось, ждёт данных от смежников.", "deep": [{"h": "Невербальные сигналы", "p": ["Курпатов («7 этажей взаимопонимания») описывает «этажи» невербального общения: **дистанция** (интимная, личная, социальная, публичная зоны), **позы** (открытые и закрытые), **рукопожатие** и борьба за лидерство, **касания лица**, **взгляд**, **мышечное напряжение**. Его правила: смотреть на группу сигналов и на изменения по сравнению с обычным поведением человека, учитывать контекст."]}, {"h": "Признаки обмана по Экману", "p": ["Экман («Психология лжи») изучал, как выдаёт себя ложь: **утечки** — в словах (оговорки, уклончивость), в голосе (повышение тона, паузы), в жестах (эмблемы, иллюстраторы), в вегетативных реакциях и в мимике. **Микровыражения** длятся доли секунды и показывают скрытую эмоцию. Лгущий может испытывать страх разоблачения, вину или «восторг надувательства»."]}, {"h": "Ошибки интерпретации", "p": ["Экман предупреждает об **ошибке Отелло** — принять волнение честного человека, которого подозревают, за признак лжи, — и об **ошибке Брокау** — не учитывать индивидуальные особенности поведения. Не существует одного «жеста лжеца». Несоответствие слов и тела — повод задать уточняющий вопрос, а не вынести приговор."]}], "steps": ["В начале разговора отметьте «норму» поведения собеседника.", "Замечайте изменения: группы сигналов, а не отдельные жесты.", "Сравнивайте с тем, что говорится.", "При несоответствии задайте открытый уточняющий вопрос.", "Рассмотрите альтернативные объяснения (холодно, устал, волнуется).", "Запишите, что выяснилось."], "check": ["Норма зафиксирована.", "Смотрю на группы сигналов.", "Не делаю выводов по одному жесту.", "Задаю вопрос, а не обвиняю.", "Учитываю контекст."], "qa2": [["Что такое микровыражение?", "Мимолётное выражение лица длительностью доли секунды, выдающее скрытую эмоцию."], ["Что такое ошибка Брокау?", "Игнорирование индивидуальных особенностей поведения человека при поиске признаков лжи."]]}]}, {"n": 16, "title": "Отношения и семья", "goal": "Понимать различия в паре, проходить кризисы отношений, строить близость и отношения с родителями и детьми.", "lessons": [{"t": "Мужчина и женщина: понимание вместо обвинений", "min": 40, "why": "Многие конфликты в паре — не злой умысел, а разные ожидания и способы говорить.", "pts": ["Курпатов («Мужчина и женщина»): эволюционные различия создают разные ожидания; многие разочарования рождаются из попытки сделать партнёра «таким, как я».", "Курпатов («3 главных вопроса. Семейное счастье»): **первый год брака** — время адаптации; **кривая адаптации** и бытовые конфликты нормальны; счастье семьи — навык договариваться.", "Курпатов («Главные вопросы жизни»): одиночество и выбор, уровни развития личности, **близость и страсть — разные вещи**; брак держится на близости, страсть меняется.", "Курпатов и Абдуллаева («11 интимных вопросов»): разрушение стереотипов о «правильных» отношениях, разговор на разных языках.", "Практика: говорить о **ожиданиях** явно — кто что делает, как проводим время, как решаем конфликты."], "fig": {"k": "curve", "pts": [[0, 9], [15, 7], [35, 4], [55, 5.5], [75, 7], [100, 7.5]], "marks": [[0, "влюблённость"], [35, "кризис адаптации"], [100, "зрелая близость"]], "xl": "время отношений", "yl": "удовлетворённость", "cap": "Кривая адаптации: спад после влюблённости нормален; дальше — работа и договорённости."}, "src": ["k_manwoman|различия ожиданий и понимание", "k_family|первый год брака и кривая адаптации", "k_mainq|близость и страсть, уровни развития личности", "k_sexcity|стереотипы и разные языки в отношениях"], "ex": "Жена хочет обсудить проблему, муж сразу даёт решение — оба раздражены. Договорились: «Сначала скажи, нужен совет или просто выслушать». Ссор из-за этого стало заметно меньше.", "err": ["Ожидать, что партнёр «должен догадаться».", "Считать спад влюблённости концом любви."], "qa": [["Чем близость отличается от страсти по Курпатову?", "Страсть — яркое, но изменчивое влечение; близость — доверие и совместность, которые строятся со временем."], ["Что такое кривая адаптации?", "Естественный спад удовлетворённости после первого периода, который проходят через договорённости."]], "task": "Составьте с партнёром (или для себя, если сейчас без пары) список ожиданий в 6 областях: быт, деньги, время вместе, время отдельно, конфликты, близость. Сравните, найдите 2 расхождения и договоритесь о правилах.", "out": "Список ожиданий, два расхождения, две договорённости.", "rub": [["Области охвачены", "все шесть"], ["Ожидания конкретны", "поведение, а не «уважение»"], ["Расхождения найдены", "честно"], ["Договорённости проверяемы", "что и как"]], "sample": "Расхождение: время отдельно — мне нужен вечер в неделю для себя, партнёр воспринимал это как отдаление. Договорённость: четверг — «свободный вечер» у каждого по очереди.", "deep": [{"h": "Разные ожидания", "p": ["Курпатов («Мужчина и женщина») объясняет многие конфликты эволюционными различиями ожиданий: партнёры по-разному понимают заботу, близость, безопасность. Ошибка — пытаться сделать партнёра «таким, как я». Понимание различий снимает обвинения: дело не в злом умысле, а в разных «языках»."]}, {"h": "Первый год и кривая адаптации", "p": ["В «3 главных вопросах. Семейное счастье» он описывает **кривую адаптации**: после влюблённости удовлетворённость естественно снижается, затем пара либо договаривается и выходит на зрелую близость, либо застревает в конфликтах. Бытовые ссоры первого года — нормальная часть адаптации; счастье семьи — навык договариваться."]}, {"h": "Близость и страсть", "p": ["В «Главных вопросах жизни» Курпатов разводит **близость** (доверие, совместность, растущие со временем) и **страсть** (яркое, но изменчивое влечение). Брак держится на близости. В «11 интимных вопросах» (с Абдуллаевой) разбираются стереотипы о «правильных» отношениях и то, что партнёры часто говорят на разных языках."]}], "steps": ["Каждый партнёр пишет свои ожидания по 6 областям: быт, деньги, время вместе, время отдельно, конфликты, близость.", "Сравните списки спокойно, без оценок.", "Найдите 2 главных расхождения.", "Для каждого договоритесь о правиле.", "Назначьте дату проверки через месяц.", "Введите регулярный «разговор о нас» раз в неделю."], "check": ["Ожидания конкретны — поведение.", "Сравнение без обвинений.", "Договорённости проверяемы.", "Есть дата проверки.", "Регулярный разговор назначен."], "qa2": [["Почему спад после влюблённости нормален?", "Это естественная стадия кривой адаптации; дальше нужна работа и договорённости."], ["Чем близость отличается от страсти?", "Близость — доверие и совместность, растущие со временем; страсть — изменчивое влечение."]]}, {"t": "Близость и сексуальность", "min": 35, "why": "Сексуальность — часть отношений, о которой говорят меньше всего, хотя проблем в ней много. Знание снимает страхи и мифы.", "pts": ["Курпатов («Наука о сексе», ч. 1): сексуальность развивается с детства, имеет критические периоды; многие «нормы» — мифы сексуальной революции.", "Курпатов («Наука о сексе», ч. 2): многие сексуальные трудности — следствие **страха и ожидания неудачи**, а не физиологии; физиология возбуждения и разница реакций у мужчин и женщин.", "Курпатов: при стойких трудностях — сначала врач (исключить телесные причины), затем психотерапевт.", "Нил Штраус («Сердце вне игры»): автобиографическая история о зависимости от отношений и травмах детства; **близость требует честности** и работы над собой, а не техник соблазнения.", "Главный инструмент — **разговор**: о желаниях, границах, страхах — в спокойной обстановке, а не в момент конфликта."], "fig": {"k": "flow", "a": ["Страх неудачи", "Напряжение", "Трудность", "Ещё больше страха", "Разговор и знание|круг разорван"], "cap": "Многие трудности держатся на круге тревоги ожидания."}, "src": ["k_sex1|развитие сексуальности и мифы", "k_sex2|страх неудачи, физиология возбуждения", "strauss|близость, честность и работа над собой"], "ex": "Пара годами избегала темы. Договорились раз в месяц на прогулке говорить о том, что нравится и чего хочется. Через три месяца оба отметили, что напряжения стало меньше.", "err": ["Искать «технику» вместо разговора о чувствах.", "Молчать о трудностях из стыда."], "qa": [["Что часто поддерживает сексуальные трудности?", "Тревога ожидания неудачи."], ["Когда нужно идти к врачу?", "При стойких трудностях — сначала исключить телесные причины."]], "task": "Подготовьте спокойный разговор о близости (или, если пары нет, напишите для себя: что для меня близость, какие у меня страхи и границы). Сформулируйте 3 вопроса, которые хотите обсудить, и правила разговора (без упрёков, время, место).", "out": "Правила разговора, 3 вопроса, (по желанию) итог. Личные подробности не обязательны.", "rub": [["Правила безопасны", "без упрёков, время, место"], ["Вопросы открытые", "о желаниях и чувствах"], ["Учтены границы", "обоих"], ["Есть рефлексия", "что узнали"]], "sample": "Правила: воскресенье, прогулка, без телефонов, без «ты всегда». Вопросы: «Когда ты чувствуешь себя ближе ко мне?», «Чего тебе не хватает?», «Что тебя смущает?»", "deep": [{"h": "Сексуальность без мифов", "p": ["Курпатов («Наука о сексе», ч. 1) описывает развитие сексуальности с детства, критические периоды и формирование «объекта влечения», разбирает мифы сексуальной революции о «нормах». Во второй части — сексуальные комплексы и трудности: многие из них держатся на **страхе неудачи** и тревоге ожидания, а не на физиологии."]}, {"h": "Когда к врачу", "p": ["Курпатов настаивает: при стойких трудностях сначала исключить телесные причины у врача (уролог, гинеколог, эндокринолог), затем при необходимости работать с психотерапевтом. Самолечение и «техники» без разговора о чувствах редко помогают."]}, {"h": "Честность и близость", "p": ["Нил Штраус («Сердце вне игры»), автор книги о соблазнении, описывает, как оказался в клинике из-за зависимости от отношений и как травмы детства мешали близости. Его вывод: близость требует честности, уязвимости и работы над собой, а не техник. Главный инструмент пары — спокойный разговор о желаниях, границах и страхах."]}], "steps": ["Выберите спокойное время и место для разговора, не в момент конфликта.", "Договоритесь о правилах: без упрёков, слушать до конца.", "Подготовьте 3 открытых вопроса о чувствах и желаниях.", "Говорите о себе: «мне нравится», «мне хочется», «я стесняюсь».", "Если есть стойкие трудности — запишитесь к врачу.", "Повторяйте разговор регулярно."], "check": ["Разговор в безопасной обстановке.", "Без упрёков и сравнений.", "Вопросы открытые.", "Границы обоих учтены.", "Телесные причины исключены при необходимости."], "qa2": [["Что часто поддерживает сексуальные трудности?", "Тревога ожидания неудачи."], ["Какой вывод делает Штраус?", "Близость требует честности и работы над собой, а не техник."]]}, {"t": "Одиночество и выбор партнёра", "min": 40, "why": "Одиночество — не только отсутствие пары, а нехватка близости. Выбор партнёра часто повторяет старые сценарии.", "pts": ["Курпатов и Девятова («5 наболевших вопросов»): **одиночество среди людей**; близость и страсть — разные вещи; поиск партнёра «по критериям» часто ведёт мимо реальной совместимости.", "Курпатов («Советы доктора», выпуски 1–6 и 7–12): разбор реальных писем — безответная любовь, измены, страх новых отношений, гражданский брак, «он не говорит, что любит». Общий вывод: начинать с себя и честных разговоров.", "Ксения Асаулюк («Женское искусство вдохновлять»): сначала — ответственность за свою жизнь, самооценка и энергия, любовь к себе; затем — отношения с окружающими.", "Повторяющиеся сценарии: если все партнёры «одинаковые», вопрос в том, **что вас привлекает** и почему.", "Окружение и активность: близкие отношения чаще рождаются в регулярных совместных занятиях, а не в разовых знакомствах."], "fig": {"k": "cols", "cols": [{"h": "Сценарий", "items": ["кого выбираю", "что повторяется", "чем заканчивается"]}, {"h": "Корень", "items": ["что меня привлекает", "что я получаю", "чего боюсь"]}, {"h": "Новое", "items": ["что ценю на самом деле", "где встречать людей", "как проверять совместимость"]}], "cap": "Разбор повторяющегося сценария отношений."}, "src": ["k_psycity|одиночество среди людей, близость и страсть", "k_advice1|разбор писем о любви и изменах", "k_advice2|страх новых отношений и выбор спутника", "asaulyuk|любовь к себе как основа отношений"], "ex": "Три раза подряд — отношения с эмоционально холодными партнёрами. Корень: привлекает «загадка», знакомо по отцу. Новое: обращать внимание на тех, кто проявляет интерес и надёжен; встречаться в клубе походов.", "err": ["Искать партнёра по списку внешних критериев.", "Ждать, что новый партнёр «исправит» одиночество, не разобравшись с собой."], "qa": [["Что такое одиночество среди людей?", "Нехватка близости при наличии окружения."], ["Где чаще рождаются близкие отношения?", "В регулярных совместных занятиях и сообществах."]], "task": "Проанализируйте 2–3 значимых отношения (романтических или дружеских) по схеме «сценарий — корень — новое». Выберите одно сообщество или регулярное занятие, где можно встречать людей, и сходите туда дважды.", "out": "Разбор по схеме + описание двух посещений.", "rub": [["Сценарий выявлен", "общие черты"], ["Корень осмыслен", "без самобичевания"], ["Новое конкретно", "ценности и критерии"], ["Действие выполнено", "два посещения"]], "sample": "Сценарий: дружу с теми, кто постоянно просит помощи. Корень: чувствую себя нужной. Новое: дружба на равных. Действие: книжный клуб в библиотеке — 2 встречи, познакомилась с двумя женщинами.", "deep": [{"h": "Одиночество среди людей", "p": ["Курпатов и Девятова («5 наболевших вопросов») различают одиночество как отсутствие людей и как отсутствие **близости** при насыщенном окружении. Второе часто связано с поиском партнёра «по критериям»: внешние признаки не говорят о совместимости. Близость рождается в совместной деятельности и честности."]}, {"h": "Разбор реальных историй", "p": ["«Советы доктора» (выпуски 1–6 и 7–12) — ответы Курпатова на письма: безответная любовь, измены, страх новых отношений, гражданский брак, «он не говорит, что любит». Общий вывод из многих ответов — начинать с себя: понять, что вы на самом деле ищете, и честно говорить об этом."]}, {"h": "Начать с себя", "p": ["Асаулюк («Женское искусство вдохновлять») строит книгу от себя к отношениям: ответственность за свою жизнь, благодарность, самооценка, энергия и любовь к себе — потом окружение. Если все партнёры «одинаковые», стоит спросить: что меня в них привлекает и что я получаю от этого сценария?"]}], "steps": ["Выберите 2–3 значимых отношения в прошлом.", "Опишите повторяющийся сценарий: кого выбираю, что происходит, чем заканчивается.", "Найдите корень: что привлекает, чего боюсь.", "Сформулируйте, что вы цените на самом деле.", "Выберите регулярное занятие или сообщество для знакомств.", "Сходите туда минимум дважды."], "check": ["Сценарий описан честно.", "Корень назван без самобичевания.", "Ценности сформулированы.", "Есть регулярное сообщество.", "Действие выполнено."], "qa2": [["Почему поиск по внешним критериям часто не работает?", "Внешние признаки не говорят о совместимости и способности к близости."], ["Где чаще рождаются близкие отношения?", "В регулярной совместной деятельности и сообществах."]]}, {"t": "Родители и дети", "min": 40, "why": "Отношения с родителями определяют многое во взрослой жизни, а с детьми — их будущее. Здесь нужны и понимание, и границы.", "pts": ["Курпатов («Исправь своё детство»): **три ошибки родителей** — беззащитность, нелюбовь, вина — оставляют следы: тревогу, неуверенность, зависимость от одобрения. Взрослый может осознать это и выстроить свои правила.", "Курпатов («Счастливый ребёнок»): ребёнку нужны среда, ритм и пример; «объяснять бесполезно», пока мозг не созрел для этого.", "Робин Шарма («Уроки семейной мудрости», в «Большой книге лидера»): присутствие вместо подарков, время вместе, благодарность, личный пример; семья — тоже «команда», которой нужен лидер.", "Курпатов и Девятова («5 наболевших вопросов»): отцы и дети разных поколений живут в разных мирах; **авторитет** сегодня строится на уважении и интересе, а не на статусе.", "Взрослые отношения с родителями: благодарность за хорошее, **границы** там, где больно, и отказ от ожидания, что родители изменятся."], "fig": {"k": "cols", "cols": [{"h": "С родителями", "items": ["благодарность", "границы", "принятие, что они не изменятся"]}, {"h": "С детьми", "items": ["присутствие", "ритм и пример", "уважение и интерес"]}], "cap": "Две стороны семейных отношений взрослого человека."}, "src": ["k_childhood|три ошибки родителей и их следы", "k_child|среда, ритм и пример", "sharma_lead|уроки семейной мудрости: присутствие и пример", "k_psycity|отцы и дети разных поколений"], "ex": "Мама критикует каждый звонок. Граница: «Мам, я рада говорить с тобой, но если разговор переходит на мой вес, я заканчиваю звонок». Благодарность: раз в неделю говорю, за что ценю её. Звонки стали короче и теплее.", "err": ["Требовать от пожилых родителей «признать ошибки».", "Заменять время с детьми подарками и гаджетами."], "qa": [["Какие три ошибки родителей называет Курпатов?", "Беззащитность, нелюбовь, вина."], ["Что Шарма считает главным в семье?", "Присутствие, время вместе, благодарность и личный пример."]], "task": "Напишите (не отправляя) письмо родителям: за что благодарны, что было трудно, какие границы вам нужны сейчас. Сформулируйте одну границу и одно действие благодарности. Если есть дети — запланируйте еженедельное «время только с ребёнком» на месяц.", "out": "Письмо (для себя), граница, действие благодарности, план времени с детьми.", "rub": [["Благодарность конкретна", "события и черты"], ["Трудное названо", "без обвинений"], ["Граница сформулирована", "что делаю, если нарушена"], ["Есть действие", "благодарность или время с детьми"]], "sample": "Граница: «Не обсуждаю воспитание внуков в их присутствии». Благодарность: каждое воскресенье звонок папе с вопросом о его саде. Время с сыном: суббота 10–12, его выбор занятия.", "deep": [{"h": "Следы детства", "p": ["Курпатов («Исправь своё детство») описывает, как беззащитность, нелюбовь и вина детства превращаются во взрослую тревогу, неуверенность и зависимость от одобрения. Взрослый может осознать эти механизмы и выстроить новые правила, не требуя от родителей «признать ошибки» — пожилые родители редко меняются."]}, {"h": "Отцы и дети разных эпох", "p": ["Курпатов и Девятова («5 наболевших вопросов») показывают разрыв поколений: родители и дети живут в разных мирах и по-разному понимают успех, работу, отношения. Авторитет сегодня строится не на статусе, а на уважении и интересе к миру ребёнка."]}, {"h": "Семейная мудрость", "p": ["Шарма («Уроки семейной мудрости», в «Большой книге лидера») говорит о присутствии вместо подарков, о времени вместе, благодарности и личном примере; семья — команда, которой нужен лидер, служащий остальным. Курпатов («Счастливый ребёнок») добавляет про детей: среда, ритм и пример важнее объяснений."]}], "steps": ["Напишите письмо родителям (для себя): благодарность, трудное, нужные границы.", "Сформулируйте одну границу и что вы делаете, если её нарушают.", "Выберите регулярное действие благодарности родителям.", "Если есть дети — назначьте еженедельное время только с ребёнком на месяц.", "Ребёнок выбирает занятие сам.", "Через месяц отметьте изменения в отношениях."], "check": ["Благодарность конкретна.", "Граница спокойная и ясная.", "Я не требую от родителей измениться.", "Время с ребёнком регулярно.", "Экран не заменяет общение."], "qa2": [["Почему не стоит требовать от пожилых родителей признать ошибки?", "Они редко меняются; важнее выстроить свои правила и границы."], ["На чём строится авторитет родителя сегодня?", "На уважении и интересе к миру ребёнка, а не на статусе."]]}]}, {"n": 17, "title": "Творчество", "goal": "Сделать творчество ежедневной практикой, научиться рождать идеи из влияний и показывать свою работу миру.", "lessons": [{"t": "Творчество как ежедневная практика", "min": 40, "why": "Вдохновение приходит к тем, кто уже работает. Творческая жизнь держится на ритуале, а не на озарениях.", "pts": ["Джулия Кэмерон («Путь художника»): **утренние страницы** — три страницы потока сознания от руки каждое утро — и **свидание с художником** — еженедельное время наедине с собой ради впечатлений. 12-недельный курс восстановления творчества.", "Твайла Тарп («Привычка к творчеству»): творчество — **привычка и ритуал начала**; у каждого проекта есть «коробка», куда складываются идеи, вырезки, наброски.", "Остин Клеон («Просто продолжай»): каждый день — «день сурка»: расписание и список дел, **оазис** без отвлечений, процесс важнее результата; когда застрял — наведи порядок и погуляй.", "Стивен Прессфилд («Война за креатив»): **Сопротивление** сильнее всего перед важной творческой работой; побеждает профессионал, который приходит каждый день.", "Формула: **фиксированное время + место + ритуал входа + маленькая ежедневная норма**."], "fig": {"k": "flow", "a": ["Ритуал входа|одинаковое начало", "Норма дня|страницы, наброски", "Коробка проекта|копить материал", "Свидание с художником|раз в неделю"], "cap": "Каркас творческой практики по Кэмерон и Тарп."}, "src": ["cameron|утренние страницы и свидание с художником", "tharp|ритуал и коробка проекта", "kleon3|«день сурка», оазис, процесс", "pressfield|Сопротивление и профессионал"], "ex": "Ритуал: 6:30, кухня, чашка чая, три страницы от руки. Норма: 300 слов рассказа. Коробка проекта: папка с фото, заметками и цитатами. Свидание: суббота, 2 часа в музее одному.", "err": ["Ждать «настроения» для работы.", "Перечитывать утренние страницы и редактировать их."], "qa": [["Что такое утренние страницы?", "Три страницы потока сознания от руки каждое утро без редактирования."], ["Зачем Тарп «коробка» проекта?", "Копить материал и идеи, чтобы не начинать с пустоты."]], "task": "Две недели пишите утренние страницы. Определите своё творческое дело (текст, рисунок, музыка, фото, проект) и ежедневную норму. Проведите одно «свидание с художником». Заведите коробку проекта.", "out": "Отметки 14 дней, норма и сколько сделано, описание свидания, содержимое коробки.", "rub": [["Регулярность", "12+ из 14 дней"], ["Норма маленькая и ежедневная", "выполнима"], ["Свидание проведено", "впечатления"], ["Коробка заведена", "10+ материалов"]], "sample": "Страницы: 13 из 14. Норма: 1 скетч в день — 14 скетчей. Свидание: ботанический сад, 40 зарисовок листьев. Коробка: 23 фото, 6 цитат, 4 идеи сюжета.", "deep": [{"h": "Утренние страницы и свидания с художником", "p": ["Кэмерон («Путь художника») строит 12-недельный курс на двух инструментах. **Утренние страницы** — три страницы от руки каждое утро, поток сознания без редактирования и перечитывания; они «сливают» тревоги и внутреннего критика и освобождают место для творчества. **Свидание с художником** — еженедельные 1–2 часа наедине с собой ради впечатлений: музей, прогулка, магазин тканей. Это «пополнение колодца» образов.", "Каждая неделя курса посвящена восстановлению чего-то: безопасности, идентичности, силы, честности, возможностей, изобилия, связи, силы, сострадания, самозащиты, автономии, веры."]}, {"h": "Ритуал и коробка", "p": ["Тарп («Привычка к творчеству»), хореограф, начинает каждый день с ритуала: в 5:30 садится в такси до спортзала — решение принято, остальное следует само. Ритуал снимает вопрос «работать ли сегодня». Для каждого проекта у неё **коробка**: туда складываются вырезки, заметки, видео, книги — материал, к которому можно вернуться. Она также советует «раскопки» в памяти и использование ограничений как топлива."]}, {"h": "Профессионал против Сопротивления", "p": ["Клеон («Просто продолжай») советует жить как в «Дне сурка»: каждый день похож на предыдущий — расписание, список дел, работа. Создайте **оазис** без отвлечений; процесс важнее результата; когда застряли — наведите порядок на столе и погуляйте. Прессфилд («Война за креатив») добавляет: Сопротивление побеждает **профессионал** — тот, кто приходит работать каждый день, не дожидаясь вдохновения, и не отождествляет себя с результатом."]}], "steps": ["Выберите творческое дело и ежедневную норму (маленькую).", "Определите ритуал входа: время, место, первое действие.", "Пишите утренние страницы 14 дней.", "Запланируйте свидание с художником на эту неделю.", "Заведите коробку проекта и складывайте туда материалы.", "Отмечайте выполнение нормы, не оценивая качество."], "check": ["Норма ежедневная и посильная.", "Есть ритуал входа.", "Утренние страницы не перечитываю и не правлю.", "Свидание с художником состоялось.", "Коробка проекта пополняется."], "qa2": [["Зачем нужны свидания с художником?", "Чтобы пополнять «колодец» образов и впечатлений, из которого берётся творчество."], ["Что даёт ритуал Тарп?", "Снимает ежедневное решение «работать ли» — ритуал запускает работу сам."]]}, {"t": "Кради как художник: идеи из влияний", "min": 40, "why": "Оригинальность — это не создание из пустоты, а новая комбинация. Кто много впитывает, тот много создаёт.", "pts": ["Остин Клеон («Кради как художник»): ничто не рождается из ничего; **копируйте героев**, чтобы понять, как они думают, и смешивайте влияния, пока не появится своё. Воруйте **у многих**, а не у одного.", "Клеон: пишите книгу, которую хотели бы прочитать сами; работайте руками; держите побочные проекты; будьте скучным в быту, чтобы быть смелым в работе.", "Тина Силиг («Креатив по правилам»): **цикл изобретения** — воображение → творчество → инновации → предпринимательство; увлечённость, умение предвидеть, мотивация, эксперименты, фокус, упорство.", "Марина Москвина («Учись видеть»): творчество начинается с **внимания к детали** и живого взгляда — смотреть, удивляться, записывать, не бояться простоты.", "Практика: **дерево влияний** — 5 «учителей», что взять у каждого, как это смешать."], "fig": {"k": "hub", "c": "Моё", "a": ["Учитель 1|приём", "Учитель 2|интонация", "Учитель 3|структура", "Жизненный опыт", "Другая область", "Ограничение"], "cap": "Дерево влияний: новое рождается на пересечении."}, "src": ["kleon1|копировать и смешивать влияния", "seelig|цикл изобретения", "moskvina|внимание к детали и живой взгляд"], "ex": "Хочу вести блог о финансах. Влияния: ясность Тинькофф Журнала, юмор Мэнсона, истории Гладуэлла, графики из учебника экономики, мой опыт бухгалтера. Смесь: «финансовые истории с графиком и шуткой».", "err": ["Копировать одного автора — это подражание, а не стиль.", "Ждать «своего голоса» до начала работы."], "qa": [["Чем «кража» художника отличается от плагиата?", "Художник изучает многих, понимает, как они думают, и создаёт новую комбинацию; плагиат копирует одного без переработки."], ["Какие этапы цикла изобретения у Силиг?", "Воображение, творчество, инновации, предпринимательство."]], "task": "Составьте дерево влияний для своего творческого или рабочего проекта: 5 источников, что берёте у каждого, одно ограничение (формат, срок, материал). Создайте небольшую работу на этом пересечении.", "out": "Дерево влияний + описание работы и что получилось нового.", "rub": [["Влияния разнообразны", "из разных областей"], ["Указано, что берёте", "конкретный приём"], ["Ограничение задано", "помогает выбору"], ["Работа создана", "есть результат"]], "sample": "Проект: открытки. Влияния: японская гравюра (линия), советский плакат (цвет), детские рисунки дочери (наивность), архитектура города, моё фото. Ограничение: 2 цвета. Результат: серия из 5 открыток.", "deep": [{"h": "Нет ничего оригинального", "p": ["Клеон («Кради как художник») утверждает: каждое новое произведение — смесь влияний. Различие между «хорошей» и «плохой» кражей: изучать, а не просто брать; воровать у многих, а не у одного; отдавать должное; преобразовывать, а не копировать. Начинайте с копирования героев — чтобы понять, как они думают, — пока не появится свой голос.", "Его правила: пишите книгу, которую хотели бы прочитать; работайте руками; побочные проекты важны; будьте скучным в быту (режим, финансовая стабильность), чтобы быть смелым в работе; ограничения помогают творить."]}, {"h": "Цикл изобретения", "p": ["Силиг («Креатив по правилам»), преподаватель Стэнфорда, описывает цикл: **воображение** (представлять то, чего нет) → **творчество** (применять воображение к задаче) → **инновации** (создавать уникальные решения) → **предпринимательство** (воплощать и вдохновлять других). Каждый этап опирается на установки: увлечённость, умение предвидеть, мотивацию, эксперименты, фокус, упорство."]}, {"h": "Учиться видеть", "p": ["Москвина («Учись видеть») учит литературному творчеству через внимание: замечать необычную деталь, удивляться, записывать, не бояться простоты и личной интонации. «Золотое» и «железное» правила ремесла у неё — про честность взгляда и ежедневную работу."]}], "steps": ["Составьте «дерево влияний»: 5 авторов или мастеров.", "Для каждого запишите конкретный приём, который берёте.", "Добавьте влияние из совсем другой области.", "Задайте ограничение: формат, срок, материал.", "Создайте небольшую работу на пересечении.", "Запишите, что получилось своего."], "check": ["Влияния из разных источников.", "Приёмы конкретны.", "Есть ограничение.", "Работа создана.", "Я отдаю должное источникам."], "qa2": [["Чем «хорошая кража» отличается от плохой у Клеона?", "Изучать, а не брать; у многих, а не у одного; преобразовывать и отдавать должное."], ["Почему ограничения помогают творить?", "Они сужают выбор и заставляют искать нестандартные решения."]]}, {"t": "Покажи свою работу: платформа и личный бренд", "min": 40, "why": "Работа, которую никто не видит, не приносит ни отклика, ни возможностей. Делиться — тоже навык.", "pts": ["Клеон («Покажи свою работу»): делитесь **процессом**, а не только результатом; **маленький шаг в день**; рассказывайте историю работы; учите тому, что знаете.", "Майкл Хайятт («Платформа»): платформа = продукт, вызывающий восторг, + аудитория; «домашняя база» (блог/сайт) и аванпосты (соцсети); работа с подписчиками.", "Том Питерс («Преврати себя в бренд»): каждый — **«компания из одного человека»**; бренд строят проекты-«вау», репутация и сеть контактов.", "Роман Масленников («СуперБлог», «СуперКнига»): практичные приёмы продвижения блога (комментирование, авторитетные друзья, марафоны) и книги (до выхода, вручения, рецензии, веб-представительство).", "Принцип щедрости: давайте ценность постоянно, просите редко."], "fig": {"k": "hub", "c": "Платформа", "a": ["Домашняя база|блог, сайт", "Соцсети", "Рассылка", "Выступления", "Партнёры", "Проекты-«вау»"], "cap": "Платформа по Хайятту: база + аванпосты."}, "src": ["kleon2|делиться процессом и учить", "hyatt|платформа: продукт + аудитория", "peters|компания из одного человека", "maslen_blog|приёмы раскрутки блога", "maslen_book|19 приёмов продвижения книги"], "ex": "Фотограф: раз в день — один кадр и короткая история, как он сделан (процесс). Раз в неделю — разбор ошибок подписчиков (учит). Через 3 месяца — 1200 подписчиков и 4 заказа на съёмку.", "err": ["Показывать только идеальные финальные работы — нет истории и связи.", "Постоянно продавать вместо того, чтобы давать."], "qa": [["Что Хайятт называет домашней базой?", "Собственную площадку — блог или сайт, которым вы управляете."], ["Почему стоит показывать процесс?", "Он создаёт историю и доверие, даёт ежедневный повод делиться."]], "task": "Выберите площадку и опубликуйте 5 материалов за 2 недели о процессе своей работы или обучения (одна идея — один пост). Опишите свой «бренд из одного человека»: чем вы полезны, для кого, какой проект-«вау» хотите сделать.", "out": "Ссылки или тексты 5 публикаций + описание личного бренда.", "rub": [["Публикации о процессе", "не только результат"], ["Регулярность", "5 за 2 недели"], ["Бренд сформулирован", "для кого и чем полезен"], ["Есть проект-«вау»", "конкретный"]], "sample": "Бренд: «помогаю маленьким пекарням считать себестоимость». Публикации: как я считаю себестоимость булки, моя ошибка в цене, шаблон таблицы… Проект-«вау»: бесплатный калькулятор для пекарен.", "deep": [{"h": "Делиться процессом", "p": ["Клеон («Покажи свою работу») советует: не надо быть гением, будьте частью «сцены» — сообщества. Делитесь чем-то маленьким каждый день, показывайте процесс, а не только результат; рассказывайте историю работы; учите тому, что знаете; не превращайтесь в спам; переживайте удары и продолжайте."]}, {"h": "Платформа", "p": ["Хайятт («Платформа») определяет успех как продукт, вызывающий восторг, плюс аудиторию. Он советует строить **домашнюю базу** — блог или сайт, которым вы управляете, — и **аванпосты** — соцсети, откуда люди приходят на базу. Главное — давать ценность постоянно и бережно работать с подписчиками."]}, {"h": "Бренд одного человека", "p": ["Том Питерс («Преврати себя в бренд») предлагает считать себя «компанией из одного человека»: отличие, проекты-«вау», репутация и сеть контактов делают вас брендом. Масленников («СуперБлог», «СуперКнига») даёт практичные приёмы продвижения блога и книги — комментирование, совместные проекты, работа с первыми читателями, рецензии."]}], "steps": ["Выберите площадку — домашнюю базу.", "Сформулируйте, для кого вы полезны и чем.", "Составьте план 10 публикаций о процессе своей работы или обучения.", "Публикуйте 2–3 раза в неделю две недели.", "Отвечайте на каждый комментарий.", "Придумайте один проект-«вау» и первый шаг к нему."], "check": ["Публикации о процессе, а не только результат.", "Регулярность соблюдена.", "Даю больше, чем прошу.", "Есть домашняя база.", "Есть проект-«вау»."], "qa2": [["Что такое аванпосты у Хайятта?", "Соцсети и другие площадки, откуда люди приходят на вашу домашнюю базу."], ["Что значит быть частью «сцены» по Клеону?", "Участвовать в сообществе, делиться и помогать, а не ждать признания как одинокий гений."]]}, {"t": "Искусство как тренажёр мышления", "min": 35, "why": "Глубокое чтение, театр, философский текст учат держать сложность — навык, которого не хватает в эпоху коротких видео.", "pts": ["Курпатов («Страх. Сладострастие. Смерть»): психологический разбор спектаклей Романа Виктюка — пример того, как **читать произведение** через форму, концепцию и знак, видеть темы эроса и танатоса, подавления и освобождения.", "Курпатов («Дневник канатного плясуна»): диалог с «Так говорил Заратустра» Ницше — записывать свои мысли рядом с великим текстом, спорить и соглашаться.", "Москвина: смотреть внимательно, удивляться, записывать — этот навык одинаково нужен и зрителю, и автору.", "Силиг: **увлечённость** и **умение предвидеть** развиваются, когда вы погружаетесь в чужой творческий мир.", "Практика **«медленного просмотра»**: одна картина 10 минут, один спектакль или фильм с записью трёх уровней — что вижу (форма), что это значит (концепция), что во мне отзывается (знак)."], "fig": {"k": "stairs", "a": ["Форма|что вижу и слышу", "Концепция|о чём это", "Знак|что это значит для меня"], "cap": "Три уровня чтения произведения."}, "src": ["k_theatre|разбор спектаклей через форму, концепцию, знак", "k_diary|дневник-диалог с философским текстом", "moskvina|учиться видеть", "seelig|увлечённость и предвидение"], "ex": "Фильм «Сталкер». Форма: долгие планы, вода, сепия и цвет. Концепция: вера и желание. Знак: я тоже хожу «в Зону» за исполнением желаний, не зная, чего хочу. Запись — 2 страницы; через неделю — пост в блоге.", "err": ["Ограничиться «понравилось/не понравилось».", "Искать «правильную» трактовку вместо своей."], "qa": [["Какие три уровня чтения произведения?", "Форма, концепция, знак (личный смысл)."], ["Что даёт дневник-диалог с текстом?", "Тренирует собственное мышление в споре и согласии с автором."]], "task": "Выберите произведение (фильм, спектакль, картина, глава философской книги). Проведите «медленный просмотр» и напишите разбор по трём уровням (300–500 слов).", "out": "Разбор по трём уровням.", "rub": [["Форма описана", "детали"], ["Концепция сформулирована", "о чём"], ["Личный знак", "честно"], ["Связь уровней", "форма поддерживает смысл"]], "sample": "Картина Хаммерсхёя «Интерьер»: форма — пустая комната, спина женщины, серый свет; концепция — тишина и одиночество; знак — мне не хватает тишины, решаю ввести час без звуков по воскресеньям.", "deep": [{"h": "Чтение произведения по уровням", "p": ["Курпатов в «Страхе. Сладострастии. Смерти» разбирает спектакли Романа Виктюка через три уровня: **форма** (что мы видим и слышим), **концепция** (о чём произведение) и **знак** (что оно значит для зрителя). Такой разбор учит видеть, как форма поддерживает смысл — навык, полезный и зрителю, и автору."]}, {"h": "Дневник-диалог", "p": ["«Дневник канатного плясуна» — записи Курпатова рядом с текстом Ницше «Так говорил Заратустра»: он спорит и соглашается, проверяя свои мысли о великом тексте. Это пример практики, тренирующей самостоятельное мышление — связь с уроком 10.4."]}, {"h": "Увлечённость и предвидение", "p": ["Силиг называет **увлечённость** и **умение предвидеть** основой воображения; они развиваются, когда мы глубоко погружаемся в чужой творческий мир. Москвина учит медленному взгляду: видеть деталь, удивляться и записывать."]}], "steps": ["Выберите произведение: фильм, спектакль, картину или главу книги.", "Смотрите или читайте медленно, без телефона.", "Запишите форму: детали, ритм, цвет, звук.", "Сформулируйте концепцию одной фразой.", "Запишите знак — что это для вас.", "Свяжите уровни: как форма работает на смысл."], "check": ["Описана форма с деталями.", "Концепция одной фразой.", "Есть личный смысл.", "Уровни связаны.", "Без поиска «правильной» трактовки."], "qa2": [["Какие три уровня разбора использует Курпатов?", "Форма, концепция, знак."], ["Что тренирует дневник-диалог с текстом?", "Самостоятельное мышление через спор и согласие с автором."]]}]}, {"n": 18, "title": "Бизнес: старт", "goal": "Выбрать идею и формат бизнеса, найти нишу, упаковать предложение и проверить гипотезы с минимальными вложениями.", "lessons": [{"t": "Идея и формат бизнеса", "min": 45, "why": "Бизнес начинают не с идеи, а с понимания, какую жизнь и какой риск вы готовы принять.", "pts": ["Таблица «Масштаб бизнеса»: четыре типа — **самореализация**, **закрытие потребностей**, **устойчивый бизнес**, **большая мечта**. Они различаются долгами, временем, командой и ожиданиями дохода.", "Шаблон «Идеи бизнеса» (Бизнес-класс): в сфере своих интересов можно **делать, продавать, обучать, консультировать, инвестировать, обеспечивать технологиями, организовывать, ремонтировать, развлекать** — 9 способов превратить интерес в дело.", "Михаил Дашкиев («28 мыслей»): модель неизбежных продаж, «люди-локомотивы», **семь критериев выбора стартовой ниши**, видение на три года и анти-нытьё.", "Дмитрий Портнягин («Трансформатор»): путь из Тынды к своему делу — вызовы себе, честный разбор ошибок, лидерское мышление.", "Дмитрий Потапенко («Честная книга о том, как делать бизнес в России»; LitRes помечает автора как иноагента): шок-терапия для начинающих — реалистичный взгляд на рынок, расходы и риски."], "fig": {"k": "quad", "c": "Какой бизнес вы строите?", "a": ["Самореализация: дело для души", "Закрытие потребностей: доход семьи", "Устойчивый бизнес: команда 2–50", "Большая мечта: масштаб и риск"], "cap": "Тип бизнеса определяет допустимые долги, время и команду."}, "src": ["biz_scale|четыре типа бизнеса", "bizideas|9 способов превратить интерес в дело", "dashkiev|семь критериев ниши и видение на 3 года", "a28058395|путь предпринимателя с нуля", "a22817955|реалистичный взгляд на риски малого бизнеса"], "ex": "Интерес: велосипеды. Способы: продавать б/у велосипеды, ремонтировать, обучать детей, организовывать туры. Тип: закрытие потребностей (без долгов, 30 часов в неделю). Выбор: мастерская выездного ремонта.", "err": ["Брать кредит под бизнес «для души».", "Выбирать нишу только по любви, не проверив спрос."], "qa": [["Какие четыре типа бизнеса различает таблица?", "Самореализация, закрытие потребностей, устойчивый бизнес, большая мечта."], ["Назовите четыре из девяти способов превратить интерес в бизнес.", "Делать, продавать, обучать, консультировать (а также инвестировать, технологии, организация, ремонт, развлечения)."]], "task": "Определите свой тип бизнеса (ответьте на вопросы таблицы: долги, время, команда, доход). Возьмите 2 сферы интересов и сгенерируйте по 9 идей. Отберите 3 идеи по критериям: спрос, ваша компетенция, стартовые вложения, соответствие типу.", "out": "Тип бизнеса с ответами, 18 идей, таблица отбора, 3 финалиста.", "rub": [["Тип определён честно", "ответы на вопросы"], ["Идей 18", "по 9 способам"], ["Отбор по критериям", "таблица"], ["Финалисты соответствуют типу", "обосновано"]], "sample": "Тип: закрытие потребностей — без долгов, 20–30 ч/нед, 0–2 человека, цель +60 тыс./мес. Финалисты: курс Excel для бухгалтеров, настройка 1С для ИП, консультации по учёту.", "deep": [{"h": "Какой бизнес вы строите", "p": ["Таблица «Масштаб бизнеса» различает четыре типа: **самореализация**, **закрытие потребностей**, **устойчивый бизнес**, **большая мечта**. Они различаются ответами на вопросы: сколько можно прожить без дохода, какие долги допустимы, где и сколько работать, сколько людей нанимать, чего ждать от дохода. Ошибка — строить «большую мечту» с ожиданиями «самореализации» или брать кредит под бизнес для души."]}, {"h": "Девять способов превратить интерес в дело", "p": ["Шаблон «Идеи бизнеса» (Бизнес-класс) предлагает взять сферу интересов и пройти девять вариантов: делать или создавать, продавать, обучать, консультировать, инвестировать, обеспечивать технологиями и оборудованием, организовывать мероприятия, обслуживать и ремонтировать, развлекать. Из одной сферы получается 9+ идей."]}, {"h": "Ниша и реализм", "p": ["Дашкиев («28 мыслей») предлагает выбирать стартовую нишу по семи критериям и думать на горизонте трёх лет; он пишет об «анти-нытье» и о «людях-локомотивах», которые тянут дело. Портнягин («Трансформатор») делится путём из Тынды к своему бизнесу: вызовы себе, ошибки, лидерское мышление. Потапенко («Честная книга…»; LitRes помечает автора как иноагента) даёт трезвый взгляд на риски малого бизнеса в России."]}], "steps": ["Ответьте на вопросы таблицы масштаба и определите свой тип.", "Выберите 2 сферы интересов.", "Для каждой сгенерируйте по 9 идей по шаблону.", "Оцените идеи по критериям: спрос, компетенция, стартовые вложения, соответствие типу.", "Отберите 3 финалиста.", "Для каждого запишите, кто первый клиент."], "check": ["Тип бизнеса определён честно.", "Идей 18.", "Оценка по критериям.", "Финалисты соответствуют типу.", "Понятен первый клиент."], "qa2": [["Почему тип бизнеса важно определить до идеи?", "От него зависят допустимые риски, долги, время и масштаб."], ["Как из одной сферы интересов получить много идей?", "Пройти девять способов: делать, продавать, обучать, консультировать и т. д."]]}, {"t": "Ниша и упаковка: стать иглой", "min": 45, "why": "«Мы делаем всё для всех» — главная причина незаметности. Узкая ниша и ясная упаковка делают бизнес видимым.", "pts": ["«Игла. Антипосредственность» (Бизнес Молодость): чтобы пробиться, станьте **иглой** — пиком в узкой нише, отказавшись от второстепенного. Первому достаётся большая часть внимания и клиентов (связь с «концепцией ежа» Коллинза).", "Торбосов («10 бизнес-фишек»), **«пол-процента»**: побеждает не тот, кто лучше в разы, а тот, кто на полпроцента лучше в сервисе, упаковке, скорости и продукте.", "«117 вопросов для упаковки» (Бизнес Молодость): что продаёте и кому, какую проблему решаете, цифры и масштаб, история, люди, проекты, процесс работы, возражения и боли клиентов. Ответы — сырьё для сайта, презентации, коммерческого предложения.", "Араик Галстян («Миллион на цветах»): малый бизнес выигрывает атмосферой, коммуникацией и **личным брендом владельца**.", "Формула позиционирования: **для кого + какая проблема + чем отличаемся + доказательство**."], "fig": {"k": "funnel", "a": ["Все клиенты", "Сегмент|кто именно", "Проблема|что болит", "Отличие|чем мы лучше на 0,5%", "Игла|номер один в узкой нише"], "cap": "Сужение до иглы: меньше охват — больше заметность."}, "src": ["igla|игла и антипосредственность", "torbosov|«пол-процента» и «король обезьян»", "bm117|117 вопросов для упаковки", "galstyan|атмосфера и личный бренд владельца"], "ex": "Было: «Бухгалтерские услуги». Стало: «Бухгалтерия для кофеен Екатеринбурга: закрываем месяц за 3 дня, считаем себестоимость каждого напитка. 27 кофеен на обслуживании».", "err": ["Бояться сужения ниши, «чтобы не потерять клиентов».", "Писать об отличиях, которые есть у всех («качественно и недорого»)."], "qa": [["Что такое «игла»?", "Пик в узкой нише, где вы номер один."], ["Из чего состоит формула позиционирования?", "Для кого, какая проблема, чем отличаемся, доказательство."]], "task": "Ответьте на 30 самых важных для вас вопросов из «117 вопросов для упаковки» (о продукте, клиенте, цифрах, процессе, возражениях). Сформулируйте позиционирование по формуле и найдите 4 места, где вы можете быть лучше конкурентов на полпроцента.", "out": "Ответы на 30 вопросов, позиционирование одним абзацем, 4 «пол-процента».", "rub": [["Ответы конкретны", "цифры и примеры"], ["Ниша узкая", "понятно, кто клиент"], ["Отличие реальное", "проверяемое"], ["«Пол-процента» реализуемы", "сервис, упаковка, скорость, продукт"]], "sample": "Позиционирование: «Настройка 1С для ИП на УСН в розничной торговле: за 2 дня, с обучением кассира и чек-листом на месяц». Пол-процента: ответ в течение часа, видео-инструкции, напоминания о сроках.", "deep": [{"h": "Игла и ёж", "p": ["Материал «Игла. Антипосредственность» (Бизнес Молодость) опирается на «концепцию ежа» Коллинза: компании, ставшие великими, отказались от второстепенного и нашли одно дело, в котором стали лучшими. Малому бизнесу нужно стать **иглой** — пиком в узкой нише. Первый в нише получает основное внимание и клиентов без лишней рекламы."]}, {"h": "Пол-процента и упаковка", "p": ["Торбосов («10 бизнес-фишек»): на скачках побеждает лошадь, пришедшая на полкорпуса раньше, а не та, что в разы быстрее. Лидером рынка становится тот, кто на полпроцента лучше в сервисе, упаковке, скорости и продукте.", "Анкета «117 вопросов для упаковки» (Бизнес Молодость) помогает собрать материал: что продаёте и зачем это покупают, какую проблему решаете, цифры бизнеса, история, люди, проекты, процесс работы с клиентом, частые сомнения и возражения клиентов. Ответы становятся основой сайта, презентации, коммерческого предложения."]}, {"h": "Атмосфера и личность", "p": ["Галстян («Миллион на цветах») показывает на примере цветочного бизнеса: малый бизнес выигрывает атмосферой, коммуникацией и личным брендом владельца — тем, что сети скопировать не могут."]}], "steps": ["Ответьте на 30 ключевых вопросов из «117 вопросов».", "Сформулируйте позиционирование: для кого + проблема + отличие + доказательство.", "Проверьте, насколько узкая ниша.", "Найдите 4 места, где вы лучше на полпроцента: сервис, упаковка, скорость, продукт.", "Соберите 3 доказательства: кейсы, цифры, отзывы.", "Покажите позиционирование 5 потенциальным клиентам и соберите реакции."], "check": ["Ниша узкая.", "Отличие проверяемое.", "Есть доказательства.", "Пол-процента реализуемы.", "Позиционирование проверено на клиентах."], "qa2": [["Почему первому в нише достаётся больше?", "Его запоминают и рекомендуют; внимание рынка концентрируется на лидере."], ["Для чего нужна анкета «117 вопросов»?", "Собрать материал для упаковки бизнеса: сайта, презентации, коммерческого предложения."]]}, {"t": "Проверка гипотез и цифры", "min": 45, "why": "Большинство бизнесов умирает не от плохой идеи, а от непроверенных предположений и незнания своих цифр.", "pts": ["Дмитрий Потапенко («Бизнес — это глаголы и существительные, которые заканчиваются цифрами»; LitRes помечает автора как иноагента): каждое действие должно иметь **измеримый результат**. Не «продвигаем», а «10 звонков в день → 2 встречи → 1 сделка».", "Гипотеза = **если сделаем X для клиента Y, то получим Z к сроку**. Проверяйте самым дешёвым способом: предзаказ, лендинг, тестовая продажа знакомым.", "Лео Шевченко («Как начать бизнес на Wildberries и Ozon»): начинайте с анализа спроса и конкурентов через сервисы аналитики, смотрите отзывы и сезонность, стартуйте с небольшой партии.", "«Freelance Evolution»: фриланс — тоже бизнес; портфолио, выбор проектов, оценка стоимости и сроков, заявки, общение с заказчиками.", "Минимальный набор цифр: средний чек, конверсия по этапам, стоимость привлечения клиента, маржа, точка безубыточности."], "fig": {"k": "funnel", "a": ["Контакты|100", "Интерес|30", "Встречи/заявки|10", "Сделки|3", "Повторные|1"], "cap": "Оцифрованная воронка показывает, где теряются клиенты и какая гипотеза нужна."}, "src": ["a27172685|каждое действие — с цифрой результата", "wb_ozon|анализ спроса и старт на маркетплейсах", "freelance|фриланс как бизнес: проекты, цены, заявки"], "ex": "Гипотеза: «Если предложить кофейням настройку учёта себестоимости за 15 тыс., то 3 из 20 опрошенных заплатят предоплату в течение 2 недель». Проверка: 20 звонков. Результат: 2 предоплаты — гипотеза частично подтверждена, корректирую цену.", "err": ["Вкладываться в сайт, склад и рекламу до первой продажи.", "Не считать конверсии и стоимость клиента."], "qa": [["Как формулируется гипотеза?", "Если сделаем X для клиента Y, то получим Z к сроку."], ["Какие цифры нужно знать с самого начала?", "Средний чек, конверсии, стоимость клиента, маржа, точка безубыточности."]], "task": "Для одной идеи из урока 18.1 сформулируйте 3 гипотезы, выберите самую рискованную и проверьте её за 2 недели самым дешёвым способом. Посчитайте воронку и юнит-экономику (чек, маржа, стоимость клиента).", "out": "3 гипотезы, план и результат проверки, расчёт воронки и юнит-экономики.", "rub": [["Гипотезы по формуле", "X, Y, Z, срок"], ["Проверка дешёвая", "без больших вложений"], ["Есть результат", "цифры"], ["Юнит-экономика посчитана", "чек, маржа, стоимость клиента"]], "sample": "Гипотеза: «Родители школьников купят 4 занятия по финграмотности за 4000 ₽». Проверка: пост в 3 родительских чатах + форма предзаказа. 140 просмотров → 12 заявок → 5 оплат. Стоимость клиента ≈ 0 ₽, маржа 3200 ₽.", "deep": [{"h": "Бизнес в цифрах", "p": ["Потапенко («Бизнес — это глаголы и существительные, которые заканчиваются цифрами»; LitRes помечает автора как иноагента) требует, чтобы каждое действие имело измеримый результат: не «продвигаем», а «20 звонков → 4 встречи → 1 сделка». Минимальный набор цифр: средний чек, конверсия по этапам, стоимость привлечения клиента, маржа, точка безубыточности."]}, {"h": "Гипотезы и дешёвая проверка", "p": ["Гипотеза формулируется как «если сделаем X для клиентов Y, то получим Z к сроку». Проверять нужно самым дешёвым способом: предзаказ, лендинг с формой, тестовая продажа знакомым, ручное оказание услуги до автоматизации. Только после подтверждения спроса — вложения в склад, сайт, рекламу."]}, {"h": "Маркетплейсы и фриланс", "p": ["Шевченко («Как начать бизнес на Wildberries и Ozon») предлагает начинать с анализа спроса и конкурентов через сервисы аналитики, смотреть отзывы и сезонность, стартовать с небольшой партии. «Freelance Evolution» показывает фриланс как бизнес: портфолио, выбор проектов, оценка стоимости и сроков, заявки и общение с заказчиками."]}], "steps": ["Сформулируйте 3 гипотезы по формуле.", "Выберите самую рискованную.", "Придумайте проверку за 2 недели без больших вложений.", "Задайте критерий успеха заранее.", "Проведите проверку и соберите цифры воронки.", "Посчитайте юнит-экономику и решите: продолжать, менять или закрывать."], "check": ["Гипотезы по формуле.", "Критерий успеха задан до проверки.", "Проверка дешёвая.", "Цифры собраны.", "Решение принято по данным."], "qa2": [["Зачем задавать критерий успеха заранее?", "Чтобы не подгонять оценку под желаемый результат."], ["Что такое юнит-экономика?", "Расчёт доходов и затрат на одну продажу или одного клиента."]]}, {"t": "Истории основателей", "min": 40, "why": "Биографии показывают то, что не помещается в учебник: упорство, ошибки, нестандартные ходы и ценности.", "pts": ["Генри Форд («Моя жизнь. Мои достижения»): **служение потребителю** важнее прибыли; низкая цена за счёт эффективности (конвейер), высокая зарплата рабочим, отказ от спекуляций.", "«Илон Маск. Правила успеха»: амбициозные цели, **мышление от первых принципов** (разобрать задачу до физических основ и собрать заново), работа на пределе и готовность к риску.", "Алекс Банаян («Третья дверь»): к успеху ведёт не только парадная дверь (очередь) и VIP-вход, но и **третья дверь** — обходной путь, который находят настойчивостью и изобретательностью.", "Майкл Роуч («Алмазный огранщик») и выпуск подкаста с Антоном Кратасюком («Как посадить семена богатства»): буддийская рамка бизнеса — **честность, щедрость и помощь другим** как основа долгосрочного успеха. Мировоззрение — на ваше усмотрение; практика честности и щедрости работает и без него.", "Общее в историях: ясная цель, ценности, принятые решения в неопределённости, учёба на ошибках."], "fig": {"k": "cols", "cols": [{"h": "Форд", "items": ["служение клиенту", "эффективность", "высокая оплата"]}, {"h": "Маск", "items": ["первые принципы", "большие цели", "риск"]}, {"h": "Банаян", "items": ["третья дверь", "настойчивость", "наставники"]}, {"h": "Роуч", "items": ["честность", "щедрость", "долгий срок"]}], "cap": "Четыре разных «кода» основателей."}, "src": ["a6353656|принципы Форда", "a22043782|правила Маска и первые принципы", "banayan|третья дверь", "a36300973|честность и щедрость в бизнесе", "a27442856|выпуск: семена богатства"], "ex": "Первые принципы: «Аренда офиса дорогая». Из чего складывается цена? Метры, локация, срок. Что нужно на самом деле? Место для 3 встреч в неделю. Решение: коворкинг по часам — расходы снижены в 4 раза.", "err": ["Копировать внешние атрибуты (подъём в 4 утра) вместо принципов.", "Видеть только успех и не изучать ошибки героев."], "qa": [["Что такое мышление от первых принципов?", "Разложить задачу до базовых фактов и собрать решение заново, а не по аналогии."], ["Что такое «третья дверь» у Банаяна?", "Обходной путь к цели, когда главный вход закрыт, а VIP недоступен."]], "task": "Выберите одну задачу своего бизнеса или карьеры и решите её четырьмя «кодами»: как поступил бы Форд, Маск (первые принципы), Банаян (третья дверь), Роуч (честность и щедрость). Выберите решение и сделайте первый шаг.", "out": "Четыре варианта решения + выбор + первый шаг.", "rub": [["Задача реальная", "из вашей практики"], ["Коды применены по сути", "не внешне"], ["Решения различаются", "разные подходы"], ["Первый шаг сделан", "результат"]], "sample": "Задача: попасть на конференцию спикером. Форд: дать организаторам пользу. Маск: что нужно организаторам? — контент и аудитория. Банаян: написать спикеру прошлого года и попросить рекомендацию. Роуч: бесплатно помочь с модерацией. Шаг: письмо спикеру — ответил.", "deep": [{"h": "Форд: служение потребителю", "p": ["Форд («Моя жизнь. Мои достижения») формулирует принципы: бизнес существует ради служения потребителю, прибыль — следствие; цена снижается за счёт эффективности производства (конвейер), а не качества; высокая зарплата рабочих — выгодна, потому что они становятся покупателями; спекуляции и финансовые игры вредят делу."]}, {"h": "Маск: первые принципы", "p": ["«Илон Маск. Правила успеха» описывает подход Маска: ставить амбициозные цели и рассуждать **от первых принципов** — раскладывать задачу до базовых фактов (например, из чего состоит ракета и сколько стоят материалы) и собирать решение заново, а не по аналогии с тем, как «принято». Плюс готовность к риску и очень высокая нагрузка."]}, {"h": "Третья дверь и семена", "p": ["Банаян («Третья дверь») брал интервью у известных людей и заметил: в жизни есть главный вход (очередь), VIP-вход (для избранных) и **третья дверь** — обходной путь, который находят настойчивостью, наставниками и нестандартными ходами. Роуч («Алмазный огранщик») и Антон Кратасюк (подкаст) предлагают буддийскую рамку бизнеса: честность и щедрость как «семена» будущего успеха; практика честности и помощи другим работает независимо от мировоззрения."]}], "steps": ["Выберите задачу своего бизнеса или карьеры.", "Как решил бы её Форд (служение и эффективность)?", "Разберите от первых принципов: из чего состоит задача, что нужно на самом деле?", "Найдите «третью дверь»: обходной путь, человек, нестандартный ход.", "Где можно проявить честность и щедрость?", "Выберите решение и сделайте первый шаг."], "check": ["Задача реальная.", "Первые принципы применены по сути.", "Есть вариант третьей двери.", "Решения разные.", "Первый шаг сделан."], "qa2": [["Почему Форд считал высокую зарплату выгодной?", "Рабочие становились покупателями, и росла их мотивация и стабильность."], ["Что значит рассуждать от первых принципов?", "Разложить задачу до базовых фактов и собрать решение заново, а не по аналогии."]]}]}, {"n": 19, "title": "Продажи", "goal": "Освоить этапы продажи, вариативные скрипты и работу с возражениями, понять устройство отдела продаж и удержание клиентов.", "lessons": [{"t": "Этапы продажи и мышление продавца", "min": 45, "why": "Продажа — это не навязывание, а помощь человеку принять решение. Структура делает её предсказуемой.", "pts": ["Михаил Гребенюк («Гениальные скрипты продаж»): этапы — **установление контакта, программирование** (договориться о ходе разговора), **квалификация** (потребности), **презентация** (под потребности), **работа с возражениями, закрытие**.", "Гребенюк: профессионала отличает **система** — подготовка, настрой, план звонков, работа над ошибками.", "Максим Батырев («45 татуировок продавана»): отказы — норма («из ста раз посылают девяносто девять — ты на грани рентабельности; три согласия — всё в порядке»); дисциплина и честность продавца.", "Квалификация важнее презентации: задавайте вопросы о ситуации, проблеме, последствиях и желаемом результате.", "Закрытие = **предложение следующего шага**: встреча, тест, счёт — с датой."], "fig": {"k": "flow", "a": ["Контакт", "Программирование|план разговора", "Квалификация|вопросы", "Презентация|под потребность", "Возражения", "Закрытие|следующий шаг"], "cap": "Этапы продажи по Гребенюку."}, "src": ["greb_scripts|10 этапов продажи и система профессионала", "a28058774|45 правил продавца и руководителя продаж"], "ex": "Программирование: «Предлагаю так: я задам несколько вопросов о вашей бухгалтерии, расскажу, как работаем, и решим, есть ли смысл встречаться. Хорошо?» Клиент расслабляется — разговор структурирован.", "err": ["Начинать с презентации, не узнав потребностей.", "Заканчивать разговор без конкретного следующего шага."], "qa": [["Что такое программирование в продаже?", "Договорённость с клиентом о ходе разговора в начале."], ["Почему квалификация важнее презентации?", "Без понимания потребности презентация попадает мимо."]], "task": "Распишите свою продажу (товара, услуги или идеи руководителю) по 6 этапам: фразы контакта и программирования, 6 вопросов квалификации, структура презентации, закрытие. Проведите 3 реальных разговора и разберите.", "out": "Сценарий по этапам + разбор трёх разговоров.", "rub": [["Все этапы", "6 этапов"], ["Вопросы квалификации", "открытые, о проблеме и результате"], ["Закрытие конкретное", "шаг с датой"], ["Разборы честные", "что улучшить"]], "sample": "Вопросы: «Как сейчас ведёте учёт?», «Что занимает больше всего времени?», «Во что обходятся ошибки?», «Как бы выглядел идеальный месяц?»… Закрытие: «Давайте во вторник в 11 покажу на ваших данных».", "deep": [{"h": "Этапы продажи", "p": ["Гребенюк («Гениальные скрипты продаж») раскладывает продажу на этапы: **установление контакта**, **программирование** (договориться о ходе разговора: «я задам несколько вопросов, расскажу о решении, и решим, есть ли смысл»), **квалификация** (выяснить ситуацию, проблему, потребность, бюджет, лицо, принимающее решение), **презентация** под выявленные потребности, **работа с возражениями**, **закрытие** — договорённость о следующем шаге."]}, {"h": "Профессионал и система", "p": ["Гребенюк отличает профессионала от любителя: подготовка к звонкам, план, учёт, разбор ошибок, настрой. Батырев («45 татуировок продавана») добавляет правила из опыта: отказы — норма продаж («из ста раз посылают 99 — на грани рентабельности; соглашаются трое — всё в порядке»); дисциплина, честность с клиентом; руководитель продаж показывает пример."]}, {"h": "Квалификация важнее презентации", "p": ["Вопросы о ситуации, проблеме, последствиях и желаемом результате позволяют говорить о ценности для клиента, а не о характеристиках продукта. Хорошая квалификация сокращает возражения: клиент сам называет причины купить."]}], "steps": ["Напишите фразу контакта и программирования.", "Подготовьте 6 вопросов квалификации: ситуация, проблема, последствия, желаемое.", "Свяжите презентацию с ответами клиента: «вы сказали… — поэтому…».", "Подготовьте закрытие: конкретный следующий шаг с датой.", "Проведите 3 разговора.", "Разберите каждый: что сработало, что улучшить."], "check": ["Есть программирование.", "Вопросы открытые.", "Презентация под потребности.", "Закрытие — шаг с датой.", "Разговоры разобраны."], "qa2": [["Что даёт программирование разговора?", "Клиент понимает структуру встречи и меньше сопротивляется."], ["Почему квалификация уменьшает возражения?", "Клиент сам называет проблему и последствия — презентация отвечает на его слова."]]}, {"t": "Скрипты и возражения", "min": 45, "why": "Возражение — не отказ, а вопрос, на который клиент ещё не получил ответа. Готовые модули экономят продажи.", "pts": ["Ася Барышева («Боевые слоны продаж»): жёсткие скрипты токсичны — клиент чувствует «робота». Нужны **вариативные скрипты** с развилками, построенные вокруг «счастья клиента»; создание скриптов — обязанность руководителя.", "Дмитрий Ткаченко («Работа с возражениями: 200 приёмов»): готовые речевые модули на «дорого», «у нас есть поставщик», «пришлите на почту», «я подумаю»; лучше строить диалог так, чтобы возражения не возникали.", "Алгоритм: **выслушать → присоединиться** («понимаю, это важный вопрос») → **уточнить** («с чем сравниваете?») → **аргумент** под суть → **вопрос-закрытие**.", "Типы возражений: истинные (цена, сроки) и ложные (отговорка — нужно найти настоящую причину).", "Сбор базы: записывайте все возражения за месяц и лучшие ответы — это и есть ваш скрипт."], "fig": {"k": "flow", "a": ["Выслушать", "Присоединиться", "Уточнить|что за этим?", "Аргумент|под суть", "Вопрос-закрытие"], "cap": "Пять шагов работы с возражением."}, "src": ["barysheva|вариативные скрипты вокруг клиента", "a39470616|200 речевых модулей против возражений"], "ex": "«Дорого». Присоединение: «Понимаю, бюджет важен». Уточнение: «С чем сравниваете?» — «Фрилансер берёт вдвое дешевле». Аргумент: «У нас гарантия и замена специалиста за день; во что вам обходится остановка учёта на неделю?» Закрытие: «Давайте начнём с первого месяца со скидкой 20%?»", "err": ["Спорить с клиентом.", "Отвечать на ложное возражение, не найдя настоящего."], "qa": [["Почему жёсткие скрипты плохи?", "Клиент чувствует шаблон, а развилки разговора не учтены."], ["Какой первый шаг после возражения?", "Выслушать и присоединиться, а не спорить."]], "task": "Соберите 8 самых частых возражений в вашей работе. Для каждого напишите ответ по 5 шагам. Оформите как вариативный скрипт с двумя развилками. Отработайте с кем-то в ролевой игре.", "out": "8 возражений с ответами + схема скрипта с развилками + итог ролевой игры.", "rub": [["Возражения реальные", "из практики"], ["Ответы по шагам", "все 5"], ["Есть развилки", "минимум две"], ["Ролевая игра", "выводы"]], "sample": "Возражение «Я подумаю». Уточнение: «Что именно хотите обдумать — цену, сроки или формат?» Развилка 1: цена → вариант пакета. Развилка 2: нужно согласовать → «Кто ещё участвует? Давайте созвонимся втроём».", "deep": [{"h": "Вариативные скрипты", "p": ["Барышева («Боевые слоны продаж») показывает, что жёсткие скрипты токсичны: клиент чувствует «робота», разговор ломается на первом нестандартном ответе. Нужны **вариативные скрипты** — карта разговора с развилками, построенная вокруг «счастья клиента». Создание скриптов — обязанность руководителя: он собирает лучшие ответы менеджеров и тестирует их."]}, {"h": "Работа с возражениями", "p": ["Ткаченко («200 приёмов») даёт готовые речевые модули на «дорого», «есть поставщик», «пришлите на почту», «я подумаю», «нет времени». Общий алгоритм: **выслушать** до конца → **присоединиться** («понимаю, это важно») → **уточнить**, что стоит за возражением → дать **аргумент** под суть → задать **вопрос-закрытие**. Он подчёркивает: лучше выстроить разговор так, чтобы возражения не возникали."]}, {"h": "Истинное и ложное возражение", "p": ["«Я подумаю» часто означает непонятую ценность или скрытую причину (нет денег, решает не он, не доверяет). Уточняющий вопрос — «что именно хотите обдумать: цену, сроки или формат?» — помогает найти настоящее возражение."]}], "steps": ["Соберите 8 самых частых возражений за месяц.", "Для каждого напишите ответ по 5 шагам.", "Оформите карту разговора с 2–3 развилками.", "Отработайте в ролевой игре с коллегой или с ИИ.", "Применяйте месяц и записывайте, что работает.", "Обновите скрипт по результатам."], "check": ["Возражения реальные.", "Ответы по алгоритму.", "Есть развилки.", "Скрипт отработан вслух.", "Скрипт обновляется."], "qa2": [["Почему жёсткий скрипт ломается?", "Он не учитывает нестандартные ответы клиента и звучит механически."], ["Как найти истинное возражение?", "Задать уточняющий вопрос о том, что стоит за словами клиента."]]}, {"t": "Отдел продаж как система", "min": 45, "why": "Продажи, которые держатся на одном «звёздном» продавце или собственнике, не масштабируются.", "pts": ["Михаил Гребенюк («Отдел продаж по захвату рынка»): начните с **аудита** — оцифруйте точку А (лиды, конверсии, средний чек, цикл сделки), изучите аудиторию и конкурентов.", "Модели отдела: **одноуровневая** (менеджер ведёт всё), **двухуровневая** (колл-центр + закрывающие или хантеры + аккаунт-менеджеры), **трёхуровневая**. Разделение ролей повышает производительность.", "Найм, обучение, мотивация (оклад + процент + бонус за план), контроль (CRM, план-факт, прослушка звонков, ежедневные планёрки).", "Центр финансовой культуры: **оцифровка процесса** — KPI, блок-схема пути к результату, сложность действий в «активностях», конверсии и план на месяц («для одной продажи нужно 10 активностей»).", "Максим Батырев: руководитель продаж сам продаёт и показывает пример, держит дисциплину и защищает команду."], "fig": {"k": "cols", "cols": [{"h": "Аудит", "items": ["лиды и конверсии", "средний чек", "цикл сделки"]}, {"h": "Модель", "items": ["роли", "колл-центр / закрытие", "аккаунтинг"]}, {"h": "Управление", "items": ["CRM и план-факт", "мотивация", "обучение и скрипты"]}], "cap": "Три блока построения отдела продаж."}, "src": ["greb_dept|аудит, модели отдела, найм, мотивация, контроль", "cfc|оцифровка процесса и план активностей", "a28058774|руководитель продаж как пример"], "ex": "Аудит: 300 лидов → 60 встреч → 15 сделок, средний чек 80 тыс. Узкое место: 20% лидов не обрабатываются в первый день. Решение: двухуровневая модель — колл-центр обрабатывает лиды за 15 минут, менеджеры ведут встречи.", "err": ["Нанимать продавцов, не оцифровав воронку.", "Платить только оклад или только процент без учёта цикла сделки."], "qa": [["С чего начинать построение отдела продаж?", "С аудита и оцифровки точки А."], ["Чем двухуровневая модель лучше одноуровневой?", "Разделение ролей позволяет каждому делать то, в чём он сильнее, и повышает общую производительность."]], "task": "Оцифруйте продажи своего бизнеса или отдела (или придуманного кейса): воронка, средний чек, цикл, конверсии. Найдите узкое место и предложите модель ролей и систему мотивации. Посчитайте план активностей на месяц.", "out": "Таблица метрик, узкое место, модель, мотивация, план активностей.", "rub": [["Метрики посчитаны", "все этапы"], ["Узкое место найдено", "по данным"], ["Модель обоснована", "роли и задачи"], ["План активностей", "от цели к ежедневным действиям"]], "sample": "Цель: 20 сделок. Конверсия встреча → сделка 25% → нужно 80 встреч; звонок → встреча 10% → 800 звонков; 20 рабочих дней → 40 звонков в день на двух менеджеров.", "deep": [{"h": "Аудит и модели отдела", "p": ["Гребенюк («Отдел продаж по захвату рынка») начинает с аудита: оцифровать точку А (лиды, конверсии, средний чек, цикл сделки), изучить аудиторию и конкурентов. Затем выбирается модель: **одноуровневая** (менеджер ведёт клиента от звонка до сделки), **двухуровневая** (колл-центр квалифицирует, менеджеры закрывают; или хантеры привлекают, аккаунт-менеджеры развивают), **трёхуровневая**. Разделение ролей повышает производительность."]}, {"h": "Управление отделом", "p": ["Найм (воронка кандидатов, тестовые задания), обучение (скрипты, наставничество), мотивация (оклад + процент + бонус за план, с учётом цикла сделки), контроль (CRM, план-факт, прослушивание звонков, ежедневные планёрки). Батырев добавляет: руководитель продаж сам продаёт, держит дисциплину и защищает команду."]}, {"h": "Оцифровка процесса", "p": ["Центр финансовой культуры предлагает считать работу в «активностях»: блок-схема пути к результату, сложность действий в условных единицах, конверсии и план на месяц («для одной продажи нужно 10 активностей → для 20 продаж нужно 200»)."]}], "steps": ["Соберите метрики воронки за 1–3 месяца.", "Посчитайте конверсии этапов.", "Найдите узкое место (связь с уроком 7.4).", "Выберите модель ролей.", "Спроектируйте мотивацию.", "Посчитайте план активностей от цели к ежедневным действиям."], "check": ["Метрики посчитаны.", "Узкое место найдено по данным.", "Роли разделены осознанно.", "Мотивация учитывает цикл сделки.", "Есть план активностей."], "qa2": [["Зачем разделять колл-центр и закрывающих менеджеров?", "Каждый делает то, в чём силён; скорость обработки лидов и конверсия растут."], ["Как посчитать план активностей?", "Разделить целевое число продаж на конверсии этапов назад до ежедневных действий."]]}, {"t": "Удержание клиентов", "min": 40, "why": "Привлечь нового клиента в разы дороже, чем удержать существующего. Лояльность строится сразу после покупки.", "pts": ["Джоуи Коулман («Никогда не теряйте клиента»): от 20 до 70% новых клиентов уходят **в первые 100 дней**, потому что не получают внимания после покупки. Путь клиента — восемь этапов, и после оплаты нужно «удивлять и заботиться».", "Практики Коулмана: приветственный подарок или сообщение, видео «что дальше», проверочный звонок, персональные знаки внимания на важных этапах.", "Максим Жуков («75 хаков для роста конверсии интернет-магазина»): мелочи решают — отзывы и гарантии, понятная карточка, удобная корзина, быстрая связь, напоминания о брошенной корзине, допродажи.", "Метрики удержан
