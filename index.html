ну?", "Чем быстрее мы работаем, тем больше дел появляется; успеть всё всё равно нельзя."], ["Какие два вопроса задавал себе Франклин?", "Утром: «Что хорошего я сделаю сегодня?», вечером: «Что хорошего я сделал сегодня?»."]]}, {"t": "Планирование недели и дня", "min": 45, "why": "План — это не жёсткое расписание, а договор с собой о главном. Хороший план переживает форс-мажор.", "pts": ["Архангельский: **жёсткие** задачи (привязаны ко времени) — в календарь; **гибкие** — в контекстные списки («на компьютере», «звонки», «в городе»). День планируется «от жёстких», гибкие заполняют промежутки.", "Круз: планируйте **в календаре, а не в списке** — то, что не получило времени, скорее всего не будет сделано.", "Моран и Леннингтон («12 недель в году»): год слишком абстрактен — живите **12-недельными циклами** с еженедельным планом и оценкой выполнения; цель — 85% выполненных тактик.", "Пинтосевич («Будь эффективным!»): эффективность складывается из мелочей — режим, контроль, окружение, регулярный пересмотр.", "Дмитрий Тарасов (подкаст Маклахова) — о выборе планировщика: инструмент вторичен, важна регулярность недельного обзора."], "fig": {"k": "flow", "a": ["12 недель|2–3 цели цикла", "Неделя|тактики + оценка", "День|жёсткие → лягушка → гибкие", "Вечер|итоги и план"], "cap": "Цикл Морана, встроенный в ежедневное планирование Архангельского."}, "src": ["arkh|жёсткие и гибкие задачи, контекстное планирование", "kruse|календарь вместо списка", "a58004531|12-недельный год и 85% тактик", "pint_eff|эффективность из мелочей", "a27442768|выпуск: как выбрать идеальный планировщик"], "ex": "Неделя: цели цикла — запуск лендинга и 10 км бега. Тактики: 3 часа в неделю на лендинг (вт, чт), 3 пробежки. Оценка в пятницу: 5 из 6 тактик = 83%.", "err": ["Заполнять день на 100% — первый форс-мажор ломает всё.", "Не проводить недельный обзор."], "qa": [["Чем жёсткие задачи отличаются от гибких?", "Жёсткие привязаны ко времени, гибкие — можно сделать в любой подходящий момент."], ["Какой процент выполнения тактик считается хорошим у Морана?", "85% и выше."]], "task": "Составьте 12-недельный план: 2–3 цели и еженедельные тактики. Распланируйте ближайшую неделю в календаре (жёсткие задачи, «лягушки», буфер 30%). В конце недели посчитайте процент выполнения.", "out": "План цикла + скриншот или описание недели + итоговый процент и выводы.", "rub": [["Цели цикла измеримы", "понятно, что такое «достигнуто»"], ["Тактики регулярные", "действия с частотой"], ["Есть буфер", "не меньше 20–30% времени свободно"], ["Проведена оценка", "процент и одно изменение"]], "sample": "Цикл: сдать сертификацию 1С, сбросить 4 кг. Тактики: 5 часов учёбы в неделю, 3 тренировки, без сладкого в будни. Итог недели 1: 7 из 9 = 78%; вывод — учёбу перенести на утро.", "deep": [{"h": "Жёсткие и гибкие задачи", "p": ["Архангельский делит задачи на **жёсткие** — привязанные ко времени (встречи, звонки на час) — и **гибкие** — которые можно сделать в любой подходящий момент. Жёсткие идут в календарь, гибкие — в списки по **контекстам**: «за компьютером», «звонки», «в городе», «с руководителем». День строится от жёстких задач, гибкие заполняют окна.", "Круз уточняет: важное должно получить время в календаре, иначе оно проиграет срочному. Дела «из списка» без времени часто переносятся неделями."]}, {"h": "12-недельный год", "p": ["Моран и Леннингтон предлагают отказаться от годового плана в пользу **12-недельных циклов**: при годовом горизонте кажется, что времени много, и действия откладываются. В 12 неделях каждая неделя значима. Структура: видение → цели цикла → **тактики** (регулярные действия) → недельный план → еженедельная оценка выполнения тактик. Хорошим считается выполнение 85 % тактик: оно почти всегда ведёт к целям."]}, {"h": "Планировщик и регулярность", "p": ["Пинтосевич («Будь эффективным!») показывает, что эффективность складывается из мелочей: режим, контроль, окружение. Дмитрий Тарасов, создатель органайзера «Хаос-контроль» (подкаст Маклахова), — о том, что инструмент вторичен: подойдёт и блокнот, если есть регулярный недельный обзор. Оставляйте в расписании 20–30 % буфера на непредвиденное."]}], "steps": ["Сформулируйте 2–3 цели на 12 недель.", "Для каждой выберите тактики — регулярные действия с частотой.", "В воскресенье составьте недельный план: жёсткие задачи в календарь, тактики — на конкретные дни.", "Гибкие задачи разложите по контекстам.", "Оставьте 20–30 % буфера.", "В конце недели посчитайте процент выполненных тактик и скорректируйте план."], "check": ["Цели цикла измеримы.", "Тактики имеют частоту.", "Жёсткие задачи — в календаре, гибкие — в контекстах.", "Есть буфер.", "Еженедельная оценка проводится."], "qa2": [["Почему 12 недель лучше года по Морану?", "Короткий горизонт делает каждую неделю значимой и снижает откладывание."], ["Что такое контекст в планировании Архангельского?", "Условие выполнения задачи: место, инструмент или человек (за компьютером, звонки, в городе)."]]}]}, {"n": 7, "title": "Системы продуктивности", "goal": "Собрать личную систему: всё записано, задачи сформулированы как действия, лишнее делегировано, процесс улучшается.", "lessons": [{"t": "GTD: голова для идей, а не для хранения", "min": 45, "why": "Незаписанные дела крутятся в голове и тратят внимание. Система снимает этот фоновый шум.", "pts": ["Дэвид Аллен (конспект «Как привести дела в порядок» в «Годе личной эффективности»): **пять этапов** — сбор, обработка, организация, обзор, выполнение.", "Сбор: всё, что требует внимания, — во **входящие** (блокнот, приложение). Обработка: для каждого пункта — «Что это? Нужно ли действие?»; если меньше 2 минут — сделать сразу.", "Организация: проекты (всё, что требует больше одного шага), следующие действия по контекстам, «ожидание» (делегировано), «когда-нибудь/может быть», справочные материалы.", "Дорофеев («Джедайские техники»): **опустошайте инбокс** — входящие должны регулярно становиться пустыми, иначе система перестаёт вызывать доверие.", "Дорофеев («Путь джедая»): универсального рецепта нет — собирайте свою систему через самонаблюдение, маленькие «вакцины»-действия и регулярные практики."], "fig": {"k": "flow", "a": ["Сбор|всё во входящие", "Обработка|что это? < 2 мин — сделать", "Организация|проекты, действия, ожидание", "Обзор|еженедельно", "Выполнение|по контексту и энергии"], "cap": "Пять этапов GTD."}, "src": ["godeff|Аллен: пять этапов контроля над работой", "dorofeev|пустой инбокс и доверие к системе", "a63591077|собрать свою систему через самонаблюдение"], "ex": "В голове: «отпуск», «маме подарок», «отчёт». После обработки: проект «Отпуск» → действие «написать Ане, какие даты ей подходят» (контекст: телефон); «Подарок маме» → «посмотреть 3 варианта на Ozon» (компьютер); отчёт → календарь, вторник 10:00.", "err": ["Собирать, но не обрабатывать — входящие превращаются в свалку.", "Пропускать еженедельный обзор: через месяц система «протухает»."], "qa": [["Назовите пять этапов GTD.", "Сбор, обработка, организация, обзор, выполнение."], ["Что делать с задачей меньше 2 минут?", "Сделать сразу при обработке."]], "task": "Проведите «полный сбор»: 30 минут выписывайте всё, что висит в голове. Обработайте список по схеме GTD и проведите первый еженедельный обзор через 7 дней.", "out": "Количество собранных пунктов, сколько стало проектами/действиями/делегировано/удалено + итог обзора.", "rub": [["Сбор полный", "не меньше 40 пунктов из разных сфер"], ["Обработка по схеме", "у каждого пункта есть решение"], ["Действия конкретные", "физические шаги с контекстом"], ["Обзор проведён", "через неделю, с выводами"]], "sample": "Собрано 63 пункта: 9 проектов, 28 действий, 6 «ожидание», 11 «когда-нибудь», 9 удалено. Обзор: 19 действий выполнено, 2 проекта закрыто; добавил контекст «в машине».", "deep": [{"h": "Пять этапов GTD", "p": ["Дэвид Аллен (конспект «Как привести дела в порядок» в «Годе личной эффективности») исходит из того, что голова — плохое хранилище: незакрытые дела создают фоновый шум и тревогу. Пять этапов: **сбор** всего, что требует внимания; **обработка** — что это и нужно ли действие; **организация** — по спискам; **обзор** — еженедельный; **делание** — выбор по контексту, времени, энергии и приоритету.", "При обработке: если действие занимает меньше 2 минут — сделать сразу; если можно поручить — поручить и записать в «ожидание»; если требует нескольких шагов — это **проект**, у которого должно быть следующее физическое действие."]}, {"h": "Списки системы", "p": ["Входящие; проекты; следующие действия по контекстам; ожидание (делегированное); календарь (только жёсткое); «когда-нибудь/может быть»; справочные материалы. Еженедельный обзор — сердце системы: опустошить входящие, пройти проекты, обновить списки. Без обзора система за месяц перестаёт вызывать доверие, и голова снова начинает всё держать сама."]}, {"h": "Своя система по Дорофееву", "p": ["Дорофеев («Джедайские техники») переводит GTD на язык психологии: пустой инбокс экономит **мыслетопливо**. В «Пути джедая» он идёт дальше: универсального рецепта нет, систему собирают под себя через самонаблюдение, маленькие «вакцины»-действия и регулярные практики. Начинать стоит с одного инструмента и одной привычки, а не со сложной системы."]}], "steps": ["За 30–60 минут выпишите во входящие всё, что висит в голове.", "Обработайте каждый пункт: удалить, сделать за 2 минуты, поручить, запланировать, отложить в «когда-нибудь».", "Для проектов определите следующее физическое действие.", "Разложите действия по контекстам.", "Назначьте еженедельный обзор (30–60 минут) в календаре.", "Проведите первый обзор через неделю."], "check": ["Входящие регулярно пустеют.", "У каждого проекта есть следующее действие.", "Делегированное записано в «ожидание».", "Календарь содержит только жёсткие дела.", "Еженедельный обзор проводится."], "qa2": [["Что делать с задачей, которую можно поручить?", "Поручить и записать в список «ожидание», чтобы проконтролировать."], ["Зачем отдельный список «когда-нибудь/может быть»?", "Чтобы идеи не терялись, но и не загромождали активные списки."]]}, {"t": "Мыслетопливо и формулировка задач", "min": 40, "why": "Задачи откладываются не потому, что трудные, а потому, что непонятные. Конкретная формулировка — половина выполнения.", "pts": ["Дорофеев: **мыслетопливо** — ограниченный ресурс осознанных решений; к вечеру его меньше. Тратьте его на важное, а рутину переводите в правила.", "**«Обезьянка»** (лимбическая система) сопротивляется неясному и неприятному. Задача «подумать про отпуск» её пугает; задача «открыть сайт и выбрать 3 отеля до 10 тыс. ₽» — нет.", "Формула задачи: **глагол физического действия + объект + критерий завершения**. Не «сайт», а «написать 5 заголовков для первого экрана».", "Дахигг («Восемь правил эффективности»): мотивация растёт, когда есть **чувство контроля** (выбор); ментальные модели («рассказывать себе, что будет») удерживают фокус; сочетайте большую «растягивающую» цель с SMART-шагами.", "Выпуск подкаста Маклахова с Максом Черепицей — о шквале информации: ограничивать входящие потоки, чтобы оставалось мыслетопливо на свои задачи."], "fig": {"k": "fork", "q": "Как записана задача?", "a": "Размыто: «Подумать про отпуск» → обезьянка сопротивляется → откладываю", "b": "Конкретно: «Открыть сайт и выбрать 3 отеля до 10 тыс. ₽» → понятно → делаю", "cap": "Конкретная формулировка снимает сопротивление."}, "src": ["dorofeev|мыслетопливо, обезьянка, формулировки задач", "a23328659|контроль, ментальные модели, растягивающие + SMART цели", "a27442928|выпуск: как справиться со шквалом информации"], "ex": "«Налоговый вычет» (висит полгода) → «Зайти в Госуслуги и скачать справку 2-НДФЛ» (5 минут) → «Сканировать договор и чеки» → «Заполнить декларацию по шаблону». Через неделю вычет подан.", "err": ["Писать задачи существительными («отчёт», «ремонт»).", "Делать важные решения вечером, когда мыслетоплива нет."], "qa": [["Почему откладываются неясные задачи?", "Обезьянка сопротивляется неопределённости; непонятно, с чего начать."], ["Из чего состоит хорошая формулировка?", "Глагол физического действия, объект, критерий завершения."]], "task": "Найдите в своих списках 10 задач, которые висят дольше двух недель. Переформулируйте каждую по формуле. Выполните три самые маленькие.", "out": "10 пар «было → стало» + отметка о трёх выполненных.", "rub": [["Задачи реальные", "висят дольше двух недель"], ["Формулировки по формуле", "глагол, объект, критерий"], ["Первый шаг маленький", "выполним за 5–30 минут"], ["Три выполнены", "что изменилось"]], "sample": "«Спорт» → «Позвонить в фитнес-клуб у дома и спросить цену годового абонемента». «Резюме» → «Открыть резюме и обновить блок последнего места работы, 3 пункта с цифрами».", "deep": [{"h": "Обезьянка и мыслетопливо", "p": ["Дорофеев использует образ **обезьянки** — лимбической системы, которая реагирует на эмоции и сопротивляется неясному и неприятному. Сознательное мышление расходует **мыслетопливо**, которого к вечеру мало. Когда задача сформулирована туманно («сайт», «отпуск», «налоги»), приходится тратить топливо на то, чтобы понять, что делать, и обезьянка предпочитает отвлечься.", "Отсюда правило: задача записывается как **конкретное физическое действие** с понятным критерием завершения. «Подумать об отпуске» превращается в «открыть сайт и выбрать три отеля до 10 тыс. ₽ за ночь»."]}, {"h": "Восемь правил Дахигга", "p": ["Дахигг («Восемь правил эффективности») собрал исследования о продуктивности: **мотивация** растёт, когда есть чувство контроля и выбора; **команды** работают лучше при психологической безопасности; **фокус** удерживают ментальные модели — привычка заранее представлять, как пройдёт день; **цели** лучше ставить парами: большая «растягивающая» + SMART-шаги; **решения** — через вероятностное мышление; **инновации** — через перенос идей из других областей; **данные** полезнее, когда с ними приходится работать руками."]}, {"h": "Информационный шквал", "p": ["Макс Черепица (подкаст Маклахова), коуч по селф-менеджменту, — о том, как обрабатывать и хранить информацию, не утопая в ней. Практичный вывод: меньше входящих потоков — больше мыслетоплива для своих задач. Сократите подписки, рассылки, чаты; сохраняйте только то, что пригодится для конкретной цели."]}], "steps": ["Найдите 10 задач, которые висят дольше двух недель.", "Переформулируйте каждую: глагол физического действия + объект + критерий завершения.", "Если первое действие больше 30 минут — разбейте мельче.", "Выполните три самые маленькие сразу.", "Утром представьте, как пройдёт день (ментальная модель Дахигга).", "Отпишитесь от 5 лишних информационных потоков."], "check": ["Мои задачи начинаются с глагола.", "У задачи понятно, когда она готова.", "Первое действие занимает не больше 30 минут.", "Важные решения я принимаю в первой половине дня.", "Входящих потоков стало меньше."], "qa2": [["Что такое ментальная модель дня по Дахиггу?", "Привычка заранее представлять, как пройдёт день; это помогает удерживать фокус."], ["Почему задача «налоги» откладывается?", "Она неконкретна: мозг тратит силы на понимание, что делать, и сопротивляется."]]}, {"t": "Делегирование и автоматизация", "min": 40, "why": "Самый быстрый способ сделать дело — не делать его самому. Время освобождается не ускорением, а передачей.", "pts": ["Феррис («4-часовая рабочая неделя»): **DEAL** — Definition, Elimination, Automation, Liberation. Сначала исключить ненужное, затем автоматизировать и делегировать то, что осталось.", "Феррис: делегировать стоит только то, что уже **очищено** от лишнего: «не делегируйте ерунду — исключите её».", "Торбосов («10 бизнес-фишек»), **«король обезьян»**: задача — обезьяна; когда сотрудник приносит её вам («посмотрите, что скажете?»), он пересаживает её на ваши плечи. Возвращайте обезьяну: срок, критерий, «отправь сам, если не отвечу».", "Порядок решения: **исключить → автоматизировать → делегировать → делать самому**.", "Евгений Ходченков (подкаст Маклахова) — о том, как удалённо управлять пятью бизнесами: делегирование держится на регламентах и контрольных точках."], "fig": {"k": "flow", "a": ["Исключить|не делать вовсе", "Автоматизировать|правило, шаблон, сервис", "Делегировать|человеку с критерием", "Сделать самому|если осталось"], "cap": "Проверяйте задачу на каждом шаге по порядку."}, "src": ["ferris4|DEAL: исключение, автоматизация, делегирование", "torbosov|«король обезьян»", "a27442416|выпуск: как удалённо управлять пятью бизнесами"], "ex": "Еженедельный отчёт (2 часа). Исключить: убрать 3 никем не читаемых раздела. Автоматизировать: выгрузка из CRM по расписанию. Делегировать: комментарии к цифрам — помощнику по шаблону. Осталось 20 минут.", "err": ["Делегировать без критерия результата и срока.", "Брать обезьян обратно: «давай я сам, быстрее будет»."], "qa": [["Что означает DEAL?", "Определение, исключение, автоматизация, освобождение."], ["Как вернуть «обезьяну»?", "Назначить срок и критерий, оставить ответственность у сотрудника («если не отвечу до 12 — отправляй»)."]], "task": "Выберите 5 повторяющихся задач, которые занимают у вас больше всего времени. Пропустите каждую через цепочку «исключить → автоматизировать → делегировать → сам». Для одной делегируемой напишите поручение: результат, срок, критерии, ресурсы, точки контроля.", "out": "Таблица 5 задач с решениями + текст одного поручения.", "rub": [["Задачи значимые", "реально съедают время"], ["Цепочка пройдена", "для каждой задачи по порядку"], ["Поручение полное", "результат, срок, критерии, ресурсы, контроль"], ["Экономия посчитана", "часы в неделю"]], "sample": "Поручение: «Каждый понедельник до 11:00 присылай сводку по продажам за неделю по шаблону. Критерий: все 5 метрик заполнены, отклонения >10% прокомментированы. Если есть вопрос — пиши до пятницы».", "deep": [{"h": "DEAL Ферриса", "p": ["Феррис описывает путь к свободе как **DEAL**: **Definition** — определить, чего вы хотите (и посчитать «мечтолайн» — реальную стоимость желаемой жизни); **Elimination** — исключить ненужное по правилу 80/20 и информационной диетой; **Automation** — автоматизировать доход и рутину, делегировать (виртуальные ассистенты, сервисы); **Liberation** — освободиться от привязки к месту через удалённую работу и «мини-пенсии».", "Его важная оговорка: «не автоматизируйте то, что можно исключить, и не делегируйте то, что можно автоматизировать»."]}, {"h": "«Король обезьян»", "p": ["Торбосов («10 бизнес-фишек») использует классический образ «обезьяны» как задачи. Когда сотрудник приходит со словами «посмотрите, что скажете?», он пересаживает обезьяну на плечи руководителя. Если так делают все, у руководителя на шее десяток чужих обезьян. Решение — возвращать задачу: «Отправляй сам; если не отвечу до 12:00 — отправляй как есть»."]}, {"h": "Как поручать", "p": ["Евгений Ходченков (подкаст Маклахова) удалённо управляет несколькими бизнесами; это возможно при регламентах и точках контроля. Хорошее поручение содержит: ожидаемый **результат** (как выглядит «готово»), **срок**, **критерии качества**, **ресурсы и полномочия**, **точки контроля** и правило, что делать при проблеме."]}], "steps": ["Выпишите 5 повторяющихся задач, которые занимают больше всего времени.", "Для каждой задайте вопросы по порядку: можно ли не делать? автоматизировать? поручить?", "Для одной задачи напишите полное поручение.", "Отследите «обезьян» за неделю: сколько задач вам вернули на решение.", "Введите правило возврата обезьяны.", "Посчитайте, сколько часов в неделю освободилось."], "check": ["Исключение рассматривается раньше делегирования.", "Поручение содержит результат, срок, критерии, ресурсы и контроль.", "Чужие задачи возвращаются владельцам.", "Делегированное записано в «ожидание».", "Экономия посчитана."], "qa2": [["Что такое «мечтолайн» по Феррису?", "Расчёт реальной ежемесячной стоимости желаемой жизни вместо абстрактной «большой суммы»."], ["Что значит «вернуть обезьяну»?", "Оставить ответственность за задачу у сотрудника, дав срок и правило действий."]]}, {"t": "Бережливость и непрерывное улучшение", "min": 40, "why": "Система, которую не улучшают, деградирует. Маленькие улучшения каждый день побеждают большие реформы раз в год.", "pts": ["Пол Эйкерс («2 секунды бережливости», конспект в «Годе личной эффективности»): каждый день улучшайте процесс хотя бы на 2 секунды. **Восемь видов потерь** — перепроизводство, ожидание, лишние перемещения, лишняя обработка, запасы, дефекты, транспортировка, неиспользованный талант.", "Джефф Сазерленд («Scrum»): работа короткими **спринтами** с доской задач «сделать / в работе / готово», ежедневной короткой сверкой и ретроспективой. Scrum работает и в личной жизни (ремонт, свадьба).", "Голдратт («Цель»): у любой системы есть **ограничение** — самое узкое место. Улучшения вне узкого места ничего не дают. Пять шагов: найти, выжать максимум, подчинить остальное, расширить, повторить.", "Центр финансовой культуры: оценивайте задачи по шкале «легко / быстро / дёшево / высокий эффект» и внедряйте сначала набравшие 4 и 3 балла — быстрые победы дают ресурс на трудные."], "fig": {"k": "flow", "a": ["Найти ограничение|узкое место", "Выжать максимум|без вложений", "Подчинить|всё остальное ему", "Расширить|вложиться", "Повторить|ищем новое"], "cap": "Пять шагов теории ограничений Голдратта."}, "src": ["godeff|Эйкерс (бережливость) и Сазерленд (Scrum)", "a6734534|теория ограничений: узкое место системы", "cfc|оценка задач по шкале и быстрые победы"], "ex": "Узкое место утра — сборы ребёнка в школу (25 минут). Выжать: одежда с вечера, рюкзак у двери. Подчинить: завтрак готовлю, пока ребёнок одевается. Итог: 12 минут.", "err": ["Улучшать то, что и так не мешает, игнорируя узкое место.", "Запускать большую реформу вместо ежедневных маленьких шагов."], "qa": [["Что такое ограничение по Голдратту?", "Самое узкое место системы, определяющее её общую производительность."], ["Какие три элемента Scrum можно перенести в личную жизнь?", "Спринт, доска задач, ретроспектива (и короткая ежедневная сверка)."]], "task": "Выберите один повторяющийся процесс (утро, уборка, отчёт, закупки). Опишите шаги и время, найдите узкое место и потери. Внедрите два улучшения и замерьте результат через неделю.", "out": "Схема процесса с временем, узкое место, потери, два улучшения, замер до/после.", "rub": [["Процесс описан", "шаги и время"], ["Узкое место найдено", "с данными"], ["Улучшения точечные", "направлены на узкое место или потери"], ["Есть замер", "до и после"]], "sample": "Процесс: закупка продуктов (2 ч в неделю). Потери: лишние поездки, забытые продукты. Улучшения: постоянный список в заметках, доставка по субботам. Итог: 35 минут.", "deep": [{"h": "Теория ограничений Голдратта", "p": ["Роман «Цель» рассказывает, как управляющий спасает завод. Главная мысль: производительность системы определяется её **узким местом** (ограничением). Час, потерянный на узком месте, — потерянный час всей системы; час, сэкономленный в другом месте, — мираж. Знаменитый пример — поход скаутов, где скорость колонны определяется самым медленным мальчиком.", "Пять шагов: **найти** ограничение; **выжать** из него максимум без вложений; **подчинить** ему остальные процессы; **расширить** ограничение; **повторить**, не давая инерции стать новым ограничением."]}, {"h": "Бережливость и восемь потерь", "p": ["Пол Эйкерс (конспект «2 секунды бережливости» в «Годе личной эффективности») переносит бережливое производство на всё: каждый день улучшать процесс хотя бы на 2 секунды. Потери: перепроизводство, ожидание, лишние перемещения, лишняя обработка, запасы, дефекты, транспортировка и неиспользованный талант людей. Главное, по Эйкерсу, — культура постоянного улучшения, а не разовые мероприятия."]}, {"h": "Scrum и быстрые победы", "p": ["Джефф Сазерленд («Scrum») предлагает работать **спринтами** (1–4 недели) с доской задач «сделать / в работе / готово», короткими ежедневными сверками и ретроспективой «что улучшить». Это работает и в личных проектах — ремонт, свадьба, переезд.", "Центр финансовой культуры советует оценивать улучшения по четырём признакам — легко, быстро, дёшево, высокий эффект — и внедрять первыми те, что набрали 4 и 3 балла: быстрые победы дают ресурс на сложные."]}], "steps": ["Выберите повторяющийся процесс (утро, отчёт, уборка, закупки).", "Распишите шаги и время каждого.", "Найдите узкое место и потери.", "Придумайте 5 улучшений и оцените их по шкале легко/быстро/дёшево/эффект.", "Внедрите два лучших.", "Через неделю замерьте процесс снова и проведите мини-ретроспективу."], "check": ["Процесс описан с временем шагов.", "Улучшения направлены на узкое место.", "Есть оценка улучшений по шкале.", "Есть замер до и после.", "Есть следующий шаг улучшения."], "qa2": [["Почему улучшение вне узкого места бесполезно?", "Производительность всей системы определяется ограничением; ускорение других участков её не меняет."], ["Что происходит на ретроспективе Scrum?", "Команда (или вы сами) разбирает, что сработало и что улучшить в следующем спринте."]]}]}, {"n": 8, "title": "Прокрастинация и фокус", "goal": "Понять механизм откладывания, вернуть контроль над вниманием и доводить проекты до конца.", "lessons": [{"t": "Почему мы откладываем", "min": 40, "why": "Прокрастинация — не лень, а способ справиться с неприятными чувствами. Пока не понят механизм, советы «просто начни» не работают.", "pts": ["Фьоре («Лёгкий способ перестать откладывать»): прокрастинация — **защита от страха** неудачи, оценки и перфекционизма. Мы откладываем, чтобы не чувствовать угрозу.", "Инструменты Фьоре: **«незапланированное расписание»** — сначала вписать в неделю отдых, встречи и удовольствия, а потом искать окна для работы; учитывать только 30-минутные отрезки качественной работы; язык «я выбираю» вместо «я должен».", "Прессфилд («Война за креатив»): **Сопротивление** сильнее всего перед самым важным делом. Его побеждает профессионал: приходит работать каждый день, не дожидаясь вдохновения.", "Зарудный и Жданов («Легко и просто»): долгие проекты требуют заботы о своём психологическом состоянии — без насилия над собой, с понятными маленькими шагами и поддержкой.", "Скотт («23 привычки против прокрастинации»): правило 2 минут, ограничение входящих, один фокус и ежедневный обзор."], "fig": {"k": "flow", "a": ["Задача кажется угрозой|оценка, провал", "Тревога", "Откладывание|облегчение", "Вина и спешка", "Задача ещё страшнее"], "cap": "Петля прокрастинации: облегчение сейчас усиливает угрозу потом."}, "src": ["fiore|прокрастинация как защита и незапланированное расписание", "pressfield|Сопротивление и профессионал", "a63125498|долгие проекты без насилия над собой", "scott|23 привычки против прокрастинации"], "ex": "Откладываю диплом. Чувство: «если напишу плохо — значит, я глупый». Фьоре: вписал отдых и встречи, нашёл 5 окон по 30 минут, задача окна — «написать плохой черновик 1 страницы». За неделю — 5 страниц.", "err": ["Ругать себя за лень — это добавляет угрозы и усиливает петлю.", "Ждать вдохновения перед важной работой."], "qa": [["От чего защищает прокрастинация по Фьоре?", "От страха неудачи, оценки, перфекционизма — от угрозы, которую несёт задача."], ["Что такое незапланированное расписание?", "Сначала в неделю вписывается отдых и обязательства, затем находятся окна для работы."]], "task": "Выберите задачу, которую откладываете дольше всего. Опишите чувство и «угрозу», которую она несёт. Составьте незапланированное расписание на неделю и поработайте над задачей минимум в трёх 30-минутных окнах.", "out": "Анализ чувства и угрозы + расписание + отчёт о трёх окнах.", "rub": [["Чувство названо", "не «лень», а конкретная эмоция и угроза"], ["Расписание по Фьоре", "отдых и обязательства вписаны первыми"], ["Окна использованы", "3 окна по 30 минут"], ["Язык выбора", "фразы «я решаю», «я выбираю»"]], "sample": "Задача: налоговая декларация. Угроза: «запутаюсь и ошибусь». Окна: пн 19:00, ср 7:30, сб 11:00. Итог: декларация заполнена на 80%. «Я решаю закончить в воскресенье».", "deep": [{"h": "Прокрастинация как защита", "p": ["Фьоре, психолог, описывает прокрастинацию не как лень, а как механизм справляться со страхом: неудачи, оценки, успеха (за которым последуют новые требования), а также с ощущением навязанности («я должен»). Откладывание даёт временное облегчение — и потому закрепляется.", "Его инструменты: **язык выбора** («я решаю», «я выбираю начать») вместо «я должен»; учитывать только **30 минут качественной работы** как единицу успеха; заранее планировать отдых и удовольствия, чтобы работа не отнимала всю жизнь."]}, {"h": "Незапланированное расписание", "p": ["Метод Фьоре парадоксален: сначала в неделю вписываются **все обязательства и отдых** — сон, еда, встречи, спорт, досуг. Оставшиеся окна показывают, сколько времени реально есть на работу. После каждых 30 минут работы — отметка. Так видно, что работы сделано больше, чем казалось, и нет ощущения, что дело съедает всю жизнь."]}, {"h": "Сопротивление и долгие проекты", "p": ["Прессфилд («Война за креатив») называет силу, мешающую важной работе, **Сопротивлением**: чем важнее дело, тем оно сильнее. Побеждает его профессионал — человек, который приходит работать каждый день независимо от вдохновения.", "Зарудный и Жданов («Легко и просто») смотрят мягче: долгие проекты требуют заботы о психологическом состоянии — понятных маленьких шагов, поддержки и отказа от насилия над собой. Скотт («23 привычки») дополняет приёмами: правило 2 минут, одна задача за раз, ежедневный обзор."]}], "steps": ["Выберите задачу, которую откладываете дольше всего.", "Назовите чувство и «угрозу», которую она несёт.", "Составьте незапланированное расписание: сначала обязательства и отдых.", "Найдите 3–5 окон по 30 минут.", "В каждом окне — «плохой черновик» или первый маленький шаг.", "Отмечайте каждые 30 минут работы и говорите «я решаю», а не «я должен»."], "check": ["Названо чувство, а не «лень».", "Отдых вписан первым.", "Окна по 30 минут использованы.", "Я отмечаю сделанное.", "Язык выбора вместо долженствования."], "qa2": [["Почему Фьоре советует сначала вписывать отдых?", "Чтобы работа не воспринималась как то, что съедает всю жизнь, и снизилось сопротивление."], ["Что такое Сопротивление у Прессфилда?", "Внутренняя сила, мешающая важной работе; она тем сильнее, чем важнее дело."]]}, {"t": "Внимание в цифровую эпоху", "min": 40, "why": "Внимание — главный ресурс знаниевой работы, и именно его забирают уведомления и переключения.", "pts": ["Креншоу («Миф о многозадачности»): многозадачности не бывает — есть **переключение**, и каждое стоит времени, качества и нервов. Решение — договариваться о времени ответов и группировать дела.", "Глория Марк («Метавнимание»): исследования показывают, что внимание на экране переключается каждые несколько десятков секунд. **Метавнимание** — способность замечать, куда уходит внимание, и возвращать его.", "Дэниел Сиберг («Цифровая диета», конспект в «Годе личной эффективности»): учёт времени в гаджетах, отключение лишних уведомлений, «цифровая уборка», время без устройств.", "Практика: **блоки фокуса** (45–90 минут без уведомлений), проверка почты и мессенджеров по расписанию, телефон вне зоны видимости.", "Глория Марк также предупреждает: внимание нуждается в отдыхе — «бездумные» короткие занятия бывают полезны как пауза, если они выбраны осознанно."], "fig": {"k": "curve", "pts": [[0, 3], [10, 8], [30, 8.5], [31, 3], [45, 7], [55, 7.5], [56, 2.5], [75, 6], [100, 6.5]], "marks": [[31, "уведомление"], [56, "«проверю почту»"]], "xl": "время работы", "yl": "глубина внимания", "cap": "Каждое переключение обнуляет погружение; на возврат уходят минуты."}, "src": ["crenshaw|переключение вместо многозадачности", "a71330419|метавнимание и ритмы внимания", "godeff|Сиберг: цифровая диета"], "ex": "Было: почта и мессенджер открыты весь день. Стало: два блока фокуса по 90 минут утром, мессенджеры в 11:00, 14:00, 17:00. Коллегам сказано: «срочное — звонком».", "err": ["Отключить всё «навсегда» и сорваться через два дня.", "Считать, что умеете работать в многозадачности, потому что «привыкли»."], "qa": [["Почему многозадачность — миф?", "Мозг не выполняет две осознанные задачи одновременно, а переключается, теряя время и качество."], ["Что такое метавнимание?", "Способность замечать, куда уходит внимание, и сознательно его возвращать."]], "task": "Посмотрите статистику экранного времени за неделю. Проведите «цифровую уборку»: отключите уведомления, уберите отвлекающие приложения с первого экрана. Назначьте два блока фокуса в день и окна для связи. Через 5 дней сравните экранное время и количество сделанного.", "out": "Статистика до/после + список изменений + отчёт о блоках фокуса.", "rub": [["Есть исходные данные", "экранное время и разблокировки"], ["Уборка проведена", "конкретные отключения"], ["Блоки фокуса", "время, длительность, правила"], ["Сравнение", "цифры до и после"]], "sample": "Экранное время: 5 ч 10 мин → 3 ч 05 мин. Разблокировки: 112 → 58. Блоки: 9:00–10:30 и 14:00–15:00. За неделю закрыт отчёт, который висел месяц.", "deep": [{"h": "Цена переключения", "p": ["Креншоу в притче «Миф о многозадачности» показывает: мы не делаем два дела одновременно, а **переключаемся**, и каждое переключение стоит времени, качества и сил. Особенно дорого обходятся «фоновые» переключения: открытая почта, уведомления, коллеги «на секунду». Его решение — договориться с окружением о времени ответов и проводить встречи по расписанию."]}, {"h": "Метавнимание", "p": ["Глория Марк (саммари «Метавнимание»), исследователь внимания, приводит данные: внимание на экране переключается в среднем примерно каждые 47 секунд, а после прерывания возврат к задаче занимает много времени. Она вводит понятие **метавнимания** — способности замечать, куда уходит внимание, и сознательно возвращать его.", "Важная мысль Марк: у внимания есть ритм, и полностью «рутинные», не требующие усилий занятия иногда полезны как пауза, если выбраны осознанно, — проблема не в отдыхе, а в автоматическом переключении."]}, {"h": "Цифровая диета", "p": ["Дэниел Сиберг (конспект в «Годе личной эффективности») предлагает «цифровую диету»: учёт времени в гаджетах, отключение лишних уведомлений, уборку цифрового хлама, периоды без устройств. Практичный минимум: телефон вне поля зрения во время работы, мессенджеры по расписанию, уведомления только от людей."]}], "steps": ["Посмотрите статистику экранного времени и разблокировок за неделю.", "Отключите все уведомления, кроме звонков и важных людей.", "Уберите отвлекающие приложения с первого экрана.", "Назначьте 2 блока фокуса в день и окна для связи.", "Сообщите коллегам и близким, как с вами связаться срочно.", "Через 5 дней сравните статистику и количество сделанного."], "check": ["Есть исходные данные.", "Уведомления отключены.", "Блоки фокуса стоят в календаре.", "Окружение знает правила связи.", "Есть сравнение до и после."], "qa2": [["Что такое метавнимание?", "Умение замечать, куда уходит внимание, и сознательно его возвращать."], ["Почему «фоновые» переключения особенно дороги?", "Они незаметны, но постоянно прерывают погружение и требуют времени на возврат."]]}, {"t": "Начать и закончить", "min": 40, "why": "Начинать проекты легко — заканчивать трудно. Энергия начала быстро тает, а финиш требует отдельной стратегии.", "pts": ["Джон Эйкафф («Закончи то, что начал»): главный враг финиша — **перфекционизм**. Самый опасный момент — **«день после идеального»**, когда что-то пошло не так и хочется бросить.", "Советы Эйкаффа: **сократите цель вдвое** или удвойте срок; **решите заранее, что вы позволите себе «провалить»** (что не будет идеальным); сделайте процесс приятным; уберите тайные правила вроде «если не сложно — не считается».", "Скотт: **правило 2 минут** для старта и «разбить на части» для больших задач.", "Фьоре: начинайте с маленького, предсказуемо успешного шага — «плохой черновик», «пять минут».", "Финиш — тоже навык: заранее определите **критерий готовности** («готово, когда…»)."], "fig": {"k": "curve", "pts": [[0, 9], [15, 7], [30, 3], [50, 4], [75, 5], [90, 7], [100, 9]], "marks": [[30, "«день после идеального»"], [90, "финишная прямая"]], "xl": "ход проекта", "yl": "мотивация", "cap": "Мотивация проседает в середине. План должен заранее учитывать этот провал."}, "src": ["a38840284|перфекционизм, «день после идеального», цель вдвое", "scott|правило 2 минут", "fiore|маленький успешный шаг", "fastres|быстрые результаты через ежедневные отчёты"], "ex": "Цель «написать 12 статей за 3 месяца» → сокращена до 6. Что «провалю»: не буду делать красивые иллюстрации. Критерий готовности: 5000 знаков, 3 примера, опубликовано. Результат: 7 статей.", "err": ["Бросать после первого срыва, вместо того чтобы вернуться на следующий день.", "Не иметь критерия готовности и бесконечно «дорабатывать»."], "qa": [["Что такое «день после идеального»?", "Момент, когда впервые что-то пошло не так и хочется бросить весь проект."], ["Какой совет Эйкаффа про размер цели?", "Сократить цель вдвое или удвоить срок."]], "task": "Возьмите незаконченный проект. Перепишите цель по Эйкаффу (вдвое меньше или срок вдвое больше), решите, что позволите себе сделать неидеально, задайте критерий готовности и план на случай «дня после идеального».", "out": "Старая и новая цель, список «провалю сознательно», критерий готовности, план на срыв.", "rub": [["Цель пересмотрена", "вдвое меньше или срок вдвое больше"], ["Есть список «неидеально»", "конкретные пункты"], ["Критерий готовности", "проверяемый"], ["План на срыв", "что сделаю в день срыва"]], "sample": "Было: «выучить испанский до B2 за год». Стало: «A2 за год». Неидеально: произношение. Готово: сдан тест A2. План на срыв: на следующий день 10 минут Duolingo, без «наверстать всё».", "deep": [{"h": "Враг финиша — перфекционизм", "p": ["Эйкафф («Закончи то, что начал») пишет: большинство людей бросают не потому, что ленивы, а потому, что перфекционизм говорит «если не идеально — не стоит». Особенно опасен **«день после идеального»** — первый день, когда что-то пошло не так: пропустил тренировку, сорвал срок. Здесь чаще всего и бросают проект целиком."]}, {"h": "Приёмы Эйкаффа", "p": ["**Сократите цель вдвое** или удвойте срок — так она перестаёт быть невыполнимой. **Выберите, что провалить**: сознательно решите, какие сферы временно останутся «неидеальными» (меньше соцсетей, проще ужины). **Сделайте процесс приятным**: удовольствие — законное топливо. **Найдите тайные правила**: «если это не трудно — не считается», «отдых надо заработать». **Используйте данные**: отмечайте прогресс."]}, {"h": "Начать легко", "p": ["Скотт предлагает **правило 2 минут**: начать на две минуты — дальше обычно продолжаешь. Фьоре — первый шаг, гарантированно успешный («плохой черновик», «одна страница»). Парабеллум и Мрочковский («Быстрые результаты») — ежедневная отчётность и быстрые победы, которые создают импульс. Чтобы закончить, заранее определите **критерий готовности**: без него проект бесконечно «дорабатывается»."]}], "steps": ["Возьмите незаконченный проект.", "Сократите цель вдвое или удвойте срок.", "Запишите, что сознательно сделаете неидеально.", "Сформулируйте критерий готовности.", "Подготовьте план на «день после идеального»: что делаю на следующий день после срыва.", "Начинайте каждую сессию с 2 минут и отмечайте прогресс."], "check": ["Цель стала реалистичной.", "Есть список «провалю сознательно».", "Критерий готовности проверяемый.", "План на срыв записан.", "Прогресс отмечается."], "qa2": [["Что такое тайные правила по Эйкаффу?", "Неосознанные установки вроде «если не трудно — не считается», которые мешают закончить."], ["Зачем нужен критерий готовности?", "Без него проект бесконечно дорабатывается и никогда не завершается."]]}, {"t": "Глубокая работа и состояние потока", "min": 40, "why": "Самые ценные результаты рождаются в длинных отрезках полной концентрации. Их можно создавать намеренно.", "pts": ["Котлер и Уил («Похищая огонь»): **поток** — состояние полной вовлечённости, когда исчезает ощущение времени и «я». Оно резко повышает продуктивность и творчество.", "Условия потока: ясная цель, немедленная обратная связь, **баланс сложности и навыка** (задача чуть выше вашего уровня), отсутствие отвлечений.", "Котлер и Уил предупреждают о **ловушке**: погоня за «пиками» без интеграции опыта в обычную жизнь ведёт к зависимости и выгоранию.", "Келлер («Единственная вещь»): **блок времени** под главное — 4 часа в день, защищённые как встреча с самым важным клиентом.", "Ритуал входа: одно и то же место, время, музыка, напиток — мозг учится быстрее погружаться."], "fig": {"k": "quad", "c": "Поток = сложность ≈ навык", "a": ["Сложно, навык низкий → тревога", "Сложно, навык высокий → поток", "Просто, навык низкий → апатия", "Просто, навык высокий → скука"], "cap": "Подбирайте задачу на шаг выше текущего уровня."}, "src": ["kotler_fire|поток, его условия и ловушки", "keller|блок времени под главное", "crenshaw|одна задача за раз"], "ex": "Ритуал: 8:30, библиотека, наушники с одним и тем же альбомом, чай. 90 минут работы над моделью без телефона. Задача на шаг сложнее вчерашней. За месяц — 3 раза в неделю стабильное погружение.", "err": ["Ставить блок фокуса на время, когда энергии нет.", "Брать задачу слишком лёгкую (скука) или слишком сложную (тревога)."], "qa": [["Какие условия потока важнее всего?", "Ясная цель, обратная связь, баланс сложности и навыка, отсутствие отвлечений."], ["В чём ловушка погони за потоком?", "Зависимость от пиковых состояний без интеграции в обычную жизнь."]], "task": "Спроектируйте ритуал глубокой работы: время, место, длительность, сигналы входа, правила (без чего работаете). Проведите 4 сессии и оцените каждую по шкале погружения 1–10.", "out": "Описание ритуала + 4 сессии с оценками и выводами.", "rub": [["Ритуал конкретен", "время, место, сигналы"], ["Задачи подобраны", "чуть выше уровня навыка"], ["Отвлечения убраны", "перечислено, как"], ["Есть оценка", "4 сессии и вывод"]], "sample": "Ритуал: 7:00–8:30, кухня, кофе, телефон в другой комнате, таймер. Сессии: 6, 7, 8, 5 (в четверг недоспал). Вывод: добавить правило «после недосыпа — лёгкая задача».", "deep": [{"h": "Что такое поток", "p": ["Котлер и Уил («Похищая огонь») описывают **поток** — состояние полной вовлечённости, когда исчезает ощущение времени и самокритика, а продуктивность и творчество резко растут. Они называют четыре силы, которые делают такие состояния доступнее: психологию (практики внимания, медитация), нейробиологию, технологии (обратная связь, VR) и физиологию (движение, дыхание).", "Условия потока: **ясная цель**, **немедленная обратная связь**, **баланс сложности и навыка** (задача чуть выше текущего уровня), **отсутствие отвлечений**. Слишком легко — скука, слишком трудно — тревога."]}, {"h": "Ловушки погони за пиками", "p": ["Авторы предупреждают: погоня за изменёнными состояниями без интеграции опыта в обычную жизнь ведёт к зависимости, выгоранию и «похмелью» после пиков. Поток — инструмент работы, а не самоцель."]}, {"h": "Блок времени под главное", "p": ["Келлер («Единственная вещь») советует защищать ежедневный **блок времени** под главное дело — до 4 часов утром — так, будто это встреча с самым важным клиентом: не переносить, не отвлекаться, предупредить окружающих. Креншоу добавляет: одна задача за раз — условие любого погружения."]}], "steps": ["Определите задачу, требующую глубокой работы.", "Выберите время и место для блока 60–120 минут.", "Подготовьте ритуал входа: одно и то же место, напиток, музыка или тишина.", "Уберите отвлечения: телефон в другой комнате, уведомления выключены.", "Подберите сложность на шаг выше привычной и ясную цель сессии.", "После сессии оцените погружение (1–10) и что помешало."], "check": ["Блок стоит в календаре и защищён.", "Есть ритуал входа.", "Отвлечения убраны.", "Задача чуть сложнее текущего уровня.", "Я веду оценку погружения."], "qa2": [["Какой баланс сложности нужен для потока?", "Задача немного выше уровня навыка: слишком легко — скука, слишком трудно — тревога."], ["Почему поток опасно делать самоцелью?", "Погоня за пиками без интеграции ведёт к зависимости и выгоранию."]]}]}, {"n": 9, "title": "Порядок: дом, вещи, удалёнка, семья", "goal": "Перевести быт и домашнюю работу в систему, освободить пространство от лишнего и наладить время в семье.", "lessons": [{"t": "Дом как система, а не вечная уборка", "min": 40, "why": "Хаос дома съедает время и внимание так же, как хаос в задачах. Система быта освобождает часы каждую неделю.", "pts": ["Анна Семенова («Дом в радость»): начните с **точек опоры** (что для вас значит «дом в порядке»), определите **ключевые зоны**, выработайте маршруты ежедневной уборки и расписание больших дел.", "Валентина Красникова («Порядок раз и навсегда», мама 17 детей): хозяйка — **управленец, а не уборщица**. Дом — это процессы: закупки, еда, стирка, уборка, — и у каждого есть ответственный и регламент.", "Правило «**у каждой вещи есть адрес**»: вещь без места превращается в беспорядок.", "Ежедневный минимум (15 минут) экономит выходные: короткие маршруты по зонам вместо генеральной уборки раз в месяц.", "Делегирование дома: дети и партнёр получают **зоны**, а не разовые просьбы."], "fig": {"k": "hub", "c": "Дом-система", "a": ["Закупки", "Еда", "Стирка", "Уборка", "Финансы дома", "Дети", "Ремонт", "Отдых"], "cap": "Для каждого процесса: кто отвечает, как часто, по какому правилу."}, "src": ["semenova|точки опоры, зоны, маршруты", "a71477242|хозяйка как управленец; процессы дома"], "ex": "Процесс «еда»: меню на неделю в воскресенье (15 минут), один заказ продуктов, заготовки на 3 дня. Ответственный — я, мытьё посуды — сын (зона), мусор — муж (зона).", "err": ["Пытаться навести порядок «раз и навсегда» за один выходной.", "Делегировать разово («убери, пожалуйста»), а не зонами."], "qa": [["Что такое точки опоры по Семеновой?", "Ваши критерии «дома в порядке», от которых строится система."], ["Чем зона отличается от поручения?", "Зона — постоянная ответственность за участок; поручение — разовая просьба."]], "task": "Опишите 6–8 процессов вашего дома: кто отвечает, частота, правило. Составьте ежедневный 15-минутный маршрут и распределите хотя бы две зоны между членами семьи.", "out": "Таблица процессов + ежедневный маршрут + распределение зон.", "rub": [["Процессы полные", "охвачены основные домашние дела"], ["Есть ответственные", "у каждого процесса"], ["Маршрут реалистичен", "15–20 минут"], ["Зоны распределены", "договорённость с семьёй"]], "sample": "Стирка: я, по вт и пт, правило — сортировка в корзинах. Уборка: маршрут 15 мин (кухня → ванная → прихожая). Зоны: дочь — своя комната и цветы, муж — мусор и машина.", "deep": [{"h": "Точки опоры и зоны", "p": ["Семенова («Дом в радость») начинает не с уборки, а с вопроса: что для вас значит «дом в порядке»? Это **точки опоры** — несколько признаков, при которых вам хорошо (чистая раковина вечером, свободный стол, бельё не копится). Затем выделяются **ключевые зоны** — места, от которых зависит ощущение порядка, — и для них создаются короткие ежедневные **маршруты**: 10–15 минут по одному пути.", "Большие дела (окна, шкафы, балкон) раскладываются по календарю — по одному в неделю, а не «генеральной уборкой» раз в полгода."]}, {"h": "Хозяйка как управленец", "p": ["Красникова («Порядок раз и навсегда»), мама 17 детей, смотрит на дом как на организацию: у хозяйки — роль менеджера, а не уборщицы. Процессы (еда, стирка, закупки, уборка, учёба детей) описываются, у каждого есть ответственный и правило. Дети получают **зоны ответственности** по возрасту, а не разовые поручения — так формируется самостоятельность."]}, {"h": "Адрес у каждой вещи", "p": ["Беспорядок чаще всего — это вещи без места. Правило: каждая вещь имеет «адрес», и после использования возвращается туда. Если адрес неудобен, вещь не будут возвращать — значит, адрес надо поменять, а не ругать домашних."]}], "steps": ["Запишите 5 точек опоры — признаков порядка для вас.", "Выделите 3–4 ключевые зоны.", "Составьте ежедневный маршрут на 15 минут.", "Опишите 6–8 домашних процессов: ответственный, частота, правило.", "Распределите зоны между членами семьи и договоритесь.", "Разложите большие дела по неделям месяца."], "check": ["Точки опоры записаны.", "Ежедневный маршрут не дольше 20 минут.", "У каждого процесса есть ответственный.", "У вещей есть удобный адрес.", "Большие дела распределены по календарю."], "qa2": [["Что такое точки опоры по Семеновой?", "Признаки, по которым вы считаете дом «в порядке»."], ["Почему зоны лучше разовых поручений?", "Они формируют постоянную ответственность и самостоятельность, а не зависимость от напоминаний."]]}, {"t": "Минимализм: меньше вещей — больше жизни", "min": 35, "why": "Каждая вещь требует внимания: хранения, уборки, ремонта. Лишнее отнимает время и энергию незаметно.", "pts": ["Джошуа Беккер («Дом минималиста»): владея меньшим, вы получаете больше времени и свободы для важного — близких, хобби, путешествий.", "Метод **«комната за комнатой»**: начните с самого простого места (прихожая, ванная), чтобы быстро увидеть результат, и лишь потом переходите к сложному (воспоминания, подарки).", "Вопросы для каждой вещи: «Пользовался ли я этим за последний год?», «Купил бы снова?», «Что эта вещь даёт моей жизни?».", "Новые вещи: правило **«одна вошла — одна вышла»** и пауза 30 дней перед необязательной покупкой.", "Минимализм — не аскеза, а **осознанность**: оставить то, что служит вашим ценностям (неделя 2)."], "fig": {"k": "flow", "a": ["Простая зона|быстрый результат", "Вопросы к вещи|пользуюсь? куплю снова?", "Решение|оставить / отдать / продать / выбросить", "Правило входа|одна вошла — одна вышла"], "cap": "Расхламление по Беккеру: от простого к сложному."}, "src": ["a57473616|комната за комнатой и правила минимализма", "semenova|расхламление как часть системы быта"], "ex": "Шкаф: 120 вещей. После вопросов осталось 54. Продано 12 вещей на Авито (8 400 ₽), 40 отдано в благотворительный фонд. Сборы утром сократились с 15 до 5 минут.", "err": ["Начинать с самого эмоционального (фотографии, подарки).", "Расхламиться и тут же купить «органайзеры» для оставшегося хаоса."], "qa": [["С чего Беккер советует начинать?", "С простых зон, где быстро виден результат."], ["Какое правило помогает не накопить заново?", "«Одна вошла — одна вышла» и пауза перед необязательной покупкой."]], "task": "Выберите две зоны дома. Пройдите их по вопросам Беккера, посчитайте вещи до и после и решения по категориям. Введите правило входа новых вещей на месяц.", "out": "Две зоны: число вещей до/после, распределение решений, правило входа.", "rub": [["Зоны пройдены полностью", "все вещи рассмотрены"], ["Вопросы применены", "есть пример решения"], ["Есть цифры", "до/после"], ["Правило входа", "сформулировано"]], "sample": "Ванная: 47 → 21 предмет. Кухня: 3 сковороды из 7 оставлены, 2 продано. Правило: перед покупкой одежды — 30 дней в списке желаний.", "deep": [{"h": "Зачем владеть меньшим", "p": ["Беккер («Дом минималиста») показывает минимализм не как аскезу, а как способ освободить время, деньги и внимание для важного: меньше уборки, ремонта, поиска, меньше трат. Каждая вещь требует места и заботы, и её «стоимость» гораздо выше цены покупки."]}, {"h": "Комната за комнатой", "p": ["Метод Беккера: начинать с самого лёгкого (прихожая, ванная, машина), чтобы быстро увидеть результат и получить мотивацию, и только потом переходить к сложному — одежде, книгам, бумагам и вещам с воспоминаниями. Вещи раскладываются на четыре группы: оставить, отдать, продать, выбросить. Вопросы: пользовался ли я этим за год? купил бы снова? что эта вещь даёт моей жизни?"]}, {"h": "Как не накопить заново", "p": ["Правило **«одна вошла — одна вышла»**, список желаний с паузой 30 дней перед необязательной покупкой, отказ от «запасов на всякий случай». Связь с уроком 2.1: оставляйте то, что служит вашим ценностям."]}], "steps": ["Выберите самую простую зону.", "Достаньте все вещи и рассортируйте на четыре группы.", "Посчитайте количество до и после.", "Продайте или отдайте отобранное в течение недели — не храните «на вынос».", "Переходите к следующей зоне по сложности.", "Введите правило входа новых вещей на месяц."], "check": ["Начал(а) с простой зоны.", "Отобранное ушло из дома за неделю.", "Есть цифры до и после.", "Введено правило входа.", "Вещи с воспоминаниями оставлены на конец."], "qa2": [["Почему начинать нужно с простых зон?", "Быстрый видимый результат даёт мотивацию на сложные."], ["Что такое список желаний с паузой?", "Отложить необязательную покупку на 30 дней и купить, только если желание сохранилось."]]}, {"t": "Удалённая работа без хаоса", "min": 35, "why": "Дом без границ превращается в офис, который никогда не закрывается, — или в отдых, который никогда не заканчивается.", "pts": ["Куртц («Как не сойти с ума, работая из дома»): удалёнка требует **границ** — отдельного рабочего места, распорядка и ритуалов начала и конца дня.", "Ритуал начала: одеться «на работу», план дня; ритуал конца: закрыть ноутбук, записать задачи на завтра, выйти на прогулку — «дорога домой».", "Договорённости с семьёй: сигнал «я работаю» (закрытая дверь, наушники) и время, когда вы доступны.", "Связь с коллегами: регулярные созвоны и письменные статусы снижают изоляцию и недопонимание.", "Феррис показывает обратную сторону: удалённая работа — шаг к **«освобождению»** (L в DEAL), если вы договорились об измеримом результате, а не о присутствии онлайн."], "fig": {"k": "lines", "rows": [{"name": "Без границ", "segs": [[0, 100, "работа и быт вперемешку"]]}, {"name": "С границами", "segs": [[5, 15, "ритуал"], [15, 55, "работа"], [55, 65, "обед"], [65, 90, "работа"], [90, 97, "конец"]]}], "cap": "Ритуалы начала и конца создают «стены» офиса там, где их нет."}, "src": ["kurtz|границы, рабочее место, ритуалы", "ferris4|удалёнка как освобождение при измеримом результате"], "ex": "Рабочее место — угол спальни с ширмой. 9:00 — кофе и план, 9:15–13:00 работа, 13:00 обед вне дома, 14:00–18:00, 18:00 — запись задач на завтра и 20 минут прогулки.", "err": ["Работать с кровати или дивана.", "Отвечать на рабочие сообщения в 23:00, потому что «я же дома»."], "qa": [["Зачем нужен ритуал окончания дня?", "Он заменяет «дорогу домой» и отделяет работу от личной жизни."], ["О чём договориться с работодателем для свободы удалёнки?", "Об измеримом результате, а не о присутствии онлайн."]], "task": "Опишите свои правила удалённой (или домашней) работы: место, ритуалы начала и конца, сигнал для семьи, часы доступности для коллег. Проживите по ним 5 дней и отметьте, где правила нарушались.", "out": "Правила + отчёт о 5 днях.", "rub": [["Место определено", "отдельное и постоянное"], ["Ритуалы конкретны", "действия начала и конца"], ["Договорённости есть", "с семьёй и коллегами"], ["Отчёт честный", "нарушения и решения"]], "sample": "Сигнал: наушники = не беспокоить. Доступность: 10–12 и 15–17. Нарушения: 2 вечера ответила в чате после 20:00. Решение: убрать рабочий мессенджер с телефона.", "deep": [{"h": "Границы пространства и времени", "p": ["Куртц («Как не сойти с ума, работая из дома») собрал советы для удалёнщиков: отдельное рабочее место (даже угол со своим столом), фиксированный распорядок, «переодеться на работу», ритуалы начала и конца дня. Без них дом превращается в офис, который никогда не закрывается."]}, {"h": "Одиночество и связь", "p": ["Удалённая работа лишает случайных разговоров и обратной связи. Нужны регулярные созвоны, письменные статусы, иногда работа в коворкинге или кафе. Важно и общение вне работы — спорт, хобби, друзья, — иначе растёт изоляция."]}, {"h": "Свобода через результат", "p": ["Феррис показывает, что удалёнка становится свободой (Liberation в DEAL), когда вы договорились с работодателем об **измеримом результате**, а не о присутствии онлайн. Он советует начинать с пробного периода и показывать, что продуктивность выросла."]}], "steps": ["Определите постоянное рабочее место.", "Составьте ритуалы начала и конца рабочего дня.", "Договоритесь с семьёй о сигнале «я работаю».", "Сообщите коллегам часы доступности.", "Запланируйте одну «выездную» рабочую сессию в неделю и одно живое общение.", "Сформулируйте, по каким результатам оценивается ваша работа."], "check": ["Рабочее место отдельно от зоны отдыха.", "Есть ритуал завершения дня.", "Семья знает сигнал.", "Часы доступности объявлены.", "Есть регулярное общение вне работы."], "qa2": [["Зачем «переодеваться на работу» дома?", "Это сигнал мозгу о переходе в рабочий режим и обратно."], ["Как удалёнка становится свободой по Феррису?", "Когда работа оценивается по результату, а не по присутствию онлайн."]]}, {"t": "Время в семье и с детьми", "min": 35, "why": "Ребёнок учится управлять временем не из лекций, а глядя на взрослых и играя. Семья — команда со своими общими планами.", "pts": ["Марианна Лукашенко («Тайм-менеджмент для детей»): учите ребёнка **«видеть» цель** (рисунок, коллаж), **планировать** дела (визуальное расписание) и **контролировать** выполнение (наклейки, отметки) — через игру.", "**Планирование всей семьёй**: еженедельный семейный совет — общий календарь, дела каждого, общий отдых.", "Курпатов («Счастливый ребёнок»): мозг ребёнка созревает постепенно, поэтому «объяснять бесполезно» — работают **среда, ритм и пример**; в одном ребёнке — пять возрастных «детей» с разными задачами.", "Курпатов предупреждает о цифровой среде: экран заменяет ребёнку деятельность и общение — ограничивайте и замещайте живыми занятиями.", "Главное правило: ребёнок копирует ваш способ обращаться со временем."], "fig": {"k": "flow", "a": ["Увидеть цель|рисунок, коллаж", "Спланировать|визуальное расписание", "Сделать|маленькие шаги", "Отметить|наклейка, похвала"], "cap": "Цикл детского тайм-менеджмента по Лукашенко."}, "src": ["tm_kids|цель, планирование, контроль и семейное планирование", "k_child|развитие детского мозга, среда и цифровая зависимость"], "ex": "Сын 8 лет: утреннее расписание картинками на холодильнике (встать, умыться, одеться, завтрак, рюкзак). За каждое утро без напоминаний — наклейка; 10 наклеек — поход в батутный центр.", "err": ["Читать ребёнку лекции о времени вместо игры и примера.", "Использовать экран как основную награду."], "qa": [["Как сделать цель видимой для ребёнка?", "Нарисовать или собрать коллаж, повесить на видное место."], ["Почему Курпатов говорит, что «объяснять бесполезно»?", "Детский мозг ещё созревает; поведение формируют среда, ритм и пример, а не слова."]], "task": "Проведите семейный совет на 20–30 минут: общий календарь недели, по одной цели для каждого, общий отдых. Если есть дети — сделайте с ними визуальное расписание одного блока дня.", "out": "Итоги совета: календарь, цели, отдых + (если есть дети) описание визуального расписания и первой недели.", "rub": [["Совет проведён", "участвовали все члены семьи"], ["Календарь общий", "дела каждого видны"], ["Цели у каждого", "по одной"], ["Есть визуальный инструмент", "расписание или трекер"]], "sample": "Совет в воскресенье 19:00. Цели: я — 3 пробежки, муж — починить балкон, дочь — дочитать книгу. Общий отдых: суббота, каток. Расписание дочери — вечерний блок картинками.", "deep": [{"h": "Детский тайм-менеджмент", "p": ["Лукашенко («Тайм-менеджмент для детей») предлагает учить ребёнка через игру и наглядность: **увидеть цель** (рисунок, коллаж, «карта желаний»), **спланировать** (визуальное расписание картинками для младших, ежедневник для старших), **проконтролировать** (наклейки, отметки, похвала). Важно, чтобы цели были детскими, а не родительскими."]}, {"h": "Как развивается детский мозг", "p": ["Курпатов («Счастливый ребёнок») объясняет: лобные доли, отвечающие за планирование и самоконтроль, созревают долго, поэтому «объяснять бесполезно» — нужны **среда, ритм и пример**. В одном ребёнке «живут» несколько возрастов с разными задачами. Он предупреждает о цифровой среде: экран вытесняет деятельность и общение, необходимые для развития."]}, {"h": "Семья как команда", "p": ["Еженедельный семейный совет: общий календарь, дела каждого, общий отдых. Взрослые показывают, как планировать, — ребёнок учится, наблюдая. Хорошо работает «время только с ребёнком» по расписанию, выбранное им самим."]}], "steps": ["Проведите семейный совет на 20–30 минут.", "Заведите общий календарь (бумажный на холодильнике или в телефоне).", "С ребёнком нарисуйте его цель на месяц.", "Сделайте визуальное расписание одного блока дня.", "Придумайте систему отметок и небольших наград.", "Выделите еженедельное время только с ребёнком."], "check": ["Совет проходит регулярно.", "У ребёнка своя цель, а не родительская.", "Расписание наглядное.", "Экран не главная награда.", "Есть время один на один."], "qa2": [["Почему детям нужны среда и пример, а не объяснения?", "Лобные доли, отвечающие за самоконтроль, ещё не созрели."], ["Что такое визуальное расписание?", "Последовательность дел в картинках, понятная ребёнку без чтения."]]}]}, {"n": 10, "title": "Мозг, память, обучение", "goal": "Понять, как мозг учится и запоминает, и построить свою систему обучения и чтения.", "lessons": [{"t": "Пластичный мозг", "min": 40, "why": "Убеждение «я такой, какой есть» опровергнуто нейронаукой. Мозг меняется всю жизнь — в ту сторону, куда вы его тренируете.", "pts": ["Норман Дойдж («Пластичность мозга»): мозг перестраивается всю жизнь. Принцип **«используй или потеряешь»**: функции, которые не работают, уступают территорию другим; тренировка восстанавливает и развивает функции.", "Дойдж: нейроны, которые **возбуждаются вместе, связываются вместе** — повторение закрепляет связи, поэтому вредные привычки тоже «прошиваются».", "Марко Магрини («Мозг. Инструкция пользователя»): устройство мозга — нейроны, синапсы, нейромедиаторы, отделы; знание «железа» помогает понимать, почему внимание и память ограничены.", "Крис Фрит («Мозг и душа»): мозг не фотографирует мир, а **строит модель и предсказывает**; восприятие — догадка, которую проверяет опыт. Отсюда иллюзии и ошибки, но и способность понимать других.", "Венди Сузуки: **обогащённая среда** (новизна, движение, обучение, общение) поддерживает рост мозга."], "fig": {"k": "flow", "a": ["Повторение|нейроны возбуждаются вместе", "Связи крепнут|навык автоматизируется", "Неиспользование|связи слабеют", "Новая тренировка|территория перераспределяется"], "cap": "Пластичность работает в обе стороны."}, "src": ["doidge|«используй или потеряешь», пластичность всю жизнь", "magrini|устройство мозга и ограничения", "frith|мозг строит модель и предсказывает", "suzuki|обогащённая среда"], "ex": "В 52 года бухгалтер начинает учиться играть на гитаре по 20 минут в день. Через 4 месяца играет 10 песен — новый навык стал возможен благодаря пластичности, а регулярность закрепила связи.", "err": ["Считать, что «после 30 учиться поздно».", "Ожидать изменений без регулярного повторения."], "qa": [["Что значит «используй или потеряешь»?", "Неиспользуемые функции ослабевают, их территорию занимают другие."], ["Как Фрит описывает восприятие?", "Как модель и предсказание мозга, проверяемое опытом."]], "task": "Выберите один навык, который считали «не своим». Составьте план тренировки на 8 недель с учётом пластичности: ежедневная частота, усложнение, новизна, движение. Сделайте первые 7 занятий.", "out": "План на 8 недель + журнал 7 занятий.", "rub": [["Навык конкретен", "можно проверить прогресс"], ["Регулярность", "ежедневно или почти"], ["Есть усложнение", "по неделям"], ["Журнал ведётся", "7 записей"]], "sample": "Навык: рисование. 15 минут в день. Неделя 1–2: линии и формы, 3–4: светотень, 5–6: натюрморт, 7–8: портрет. Журнал: 7 из 7, на 5-й день впервые получился объём.", "deep": [{"h": "Открытие пластичности", "p": ["Дойдж («Пластичность мозга») рассказывает истории учёных, опровергших идею неизменного мозга: Пол Бах-и-Рита вернул женщине чувство равновесия с помощью устройства на языке; Майкл Мерцених показал, что карты мозга перестраиваются при обучении; Эдвард Тауб создал терапию для восстановления движения после инсульта. Принцип **«используй или потеряешь»**: функции, которые не используются, уступают территорию другим.", "Дойдж описывает и «пластический парадокс»: те же механизмы, которые делают нас гибкими, закрепляют вредные привычки и ригидность. Нейроны, которые возбуждаются вместе, связываются вместе."]}, {"h": "Мозг строит модель мира", "p": ["Фрит («Мозг и душа») показывает: мозг не фотографирует мир, а строит **модель** и постоянно предсказывает, что увидит; восприятие — это догадка, проверяемая опытом. Поэтому возможны иллюзии и ошибки, но благодаря той же способности мы понимаем намерения других людей.", "Магрини («Мозг. Инструкция пользователя») объясняет «железо»: нейроны, синапсы, нейромедиаторы, отделы мозга, — чтобы было понятно, почему внимание и память ограничены и как их беречь."]}, {"h": "Обогащённая среда", "p": ["Сузуки описывает классические опыты с крысами в «обогащённой среде» (игрушки, лабиринты, общение): у них больше связей между нейронами. Для человека аналог — новизна, движение, обучение и общение. Монотонность мозг «экономит»."]}], "steps": ["Выберите навык, который считали «не своим».", "Разбейте его на элементы и начните с самого простого.", "Тренируйтесь ежедневно 15–20 минут — регулярность важнее длительности.", "Каждую неделю добавляйте немного сложности.", "Добавьте новизну: другое место, другие задачи, обучение у другого человека.", "Ведите журнал — отмечайте, что стало получаться."], "check": ["Тренировка ежедневная.", "Есть план усложнения.", "Есть элементы новизны.", "Журнал ведётся.", "Я не сдаюсь на первых неудачах — это нормальная фаза перестройки."], "qa2": [["Что такое пластический парадокс по Дойджу?", "Пластичность делает нас гибкими, но и закрепляет вредные привычки и ригидность."], ["Почему восприятие — это догадка по Фриту?", "Мозг строит модель мира и предсказывает, а опыт подтверждает или исправляет её."]]}, {"t": "Память", "min": 40, "why": "Память — не склад, а процесс: внимание, кодирование, повторение. Каждый этап тренируется.", "pts": ["Букин («Развитие памяти по методикам спецслужб»): память начинается с **внимания**; объём внимания — **7±2** объекта, поэтому информацию группируют.", "Приёмы: **ассоциации и образы** (запоминать картинками), **метод мест** (размещать образы по знакомому маршруту), цепочки, запоминание лиц и имён через яркую деталь.", "Упражнения агента: «расфокусированное наблюдение» (видеть всю картину), описание по памяти комнаты или прохожего.", "Могучий («Тренажёр для мозга»): ежедневные короткие упражнения на внимание, память, логику и воображение — с постепенным усложнением.", "Михаил Литвак («10 методик развития мышления и памяти»): мышление и память — тренируемые функции, опирающиеся на законы логики и психологии."], "fig": {"k": "flow", "a": ["Внимание|заметить", "Кодирование|образ, ассоциация", "Повторение|интервалы", "Извлечение|вспомнить без подсказки"], "cap": "Четыре этапа памяти — на каждом есть свой приём."}, "src": ["memory_spec|внимание, 7±2, образы, метод мест", "moguchy|ежедневный тренажёр для мозга", "a27619670|методики развития мышления и памяти"], "ex": "Запомнить список покупок из 10 пунктов: дорога от двери до кухни — 10 мест. Молоко — «река молока» в прихожей, хлеб — батон вместо зонта в корзине… Через час — 10 из 10.", "err": ["Повторять одно и то же пассивно вместо попыток вспомнить.", "Пытаться удержать в голове больше 7 элементов без группировки."], "qa": [["Что такое метод мест?", "Размещение образов запоминаемых элементов по знакомому маршруту."], ["Почему важна группировка?", "Объём внимания около 7±2 элементов; группировка увеличивает объём запоминаемого."]], "task": "Освойте метод мест: выберите маршрут из 10 точек и запомните список из 10 слов, затем номер телефона (через образы цифр). Неделю делайте по одному упражнению из тренажёра (5–10 минут).", "out": "Маршрут, результат запоминания (через час и через сутки), журнал недели.", "rub": [["Маршрут стабилен", "10 знакомых мест по порядку"], ["Образы яркие", "приведены примеры"], ["Проверка отсрочена", "через час и сутки"], ["Тренировка недели", "7 записей"]], "sample": "Маршрут: дверь, коврик, шкаф, зеркало… Слова: 10/10 через час, 9/10 через сутки. Телефон: 9 из 11 цифр через сутки — добавлю повторение утром.", "deep": [{"h": "Память начинается с внимания", "p": ["Букин («Развитие памяти по методикам спецслужб») начинает с внимания: то, что не замечено, не запомнится. Объём внимания и рабочей памяти — около **7±2 элементов** (правило Миллера), поэтому информацию группируют: телефон легче помнить тройками и парами цифр. Упражнения агента: расфокусированное наблюдение (видеть всю картину), описание комнаты или человека по памяти, запоминание маршрутов."]}, {"h": "Кодирование образами", "p": ["Мозг лучше помнит образы, эмоции и необычное, чем абстракции. Отсюда мнемотехники: **ассоциации** (связать новое с известным), **метод мест** (разместить образы по знакомому маршруту — дому, дороге), **цепочки** (связать образы в историю), запоминание имён через яркую деталь внешности. Чем нелепее и ярче образ, тем лучше."]}, {"h": "Тренировка и мышление", "p": ["Могучий («Тренажёр для мозга») предлагает ежедневные короткие упражнения на внимание, память, логику и воображение с постепенным усложнением. Литвак («10 методик развития мышления и памяти») соединяет память с мышлением: законы логики и психологии помогают не только запоминать, но и решать жизненные задачи."]}], "steps": ["Выберите маршрут из 10 знакомых мест.", "Запомните список из 10 слов, разместив яркие образы по местам.", "Проверьте через час и через сутки.", "Запомните телефонный номер, группируя цифры и превращая их в образы.", "Неделю делайте по одному упражнению на внимание (описать по памяти комнату, прохожего).", "Ведите результаты, чтобы видеть рост."], "check": ["Маршрут стабилен и знаком.", "Образы яркие и необычные.", "Проверка отсроченная.", "Упражнения на внимание ежедневные.", "Результаты записываются."], "qa2": [["Почему необычные образы запоминаются лучше?", "Мозг отмечает новизну и эмоцию как значимые."], ["Что даёт группировка информации?", "Позволяет уместить больше в ограниченный объём рабочей памяти (7±2 элемента)."]]}, {"t": "Как учиться и читать с пользой", "min": 45, "why": "Прочитанное забывается за недели, если его не применять. Умение учиться — метанавык, который ускоряет все остальные.", "pts": ["Улаф Шеве («Суперстудент»): **активное чтение** (вопросы к тексту до чтения, пересказ после), конспект-карты, **интервальное повторение**, мнемотехники, подготовка к экзаменам.", "Джош Кауфман («Первые 20 часов», конспект в «Годе личной эффективности»): чтобы освоить новый навык на базовом уровне, хватит около **20 часов** целенаправленной практики: разбить навык на части, изучить минимум теории, убрать препятствия, практиковаться.", "Павел Палагин (подкаст Маклахова): скорочтение и память — инструменты, но главное — **получить из книги действие**, а не процент прочитанного.", "Правило применения: на каждую книгу — **одна идея → одно действие** на этой неделе.", "Обучение закрепляется **объяснением** другим (эффект учителя) и **проверкой себя**, а не перечитыванием."], "fig": {"k": "flow", "a": ["Вопросы до чтения|что хочу узнать", "Активное чтение|пометки, карта", "Пересказ|своими словами", "Действие|одна идея → шаг", "Повтор|через 1, 7, 30 дней"], "cap": "Цикл, который превращает книгу в навык."}, "src": ["sheve|активное чтение, карты, интервальное повторение", "godeff|Кауфман: первые 20 часов навыка", "a27442752|выпуск: как получить максимум от чтения"], "ex": "Книга «Джедайские техники». Вопрос до чтения: «Почему я откладываю мелкие дела?» Идея: формулировать задачи как физические действия. Действие: переписать 10 задач. Повтор: через неделю — пересказ коллеге.", "err": ["Измерять обучение количеством прочитанных книг.", "Перечитывать вместо попыток вспомнить и применить."], "qa": [["Сколько часов нужно на базовый уровень навыка по Кауфману?", "Около 20 часов целенаправленной практики."], ["Что эффективнее перечитывания?", "Самопроверка, пересказ и применение."]], "task": "Возьмите книгу из библиотеки курса. Пройдите полный цикл: вопросы до чтения, карта главы, пересказ на 200 слов, одно действие на неделю, план повторов.", "out": "Вопросы, карта (списком), пересказ, действие, даты повторов.", "rub": [["Вопросы заданы заранее", "до чтения"], ["Пересказ своими словами", "без цитат"], ["Действие конкретное", "выполнимо на неделе"], ["Повторы запланированы", "даты"]], "sample": "Книга «Миф о многозадачности». Вопрос: почему я устаю от переписок? Пересказ: … Действие: проверять мессенджеры 4 раза в день. Повторы: 12.10, 18.10, 10.11.", "deep": [{"h": "Активное чтение и повторение", "p": ["Шеве («Суперстудент») собрал техники учёбы: перед чтением задать вопросы к тексту; читать с карандашом и выделять главное; после главы пересказать своими словами; составлять конспект-карты (майнд-карты); повторять по интервалам (через день, неделю, месяц) — интервальное повторение сильнее массового зазубривания. Самопроверка (вспомнить без подсказки) эффективнее перечитывания."]}, {"h": "Первые 20 часов", "p": ["Джош Кауфман (конспект в «Годе личной эффективности») утверждает: чтобы освоить новый навык на базовом уровне, нужно около **20 часов** целенаправленной практики. Метод: разбить навык на элементы; изучить минимум теории, чтобы начать и исправлять ошибки; убрать препятствия к практике (подготовить инструмент, отключить отвлечения); практиковать главные элементы."]}, {"h": "Чтение ради действия", "p": ["Павел Палагин (подкаст Маклахова), эксперт по скорочтению и памяти, говорит о максимуме пользы от чтения. Главный критерий — не процент прочитанного, а изменения: одна идея из книги, превращённая в действие, ценнее десяти прочитанных книг. Отсюда правило курса: «одна идея → одно действие на этой неделе»."]}], "steps": ["Перед чтением запишите 3 вопроса к книге.", "Читайте с пометками; после главы — пересказ на полстраницы.", "Составьте карту книги на одном листе.", "Выберите одну идею и действие на неделю.", "Назначьте повторы: через 1, 7 и 30 дней.", "Объясните главную идею другому человеку."], "check": ["Вопросы заданы до чтения.", "Пересказ своими словами.", "Есть действие на неделю.", "Повторы в календаре.", "Идея объяснена другому."], "qa2": [["Почему самопроверка эффективнее перечитывания?", "Попытка вспомнить укрепляет связи памяти; перечитывание создаёт иллюзию знания."], ["Какие четыре шага метода Кауфмана?", "Разбить навык, изучить минимум теории, убрать препятствия, практиковать главное."]]}, {"t": "Думать самому в цифровую эпоху", "min": 45, "why": "Лента, поисковик и нейросети делают мышление необязательным. Навык думать самостоятельно становится редким — и ценным.", "pts": ["Курпатов («Чертоги разума»): **цифровая зависимость**, **делегирование мышления** гаджетам и **цифровая аутизация** ведут к «информационной псевдодебильности». Лекарство — глубокое чтение, собственные выводы, мыслительные усилия.", "Курпатов («Красная таблетка»): мозг экономит энергию и предпочитает автопилот; мы — продукт среды. Чтобы меняться, нужно **думать, а не только переживать**.", "Курпатов («Складка времени»): цифровая среда даёт «инфляцию идентичности» и «нехватку нехватки» — когда всё доступно сразу, исчезает желание и способность к долгому усилию.", "Курпатов («Четвёртая мировая война», «Интеллектуальный ресурс»): роботизация и ИИ меняют рынок труда; ценность человека — в способности думать, учиться и создавать новое; экономика переходит к **интеллектуальному ресурсу**.", "Практика «карта и территория»: прежде чем искать ответ, сформулируйте свою версию — потом сверяйте."], "fig": {"k": "fork", "q": "Возник вопрос", "a": "Сразу в поиск или нейросеть → готовый ответ → ничего не осталось в голове", "b": "Сначала своя версия (3 мин) → поиск → сравнение → понимание и память", "cap": "Небольшое усилие до поиска превращает информацию в знание."}, "src": ["k_palace|цифровая зависимость и делегирование мышления", "k_red|автопилот мозга и среда", "k_fold|«нехватка нехватки» в цифровой среде", "k_ww4|ИИ и ценность человеческого мышления", "k_intres|интеллектуальный ресурс как ядро экономики"], "ex": "Перед тем как спросить нейросеть «как снизить отток клиентов», записываю 5 своих гипотез. Сравниваю с ответом: 3 совпали, 2 новые идеи из ответа, 1 моя уникальная — про сервис после покупки.", "err": ["Принимать ответ поисковика или ИИ без проверки и своей версии.", "Заменять размышление потреблением коротких видео «по теме»."], "qa": [["Что Курпатов называет делегированием мышления?", "Передачу мыслительной работы гаджетам и сервисам вместо собственного размышления."], ["В чём практика «своя версия сначала»?", "Сформулировать ответ самому перед поиском и затем сравнить."]], "task": "Неделю применяйте правило «3 минуты своей версии» к каждому значимому вопросу перед поиском. Ведите журнал: вопрос, своя версия, найденный ответ, что совпало, что нового. Сократите ленту коротких видео на 50%.", "out": "Журнал из 7+ вопросов + экранное время коротких видео до/после.", "rub": [["Вопросы значимые", "рабочие или жизненные"], ["Своя версия записана", "до поиска"], ["Есть сравнение", "совпадения и новое"], ["Лента сокращена", "цифры"]], "sample": "Вопрос: как выбрать ноутбук для монтажа? Версия: 32 ГБ, видеокарта, экран 100% sRGB. Ответ: добавил SSD 1 ТБ. Короткие видео: 70 → 30 минут в день.", "deep": [{"h": "Цифровое отупение", "p": ["Курпатов в «Чертогах разума» описывает три обстоятельства: **цифровую зависимость** (постоянный поток коротких стимулов), **делегирование мышления** (гаджеты помнят и решают за нас) и **цифровую аутизацию** (ослабление живого общения). Итог он называет «информационной псевдодебильностью»: человек много потребляет, но мало думает сам."]}, {"h": "Карта и территория", "p": ["Курпатов подчёркивает разницу между картой (нашими представлениями) и территорией (реальностью). Думать — значит постоянно сверять карту с территорией. В «Красной таблетке» он показывает, что мозг склонен к автопилоту и экономии сил; в «Складке времени» — что цифровая среда даёт «нехватку нехватки»: когда всё доступно мгновенно, слабеет способность к долгому усилию и желанию."]}, {"h": "Ценность мышления в эпоху ИИ", "p": ["В «Четвёртой мировой войне» и «Интеллектуальном ресурсе» Курпатов рассуждает о будущем: роботизация и ИИ забирают рутину, а ценность человека смещается к способности думать, учиться и создавать новое. Практический вывод для каждого — тренировать глубокое чтение, письмо и собственные выводы."]}], "steps": ["Перед поиском или вопросом к ИИ записывайте свою версию ответа (3 минуты).", "После поиска сравнивайте и отмечайте, что совпало и что нового.", "Читайте ежедневно 30 минут длинный текст без переключений.", "Пишите от руки короткий вывод из прочитанного.", "Сократите короткие видео вдвое.", "Раз в неделю обсуждайте прочитанное с живым человеком."], "check": ["Своя версия — до поиска.", "Есть ежедневное глубокое чтение.", "Выводы пишутся своими словами.", "Короткие видео сокращены.", "Есть живое обсуждение идей."], "qa2": [["Что Курпатов называет делегированием мышления?", "Передачу запоминания и решения задач гаджетам вместо собственного мышления."], ["Что такое «нехватка нехватки»?", "Когда всё доступно сразу, ослабевает способность к желанию и долгому усилию."]]}]}, {"n": 11, "title": "Мышление и решения", "goal": "Распознавать ловушки мышления, строить аргументы и принимать решения системно.", "lessons": [{"t": "Две системы мышления", "min": 40, "why": "Большинство решений принимает быстрая интуиция — и она систематически ошибается в предсказуемых местах.", "pts": ["Канеман («Думай медленно… решай быстро»): **Система 1** — быстрая, автоматическая, интуитивная; **Система 2** — медленная, логичная, ленивая. Система 2 часто просто одобряет догадки Системы 1.", "Типичные искажения: **якорение** (первое число влияет на оценку), **доступность** (яркое кажется частым), **неприятие потерь** (потеря болит примерно вдвое сильнее равной выгоды), **эффект ореола**, **сверхуверенность**.", "Чатфилд («Критическое мышление»): быстрое и медленное мышление, предвзятость подтверждения — мы ищем доводы в пользу того, во что уже верим.", "Защита: в важных решениях **замедлиться** — записать альтернативы, базовую частоту («как обычно бывает»), вопрос «что докажет, что я неправ?»."], "fig": {"k": "cols", "cols": [{"h": "Система 1", "items": ["быстро, без усилий", "интуиция, шаблоны", "ошибается предсказуемо"]}, {"h": "Система 2", "items
