и.", "Определите шаг на этой неделе и время в календаре.", "Распечатайте или перепишите цели от руки и держите на виду."], "check": ["У каждой цели есть число или проверяемый результат и дата.", "Цели из разных сфер, не только работа.", "У каждой цели есть ближайший шаг.", "Цели записаны и видны каждый день.", "Есть дата еженедельного контроля."], "qa2": [["Что такое ретикулярная активирующая система в объяснении Пиза?", "Фильтр внимания мозга: при ясной цели вы начинаете замечать связанные с ней возможности."], ["Почему полезно писать много целей сразу?", "Количество снимает страх ошибки, и настоящие желания появляются после очевидных."]]}, {"t": "Единственная вещь и годовой план", "min": 45, "why": "Десяток одинаково важных целей — это ни одной. Фокус превращает план года в реальное движение.", "pts": ["Келлер и Папазан: **фокусирующий вопрос** — «Какое одно дело я могу сделать, чтобы всё остальное стало проще или ненужным?». Задаётся для года, месяца, недели и сегодняшнего дня.", "**Эффект домино**: малое правильное действие запускает цепь — каждое следующее «домино» может быть в полтора раза больше. Отсюда планирование «от цели на 5 лет к сегодняшнему дню».", "Миллиардов («Стратегия жизни»): стратегия — не документ, а цикл «самоанализ → цели → план → действие → пересмотр». Пересматривайте ежеквартально.", "Новак («Книга, которой нет», «Еженедельник идеалиста»): жизнь — игра с правилами; выигрывает тот, кто делает маленький шаг каждую неделю, а не ждёт идеального момента.", "Новогодний выпуск подкаста Маклахова — о том, как готовить выдающийся год: подвести итоги, выбрать немного целей и встроить их в расписание."], "fig": {"k": "stairs", "a": ["Сегодня", "Неделя", "Месяц", "Год", "5 лет", "Главное дело жизни"], "cap": "Задайте фокусирующий вопрос сверху вниз: что на этом уровне делает следующий уровень проще?"}, "src": ["keller|фокусирующий вопрос и эффект домино", "milliardov|стратегия как цикл с пересмотром", "novak_book|жизнь как игра и малые шаги", "novak_week|54 шага к цели", "a27442688|выпуск: как подготовить выдающийся год"], "ex": "5 лет: свой бизнес по ремонту техники. Год: 50 постоянных клиентов. Месяц: запустить сайт и 10 заказов. Неделя: договориться с 3 поставщиками запчастей. Сегодня: составить список поставщиков и позвонить двоим.", "err": ["Ответить на вопрос «одно дело» списком из пяти дел.", "Составить план года и не заглядывать в него до декабря."], "qa": [["Как звучит фокусирующий вопрос?", "Какое одно дело я могу сделать, чтобы всё остальное стало проще или ненужным?"], ["Как часто пересматривать стратегию?", "Минимум раз в квартал, а недельный план — каждую неделю."]], "task": "Пройдите лестницу фокусирующего вопроса от 5 лет до сегодняшнего дня (6 ответов). Затем составьте годовой план: 3 цели из прошлого урока, разбитые по кварталам, и дату квартальных пересмотров в календаре.", "out": "Шесть ответов на фокусирующий вопрос + годовой план по кварталам + 4 даты пересмотра.", "rub": [["Ответы — одно дело", "на каждом уровне ровно одно"], ["Уровни связаны", "нижний делает верхний проще"], ["План по кварталам", "у каждой цели есть веха на квартал"], ["Пересмотры назначены", "конкретные даты"]], "sample": "Сегодня: написать оглавление курса. Неделя: записать первый урок. Месяц: 4 урока и лендинг. Год: 100 учеников. 5 лет: школа с 5 курсами. Пересмотры: 31.12, 31.03, 30.06, 30.09.", "deep": [{"h": "Фокусирующий вопрос", "p": ["Келлер и Папазан строят книгу вокруг вопроса: «Какое одно дело я могу сделать, чтобы всё остальное стало проще или ненужным?». Его задают на разных горизонтах: жизнь, 5 лет, год, месяц, неделя, сегодня, прямо сейчас. Ответ нижнего уровня должен вести к ответу верхнего — это и есть «цели до сегодняшнего дня».", "Эффект домино: костяшка способна уронить следующую, которая в полтора раза больше. Маленькое правильное дело запускает цепь, которая через несколько шагов двигает очень большие вещи."]}, {"h": "Шесть лжеправил", "p": ["Авторы разбирают убеждения, которые мешают фокусу: **всё одинаково важно**, **многозадачность эффективна**, **нужна железная дисциплина** (на самом деле — дисциплина на время, пока не сложится привычка), **сила воли всегда под рукой** (она истощается к вечеру — главное делаем утром), **нужен баланс** (в периоды прорыва баланса нет, его восстанавливают потом), **большое — это плохо** (бояться больших целей)."]}, {"h": "Стратегия как цикл", "p": ["Миллиардов описывает стратегию жизни как цикл: самоанализ → истинные цели → план → действие → пересмотр. Новак в «Книге, которой нет» смотрит на жизнь как на игру с правилами: выигрывает тот, кто делает маленький ход каждую неделю. Новогодний выпуск подкаста Маклахова — о том, как подводить итоги года и выбирать немногие цели на следующий.", "Литвак в «7 шагах к успеху» добавляет психотерапевтический взгляд: путь к любимой и хорошо оплачиваемой работе — последовательность шагов, где каждый готовит следующий."]}], "steps": ["Задайте фокусирующий вопрос для горизонта «5 лет» и запишите ответ.", "Спуститесь: год, месяц, неделя, сегодня — каждый ответ делает верхний проще.", "Разложите 3 цели года по кварталам.", "Назначьте даты четырёх квартальных пересмотров.", "Защитите в календаре ежедневный блок под «одно дело» (лучше утром)."], "check": ["На каждом уровне ровно одно дело.", "Нижние уровни логически ведут к верхним.", "План года разбит по кварталам.", "Пересмотры назначены.", "Под главное дело есть ежедневное время."], "qa2": [["Почему главное дело лучше делать утром?", "Сила воли и внимание к вечеру истощаются."], ["Что Келлер говорит о балансе?", "В периоды прорыва баланса нет; важно не уходить в перекос надолго и возвращаться к остальным сферам."]]}]}, {"n": 3, "title": "Привычки", "goal": "Понять механику привычек и силы воли, запустить одну новую привычку и убрать одну вредную.", "lessons": [{"t": "Петля привычки", "min": 40, "why": "Привычки выполняют около половины наших ежедневных действий. Изменить их «силой» трудно; изменить, понимая устройство, — реально.", "pts": ["Дахигг: **петля привычки** — сигнал → действие (рутина) → награда; со временем появляется **тяга** — предвкушение награды при сигнале.", "**Золотое правило изменения**: сигнал и награду сохраняем, меняем действие. Скучно в 15:00 (сигнал) → вместо печенья 5 минут разговора с коллегой (та же награда — смена обстановки).", "Курпатов («Законы мозга») объясняет то же через **динамический стереотип** Павлова: мозг экономит силы и закрепляет повторяющиеся цепочки; ломать стереотип неприятно, поэтому нужен период «перестройки».", "О'Коннор («Психология вредных привычек»): вредная привычка часто защищает от неприятного чувства; без осознания этого чувства привычка возвращается.", "Николай Додонов (подкаст Маклахова) — об управлении привычками через наблюдение: сначала записывайте, когда и почему срабатывает привычка, потом меняйте."], "fig": {"k": "flow", "a": ["Сигнал|время, место, чувство, люди", "Тяга|предвкушение", "Действие|рутина", "Награда|что я на самом деле получаю"], "cap": "Меняем звено «действие», сохраняя сигнал и награду."}, "src": ["duhigg|петля привычки, тяга, золотое правило", "k_brainlaws|динамический стереотип и доминанта", "oconnor|вредная привычка как защита от чувства", "a27442544|выпуск: как управлять привычками"], "ex": "Сигнал: пришёл домой усталым. Действие: 2 часа ленты. Награда: отключить голову. Новое действие при том же сигнале: 20 минут прогулки в наушниках — голова отключается так же.", "err": ["Бороться с сигналом, который нельзя убрать (усталость после работы).", "Не выяснить, какую награду на самом деле даёт привычка."], "qa": [["Что сохраняется по золотому правилу?", "Сигнал и награда; меняется действие."], ["Как найти настоящую награду?", "Экспериментировать: заменять действие и смотреть, исчезает ли тяга."]], "task": "Выберите одну привычку, которую хотите изменить. Неделю записывайте каждое срабатывание: время, место, чувство, люди, предыдущее действие. Определите сигнал и гипотезу награды. Придумайте новое действие и проверьте его 3 раза.", "out": "Журнал наблюдений (минимум 5 записей), сигнал, награда, новое действие и результат трёх проверок.", "rub": [["Наблюдения записаны", "не меньше 5 случаев с деталями"], ["Сигнал выделен", "одна из пяти категорий, подтверждена записями"], ["Награда проверена", "есть эксперимент, а не догадка"], ["Новое действие опробовано", "описан результат"]], "sample": "Привычка: сладкое после обеда. Сигнал: 14:30, сонливость. Награда: не сахар, а бодрость. Новое действие: 10 приседаний и стакан воды. 3 из 3 раз тяга прошла за 10 минут.", "deep": [{"h": "Петля и тяга", "p": ["Дахигг описывает исследования MIT: когда крыса учится находить шоколад в лабиринте, активность мозга сначала высокая, а по мере автоматизации падает — работа уходит в **базальные ганглии**. Поведение «сворачивается» в петлю: **сигнал** (время, место, эмоция, люди, предшествующее действие) → **рутина** → **награда**. Со временем возникает **тяга** — ожидание награды при одном только сигнале.", "Тяга объясняет, почему трудно сопротивляться: мозг уже «предвкушает» награду. Поэтому эффективнее не бороться с тягой, а удовлетворять её другим способом."]}, {"h": "Золотое правило и ключевые привычки", "p": ["**Золотое правило**: оставить сигнал и награду, заменить рутину. Так работают анонимные алкоголики: сигнал (стресс, одиночество) и награда (расслабление, общение) остаются, а рутина меняется на встречи и звонок спонсору. Но для устойчивости нужна **вера** — часто её даёт группа.", "**Ключевые привычки** запускают цепную реакцию: регулярный спорт меняет питание, сон и продуктивность; семейные ужины — учёбу детей. Дахигг приводит пример Alcoa, где фокус на безопасности изменил всю культуру компании."]}, {"h": "Динамический стереотип", "p": ["Курпатов в «Законах мозга» объясняет то же языком физиологии Павлова: мозг закрепляет повторяющиеся цепочки действий — **динамические стереотипы** — и экономит энергию. Ломать стереотип неприятно: возникает напряжение, раздражение, хочется вернуться к старому. Это нормальная реакция, а не признак, что «не моё».", "О'Коннор («Психология вредных привычек») добавляет: вредная привычка часто защищает от неприятного чувства (скуки, тревоги, одиночества). Без понимания этого чувства замена рутины не держится."]}], "steps": ["Выберите одну привычку для изменения.", "Неделю записывайте каждое срабатывание по пяти категориям сигнала: время, место, эмоция, люди, предыдущее действие.", "Найдите повторяющийся сигнал.", "Проверьте гипотезы награды: заменяйте рутину и смотрите, проходит ли тяга через 15 минут.", "Выберите новую рутину, дающую ту же награду, и запишите план «когда [сигнал], я [новая рутина], чтобы [награда]».", "Найдите поддержку: человека или группу, которые помогут поверить в изменение."], "check": ["Сигнал найден по записям, а не угадан.", "Награда проверена экспериментом.", "Новая рутина даёт ту же награду.", "Есть письменный план привычки.", "Есть источник веры и поддержки."], "qa2": [["Что такое ключевая привычка?", "Привычка, которая запускает цепочку других изменений (спорт, семейные ужины)."], ["Почему ломать привычку неприятно по Курпатову?", "Разрушение динамического стереотипа вызывает напряжение — мозг сопротивляется лишним затратам энергии."]]}, {"t": "Маленькие шаги и накопительный эффект", "min": 35, "why": "Большие перемены почти всегда — сумма маленьких, скучных, повторяемых действий. Это хорошая новость: они доступны каждый день.", "pts": ["Харди («Накопительный эффект»): **малые разумные решения + постоянство + время = радикальная разница**. Результат долго не виден, поэтому многие бросают на «плоском» участке кривой.", "Эйбрамсон («Теория получаса»): 30 минут в день на главное изменение — 180 часов в год. Терпение важнее рывков.", "**Мини-привычки** (Стивен Гиз): сделайте шаг настолько маленьким, что отказаться смешно — одно отжимание, одна страница. Сила воли почти не тратится, а «старт» запускает продолжение.", "Сара Милн Роу («Маленькие ритуалы для больших достижений») строит метод **SHED** на четырёх базовых ритуалах — сон, вода, движение, питание: каркас из простых действий, который держит день. Выпуск подкаста Маклахова с Юрием Белонощенко — о силе маленьких шагов: шаг должен быть выполним даже в плохой день.", "Харди советует **отслеживать** поведение (трекер) — то, что измеряется, улучшается."], "fig": {"k": "curve", "pts": [[0, 1], [20, 1.3], [40, 1.8], [60, 2.8], [75, 4.5], [90, 7], [100, 9]], "marks": [[40, "«ничего не меняется» — точка срыва"], [90, "результат виден всем"]], "xl": "дни постоянства", "yl": "результат", "cap": "Накопительный эффект: первые недели почти без видимого результата."}, "src": ["hardy|формула накопительного эффекта и трекинг", "abramson|30 минут в день", "a68787624|мини-привычки: шаг, от которого невозможно отказаться", "a57356846|метод SHED: сон, вода, движение, питание", "a27442664|выпуск: сила маленьких шагов"], "ex": "Цель «читать больше». Мини-привычка: одна страница перед сном. За 3 месяца — 14 книг, потому что в 80% вечеров «одна страница» превращалась в двадцать.", "err": ["Начать с «час спорта каждый день» и сорваться на третий день.", "Не отмечать выполнение — через две недели непонятно, есть ли прогресс."], "qa": [["Почему многие бросают новые привычки?", "Результат накопительного эффекта долго не виден; люди принимают «плоский» участок за неудачу."], ["Как определить размер мини-привычки?", "Её можно выполнить даже в самый плохой день за минуту-две."]], "task": "Выберите одну привычку, поддерживающую цель из недели 2. Сформулируйте её мини-версию, привяжите к существующему действию («после того как… я…») и заведите трекер на 30 дней. Отчитайтесь за первые 7 дней.", "out": "Формулировка мини-привычки с привязкой + трекер за 7 дней + что мешало.", "rub": [["Привычка связана с целью", "видно, как она приближает цель"], ["Шаг действительно мини", "выполним за 1–2 минуты"], ["Есть привязка", "к конкретному ежедневному действию"], ["Трекер ведётся", "7 отметок и разбор пропусков"]], "sample": "После утреннего кофе я пишу 3 предложения в черновик книги. Трекер: 6 из 7. Пропуск в субботу — не было привычного кофе дома; решение: привязка «после завтрака».", "deep": [{"h": "Формула накопительного эффекта", "p": ["Харди: **малые разумные решения + постоянство + время = радикальная разница**. Пример с двумя друзьями: один ежедневно съедает на 125 калорий меньше и читает 10 страниц, другой на 125 больше. Месяцами разницы не видно, через 2–3 года — огромная. Тот же эффект действует в обратную сторону: мелкие плохие решения тоже накапливаются.", "Харди советует **отслеживать** любое поведение, которое хотите изменить: деньги, еду, время. Учёт сам по себе меняет поведение — вы начинаете замечать решения, которые раньше принимались на автомате."]}, {"h": "Мини-привычки и маленькие шаги", "p": ["Метод Стивена Гиза (саммари «Мини-привычки»): шаг настолько маленький, что отказаться смешно — одно отжимание, 50 слов, одна страница. Сила воли почти не тратится, а начав, человек часто делает больше. Главное — не повышать норму обязательств: «бонусные» повторы — добровольны.", "Эйбрамсон («Теория получаса») предлагает 30 минут в день; Белонощенко (подкаст), Ironman и основатель сети детских центров, — девять принципов медленного, но верного движения. Сара Милн Роу с методом SHED опирается на четыре базовых ритуала: сон, вода, движение, питание."]}, {"h": "Импульс и «плоский» участок", "p": ["Харди использует образ маховика: раскрутить его трудно, но потом он вращается почти сам. Самый опасный период — первые недели, когда усилия есть, а результатов нет. Именно тогда люди решают, что «не работает». Поэтому в начале нужно оценивать не результат, а выполнение: «сделал ли я сегодня свою мини-привычку?»."]}], "steps": ["Выберите одну привычку, поддерживающую цель года.", "Уменьшите её до шага на 1–2 минуты.", "Привяжите к ежедневному якорю: «после того как… я…».", "Заведите трекер на 30 дней и отмечайте только факт выполнения.", "Не повышайте обязательную норму 30 дней, даже если делаете больше.", "Через 30 дней оцените, стала ли привычка автоматической, и только тогда расширяйте."], "check": ["Шаг выполним в самый плохой день.", "Есть якорь — существующее ежедневное действие.", "Трекер ведётся каждый день.", "Я оцениваю выполнение, а не результат.", "Я не бросил(а) на «плоском» участке."], "qa2": [["Почему мини-привычка не должна повышаться сразу?", "Обязательная норма должна оставаться смешной, чтобы не тратить силу воли; дополнительное — бонус."], ["Как действует накопительный эффект в обратную сторону?", "Мелкие плохие решения тоже накапливаются и через годы дают большой отрицательный результат."]]}, {"t": "Сила воли", "min": 40, "why": "Силу воли считают чертой характера. На деле это ресурс, который тратится, восстанавливается и тренируется, — и его можно беречь.", "pts": ["Макгонигал: три силы — **«я буду»** (делать трудное), **«я не буду»** (сопротивляться искушению) и **«я хочу»** (помнить долгосрочную цель).", "Ловушки: **моральное самооправдание** («я сегодня молодец — можно съесть торт»), эффект **«какого чёрта»** (сорвался — значит, можно всё), вера, что **будущий я** будет сильнее.", "Инструменты: пауза (медленное дыхание), сон, движение, отсрочка на 10 минут, **заранее принятые решения** и правило «если… то…».", "Филиппов («Состояние эффективности»): решения рушатся, потому что их принимают разные «я» — **логический и эмоциональный импульс**. Договаривайтесь с эмоциональным «я», а не воюйте.", "Курпатов («Красная таблетка-2»): не надо «заставлять себя» — стройте **структуру** (среду, режим, обязательства), в которой правильное действие происходит само."], "fig": {"k": "tri", "c": "Сила воли", "a": ["Я буду|трудное, но важное", "Я не буду|искушения", "Я хочу|долгосрочная цель"], "cap": "Слабое звено обычно «я хочу»: цель забыта в момент выбора."}, "src": ["mcgonigal|три силы воли и ловушки", "state_eff|логический и эмоциональный импульс", "k_red2|структура вместо принуждения"], "ex": "Правило «если… то…»: «Если после 21:00 хочется заказать еду, то я сначала выпиваю стакан воды и жду 10 минут». В 6 из 10 случаев желание проходит.", "err": ["Хвалить себя едой или покупкой за «силу воли» — классическое самооправдание.", "После срыва бросить всё («какого чёрта»), вместо того чтобы вернуться на следующем шаге."], "qa": [["Что такое эффект «какого чёрта»?", "После небольшого срыва человек отказывается от цели целиком и срывается сильнее."], ["Почему заранее принятое решение помогает?", "В момент искушения не нужно выбирать заново — работает правило."]], "task": "Выберите одно искушение и одно «я буду». Для каждого запишите: что происходит обычно, какая ловушка срабатывает, правило «если… то…» и изменение среды. Проверьте правила 5 дней.", "out": "Две карточки «ситуация / ловушка / правило / среда» + итог 5 дней.", "rub": [["Ловушка названа точно", "одна из описанных Макгонигал или своя с объяснением"], ["Правило конкретно", "формат «если [сигнал], то [действие]»"], ["Среда изменена", "одно реальное изменение окружения"], ["Есть отчёт", "сколько раз сработало, что поправить"]], "sample": "«Я не буду»: соцсети в работе. Ловушка: «гляну одну минуту». Правило: «если тянусь к телефону, то кладу его в другую комнату на 50 минут». Среда: уведомления выключены. Итог: 4 из 5 дней.", "deep": [{"h": "Три силы и два «я»", "p": ["Макгонигал различает три силы: **«я буду»** (делать трудное), **«я не буду»** (не поддаваться), **«я хочу»** (помнить о долгосрочной цели). Внутри каждого живут два «я»: импульсивное, желающее сейчас, и разумное, думающее о будущем. Сила воли — способность разумного «я» вмешаться.", "Физиологически за самоконтроль отвечает префронтальная кора, и ей нужна энергия: сон, движение, медленное дыхание повышают самоконтроль, стресс и недосып снижают. Макгонигал описывает **реакцию «остановиться и спланировать»** — противоположность реакции «бей или беги»: замедлиться, сделать медленный вдох, подумать."]}, {"h": "Ловушки самоконтроля", "p": ["**Моральное самооправдание**: после «хорошего» поступка мы разрешаем себе «плохой» (позанимался — можно торт). **Эффект «какого чёрта»**: небольшой срыв вызывает стыд, и мы срываемся сильнее. **Иллюзия будущего «я»**: кажется, что завтра будем сильнее, поэтому сегодня можно отложить. **Обещание награды**: дофамин от ожидания покупки или еды путают со счастьем.", "Лекарство от «какого чёрта» — самосострадание, а не самокритика: исследования показывают, что люди, которые прощают себе срыв, быстрее возвращаются к цели."]}, {"h": "Не воевать, а строить", "p": ["Филиппов («Состояние эффективности») описывает, как решения рушатся из-за конфликта логического и эмоционального импульса: вечером принято одно, утром другое «я» решает иначе. Курпатов («Красная таблетка-2») делает практический вывод: не «заставлять себя», а строить **структуру** — среду, режим, обязательства, где нужное действие происходит само. Сила воли нужна, чтобы создать структуру, а не чтобы ежедневно бороться."]}], "steps": ["Выберите одно «я буду» и одно «я не буду».", "Неделю отмечайте моменты срыва: время, состояние, что сказали себе.", "Назовите ловушку: самооправдание, «какого чёрта», будущее «я», обещание награды.", "Сформулируйте правило «если [ситуация], то [действие]».", "Измените среду так, чтобы нужное было легче, а ненужное — труднее.", "Для срывов заготовьте фразу самосострадания и следующий шаг."], "check": ["Я знаю свои часы и состояния наибольших срывов.", "Ловушки названы конкретно.", "Правила «если… то…» записаны.", "Среда изменена хотя бы одним действием.", "После срыва я возвращаюсь, а не бросаю."], "qa2": [["Что такое реакция «остановиться и спланировать»?", "Замедление и медленное дыхание, дающее префронтальной коре время вмешаться."], ["Почему самосострадание помогает больше самокритики?", "Стыд запускает эффект «какого чёрта», а прощение помогает вернуться к цели."]]}, {"t": "Система поддержки привычек", "min": 40, "why": "Привычки держатся не на мотивации, а на системе: среде, учёте, людях и ритуалах.", "pts": ["Парабеллум и Мрочковский («Быстрые результаты»): 10 дней интенсивной перестройки с **ежедневными отчётами** и ответственностью перед группой. Публичное обязательство повышает выполнение.", "Смит («Привычки миллионеров»): привычки успешных людей — жить ниже своих возможностей, учиться ежедневно, работать с наставниками; книга-тренинг рассчитана на 30 дней.", "Феррис («Инструменты гигантов»): у сотен успешных людей повторяются утренние ритуалы, дневник, медитация и движение — но рецепт каждый подбирает себе экспериментом.", "Юра Ра («22 привычки миллиардера»): из эзотерической рамки стоит взять поведенческое ядро — ритм дня, утренние ритуалы, правило «не говорить больше, чем сделаешь».", "Три опоры системы: **среда** (убрать трение для нужного, добавить для вредного), **учёт** (трекер, недельный обзор), **люди** (партнёр, группа, наставник)."], "fig": {"k": "cols", "cols": [{"h": "Среда", "items": ["вещи на виду", "лишнее убрано", "удобное время и место"]}, {"h": "Учёт", "items": ["трекер на 30 дней", "недельный обзор", "правило «не пропускать дважды»"]}, {"h": "Люди", "items": ["партнёр по привычке", "отчёт в группу", "наставник"]}], "cap": "Если привычка не держится, проверьте, какой из трёх опор не хватает."}, "src": ["fastres|10 дней с ежедневными отчётами", "smith|30 дней привычек миллионеров", "ferris_tools|ритуалы гигантов и эксперимент", "yura_ra|ритм, утренние ритуалы, «не говори больше, чем сделаешь»"], "ex": "Привычка «английский 15 минут». Среда: учебник на столе, приложение на первом экране. Учёт: отметка в календаре. Люди: каждый вечер скриншот прогресса подруге, которая учит испанский.", "err": ["Рассказывать всем о планах вместо отчёта о сделанном.", "Перенимать чужой ритуал целиком, не проверив, подходит ли он вам."], "qa": [["Назовите три опоры системы привычек.", "Среда, учёт, люди."], ["Чем отчёт отличается от объявления планов?", "Отчёт фиксирует сделанное и создаёт ответственность; объявление планов даёт преждевременное удовлетворение."]], "task": "Для привычки из урока 3.2 спроектируйте систему: два изменения среды, способ учёта и недельного обзора, один человек или группа для отчёта. Внедрите и проведите первый недельный обзор.", "out": "Описание системы по трём опорам + первый недельный обзор: что сработало, что поменять.", "rub": [["Среда изменена", "два реальных изменения"], ["Учёт настроен", "трекер и время обзора"], ["Есть человек", "названо имя или группа и формат отчёта"], ["Обзор проведён", "выводы и одно изменение"]], "sample": "Привычка: бег 3 раза в неделю. Среда: форма с вечера у кровати, маршрут выбран. Учёт: приложение + воскресный обзор. Люди: сосед, бегаем по вторникам вместе. Обзор: 3 из 3, добавлю растяжку.", "deep": [{"h": "Среда сильнее мотивации", "p": ["Привычка держится, когда нужное действие требует меньше усилий, чем ненужное. Добавьте «трение» вредному (телефон в другой комнате, сладкое не покупать) и уберите его у полезного (кроссовки у кровати, книга на подушке). Это проще, чем каждый раз уговаривать себя.", "Юра Ра в «22 привычках миллиардера» сквозь эзотерическую рамку даёт практичные правила: устойчивый ритм дня, утренние ритуалы, «не говори больше, чем сделаешь». Смит в «Привычках миллионеров» подчёркивает окружение и наставников."]}, {"h": "Учёт и обзор", "p": ["Трекер делает прогресс видимым, а недельный обзор — управляемым. Правило «не пропускать дважды»: один пропуск — случайность, два — начало новой привычки. Феррис в «Инструментах гигантов» показывает, что у большинства успешных людей есть ритуалы обзора — дневник, вопросы вечером, планирование утром."]}, {"h": "Люди и обязательства", "p": ["Парабеллум и Мрочковский строят «Быстрые результаты» на ежедневных отчётах группе: публичное обязательство и сравнение с другими сильно поднимают выполнение. Важно отличать отчёт о сделанном от объявления планов: рассказ о намерениях даёт преждевременное чувство достижения и снижает мотивацию."]}], "steps": ["Возьмите привычку из урока 3.2.", "Сделайте два изменения среды: убрать трение у полезного и добавить у вредного.", "Выберите способ учёта и время недельного обзора.", "Договоритесь с одним человеком о ежедневном или еженедельном отчёте о сделанном.", "Введите правило «не пропускать дважды».", "Через неделю проведите обзор и измените одну вещь."], "check": ["Среда изменена реально, а не на бумаге.", "Учёт ведётся, обзор назначен.", "Есть человек или группа для отчёта.", "Я отчитываюсь о сделанном, а не объявляю планы.", "Есть правило на случай пропуска."], "qa2": [["Что такое «трение» в привычках?", "Количество усилий, необходимых для начала действия; его добавляют вредному и убирают у полезного."], ["Почему объявление планов вредит?", "Оно даёт ощущение достижения до действия и снижает мотивацию."]]}]}, {"n": 4, "title": "Утро, сон, энергия, тело", "goal": "Настроить ритм дня: утро, сон, восстановление и движение как фундамент продуктивности.", "lessons": [{"t": "Утро, которое задаёт день", "min": 35, "why": "Первые часы дня — время, когда вы ещё не отвечаете на чужие запросы. Кто их не планирует, отдаёт их почте и новостям.", "pts": ["Робертс («Магия успешного утра»): учитывайте **хронотип** («жаворонок» или «сова») и сдвигайте подъём постепенно, по 15 минут; ритуал пробуждения — вода, свет, движение, план.", "Хэл Элрод («Магия утра», конспект в «Годе личной эффективности» и саммари): шесть практик **S.A.V.E.R.S.** — тишина, аффирмации, визуализация, упражнения, чтение, записи.", "Шарма («Клуб 5 часов утра»): **формула 20/20/20** — 20 минут движения до пота, 20 минут рефлексии (дневник, планирование), 20 минут роста (чтение, обучение).", "Феррис собрал утренние ритуалы десятков людей: заправить кровать, медитация, дневник, чай — общий принцип в **маленькой победе до начала работы**.", "Важно не время подъёма, а **защищённый блок** до мессенджеров. Для «совы» он может начаться в 9:00."], "fig": {"k": "lines", "rows": [{"name": "Клуб 5 утра", "segs": [[0, 33, "движение"], [33, 66, "рефлексия"], [66, 100, "рост"]]}, {"name": "S.A.V.E.R.S.", "pts": [[8, "тишина"], [25, "аффирм."], [42, "визуал."], [58, "упражн."], [75, "чтение"], [92, "записи"]]}], "cap": "Две схемы утра: три блока по 20 минут у Шармы и шесть практик у Элрода."}, "src": ["roberts|хронотип, постепенный сдвиг, ритуал пробуждения", "godeff|конспект Элрода «Магия утра»", "a48859140|саммари «Магия утра»: S.A.V.E.R.S.", "a48504319|формула 20/20/20", "ferris_tools|утренние ритуалы гигантов"], "ex": "Сова: подъём 7:30, телефон в авиарежиме до 9:00. 7:40 — вода и 10 минут зарядки, 7:55 — дневник (3 главных дела), 8:10 — 20 минут чтения, затем завтрак и дорога.", "err": ["Резко перейти на подъём в 5:00 и через неделю «сломаться».", "Начинать утро с мессенджеров и новостей."], "qa": [["Что такое формула 20/20/20?", "20 минут движения, 20 — рефлексии, 20 — роста."], ["Как сдвигать подъём?", "Постепенно, по 15 минут каждые несколько дней, вместе с временем отбоя."]], "task": "Спроектируйте своё утро на 30–60 минут: подъём, защищённый блок без телефона, 3–4 практики из уроков. Проведите его 5 дней и запишите, что прижилось.", "out": "Расписание утра по минутам + отчёт за 5 дней.", "rub": [["Учтён хронотип", "время реалистично для вас"], ["Есть защищённый блок", "без мессенджеров и новостей"], ["Практики осмысленны", "связаны с вашими целями"], ["Есть отчёт", "что сработало, что меняете"]], "sample": "6:45 подъём, 6:50 вода и 15 минут йоги, 7:05 дневник и 3 дела дня, 7:20 15 минут английского, 7:35 душ и завтрак. Прижилось 4 из 5 дней, английский перенесу в дорогу.", "deep": [{"h": "Хронотип и постепенный сдвиг", "p": ["Робертс в «Магии успешного утра» начинает с хронотипа: «жаворонки» и «совы» различаются генетически и по привычкам, и насильственный подъём в 5:00 у «совы» оборачивается хроническим недосыпом. Подъём сдвигают постепенно — на 15 минут раз в несколько дней — вместе с временем отбоя. Ритуал пробуждения: стакан воды, свет, движение, план дня."]}, {"h": "S.A.V.E.R.S. и 20/20/20", "p": ["Элрод (конспект в «Годе личной эффективности» и саммари) предлагает шесть практик: **Silence** — тишина, медитация; **Affirmations** — утверждения; **Visualization** — визуализация; **Exercise** — упражнения; **Reading** — чтение; **Scribing** — записи. Их можно делать по несколько минут каждую.", "Шарма в «Клубе 5 часов утра» сжимает утро до формулы **20/20/20**: 20 минут интенсивного движения (снижает кортизол, даёт энергию), 20 минут рефлексии (дневник, планирование, медитация) и 20 минут роста (чтение, обучение). Шарма называет это «окном победы» — временем до того, как мир начнёт предъявлять требования."]}, {"h": "Главное — защищённый блок", "p": ["Феррис собрал утренние ритуалы десятков людей: заправить кровать, медитация, дневник, чай. Общий принцип — **маленькая победа** до начала работы и время без входящих сообщений. Это работает и для «сов»: защищённый блок может начинаться в 8–9 утра — главное, чтобы мессенджеры и новости не открывали день."]}], "steps": ["Определите свой хронотип (когда вы естественно просыпаетесь в отпуске).", "Выберите время подъёма и сдвигайте его по 15 минут за 3–4 дня.", "Составьте утро на 30–60 минут: 3–4 практики.", "Решите, где лежит телефон до конца утреннего блока.", "Подготовьте всё с вечера: одежда, вода, книга.", "Пять дней фиксируйте, что прижилось, и упростите остальное."], "check": ["Время подъёма реалистично для моего хронотипа.", "Утро начинается без мессенджеров и новостей.", "Есть хотя бы одна «маленькая победа».", "Подготовка сделана с вечера.", "Утро короткое настолько, чтобы выполняться каждый день."], "qa2": [["Что означает каждая буква S.A.V.E.R.S.?", "Тишина, аффирмации, визуализация, упражнения, чтение, записи."], ["Зачем движение в первые 20 минут по Шарме?", "Чтобы снизить уровень стресса, проснуться и получить энергию на день."]]}, {"t": "Сон", "min": 35, "why": "Недосып незаметно ворует внимание, память, настроение и силу воли. Это самый дешёвый «допинг» продуктивности.", "pts": ["Курпатов («10 рецептов хорошего сна»): сон состоит из циклов медленного и быстрого сна; ночь — около 4–5 циклов. Важна **регулярность** времени отхода ко сну и подъёма.", "Главный враг сна — **тревога о сне**: чем сильнее стараешься уснуть, тем хуже. Если не спится 20 минут — встаньте, займитесь скучным делом при тусклом свете и вернитесь, когда захочется спать.", "Кровать должна ассоциироваться только со сном: не работать и не листать ленту в постели.", "Гигиена: прохладная тёмная комната, без кофеина после обеда и тяжёлой еды на ночь, «ритуал засыпания» 20–30 минут без экранов.", "Курпатов различает преходящую бессонницу (стресс, событие) и хроническую — при последней нужен врач."], "fig": {"k": "flow", "v": true, "a": ["Ритуал за 30 мин|свет приглушён, экраны выключены", "Постель — только для сна|без работы и ленты", "Не уснул за 20 мин|встать, скучное дело, вернуться", "Подъём в одно время|даже в выходные"], "cap": "Четыре правила, которые закрепляют рефлекс «кровать → сон»."}, "src": ["k_sleep|механизм сна, типы бессонницы, рецепты", "roberts|сон и хронотип", "suzuki|сон и память"], "ex": "Ранее: ложусь в разное время, засыпаю с телефоном. Теперь: 22:45 приглушённый свет, книга; 23:15 сон; подъём 7:00 каждый день. Через две недели засыпаю за 15 минут.", "err": ["Отсыпаться в выходные до обеда — сбивает ритм на всю неделю.", "Лежать часами, «пытаясь уснуть»."], "qa": [["Что делать, если не спится 20 минут?", "Встать, заняться скучным делом при тусклом свете и вернуться в постель при сонливости."], ["Почему важно одно время подъёма?", "Ритм задаётся подъёмом; он закрепляет время засыпания."]], "task": "Неделю ведите дневник сна: время отбоя, засыпания, пробуждения, качество (1–5), кофеин и экраны вечером. Выберите два правила и внедрите их на следующую неделю.", "out": "Таблица 7 дней + два правила + сравнение двух недель.", "rub": [["Дневник полный", "7 записей с временем и качеством"], ["Найдена закономерность", "что влияет на ваш сон"], ["Правила выбраны по данным", "связаны с закономерностью"], ["Есть сравнение", "изменилось ли качество"]], "sample": "Закономерность: после кофе в 17:00 засыпаю через 50 минут. Правила: кофе до 14:00, телефон на зарядке в коридоре. Неделя 2: засыпание 15–20 минут, качество с 2,9 до 3,8.", "deep": [{"h": "Как устроен сон", "p": ["Курпатов в «10 рецептах хорошего сна» объясняет механику: ночь состоит из циклов около полутора часов; в каждом медленный сон (восстановление тела) и быстрый (обработка информации, сновидения). Будильник посреди глубокой фазы даёт тяжёлое пробуждение.", "Он различает преходящую бессонницу (стресс, перелёт, важное событие) и хроническую. Главная поддерживающая причина хронической — **тревога о сне**: человек ложится с мыслью «опять не усну», и эта мысль включает возбуждение."]}, {"h": "Правила, которые закрепляют рефлекс", "p": ["Кровать должна связываться только со сном: никакой работы, ленты и споров в постели. Если не уснули за 15–20 минут — вставайте, делайте что-то скучное при тусклом свете и возвращайтесь, когда захочется спать. Подъём в одно и то же время, включая выходные, — якорь ритма.", "Гигиена: прохладная тёмная комната, без кофеина во второй половине дня, без тяжёлой еды и алкоголя на ночь, экраны выключены за 30–60 минут."]}, {"h": "Сон и память", "p": ["Сузуки как нейробиолог подчёркивает: сон нужен для консолидации памяти — во сне закрепляется выученное днём. Недосып снижает внимание, настроение и силу воли (связь с уроком 3.3): усталый человек чаще срывается."]}], "steps": ["Неделю ведите дневник сна.", "Выберите фиксированное время подъёма на все 7 дней.", "Отсчитайте 7,5–8 часов назад — это время отбоя; за 30 минут до него — ритуал.", "Уберите из кровати работу и телефон.", "Введите правило 20 минут.", "Через неделю сравните качество сна."], "check": ["Подъём в одно время каждый день.", "Есть ритуал засыпания без экранов.", "Кровать — только для сна.", "Кофеин — до обеда.", "Я не борюсь со сном, а встаю, если не спится."], "qa2": [["Почему тревога о сне ухудшает сон?", "Мысль «опять не усну» включает возбуждение нервной системы."], ["Зачем вставать в одно время в выходные?", "Подъём задаёт ритм; сдвиг сбивает засыпание на всю неделю."]]}, {"t": "Усталость и восстановление", "min": 40, "why": "Работать «на износ» кажется продуктивным, пока не наступает истощение. Отдых — часть работы, а не награда за неё.", "pts": ["Архангельский («Тайм-драйв») начинает систему ТМ с **отдыха**: не стать «загнанной лошадью»; чередовать работу и короткие перерывы, отдыхать **до** сильной усталости.", "Курпатов («Как избавиться от переутомления») описывает **три фазы** неврастении: раздражительность → истощаемость → апатия. Усталость — сигнал, а не слабость характера.", "Отдых — это **смена деятельности**: после умственной работы — движение, после общения — тишина.", "Карма («Продуктивность миллионеров») называет энергию вторым ресурсом после целей: сон, движение, питание, режим. Елена Клишина (подкаст) — о том, как жить на высоких скоростях, не выгорая: темп требует обязательных пауз.", "Андрей Онистрат (подкаст) — о мотивации на подвиги: большие нагрузки выдерживает тот, кто восстанавливается по плану, а не по остаточному принципу."], "fig": {"k": "curve", "pts": [[0, 6], [15, 8], [25, 5], [27, 7.5], [45, 8], [55, 5], [57, 7], [75, 7.5], [90, 4], [100, 3]], "marks": [[25, "перерыв"], [55, "перерыв"], [90, "работа без пауз"]], "xl": "рабочий день", "yl": "энергия", "cap": "Короткие паузы держат энергию; без пауз в конце дня наступает провал."}, "src": ["arkh|отдых: как не стать загнанной лошадью", "k_fatigue|три фазы переутомления и рецепты", "karma|энергия как второй ресурс", "a27442648|выпуск: как жить на высоких скоростях", "a27442760|выпуск: как мотивировать себя на подвиги"], "ex": "Работа блоками по 50 минут, затем 10 минут ходьбы или растяжки. Обед без экрана. Вечером — час без работы и новостей. Через неделю вечерний «провал» в 16:00 исчезает.", "err": ["Отдыхать в соцсетях: мозг продолжает получать информацию и не восстанавливается.", "Игнорировать признаки второй фазы — раздражительность и ошибки."], "qa": [["Назовите три фазы переутомления по Курпатову.", "Раздражительность, истощаемость, апатия."], ["Почему отдых — это смена деятельности?", "Восстанавливаются те системы, которые были нагружены, если нагрузить другие."]], "task": "Три дня отмечайте каждый час уровень энергии (1–10) и чем вы были заняты. Найдите провалы и их причины. Спланируйте ритм: рабочие блоки, паузы и вид отдыха в каждой паузе.", "out": "График энергии за 3 дня + выводы + ритм рабочего дня.", "rub": [["Замеры полные", "не менее 8 замеров в день"], ["Причины провалов найдены", "связь с делами, едой, сном"], ["Ритм составлен", "блоки и паузы по времени"], ["Отдых — смена деятельности", "в паузах не экран и не та же работа"]], "sample": "Провал в 15:00 после обеда за компьютером. Ритм: 9:00–12:00 три блока по 50/10, 12:00 обед + прогулка 15 минут, 13:00–17:00 блоки по 45/15 с растяжкой.", "deep": [{"h": "Отдых как часть системы", "p": ["Архангельский начинает «Тайм-драйв» не с планирования, а с отдыха: человек, работающий на износ, теряет производительность, а не выигрывает время. Принципы: отдыхать **до** сильной усталости, чередовать виды деятельности, планировать отдых так же, как работу, и спать достаточно.", "Карма в «Продуктивности миллионеров» называет энергию вторым ресурсом после целей: сон, спорт, питание и режим — фундамент, без которого планы не выполняются."]}, {"h": "Три фазы переутомления", "p": ["Курпатов описывает неврастению как три фазы. **Первая** — раздражительность, неусидчивость, плохой сон. **Вторая** — быстрая истощаемость, ошибки, «ничего не хочется». **Третья** — апатия и вялость. На первой фазе достаточно отдыха, на третьей нужен врач.", "Его рецепты: смена деятельности, регулярный сон, движение, отказ от лишнего, умение говорить «нет»."]}, {"h": "Ритм работы и пауз", "p": ["Клишина (подкаст Маклахова), преподаватель MBA по эффективности, — о жизни в большом городе: высокий темп возможен, если в нём есть обязательные паузы. Онистрат, «бегущий банкир» и Ironman, — о том, что большие нагрузки выдерживает тот, кто восстанавливается по плану. Практически — блоки работы по 50–90 минут и перерывы 10–15 минут с движением, а не с лентой."]}], "steps": ["Три дня замеряйте энергию каждый час (1–10).", "Найдите провалы и их причины.", "Составьте ритм: рабочие блоки и паузы.", "Для каждой паузы выберите вид отдыха — смена деятельности.", "Определите ваш признак первой фазы переутомления и действие на этот случай.", "Запланируйте один полный день отдыха в неделю."], "check": ["Паузы стоят в расписании, а не «если останется время».", "Отдых в паузах — не экран и не та же работа.", "Я знаю свои признаки переутомления.", "Есть день отдыха в неделю.", "Сон достаточный (урок 4.2)."], "qa2": [["Почему отдыхать нужно до сильной усталости?", "Восстановление после истощения занимает намного больше времени, а производительность уже упала."], ["Что делать на третьей фазе переутомления?", "Обратиться к врачу: апатия — признак серьёзного истощения."]]}, {"t": "Движение и химия мозга", "min": 35, "why": "Тело и мозг — одна система. Движение — самый доступный способ улучшить настроение, внимание и память.", "pts": ["Венди Сузуки (нейробиолог, «Странная девочка, которая влюбилась в мозг»): регулярные аэробные нагрузки улучшают настроение, внимание и рост нейронов в гиппокампе — зоне памяти.", "Лоретта Бройнинг («Гормоны счастья»): четыре «химических» системы — **дофамин** (достижение), **серотонин** (статус, уважение), **окситоцин** (доверие), **эндорфин** (снятие боли). Их можно запускать полезными привычками, а не только сладким и лентой.", "Дофамин — маленькие цели и отметки о прогрессе; окситоцин — объятия, доверительный разговор; серотонин — признание своих достижений; эндорфин — смех, интенсивное движение.", "Андрей Онистрат и Юрий Белонощенко (гости подкаста Маклахова) — Ironman-триатлонисты и предприниматели: для них спорт — тренажёр характера, который переносится в бизнес и семью."], "fig": {"k": "quad", "c": "Гормоны счастья: что их запускает", "a": ["Дофамин: шаг к цели", "Серотонин: признание", "Окситоцин: доверие, близость", "Эндорфин: смех, нагрузка"], "cap": "Для каждой системы есть здоровый способ запуска."}, "src": ["suzuki|физическая нагрузка, настроение и память", "a28755069|четыре гормона счастья и здоровые способы их запускать", "a27442760|выпуск с «бегущим банкиром» Андреем Онистратом", "a27442664|выпуск с Ironman Юрием Белонощенко: 9 принципов"], "ex": "После 30 минут быстрой ходьбы утром работа над сложным отчётом идёт заметно легче. Вечером вместо ленты — звонок другу (окситоцин) и запись трёх достижений дня (серотонин).", "err": ["Искать дофамин только в ленте и покупках.", "Ждать результатов от одной тренировки."], "qa": [["Какие четыре системы выделяет Бройнинг?", "Дофамин, серотонин, окситоцин, эндорфин."], ["Как физическая нагрузка влияет на мозг?", "Улучшает настроение и внимание, поддерживает память."]], "task": "Составьте «меню счастья»: по 3 здоровых способа запуска каждой из четырёх систем. Добавьте в неделю 3 сеанса движения по 20–30 минут и отметьте настроение до и после.", "out": "Меню из 12 пунктов + отчёт о трёх тренировках с оценкой настроения до/после.", "rub": [["Меню полное", "по 3 пункта на каждую систему"], ["Способы здоровые", "без еды, алкоголя и бесконечной ленты"], ["Тренировки выполнены", "3 сеанса с длительностью"], ["Есть замеры", "настроение до и после"]], "sample": "Дофамин: закрыть задачу из списка, 1000 шагов к цели, новая страница книги. Эндорфин: бег 20 минут, комедия, танцы. Тренировки: настроение 4→7, 5→7, 3→6.", "deep": [{"h": "Движение меняет мозг", "p": ["Сузуки как нейробиолог описывает собственный эксперимент: регулярные аэробные нагрузки улучшили её настроение, внимание и память. Исследования показывают рост нейронов в гиппокампе — зоне памяти — при регулярных тренировках. Эффект на настроение заметен уже после одной тренировки, на память — через недели регулярности."]}, {"h": "Четыре химических системы", "p": ["Бройнинг («Гормоны счастья») объясняет эмоции через нейромедиаторы, доставшиеся нам от предков-млекопитающих. **Дофамин** — радость от приближения к цели, ожидания награды. **Серотонин** — уверенность от признания, статуса. **Окситоцин** — чувство доверия и близости. **Эндорфин** — маскировка боли, «эйфория бегуна».", "Её главная мысль: мозг ищет «быстрые» способы запуска этих систем (сладкое, лента, покупки), и они формируют вредные привычки. Задача — проложить новые нейронные пути к тем же ощущениям здоровыми способами; книга предлагает 45-дневный план."]}, {"h": "Спорт как тренажёр характера", "p": ["Онистрат и Белонощенко (подкаст Маклахова) — предприниматели и Ironman-триатлонисты. Для них спорт — не только здоровье, но и тренажёр характера: регулярность, умение терпеть дискомфорт и идти к большой цели маленькими шагами переносятся на бизнес и семью."]}], "steps": ["Составьте «меню счастья»: по 3 здоровых способа на дофамин, серотонин, окситоцин, эндорфин.", "Запланируйте 3 тренировки по 20–30 минут в неделю.", "Перед и после тренировки отмечайте настроение (1–10).", "Найдите один «быстрый» способ получения удовольствия, который хотите заменить, и подберите здоровую замену из меню.", "Через 2 недели оцените изменения сна, настроения, концентрации."], "check": ["Меню счастья заполнено.", "Тренировки стоят в календаре.", "Есть замеры настроения.", "Найдена замена одному «быстрому» удовольствию.", "Выбраны нагрузки, которые мне нравятся."], "qa2": [["За что отвечает серотонин по Бройнинг?", "За чувство уверенности, связанное с признанием и статусом."], ["Почему «быстрые» удовольствия формируют вредные привычки?", "Мозг закрепляет кратчайший путь к выбросу нейромедиаторов и повторяет его."]]}]}, {"n": 5, "title": "Страх, уверенность, мотивация", "goal": "Научиться действовать при страхе, укреплять самооценку делами и понимать, что на самом деле вас мотивирует.", "lessons": [{"t": "Природа страха и как с ним работать", "min": 40, "why": "Страх не исчезает перед действием — он уменьшается после него. Кто ждёт бесстрашия, ждёт всю жизнь.", "pts": ["Сьюзен Джефферс («Бойся… но действуй!»): страх будет всегда, пока вы растёте. Под всеми страхами лежит один: **«я не справлюсь»**. Задача — не избавиться от страха, а укрепить уверенность «я справлюсь с последствиями».", "Курпатов («Таблетка от страха», «Страхи большого города»): страх — реакция на угрозу, которую мы **сами себе нарисовали**. Избегание приносит облегчение сейчас и закрепляет страх; встреча с пугающим малыми дозами — ослабляет.", "Курпатов («Убить иллюзии»): отличайте **опасность** (реальная угроза) от **опасения** (мысль о возможной угрозе). Большинство страхов — опасения.", "Джим Лоулесс («Иди туда, где страшно»): за год он освоил профессию жокея и стал рекордсменом-фридайвером, следуя правилу — двигаться туда, где страшно, маленькими шагами и с подготовкой.", "Практика «лестницы страха»: ранжируйте ситуации от 1 до 10 и проходите их снизу вверх, оставаясь в каждой до снижения тревоги."], "fig": {"k": "fork", "q": "Страшно сделать шаг", "a": "Избегание: облегчение сейчас → страх растёт → мир сужается", "b": "Шаг малой дозой: тревога пикует и спадает → «я справился» → уверенность растёт", "cap": "Каждый выбор закрепляет одну из двух петель."}, "src": ["a30790654|«я справлюсь» и действие при страхе", "k_fear|формула страха и практика встречи с ним", "k_fearcity|разбор страхов: публичность, ошибки, бедность", "k_illusions|опасность и опасение", "a48584888|10 правил: иди туда, где страшно"], "ex": "Страх: звонить незнакомым клиентам. Лестница: 1 — написать письмо; 3 — позвонить знакомому клиенту; 5 — позвонить «тёплому» контакту; 8 — холодный звонок; 10 — звонок директору крупной компании. Каждая ступень — 3 раза.", "err": ["Ждать, пока «станет не страшно».", "Начинать с верхней ступени и после неудачи решать, что «это не моё»."], "qa": [["Что лежит под всеми страхами по Джефферс?", "Убеждение «я не справлюсь»."], ["Чем опасность отличается от опасения?", "Опасность — реальная угроза сейчас; опасение — мысль о возможной угрозе."]], "task": "Выберите страх, который мешает вашей цели. Отделите опасность от опасения. Постройте лестницу из 6–8 ступеней и пройдите первые две.", "out": "Описание страха, разбор «опасность/опасение», лестница с оценками тревоги, отчёт о двух ступенях (тревога до и после).", "rub": [["Страх связан с целью", "видно, что он мешает конкретному делу"], ["Опасность отделена от опасения", "есть факты"], ["Лестница постепенна", "ступени от 1–2 до 9–10 без пропасти"], ["Ступени пройдены", "две, с замерами тревоги"]], "sample": "Страх: выступить на планёрке. Опасение: «засмеют». Опасность: нет. Ступени: задать вопрос (2), короткий комментарий (4), доклад 2 минуты (6), доклад 10 минут (9). Ступень 1: тревога 6 → 2.", "deep": [{"h": "Пять истин о страхе по Джефферс", "p": ["Джефферс формулирует несколько утверждений, которые снимают стыд за страх: страх не исчезнет, пока вы продолжаете расти; единственный способ избавиться от страха перед делом — сделать его; лучше почувствовать себя хорошо, сделав шаг, чем копить страх, избегая; страх испытывают все, кто идёт на неизвестную территорию; и пережить страх легче, чем жить с беспомощностью, которую рождает избегание.", "Её ключевая мысль — под всеми страхами лежит одно: **«я не справлюсь»**. Поэтому работать нужно не с конкретной ситуацией, а с уверенностью в своей способности справиться с любыми последствиями."]}, {"h": "Механизм страха по Курпатову", "p": ["Курпатов («Таблетка от страха», «Страхи большого города») объясняет: страх — реакция на угрозу, которую мозг дорисовал. Избегание даёт немедленное облегчение, и это облегчение закрепляет страх как полезный. Чем больше избегаем, тем шире зона страха: сначала боимся выступать на совещании, потом звонить, потом писать письма.", "В «Убить иллюзии» он разделяет **опасность** — реальную угрозу — и **опасение** — мысль о её возможности. Опасения почти всегда больше реальности, и проверка фактами их уменьшает."]}, {"h": "Экспозиция: лестница страха", "p": ["Рабочий метод из когнитивно-поведенческой терапии, на который опираются и Курпатов, и Лоулесс: постепенная встреча с пугающим. Составляется лестница ситуаций от 1 до 10; на каждой ступени остаются, пока тревога не снизится примерно вдвое, и повторяют её несколько раз. Лоулесс описывает, как так за год освоил профессию жокея и стал рекордсменом-фридайвером: двигаться туда, где страшно, с подготовкой и маленькими шагами."]}], "steps": ["Назовите страх, который мешает конкретной цели.", "Запишите самый вероятный и самый плохой исход — и что вы сделаете в каждом случае («я справлюсь, потому что…»).", "Отделите опасность от опасения фактами.", "Постройте лестницу из 6–8 ступеней.", "Проходите по ступени 2–3 раза в неделю, отмечая тревогу до и после.", "Переходите выше, когда тревога на ступени падает ниже 4 из 10."], "check": ["У страха есть план «что я сделаю, если…».", "Опасность отделена от опасения.", "Лестница без пропастей между ступенями.", "Я остаюсь в ситуации до снижения тревоги.", "Я веду записи и вижу прогресс."], "qa2": [["Почему облегчение после избегания вредно?", "Оно подкрепляет избегание и делает страх «полезным» в глазах мозга."], ["Когда переходить на следующую ступень лестницы?", "Когда тревога на текущей ступени стабильно низкая (ниже 4 из 10)."]]}, {"t": "Самооценка и уверенность", "min": 40, "why": "Самооценку не «поднимают» словами. Она растёт из сдержанных обещаний себе и опыта «я смог».", "pts": ["Psychologies («Заниженная самооценка»): признаки — постоянное сравнение, критика себя и других, трудность сказать «нет», чувство вины за успех, зависимость от чужого мнения.", "Psychologies («Новое мужество быть собой»): уважение к себе начинается с **умения слышать себя** — свои эмоции, усталость, желания.", "Джен Синсеро («НИ СЫ»): сомнение — не факт, а привычка ума; уверенность — это решение действовать, не дожидаясь гарантии.", "Луиза Хей («Стань счастливым за 21 день»): 21 день практик любви к себе, включая работу с зеркалом. Рабочее ядро — ежедневно замечать и признавать себя, а не только критиковать.", "Механизм: **сдержанное обещание себе → доказательство → доверие к себе**. Начинайте с обещаний, которые точно выполните."], "fig": {"k": "stairs", "a": ["Маленькое обещание", "Выполнено и записано", "Доказательство «я могу»", "Обещание больше", "Доверие к себе"], "cap": "Самооценка — накопленная статистика выполненных обещаний себе."}, "src": ["psy_low|признаки низкой самооценки и уважение к себе", "psy_courage|слышать себя и свои эмоции", "a37402792|сомнение как привычка, уверенность как решение", "a22808739|21 день практик принятия себя"], "ex": "Обещание: «3 дня подряд встаю в 7:00». Выполнено — записано в «журнал побед». Следующее: «неделю». Через месяц пришла уверенность, что могу держать режим, — и решение записаться на курс.", "err": ["Давать себе большие обещания и срывать их — так самооценка падает.", "Сравнивать свою «изнанку» с чужой «витриной» в соцсетях."], "qa": [["Как растёт самооценка?", "Через сдержанные обещания себе и накопленные доказательства «я могу»."], ["Назовите два признака низкой самооценки.", "Постоянное сравнение с другими, неспособность сказать «нет» (также вина за успех, зависимость от оценки)."]], "task": "Заведите «журнал побед» на 14 дней: каждый вечер 3 вещи, которые вы сделали хорошо, и одно обещание себе на завтра (маленькое). Через неделю проанализируйте процент выполнения.", "out": "Записи за 7 дней + процент выполненных обещаний + вывод.", "rub": [["Записи ежедневные", "7 из 7"], ["Победы конкретны", "действия, а не «был молодцом»"], ["Обещания маленькие", "реально выполнимы"], ["Есть анализ", "процент и что изменить"]], "sample": "День 3: 1) Отказал коллеге в чужой задаче. 2) Пробежал 3 км. 3) Сдал отчёт вовремя. Обещание: позвонить маме до 20:00. Итог недели: 6 из 7 обещаний выполнено.", "deep": [{"h": "Как выглядит низкая самооценка", "p": ["Сборник Psychologies «Заниженная самооценка» перечисляет признаки: постоянное сравнение, критика себя и других, трудность сказать «нет», чувство вины за успех и удовольствие, привычка подражать, сверхчувствительность к чужому мнению. Многие из них маскируются под добродетели: скромность, ответственность, перфекционизм.", "«Новое мужество быть собой» добавляет основу уважения к себе — умение **слышать себя**: замечать усталость, желания, эмоции и считать их значимыми."]}, {"h": "Доверие к себе", "p": ["Самооценка складывается из опыта: каждый раз, когда вы выполняете обещание себе, растёт внутреннее доверие; каждое нарушение подтачивает его. Поэтому большие обещания, которые срываются, вредят сильнее, чем отсутствие обещаний. Начинайте с таких, которые точно выполните.", "Синсеро («НИ СЫ») говорит о том же с другой стороны: сомнение — привычка ума, а уверенность — решение действовать, не дожидаясь гарантии. Луиза Хей («Стань счастливым за 21 день») предлагает ежедневные практики принятия, включая работу с зеркалом; рабочее ядро — замечать и признавать себя, а не только критиковать."]}, {"h": "Сравнение и соцсети", "p": ["Сравнивая свою «изнанку» с чужой «витриной», невозможно выиграть. Полезная замена — сравнивать себя с собой месяц назад и вести журнал побед: он даёт мозгу доказательства, которые фильтр низкой самооценки обычно отбрасывает."]}], "steps": ["Отметьте признаки низкой самооценки, которые узнаёте в себе.", "Каждый вечер записывайте 3 вещи, сделанные хорошо.", "Давайте одно маленькое обещание себе на завтра.", "Еженедельно считайте процент выполненных обещаний.", "Сократите время в соцсетях, где вы чаще всего себя сравниваете.", "Раз в неделю делайте одно действие из «уважения к себе»: отказ, отдых, просьба."], "check": ["Мои обещания себе маленькие и выполнимые.", "Журнал побед ведётся ежедневно.", "Я сравниваю себя с собой, а не с другими.", "Я сказал(а) «нет» хотя бы раз, когда хотел(а).", "Я замечаю свою усталость и желания."], "qa2": [["Почему большие сорванные обещания вредят самооценке?", "Каждое нарушение обещания себе подтачивает внутреннее доверие."], ["Зачем нужен журнал побед?", "Он даёт доказательства «я могу», которые фильтр низкой самооценки обычно отбрасывает."]]}, {"t": "Что нас мотивирует", "min": 40, "why": "Когда мотивации «нет», обычно не хватает не силы, а понимания, какая потребность движет и чем её питать.", "pts": ["Маслоу («Мотивация и личность»): потребности — физиологические, безопасность, принадлежность, уважение, **самоактуализация**. Это не жёсткая лестница: высшие потребности просыпаются, когда базовые в целом закрыты.", "Дэниел Пинк (конспект в «Годе личной эффективности»): для творческой работы деньги работают как гигиена; движут **автономия, мастерство и цель**.", "Роббинс: поведением управляют связки **боль/удовольствие**. Чтобы измениться, свяжите старое поведение с сильной болью, новое — с удовольствием.", "Брайан Трейси («Наука мотивации»): мотивацию можно создавать по желанию — ясные цели, вера в себя, позитивный внутренний диалог и действие как источник энергии.", "Ник Вуйчич («Неудержимый»): человек без рук и ног строит жизнь на **вере в действии** — смысл сильнее обстоятельств. Андрей Онистрат (подкаст) — о мотивации на большие свершения."], "fig": {"k": "stairs", "a": ["Тело: сон, еда", "Безопасность", "Принадлежность", "Уважение", "Самоактуализация"], "cap": "Пирамида Маслоу: проверьте, какая ступень у вас сейчас «проседает»."}, "src": ["maslow|иерархия потребностей и самоактуализация", "godeff|Пинк: автономия, мастерство, цель", "robbins|связки боль/удовольствие", "a48503604|«Наука мотивации»: мотивацию можно создавать", "a18113272|вера в действии", "a27442760|выпуск: как мотивировать себя на подвиги"], "ex": "Нет желания учить английский. Анализ: безопасность закрыта, уважение — «не хочу выглядеть глупо на созвонах». Мотив: мастерство и уважение. Решение: цель «через 3 месяца веду встречу на английском» и наставник.", "err": ["Подкупать себя наградами за творческую работу — внутренний интерес падает.", "Пытаться «мотивировать» себя на высшее при хроническом недосыпе и долгах."], "qa": [["Какие три элемента мотивации по Пинку?", "Автономия, мастерство, цель."], ["Как Роббинс предлагает менять поведение?", "Связать старое с болью, новое — с удовольствием."]], "task": "Возьмите одну цель, для которой «не хватает мотивации». Определите проседающую ступень Маслоу, какие из трёх элементов Пинка есть/нет, напишите список «боль от старого / удовольствие от нового» (по 5 пунктов) и одно изменение, которое добавит автономию, мастерство или цель.", "out": "Разбор цели по Маслоу и Пинку + два списка по 5 пунктов + одно изменение.", "rub": [["Ступень Маслоу определена", "с объяснением"], ["Пинк применён", "отмечены все три элемента"], ["Списки сильные", "конкретные, эмоционально значимые пункты"], ["Изменение реальное", "можно сделать на этой неделе"]], "sample": "Цель: похудеть на 8 кг. Ступень: уважение. Автономия — нет (диета навязана). Изменение: самой выбрать план питания и вид спорта. Боль: одышка на лестнице, одежда не сходится…", "deep": [{"h": "Потребности Маслоу без мифов", "p": ["Маслоу в «Мотивации и личности» описывает иерархию: физиологические потребности, безопасность, принадлежность и любовь, уважение, самоактуализация. Он сам подчёркивал, что это не жёсткая лестница: потребности удовлетворяются частично и одновременно, а высшие становятся заметны, когда базовые в целом закрыты.", "Маслоу изучал **самоактуализирующихся** людей: им свойственны принятие себя и других, спонтанность, сосредоточенность на задачах вне себя, потребность в уединении, независимость от среды, свежесть восприятия и пиковые переживания."]}, {"h": "Мотивация 3.0 по Пинку", "p": ["Дэниел Пинк (конспект в «Годе личной эффективности») различает мотивацию «кнут и пряник», работающую для рутинных задач, и внутреннюю мотивацию для творческих. Для второй нужны **автономия** (контроль над тем, что, когда и как делать), **мастерство** (рост в деле) и **цель** (смысл больше себя). Внешние награды за интересную работу могут даже снижать интерес."]}, {"h": "Боль, удовольствие и смысл", "p": ["Роббинс объясняет: человек делает больше, чтобы избежать боли, чем чтобы получить удовольствие. Изменение происходит, когда боль от старого становится сильнее страха нового. Трейси («Наука мотивации») считает мотивацию навыком: ясные цели, вера в себя, позитивный внутренний диалог и действие, которое само порождает энергию.", "Ник Вуйчич («Неудержимый») показывает самую сильную форму мотивации — смысл. Родившись без рук и ног, он построил жизнь на «вере в действии»: смысл способен перевесить любые обстоятельства."]}], "steps": ["Выберите цель, на которую «не хватает мотивации».", "Определите, какая ступень Маслоу сейчас проседает и не мешает ли она.", "Проверьте три элемента Пинка: автономия, мастерство, цель — что можно добавить?", "Составьте списки «цена старого» и «выигрыш нового» по 5 пунктов.", "Сформулируйте смысл цели одной фразой: ради чего или кого.", "Сделайте первое действие — мотивация часто приходит после него."], "check": ["Базовые потребности не подорваны (сон, деньги, безопасность).", "В цели есть автономия, мастерство и смысл.", "Списки боли и выигрыша эмоционально значимы.", "Смысл сформулирован.", "Первое действие сделано."], "qa2": [["Почему внешние награды могут снижать интерес?", "Они превращают интересную работу в средство получения награды и вытесняют внутреннюю мотивацию."], ["Какие черты самоактуализирующихся людей описывает Маслоу?", "Принятие себя и других, спонтанность, сосредоточенность на задачах вне себя, независимость, свежесть восприятия."]]}, {"t": "Уверенно говорить на публике", "min": 40, "why": "Публичное выступление — один из самых частых страхов и один из самых быстрых способов вырасти в карьере.", "pts": ["Карнеги: уверенность растёт из **подготовки и опыта**. Говорите о том, что вы заслужили право обсуждать — из своего опыта и знаний.", "Готовьте, но **не заучивайте** текст: держите план из 3–5 мыслей и примеры. Заученный текст рассыпается при первом сбое.", "Начало — история или вопрос, не извинения. Конец — призыв или вывод. Середина — примеры, факты, наглядность.", "Курпатов («Страхи большого города») считает страх публичности формой **преувеличенного внимания к себе**: слушатели думают о теме и о себе, а не о ваших ошибках.", "Энтузиазм заразителен: говорите о том, что вам действительно важно."], "fig": {"k": "flow", "a": ["Крючок|история, вопрос, факт", "Тезис|одна главная мысль", "3 опоры|примеры и факты", "Финал|вывод и призыв"], "cap": "Каркас короткого выступления на 3–7 минут."}, "src": ["carnegie_speak|подготовка, право говорить, начало и конец речи", "k_fearcity|страх публичности как преувеличенное внимание к себе"], "ex": "Тема: зачем отделу CRM. Крючок: «Вчера мы потеряли клиента на 400 тысяч, потому что забыли перезвонить». Тезис: CRM помнит за нас. Опоры: 3 потерянные сделки за квартал, время на отчёты, опыт соседнего отдела. Финал: «Давайте с понедельника пилот на 2 недели».", "err": ["Начинать с «я не очень умею выступать».", "Перегружать слайды текстом и читать их."], "qa": [["Почему не стоит заучивать текст?", "При сбое заученный текст рассыпается; план из мыслей позволяет продолжить."], ["Чем начать выступление?", "Историей, вопросом или фактом, связанными с темой."]], "task": "Подготовьте 3-минутное выступление по рабочей или жизненной теме по схеме «крючок — тезис — 3 опоры — финал». Запишите его на телефон, пересмотрите и улучшите одну вещь. Запишите второй дубль.", "out": "План выступления + что улучшили между дублями (и, по желанию, расшифровка).", "rub": [["Есть крючок", "история, вопрос или факт"], ["Одна главная мысль", "тезис формулируется одной фразой"], ["Опоры конкретны", "примеры и цифры"], ["Улучшение между дублями", "названо и видно"]], "sample": "Тема: почему я бегаю. Крючок: «Два года назад я задыхался на третьем этаже». Тезис: бег — самый дешёвый антидепрессант. Опоры: сон, настроение, деньги на такси. Финал: «Попробуйте 10 минут завтра утром». Улучшение: убрал «э-э» и замедлил темп.", "deep": [{"h": "Карнеги: смелость из подготовки", "p": ["Карнеги учил людей выступать с 1912 года и пришёл к выводу: уверенность растёт из **подготовки** и **опыта**. Говорить стоит о том, что вы «заслужили право» обсуждать — из своей жизни и знаний. Речь готовят, но не заучивают: держат в голове план из нескольких мыслей и примеры.", "Он советовал начинать с истории или вопроса, а не с извинений; поддерживать тезис примерами и фактами; заканчивать призывом или выводом; говорить с энтузиазмом о том, что действительно волнует."]}, {"h": "Страх публичности", "p": ["Курпатов («Страхи большого города») описывает страх публичности как преувеличенное внимание к себе: кажется, что все следят за каждой ошибкой, а слушатели на деле думают о теме и о себе. Работает та же лестница, что в уроке 5.1: тост в кругу друзей → вопрос на собрании → 2 минуты на планёрке → доклад."]}, {"h": "Каркас короткой речи", "p": ["Крючок (история, вопрос, неожиданный факт) → тезис одной фразой → три опоры (примеры, цифры, аргументы) → финал (вывод, призыв, следующий шаг). На 3–5 минут этого достаточно. Запись на телефон и пересмотр — самый быстрый способ улучшить подачу: слышны «э-э», темп и паузы."]}], "steps": ["Выберите тему, в которой у вас есть опыт.", "Сформулируйте тезис одной фразой.", "Подберите крючок и три опоры с конкретикой.", "Запишите финал: что слушатель должен сделать или запомнить.", "Расскажите вслух, не заучивая текст, и запишите на телефон.", "Пересмотрите, исправьте одну вещь и запишите второй дубль."], "check": ["Тема из моего опыта.", "Тезис одной фразой.", "Опоры — конкретные примеры и цифры.", "Начало без извинений.", "Сделано минимум два дубля с улучшением."], "qa2": [["Что значит «заслужить право говорить» по Карнеги?", "Говорить о том, что вы знаете из своего опыта и изучения."], ["Почему полезно записывать выступление на видео?", "Становятся видны темп, паузы, слова-паразиты и язык тела."]]}]}, {"n": 6, "title": "Время: принципы", "goal": "Увидеть, куда уходит время, научиться выбирать главное и планировать неделю без иллюзии «успеть всё».", "lessons": [{"t": "Куда уходит время: хронометраж", "min": 35, "why": "Оценки «на глаз» ошибаются в разы. Без учёта нельзя управлять — только надеяться.", "pts": ["Архангельский («Тайм-драйв»): **хронометраж** — запись всех занятий в течение 1–2 недель с точностью 10–15 минут. Он показывает «поглотители времени» и реальную длительность задач.", "Гребенщикова («Основы осознанного тайм-менеджмента»): время — один из ресурсов наряду с финансами, людьми и энергией; осознанность начинается с понимания, что ценно именно вам.", "Центр финансовой культуры: **таймшит на месяц** — первый шаг плана роста доходов; он показывает, сколько времени уходит на работу, за которую реально платят.", "Абрамов («Занимательный тайм-менеджмент»): учёт можно сделать игрой — цвета категорий, баллы, итоги недели.", "Анализ: делите записи на **полезное** (к целям), **обязательное** (быт, дорога), **поглотители** (лента, бессмысленные встречи), **восстановление**."], "fig": {"k": "cols", "cols": [{"h": "Полезное", "items": ["работа к целям", "обучение", "главные отношения"]}, {"h": "Обязательное", "items": ["дорога", "быт", "рутинные задачи"]}, {"h": "Поглотители", "items": ["лента и новости", "встречи без повестки", "переключения"]}, {"h": "Восстановление", "items": ["сон", "спорт", "отдых без экрана"]}], "cap": "Четыре корзины для анализа хронометража."}, "src": ["arkh|хронометраж и поглотители времени", "grebensh|время как ресурс среди других", "cfc|таймшит на месяц — шаг 1 плана роста доходов", "abramov|учёт времени как игра"], "ex": "Хронометраж за неделю: 9 часов на мессенджеры, 6 часов на встречи без решения, 2 часа на обучение. Решение: проверять мессенджеры 4 раза в день, требовать повестку встреч.", "err": ["Записывать «по памяти» вечером — теряется половина переключений.", "Вести учёт и не делать выводов."], "qa": [["Сколько вести хронометраж, чтобы увидеть картину?", "Хотя бы 1–2 недели, записывая каждые 10–15 минут или каждую смену занятия."], ["Что такое поглотители времени?", "Занятия, которые съедают время без пользы и восстановления: лента, лишние встречи, переключения."]], "task": "Ведите хронометраж 3 рабочих дня и 1 выходной. Разложите время по четырём корзинам, найдите три главных поглотителя и для каждого придумайте правило.", "out": "Сводка по корзинам (часы и %), три поглотителя и три правила.", "rub": [["Учёт подробный", "шаг не крупнее 30 минут"], ["Корзины посчитаны", "часы и проценты"], ["Поглотители реальные", "подтверждены данными"], ["Правила конкретны", "понятно, что и когда меняется"]], "sample": "Полезное 31%, обязательное 38%, поглотители 19%, восстановление 12%. Поглотитель 1: лента вечером (1,5 ч). Правило: телефон на зарядке в коридоре после 21:30.", "deep": [{"h": "Зачем хронометраж", "p": ["Архангельский выделяет хронометраж как фундамент тайм-менеджмента: оценки «на глаз» ошибаются в разы. Он предлагает фиксировать все занятия с шагом 10–15 минут неделю-две, затем анализировать: сколько времени уходит на главное, какие «поглотители» съедают часы, как долго на самом деле длятся типовые задачи.", "Центр финансовой культуры использует **таймшит на месяц** как первый шаг плана роста доходов: сначала понять, сколько времени уходит на работу, за которую реально платят."]}, {"h": "Поглотители времени", "p": ["Типичные поглотители: мессенджеры и почта без расписания, совещания без повестки, поиск вещей и файлов, переключения между задачами, «быстрые» просьбы коллег, лента и новости. Каждый можно не убрать, а ограничить правилом.", "Гребенщикова напоминает, что время — один из ресурсов (наряду с деньгами, людьми, энергией); иногда дешевле купить время (доставка, помощник), чем экономить деньги ценой часов."]}, {"h": "Как сделать учёт посильным", "p": ["Абрамов («Занимательный тайм-менеджмент») предлагает игровую форму: цветовые категории, баллы, итог недели. Технически подойдут блокнот, заметки в телефоне или приложения-таймеры. Главное — записывать сразу, а не вечером по памяти, иначе теряются переключения."]}], "steps": ["Выберите способ учёта и категории: полезное, обязательное, поглотители, восстановление.", "Ведите учёт 3–7 дней, записывая каждую смену занятия.", "Посчитайте часы и проценты по категориям.", "Выпишите три главных поглотителя.", "Для каждого придумайте правило ограничения.", "Через неделю повторите короткий учёт и сравните."], "check": ["Учёт велся в моменте, а не по памяти.", "Посчитаны доли категорий.", "Поглотители подтверждены цифрами.", "Правила конкретны (когда, сколько, как).", "Есть повторный замер."], "qa2": [["Почему записывать нужно сразу?", "По памяти теряются короткие переключения, которые и съедают время."], ["Что делать с поглотителем, который нельзя убрать?", "Ограничить правилом: время, частота, длительность."]]}, {"t": "Приоритеты: важное и срочное", "min": 40, "why": "Дела не делятся на «нужные» и «ненужные» — почти все нужные. Делятся на те, что двигают жизнь, и те, что её только поддерживают.", "pts": ["Кови (навык 3 «Сначала главное»): **матрица** важное/срочное. Эффективные люди живут во II квадранте — **важное, но не срочное**: планирование, развитие, отношения, здоровье.", "Трейси: **ABCDE** — A обязательно (последствия серьёзны), B следует, C приятно, D делегировать, E исключить. Не берись за B, пока есть A.", "Трейси: **«Съешьте лягушку»** — самое трудное и важное дело делайте первым утром.", "Круз: определите **СВЗ — самую важную задачу** дня и защитите под неё время в календаре; 1440 минут в сутках — ресурс, который нельзя накопить.", "Правило Парето (80/20): 20% действий дают 80% результата — ищите эти 20% в каждой сфере (Трейси, Феррис, «38 приёмов»)."], "fig": {"k": "quad", "c": "Матрица Кови: важность × срочность", "a": ["I. Важно и срочно: кризисы, дедлайны", "II. Важно, не срочно: развитие, здоровье, планирование", "III. Срочно, не важно: чужие запросы, звонки", "IV. Не важно, не срочно: лента, пустые дела"], "cap": "Расширяйте II квадрант за счёт III и IV — тогда I будет меньше."}, "src": ["covey|навык 3 «Сначала главное», матрица", "tracy_tm|ABCDE, «съешьте лягушку», 80/20", "kruse|самая важная задача и 1440 минут", "tm38|списки и приоритеты дня"], "ex": "Список дня из 12 дел. A: подготовить предложение крупному клиенту (лягушка, 9:00–11:00). B: отчёт. C: обновить аватар. D: заказ канцелярии → помощнику. E: встреча «просто обсудить» → отменить.", "err": ["Считать всё срочное важным.", "Ставить A всем делам — тогда приоритетов нет."], "qa": [["Какой квадрант Кови главный для роста?", "II — важное, но не срочное."], ["Что значит «съесть лягушку»?", "Сделать самое трудное и важное дело первым."]], "task": "Выпишите все дела на ближайшую неделю (не менее 20). Распределите по матрице Кови, затем пометьте ABCDE. Выберите «лягушку» на каждый день и назначьте ей время в календаре.", "out": "Матрица с делами + метки ABCDE + 5 «лягушек» с временем.", "rub": [["Список полный", "20+ дел из разных сфер"], ["Матрица честная", "во II квадранте есть дела, а в IV — признанные поглотители"], ["ABCDE применено", "A — не больше 3 в день"], ["Лягушки в календаре", "конкретное время"]], "sample": "Пн: лягушка — звонок недовольному клиенту, 9:00. Вт: план квартала (II), 9:00–10:30. D: заказ воды → офис-менеджер. E: чат «болталка» — выйти.", "deep": [{"h": "Матрица Кови подробно", "p": ["Кови делит дела по важности и срочности. **I квадрант** — кризисы, горящие сроки: их нельзя игнорировать, но если жить только в нём, наступает выгорание. **II** — важное, не срочное: планирование, развитие, отношения, здоровье, профилактика; именно он определяет качество жизни. **III** — срочное, но не важное: многие звонки, письма, чужие просьбы; создаёт иллюзию важности. **IV** — ни то ни другое: лента, пустые дела.", "Рецепт Кови: сначала вписать в неделю дела II квадранта («большие камни»), а остальное распределить вокруг. Время на II берётся из III и IV, и со временем I становится меньше — кризисы предотвращаются."]}, {"h": "ABCDE и «лягушка»", "p": ["Трейси предлагает метод **ABCDE**: A — серьёзные последствия, B — умеренные, C — никаких последствий (приятно, но не нужно), D — делегировать, E — исключить. Внутри A — нумерация A1, A2. Правило: не берись за B, пока не сделано A.", "«Съешьте лягушку» — самое трудное и важное дело делается первым, утром. Если нужно съесть двух, начинайте с самой большой. Круз предлагает похожее: определить **самую важную задачу** (СВЗ) и защитить под неё 1–2 часа в начале дня."]}, {"h": "Парето и концентрация", "p": ["Правило 80/20: 20 % действий дают 80 % результата. Трейси и Феррис советуют регулярно спрашивать: какие 20 % клиентов дают 80 % дохода? какие 20 % задач дают 80 % ценности? «38 приёмов тайм-менеджмента» сводят это к ежедневной практике: список, приоритеты, сначала записать — потом делать."]}], "steps": ["Выпишите все дела на неделю.", "Разложите по квадрантам Кови.", "Внутри списка расставьте ABCDE.", "Назначьте «лягушку» на каждый день и время в календаре утром.", "Вставьте в неделю 2–3 «больших камня» из II квадранта.", "Исключите или делегируйте все D и E."], "check": ["Во II квадранте есть запланированные дела.", "A-задач не больше трёх в день.", "«Лягушки» стоят утром.", "D и E убраны из моего списка.", "Я знаю свои 20 % самых результативных действий."], "qa2": [["Почему III квадрант опасен?", "Он создаёт иллюзию важности: срочные дела кажутся главными, хотя не двигают к целям."], ["Что делать, если «лягушек» две?", "Начинать с самой большой и неприятной."]]}, {"t": "Конечность времени", "min": 35, "why": "Попытка успеть всё порождает вечную спешку и чувство вины. Признание ограниченности освобождает: можно наконец выбрать.", "pts": ["Беркман («Четыре тысячи недель»): жизнь — примерно **4000 недель**. Успеть всё невозможно по определению, поэтому продуктивность — это не «больше дел», а **осознанный выбор, от чего отказаться**.", "Беркман советует ограничить число начатых дел (не больше трёх проектов одновременно), «решать проблемы по одной» и принимать скуку и дискомфорт настоящего.", "Саммари Smart Reading «Наведи порядок» собирает книги о том, как вернуть себе управление временем жизни — от тех же 4000 недель до практик фокуса.", "Бенджамин Франклин («Время — деньги!», «Автобиография»): время — материал, из которого сделана жизнь; он вёл ежедневный план и таблицу 13 добродетелей, отмечая одну в неделю.", "Феррис: **исключение** (DEAL) — делать меньше, но важнее; информационная диета и правило 80/20."], "fig": {"k": "cols", "cols": [{"h": "Иллюзия", "items": ["когда-нибудь успею всё", "ещё немного эффективности — и будет время", "отказ = поражение"]}, {"h": "Реальность", "items": ["времени всегда меньше, чем дел", "эффективность добавляет новых дел", "отказ = выбор главного"]}], "cap": "Беркман: свобода начинается с признания ограниченности."}, "src": ["burkeman|4000 недель, выбор и отказ", "a70901020|саммари о времени жизни", "a19323482|Франклин: план дня и 13 добродетелей", "ferris4|исключение и информационная диета"], "ex": "Было: 7 проектов «в работе», ни один не движется. Стало: 3 активных (книга, ремонт, английский), остальные — в списке «позже» с датой пересмотра 1 марта.", "err": ["Читать о конечности времени и тут же добавлять в планы новые пункты.", "Путать отказ с ленью: отказ — выбор, а не уклонение."], "qa": [["Сколько недель длится жизнь по Беркману?", "Около 4000."], ["Что Беркман советует делать с числом проектов?", "Ограничить число начатых дел — например, не больше трёх одновременно."]], "task": "Выпишите все свои проекты и обязательства. Оставьте максимум три активных, остальные перенесите в список «позже» с датой пересмотра или откажитесь явно (с сообщением тем, кого касается).", "out": "Полный список, три активных проекта, список «позже» с датами, список отказов.", "rub": [["Список полный", "включены и рабочие, и личные проекты"], ["Активных ≤ 3", "с обоснованием выбора"], ["У «позже» есть дата", "пересмотра"], ["Отказы явные", "кому и что сообщено"]], "sample": "Активные: курс аналитики, ремонт кухни, подготовка к полумарафону. Позже (до 1.03): блог, испанский. Отказ: председатель родкомитета — написала в чат класса.", "deep": [{"h": "4000 недель", "p": ["Беркман считает: средняя жизнь — около 4000 недель. Обычный тайм-менеджмент обещает «успеть всё», но чем эффективнее мы работаем, тем больше дел появляется — это «ловушка эффективности». Освобождение начинается с признания, что успеть всё невозможно, и с вопроса: от чего я сознательно откажусь?", "Его практические советы: ограничить число проектов «в работе» (например, три), решать проблемы по одной, сознательно выбирать, в чём быть посредственным, принимать скуку и дискомфорт настоящего вместо бегства в телефон, ценить «бесполезные» занятия ради них самих."]}, {"h": "Время — деньги и добродетели", "p": ["Бенджамин Франклин («Время — деньги!», «Автобиография») превратил управление временем в систему: план каждого дня с вопросами «Что хорошего я сделаю сегодня?» утром и «Что хорошего я сделал?» вечером, и таблицу **13 добродетелей** (умеренность, молчание, порядок, решительность, бережливость, трудолюбие и др.), каждой из которых он уделял неделю."]}, {"h": "Исключение прежде эффективности", "p": ["Феррис в «4-часовой рабочей неделе» ставит **исключение** (Elimination) перед автоматизацией: нет смысла делать эффективно то, что вообще не нужно делать. Информационная диета — отказ от новостей и лишних потоков — освобождает часы и внимание. Саммари Smart Reading «Наведи порядок» собирает те же идеи из нескольких книг о времени."]}], "steps": ["Выпишите все проекты и обязательства.", "Выберите не больше трёх активных.", "Остальные — в список «позже» с датой пересмотра или явный отказ.", "Определите, в чём вы готовы быть посредственным.", "Введите вопросы Франклина утром и вечером на неделю.", "Устройте информационную диету на 7 дней."], "check": ["Активных проектов не больше трёх.", "Отказы сообщены тем, кого они касаются.", "У списка «позже» есть дата.", "Я знаю, в чём сознательно не стремлюсь к совершенству.", "Вопросы Франклина задавались каждый день."], "qa2": [["Что такое ловушка эффективности по Беркма
