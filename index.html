 и выводы — на человеке: модели ошибаются уверенно. Проверяйте ссылки, цифры и юридические утверждения."]}, {"h": "Сначала своя версия", "p": ["Связь с уроком 10.4: чтобы ИИ усиливал, а не заменял мышление, сначала сформулируйте свою версию, потом сравните с ответом ИИ. Не вставляйте в чужие сервисы персональные данные клиентов, пароли и коммерческую тайну. Полезные роли ИИ в курсе: собеседник для разбора задания по рубрике, генератор вариантов, критик текста, тренер для ролевой игры."]}], "steps": ["Выберите 7 задач курса или работы для ИИ.", "Напишите запрос для каждой: роль, контекст, задача, формат.", "Протестируйте три запроса.", "Проверьте факты в ответах.", "Улучшите запросы по результатам.", "Сохраните библиотеку запросов."], "check": ["Запросы содержат роль, контекст, задачу, формат.", "Факты проверяются.", "Своя версия — до ИИ.", "Нет персональных данных в запросах.", "Библиотека сохранена."], "qa2": [["Почему ИИ «ошибается уверенно»?", "Модель генерирует правдоподобный текст и не всегда отличает факт от вымысла."], ["Какие данные нельзя вставлять в чужие ИИ-сервисы?", "Персональные данные, пароли, коммерческую тайну."]]}, {"t": "Жизнь как проект", "min": 40, "why": "Мы тщательно планируем бизнес и карьеру — и часто никак не планируем жизнь целиком. Результат: успешные, но уставшие люди.", "pts": ["Радислав Гандапас («Полная Ж: жизнь как бизнес-проект»): планировать жизнь так же внимательно, как бизнес; **успех без истощения** — удовлетворение всех основных потребностей, а не жертва ради одной сферы.", "Связь с колесом жизни (неделя 1): спустя месяцы курса — пересчитайте точку А и сравните.", "Беркман: жизнь конечна — **выбор и отказ** важнее «успеть всё».", "Портфель жизни: работа, здоровье, отношения, развитие, деньги, отдых — у каждого «проекта» своя цель и бюджет времени.", "Квартальный пересмотр как совет директоров своей жизни: что работает, что нет, что меняем."], "fig": {"k": "hub", "c": "Жизнь-проект", "a": ["Работа", "Здоровье", "Отношения", "Развитие", "Деньги", "Отдых"], "cap": "Портфель жизни: у каждой сферы — цель и время."}, "src": ["a40860431|жизнь как бизнес-проект без истощения", "burkeman|конечность времени и выбор", "extreme_tm|колесо жизни для сравнения"], "ex": "Колесо в начале курса: здоровье 3, финансы 5, отношения 5, работа 8. Сейчас: здоровье 6, финансы 7, отношения 6, работа 8. Совет директоров: оставить режим сна и бюджета, добавить проект «отношения» — свидание раз в неделю.", "err": ["Оптимизировать одну сферу ценой остальных.", "Планировать жизнь без бюджета времени."], "qa": [["Что Гандапас называет успехом без истощения?", "Удовлетворение всех основных потребностей, а не жертву ради одной сферы."], ["Что такое «совет директоров» своей жизни?", "Регулярный (квартальный) пересмотр целей и результатов по сферам."]], "task": "Пересчитайте колесо жизни и сравните с неделей 1. Составьте «портфель жизни»: 6 сфер × цель на год × бюджет часов в неделю. Назначьте даты четырёх квартальных «советов директоров».", "out": "Два колеса (до/после), портфель жизни, даты пересмотров.", "rub": [["Сравнение колёс", "изменения и причины"], ["Портфель полный", "6 сфер с целями"], ["Бюджет времени реалистичен", "сумма часов помещается в неделю"], ["Даты назначены", "4"]], "sample": "Портфель: здоровье — полумарафон (4 ч/нед), отношения — еженедельное свидание (3 ч), деньги — подушка 6 мес. (1 ч), развитие — сертификат (4 ч), отдых — суббота без работы.", "deep": [{"h": "Жизнь как бизнес-проект", "p": ["Гандапас («Полная Ж: жизнь как бизнес-проект») замечает: многие тщательно планируют бизнес и карьеру, но не планируют жизнь — и в итоге видят успешных, но уставших и несчастливых людей. Решение — жить полноценно не вместо бизнеса, а вместе с ним, удовлетворяя все основные потребности: здоровье, отношения, развитие, отдых, смысл."]}, {"h": "Портфель жизни", "p": ["Полезная метафора — портфель: у каждой сферы своя цель и свой «бюджет» времени в неделю. Сумма часов должна помещаться в реальную неделю — это провер     var sum = 0;
    wk.lessons.forEach(function (ls, li) {
      var id = lid(wi + 1, li + 1), t = total(id), done = state.done[id];
      if (t !== null) sum += t;
      h += '<li><a href="#' + id + '"><span class="ln">' + (wi + 1) + "." + (li + 1) + '</span><span>' + esc(ls.t) + '</span><span class="ls' + (done ? " ok" : "") + '">' + (t !== null ? t + "/" + MAXS : "—") + (done ? " ✓" : "") + "</span></a></li>";
    });
    h += "</ul><p>Баллы недели: <strong>" + sum + " из " + wk.lessons.length * MAXS + "</strong>. Зачёт недели: " + wk.lessons.length * PASS + " и выше.</p>";
    var pw = PLAN.filter(function (p) { return p.cw === wi + 1; }).map(function (p) { return '<a href="#plan-' + p.n + '">' + p.n + "</a>"; });
    if (pw.length) h += "<p>Чтение к этой неделе — план чтения, недели года: " + pw.join(", ") + ".</p>";
    var first = lid(wi + 1, 1);
    h += '<div class="actions"><a class="btn" style="text-decoration:none" href="#' + first + '">Открыть урок ' + (wi + 1) + ".1</a></div>";
    main.innerHTML = h;
    renderNav({ w: wi, id: null });
  }

  function renderLesson(wi, li) {
    var wk = COURSE[wi], ls = wk && wk.lessons[li];
    if (!ls) { renderHome(); return; }
    var id = lid(wi + 1, li + 1), idx = LIST.findIndex(function (x) { return x.id === id; });
    var scores = state.sc[id] || [null, null, null, null];
    var h = '<p class="crumb">Неделя ' + (wi + 1) + " · урок " + (li + 1) + " · " + ls.min + ' мин</p><h1>' + esc(ls.t) + "</h1>";
    h += '<p class="why">' + md(ls.why) + "</p>";
    h += '<h2>Суть</h2><ul class="pts">' + ls.pts.map(function (p) { return "<li>" + md(p) + "</li>"; }).join("") + "</ul>";
    h += figure(ls.fig);
    if (ls.src && ls.src.length) {
      h += '<div class="from"><h3>Из книг и аудиокниг</h3><ul>' + ls.src.map(function (s) {
        var p = String(s).split("|"), b = LIBI[p[0]];
        return b ? "<li>" + bookLink(b) + (p[1] ? " — " + md(p[1]) : "") + "</li>" : "";
      }).join("") + "</ul></div>";
    }
    if (ls.deep && ls.deep.length) {
      h += "<h2>Разбор подробно</h2>" + ls.deep.map(function (d) {
        return '<section class="deep"><h3>' + md(d.h) + "</h3>" + (d.p || []).map(function (x) { return "<p>" + md(x) + "</p>"; }).join("") +
          (d.li && d.li.length ? '<ul class="pts">' + d.li.map(function (x) { return "<li>" + md(x) + "</li>"; }).join("") + "</ul>" : "") + "</section>";
      }).join("");
    }
    if (ls.steps && ls.steps.length) h += '<h2>Как применять: по шагам</h2><ol class="steps">' + ls.steps.map(function (x) { return "<li><span>" + md(x) + "</span></li>"; }).join("") + "</ol>";
    h += '<div class="example"><h3>Пример</h3><p>' + md(ls.ex) + "</p></div>";
    h += '<div class="errors"><h3>Типичные ошибки</h3><ul>' + ls.err.map(function (e) { return "<li>" + md(e) + "</li>"; }).join("") + "</ul></div>";
    if (ls.check && ls.check.length) h += '<div class="check"><h3>Чек-лист</h3><ul>' + ls.check.map(function (x) { return "<li>" + md(x) + "</li>"; }).join("") + "</ul></div>";
    h += "<h2>Проверь себя</h2>" + ls.qa.concat(ls.qa2 || []).map(function (q) { return '<details class="qa"><summary>' + md(q[0]) + "</summary><div>" + md(q[1]) + "</div></details>"; }).join("");
    h += '<section class="task"><p class="tag">Задание</p><p>' + md(ls.task) + '</p><p class="out">Что сдать: ' + md(ls.out) + "</p>" +
      '<textarea class="ans" id="ans" placeholder="Ваш ответ…" aria-label="Ответ на задание">' + esc(state.ans[id] || "") + '</textarea>' +
      '<div class="ans-meta"><span id="cnt"></span><span id="saved">сохраняется в этом браузере</span></div>';
    h += '<div class="rubric"><h3>Рубрика проверки</h3>';
    ls.rub.forEach(function (r, i) {
      var cur = scores[i];
      h += '<div class="crit"><div class="c-name">' + (i + 1) + ". " + esc(r[0]) + '</div><div class="c-hint">Полный балл: ' + esc(r[1]) + '</div><div class="pick" role="radiogroup" aria-label="Балл за критерий ' + (i + 1) + '">';
      [0, 1, 2].forEach(function (v) {
        h += '<label><input type="radio" name="c' + i + '" value="' + v + '"' + (cur === v ? " checked" : "") + "><span>" + v + "</span></label>";
      });
      h += "</div></div>";
    });
    h += '<div class="score"><span>Самооценка</span><span class="num" id="num"></span><span class="verdict" id="verdict"></span></div></div>';
    h += '<div class="actions"><button type="button" class="btn" id="send">Подготовить для проверки</button>' +
      '<button type="button" class="btn ghost" id="done">' + (state.done[id] ? "Пройден ✓" : "Отметить пройденным") + "</button></div>";
    h += '<div class="sendbox" id="sendbox" hidden><p class="hint">Скопируйте этот блок и отправьте его в чат с Claude. Если кнопка копирования не сработала, выделите текст вручную.</p>' +
      '<textarea id="sendtxt" readonly aria-label="Текст для отправки"></textarea><div class="actions"><button type="button" class="btn ghost" id="copy">Скопировать</button><span id="copied" class="ans-meta"></span></div></div>';
    h += '<details class="sample"><summary>Образец ответа</summary><p>' + md(ls.sample) + "</p></details></section>";
    var prev = LIST[idx - 1], next = LIST[idx + 1];
    h += '<div class="pager">' + (prev ? '<a href="#' + prev.id + '"><small>Назад</small>' + esc(prev.ls.t) + "</a>" : "<span></span>") +
      (next ? '<a href="#' + next.id + '"><small>Дальше</small>' + esc(next.ls.t) + "</a>" : "<span></span>") + "</div>";
    main.innerHTML = h;
    renderNav({ w: wi, id: id });

    var ta = $("ans");
    function upd() {
      var t = ta.value, words = t.trim() ? t.trim().split(/\s+/).length : 0;
      $("cnt").textContent = words + " слов · " + t.length + " знаков";
    }
    upd();
    var timer = null;
    ta.addEventListener("input", function () {
      upd(); state.ans[id] = ta.value;
      clearTimeout(timer); timer = setTimeout(function () { save(); $("saved").textContent = "сохранено"; }, 400);
    });
    function recalc() {
      var arr = [], sum = 0, filled = 0;
      for (var i = 0; i < ls.rub.length; i++) {
        var chk = main.querySelector('input[name="c' + i + '"]:checked');
        var v = chk ? parseInt(chk.value, 10) : null; arr.push(v);
        if (v !== null) { sum += v; filled++; }
      }
      state.sc[id] = arr; save();
      $("num").textContent = sum + " / " + MAXS;
      var ver = $("verdict");
      if (filled < ls.rub.length) { ver.textContent = "оцените все критерии"; ver.className = "verdict"; }
      else if (sum >= PASS) { ver.textContent = "зачёт"; ver.className = "verdict pass"; }
      else { ver.textContent = "доработать"; ver.className = "verdict fail"; }
      renderNav({ w: wi, id: id });
    }
    main.querySelectorAll(".pick input").forEach(function (el) { el.addEventListener("change", recalc); });
    recalc();
    $("done").addEventListener("click", function () {
      state.done[id] = !state.done[id]; save();
      this.textContent = state.done[id] ? "Пройден ✓" : "Отметить пройденным";
      this.classList.toggle("done", !!state.done[id]);
      renderNav({ w: wi, id: id });
    });
    if (state.done[id]) $("done").classList.add("done");
    $("send").addEventListener("click", function () {
      var arr = state.sc[id] || [], sum = 0, lines = [];
      ls.rub.forEach(function (r, i) { var v = arr[i]; if (typeof v === "number") sum += v; lines.push((i + 1) + ". " + r[0] + ": " + (typeof v === "number" ? v : "—") + " из 2"); });
      var txt = "КУРС «Мастерская роста». Неделя " + (wi + 1) + ", урок " + (li + 1) + ": " + ls.t + "\n\nЗАДАНИЕ:\n" + ls.task + "\n\nЧТО СДАТЬ: " + ls.out +
        "\n\nМОЙ ОТВЕТ:\n" + (ta.value.trim() || "(пусто)") + "\n\nМОЯ САМООЦЕНКА ПО РУБРИКЕ:\n" + lines.join("\n") + "\nИтого: " + sum + " из " + MAXS +
        "\n\nПроверь по этой рубрике, дай баллы по каждому критерию, 2–3 главных замечания с примером правки и следующий шаг.";
      $("sendtxt").value = txt; $("sendbox").hidden = false; $("sendtxt").focus(); $("sendtxt").select();
      $("copied").textContent = "";
    });
    $("copy").addEventListener("click", function () {
      var t = $("sendtxt").value, out = $("copied");
      function fallback() { $("sendtxt").focus(); $("sendtxt").select(); out.textContent = "выделено, нажмите Ctrl+C"; }
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(t).then(function () { out.textContent = "скопировано"; }, fallback);
        } else fallback();
      } catch (e) { fallback(); }
    });
  }

  var lastRoute = null;
  function route(h) {
    var hsh = (typeof h === "string" ? h : (location.hash || "")).replace(/^#/, ""), m;
    lastRoute = hsh;
    window.scrollTo(0, 0);
    nav.classList.remove("open");
    if ((m = /^w(\d+)-l(\d+)$/.exec(hsh))) renderLesson(parseInt(m[1], 10) - 1, parseInt(m[2], 10) - 1);
    else if ((m = /^w(\d+)$/.exec(hsh))) renderWeek(parseInt(m[1], 10) - 1);
    else if (hsh === "plan") renderPlan(null);
    else if ((m = /^plan-(\d+)$/.exec(hsh))) renderPlan(m[1]);
    else if (hsh === "lib") renderLib(null);
    else if ((m = /^lib-(.+)$/.exec(hsh))) renderLib(m[1]);
    else renderHome();
  }
  function go(h) {
    try { location.hash = h; } catch (e) { /* адресная строка недоступна */ }
    if (lastRoute !== h) route(h);
  }
  window.wcOpen = go;
  document.addEventListener("click", function (e) {
    var a = e.target.closest ? e.target.closest('a[href^="#"]') : null;
    if (a) { e.preventDefault(); go(a.getAttribute("href").slice(1)); }
  });

  nav.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-w]");
    if (b) { var wi = parseInt(b.getAttribute("data-w"), 10); go("w" + (wi + 1)); }
  });
  $("brand").addEventListener("click", function () { go("home"); });
  $("menu-btn").addEventListener("click", function () { nav.classList.toggle("open"); });
  $("theme").addEventListener("click", function () {
    var root = document.documentElement, cur = root.getAttribute("data-theme");
    var dark = cur ? cur === "dark" : (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
    var nx = dark ? "light" : "dark"; root.setAttribute("data-theme", nx); store.set("mr-theme", nx);
  });
  var th = store.get("mr-theme"); if (th === "light" || th === "dark") document.documentElement.setAttribute("data-theme", th);
  window.addEventListener("hashchange", function () { var h = (location.hash || "").replace(/^#/, ""); if (h !== lastRoute) route(h); });
  route();
})();


</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body></html>
